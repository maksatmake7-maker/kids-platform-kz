<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-hi-title="p_title">Для родителей — Білім Аралы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<style>
  .pr{max-width:940px;position:relative;z-index:3;margin:0 auto;padding:10px 16px 50px;}
  .pr .card{background:#fff;border-radius:24px;padding:18px;box-shadow:0 6px 0 rgba(0,0,0,.08);margin-bottom:16px;}
  .pr h1{font-family:'Baloo 2',sans-serif;color:#1D3557;font-size:1.8rem;margin-bottom:4px;} .pr h2{font-family:'Baloo 2',sans-serif;color:#1D3557;font-size:1.25rem;margin-bottom:10px;}
  .pr .lead{color:#5C7690;font-weight:700;margin-bottom:6px;}
  .pr-gate{max-width:420px;margin:30px auto;text-align:center;} .pr-gate input{font:800 1.6rem 'Baloo 2',sans-serif;width:120px;text-align:center;padding:8px;border:3px solid #D5DCE4;border-radius:14px;margin:10px 8px;} .pr-gate .err{color:#C0392B;font-weight:800;min-height:1.4em;}
  .pr-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;}
  .pr-sum div{background:#F5F8FA;border-radius:16px;padding:12px;text-align:center;} .pr-sum b{display:block;font:800 1.6rem 'Baloo 2',sans-serif;color:#1D3557;} .pr-sum span{font-size:.85rem;font-weight:700;color:#6B7C90;}
  .pr-who{display:flex;align-items:center;gap:12px;} .pr-who .av{font-size:2.6rem;}
  .pr-days{display:flex;gap:6px;align-items:flex-end;height:110px;} .pr-days div{flex:1;text-align:center;font-size:.7rem;font-weight:700;color:#6B7C90;display:flex;flex-direction:column;justify-content:flex-end;height:100%;} .pr-days i{display:block;background:#2F9BE6;border-radius:6px 6px 2px 2px;min-height:3px;margin-bottom:3px;} .pr-days i.z{background:#E3E9F0;} .pr-days b{color:#1D3557;font-size:.75rem;}
  .pr-sub{border-top:2px solid #EEF2F6;padding:10px 0;} .pr-sub:first-of-type{border-top:0;}
  .pr-sub summary{cursor:pointer;display:grid;grid-template-columns:1fr 130px;gap:10px;align-items:center;font-weight:800;color:#1D3557;list-style:none;} .pr-sub summary::-webkit-details-marker{display:none;}
  .pr-sub .meta{font-size:.82rem;color:#6B7C90;font-weight:700;}
  .bar{height:10px;border-radius:6px;background:#E3E9F0;overflow:hidden;} .bar i{display:block;height:100%;background:#3FB088;}
  .pr-c{margin:8px 0 4px 8px;padding:8px 10px;border-left:4px solid #D5DCE4;} .pr-c.done{border-color:#3FB088;} .pr-c .ct{font-weight:800;color:#1D3557;display:flex;gap:8px;flex-wrap:wrap;align-items:center;} .pr-c a{color:#2F8FD1;font-size:.85rem;font-weight:800;}
  .pr-l{display:inline-block;margin:4px 6px 0 0;padding:3px 9px;border-radius:10px;background:#F5F8FA;font-size:.82rem;font-weight:700;color:#41566E;} .pr-l.s1{background:#FFE9E6;} .pr-l.s3{background:#E2F6EA;} .pr-l .st{color:#F5B400;}
  .pr-rep li{margin:6px 0 6px 18px;font-weight:700;color:#35506B;} .pr-rep a{color:#2F8FD1;font-weight:800;}
  .pr-btn{display:inline-block;margin-right:8px;padding:10px 18px;border-radius:14px;border:0;background:#FFC93C;color:#1D3557;font:800 1rem 'Baloo 2',sans-serif;cursor:pointer;box-shadow:0 4px 0 #E0A620;}
  .pr-note{font-size:.85rem;color:#6B7C90;font-weight:700;}
  .pr-wk{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:8px 0;} .pr-wk div{background:#EAF6EF;border-radius:16px;padding:12px;text-align:center;} .pr-wk b{display:block;font:800 1.7rem 'Baloo 2',sans-serif;color:#1D6B4A;} .pr-wk span{font-size:.85rem;font-weight:700;color:#4B6B5C;}
  .pr-wk b,.pr-sum b{direction:ltr;unicode-bidi:isolate;}
  .pt-list{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:12px;} .pt-q{background:#FFF8E6;border:3px solid #F8AE3F;border-radius:18px;padding:12px 14px;} .pt-q.tg{background:#EAF3FB;border-color:#7FB8E8;}
  .pt-tag{font:800 .85rem 'Baloo 2',sans-serif;color:#8A5A00;letter-spacing:.02em;} .pt-q.tg .pt-tag{color:#2A5F8F;} .pt-q p{font-weight:800;color:#1D3557;font-size:1.05rem;line-height:1.45;margin:4px 0 0;}
  .pt-tips{margin:14px 0 0;padding-top:10px;border-top:2px solid #EEF2F6;} .pt-tips h3{font-family:'Baloo 2',sans-serif;color:#1D3557;font-size:1.05rem;margin-bottom:4px;} .pt-tips li{margin:6px 0 6px 20px;font-weight:700;color:#35506B;line-height:1.45;}
  html[dir=rtl] .pr-rep li,html[dir=rtl] .pt-tips li{margin:6px 20px 6px 0;} html[dir=rtl] .pr-c{border-left:0;border-right:4px solid #D5DCE4;margin:8px 8px 4px 0;} html[dir=rtl] .pr-c.done{border-right-color:#3FB088;}
  @media print{ header,.cloud,.back-link,.no-print,footer{display:none!important;} body{background:#fff!important;} .pr .card{box-shadow:none;border:1px solid #ccc;break-inside:avoid;} .pr-sub details{display:block;} }
</style>
</head>
<body>
<div class="cloud cloud1"></div><div class="cloud cloud2"></div><div class="cloud cloud3"></div>
<header>
  <a href="index.html" class="logo"><span class="logo-dot">🐆</span> Білім Аралы</a>
  <div class="lang-toggle">
    <button class="active" data-lang="ru" onclick="applyLang('ru')">RU</button>
    <button data-lang="kz" onclick="applyLang('kz')">ҚАЗ</button>
    <button data-lang="en" onclick="applyLang('en')">EN</button>
    <button data-lang="zh" onclick="applyLang('zh')">中文</button>
    <button data-lang="uz" onclick="applyLang('uz')">O'ZB</button>
    <button data-lang="tg" onclick="applyLang('tg')">ТҶК</button>
    <button data-lang="ug" onclick="applyLang('ug')">ئۇيغۇر</button>
  </div>
</header>

<main class="pr">
  <a href="rewards.html" class="back-link" id="back">← К наградам</a>

  <div class="card pr-gate" id="gate">
    <h1><span aria-hidden="true">🔒</span> <span data-hi="gate_h">Для родителей</span></h1>
    <p class="lead" data-hi="gate_lead">Здесь отчёт об учёбе. Чтобы войти, решите пример:</p>
    <div style="font:800 2rem 'Baloo 2',sans-serif;color:#1D3557;" id="g-q" dir="ltr"></div>
    <input id="g-a" inputmode="numeric" autocomplete="off" dir="ltr" aria-labelledby="g-q"><button class="pr-btn" id="g-ok" data-hi="gate_ok">Войти</button>
    <div class="err" id="g-err" role="alert"></div>
  </div>

  <div id="report" style="display:none">
    <div class="card">
      <h1 data-hi="rep_h">Отчёт об учёбе</h1>
      <div class="pr-who" id="who"></div>
      <div class="pr-note" id="today"></div>
      <div class="pr-note" id="names" style="margin-top:4px"></div>
    </div>
    <div class="card"><div class="pr-sum" id="sum"></div></div>
    <div class="card" id="week"></div>
    <div class="card" id="teach"></div>
    <div class="card"><h2 data-hi="days_h">Занятия за 14 дней</h2><div class="pr-days" id="days"></div><div class="pr-note" style="margin-top:6px" data-hi="days_note">Столбик — сколько раз за день ребёнок проходил урок или игру.</div></div>
    <div class="card"><h2 data-hi="repeat_h">Что повторить</h2><div id="rep"></div></div>
    <div class="card"><h2 data-hi="subs_h">Успехи по предметам</h2><div id="subs"></div></div>
    <div class="card no-print">
      <button class="pr-btn" onclick="window.print()"><span aria-hidden="true">🖨️</span> <span data-hi="print">Распечатать или сохранить в PDF</span></button>
      <div class="pr-note" style="margin-top:10px" data-hi="foot">Отчёт собран из данных этого браузера на этом устройстве.</div>
    </div>
  </div>
</main>

<script src="assets/i18n.js"></script>
<script src="assets/house-i18n.js"></script>
<script src="assets/parent-i18n.js"></script>
<script src="assets/auth.js"></script>
<script src="assets/progress.js"></script>
<script src="assets/courses-registry.js"></script>
<script src="assets/rewards.js"></script>
<script>
(function(){
  var R = BilimRewards, esc = R.esc, t = function(k, v){ return HI.t(k, v); };
  var LOC = { ru: 'ru-RU', kz: 'kk-KZ', en: 'en-GB', zh: 'zh-CN', uz: 'uz-Cyrl-UZ', tg: 'tg-TJ', ug: 'ug-CN' };
  var WDRU = ['вс', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'];
  var a = 6 + Math.floor(Math.random() * 4), b = 6 + Math.floor(Math.random() * 4), isOpen = false;
  var ok = false; try { ok = sessionStorage.getItem('bilim_parent_ok') === '1'; } catch(e){}
  document.getElementById('g-q').textContent = a + ' × ' + b + ' = ?';
  function open(){ document.getElementById('gate').style.display = 'none'; document.getElementById('report').style.display = ''; isOpen = true; render(); }
  document.getElementById('g-ok').onclick = function(){
    if(+document.getElementById('g-a').value === a * b){ try { sessionStorage.setItem('bilim_parent_ok', '1'); } catch(e){} open(); }
    else { document.getElementById('g-err').textContent = t('gate_err'); }
  };
  document.getElementById('g-a').addEventListener('keydown', function(e){ if(e.key === 'Enter') document.getElementById('g-ok').click(); });
  if(ok) open();
  HI.on(function(){ document.getElementById('g-err').textContent = ''; chrome(); if(isOpen) render(); });

  function chrome(){ document.getElementById('back').textContent = HI.arrow() + ' ' + t('back'); }
  chrome();

  function subName(id){ var r = (window.BILIM_SUBJECTS || []).filter(function(s){ return s.id === id; })[0]; var k = 'sub_' + id; var tr = t(k); return tr || (r ? r.name : id); }
  function subIcon(id){ var r = (window.BILIM_SUBJECTS || []).filter(function(s){ return s.id === id; })[0]; return r ? r.icon : ''; }
  function fmtDate(d){ try { return d.toLocaleDateString(LOC[HI.lang()] || 'ru-RU'); } catch(e){ return d.toLocaleDateString('ru-RU'); } }
  function wd(day){
    var d = new Date(day + 'T12:00:00');
    try { var s = d.toLocaleDateString(LOC[HI.lang()] || 'ru-RU', { weekday: 'short' }); if(s) return s; } catch(e){}
    return WDRU[d.getDay()];
  }

  /* ключ 'course_<слаг>_<id урока>' → курс и урок из реестра */
  function lessonOf(key, states){
    var best = null;
    states.forEach(function(s){
      var pre = 'course_' + s.course.slug + '_';
      if(key.indexOf(pre) === 0 && (!best || s.course.slug.length > best.s.course.slug.length)){
        var id = key.slice(pre.length), l = s.lessons.filter(function(x){ return x.id === id; })[0];
        if(l) best = { s: s, l: l };
      }
    });
    return best ? { c: best.s.course, l: best.l } : null;
  }

  function weekData(states){
    var rec = R.jget('bilim_recent_v1', {}), days = R.lastDays(7), stars = 0, keys = {}, lessons = {}, order = [];
    days.forEach(function(d){
      (rec[d.day] || []).forEach(function(e){
        stars += +e[1] || 0; keys[e[0]] = 1;
        var m = lessonOf(e[0], states);
        if(m){ var id = e[0]; if(!lessons[id]){ lessons[id] = m; order.push(id); } }
      });
    });
    return { activeDays: days.filter(function(d){ return d.count > 0; }).length, stars: stars, topics: Object.keys(keys).length, items: order.map(function(i){ return lessons[i]; }), hasLog: Object.keys(keys).length > 0 };
  }

  function weekCard(w){
    var h = '<h2>' + esc(t('week_h')) + '</h2><p class="lead">' + esc(t('week_lead')) + '</p>';
    if(!w.activeDays) return h + '<p class="pr-note">' + esc(t('w_none')) + '</p>';
    var three = w.items.filter(function(m){ return m.l.stars === 3; }).length;
    h += '<div class="pr-wk"><div><b>' + w.activeDays + ' / 7</b><span>' + esc(t('w_days')) + '</span></div>';
    if(w.hasLog){
      h += '<div><b>+' + w.stars + '</b><span>' + esc(t('w_stars')) + '</span></div><div><b>' + w.topics + '</b><span>' + esc(t('w_topics')) + '</span></div><div><b>' + three + '</b><span>' + esc(t('w_three')) + '</span></div></div>';
    } else h += '</div><p class="pr-note">' + esc(t('w_nodetail')) + '</p>';
    return h;
  }

  /* вопросы «научи меня»: сначала уроки этой недели, где ребёнок уверен (2–3 звезды), потом остальные, потом лучшие за всё время */
  function teachCard(w, states){
    var picked = [], seenSub = {}, used = {};
    function uid(m){ return m.c.slug + '/' + m.l.id; }
    function take(list, needNewSubject){
      list.forEach(function(m){
        if(picked.length >= 3 || used[uid(m)]) return;
        if(needNewSubject && seenSub[m.c.subject]) return;
        used[uid(m)] = 1; seenSub[m.c.subject] = 1; picked.push(m);
      });
    }
    var weekGood = w.items.filter(function(m){ return m.l.stars >= 2; }), weekRest = w.items.filter(function(m){ return m.l.stars === 1; });
    var all3 = []; states.forEach(function(s){ s.lessons.forEach(function(l){ if(l.stars === 3) all3.push({ c: s.course, l: l }); }); });
    all3 = all3.reverse();
    take(weekGood, true); take(all3, true); take(weekGood, false); take(all3, false);
    var weak = (weekRest[0]) || (function(){ var f = null; states.forEach(function(s){ s.lessons.forEach(function(l){ if(!f && l.stars === 1) f = { c: s.course, l: l }; }); }); return f; })();
    var h = '<h2>' + esc(t('teach_h')) + '</h2><p class="lead">' + esc(t('teach_lead')) + '</p>';
    if(!picked.length && !weak) h += '<div class="pt-q"><p>' + esc(t('teach_none')) + '</p></div>';
    else {
      h += '<ul class="pt-list">';
      picked.forEach(function(m){
        var q = t('tq_' + m.c.subject) || t('teach_none');
        h += '<li class="pt-q"><div class="pt-tag">' + esc(t('teach_label', { subj: subName(m.c.subject), lesson: m.l.title })) + '</div><p>' + esc(q) + '</p></li>';
      });
      if(weak) h += '<li class="pt-q tg"><p>' + esc(t('teach_together', { lesson: weak.l.title })) + '</p></li>';
      h += '</ul>';
    }
    h += '<div class="pt-tips"><h3>' + esc(t('tips_h')) + '</h3><ul><li>' + esc(t('tip1')) + '</li><li>' + esc(t('tip2')) + '</li><li>' + esc(t('tip3')) + '</li></ul></div>';
    return h;
  }

  function render(){
    var states = R.allStates(), courses = states.filter(function(s){ return s.complete; }).length;
    var lessons = states.reduce(function(x, s){ return x + s.done; }, 0), lessonsAll = states.reduce(function(x, s){ return x + s.total; }, 0);
    var days = R.lastDays(14), week = days.slice(7).reduce(function(x, d){ return x + d.count; }, 0), g = R.gamesPlayed();
    document.getElementById('today').textContent = t('rep_date', { d: fmtDate(new Date()) });
    document.getElementById('names').textContent = HI.lang() === 'ru' ? '' : t('names_note');

    document.getElementById('who').innerHTML = '<span class="av">🐆</span><div><b style="font-family:\'Baloo 2\',sans-serif;font-size:1.3rem;color:#1D3557">' + esc(t('who_name')) + '</b><div class="pr-note" id="who2">' + esc(t('who_note')) + '</div></div>';
    document.getElementById('sum').innerHTML =
      '<div><b>⭐ ' + R.totalStars() + '</b><span>' + esc(t('l_stars')) + '</span></div>' +
      '<div><b>🔥 ' + R.streak() + '</b><span>' + esc(t('l_streak')) + '</span></div>' +
      '<div><b>' + courses + ' / ' + states.length + '</b><span>' + esc(t('l_courses')) + '</span></div>' +
      '<div><b>' + lessons + ' / ' + lessonsAll + '</b><span>' + esc(t('l_lessons')) + '</span></div>' +
      '<div><b>' + week + '</b><span>' + esc(t('l_week7')) + '</span></div>' +
      '<div><b>' + g.kinds + '</b><span>' + esc(t('l_games', { n: g.times })) + '</span></div>';

    var w = weekData(states);
    document.getElementById('week').innerHTML = weekCard(w);
    document.getElementById('teach').innerHTML = teachCard(w, states);

    var max = Math.max.apply(null, days.map(function(x){ return x.count; }).concat([1]));
    document.getElementById('days').innerHTML = days.map(function(x){ return '<div><b>' + (x.count || '') + '</b><i class="' + (x.count ? '' : 'z') + '" style="height:' + Math.round(x.count * 70 / max) + 'px"></i>' + esc(wd(x.day)) + '<br>' + x.num + '</div>'; }).join('');

    var weak = [], started = [];
    states.forEach(function(s){ s.lessons.forEach(function(l){ if(l.stars === 1) weak.push({ c: s.course, l: l }); }); if(s.done && !s.complete) started.push(s); });
    var rep = '';
    if(weak.length){
      rep += '<p class="lead">' + esc(t('repeat_weak')) + '</p><ul class="pr-rep">' + weak.slice(0, 12).map(function(x){ return '<li>' + esc(subName(x.c.subject)) + ' · ' + esc(t('p_course', { c: x.c.title })) + ' · ' + esc(t('p_lesson', { l: x.l.title })) + ' <a href="' + x.c.url + '">' + esc(t('p_open')) + '</a></li>'; }).join('') + '</ul>';
    }
    if(started.length){
      rep += '<p class="lead" style="margin-top:8px">' + esc(t('repeat_started')) + '</p><ul class="pr-rep">' + started.map(function(s){ return '<li>' + esc(t('p_course', { c: s.course.title })) + ': ' + esc(t('p_prog', { a: s.done, b: s.total })) + ' <a href="' + s.course.url + '">' + esc(t('p_continue')) + '</a></li>'; }).join('') + '</ul>';
    }
    if(!weak.length && !started.length) rep = '<p class="lead">' + esc(lessons ? t('all_good') : t('none_yet')) + '</p>';
    document.getElementById('rep').innerHTML = rep;

    var html = '';
    (window.BILIM_SUBJECTS || []).forEach(function(s){
      var mine = states.filter(function(x){ return x.course.subject === s.id; }); if(!mine.length) return;
      var L = mine.reduce(function(x, c){ return x + c.done; }, 0), T = mine.reduce(function(x, c){ return x + c.total; }, 0), S = mine.reduce(function(x, c){ return x + c.stars; }, 0);
      var avg = L ? (S / L).toFixed(1) : '—', cdone = mine.filter(function(x){ return x.complete; }).length;
      html += '<details class="pr-sub"><summary><div>' + s.icon + ' ' + esc(subName(s.id)) + '<div class="meta">' + esc(t('sub_meta', { c: cdone, n: mine.length, l: L, t: T, avg: avg })) + '</div></div><div class="bar"><i style="width:' + Math.round(L * 100 / T) + '%"></i></div></summary>';
      mine.forEach(function(x){
        html += '<div class="pr-c' + (x.complete ? ' done' : '') + '"><div class="ct">' + (x.complete ? '✅' : x.done ? '🔸' : '▫️') + ' ' + esc(x.course.title) + ' <a href="' + x.course.url + '">' + esc(t('p_open_l')) + '</a></div>';
        x.lessons.forEach(function(l){ html += '<span class="pr-l s' + l.stars + '">' + esc(l.title) + ' <span class="st">' + (l.stars ? '★'.repeat(l.stars) + '☆'.repeat(3 - l.stars) : '—') + '</span></span>'; });
        html += '</div>';
      });
      html += '</details>';
    });
    document.getElementById('subs').innerHTML = html;
    /* если выбран профиль ребёнка — подтягиваем имя, уровень и звёзды с сервера */
    try {
      var tok = typeof getChildToken === 'function' ? getChildToken() : null;
      if(tok && typeof apiRequestAuth === 'function'){
        apiRequestAuth('/api/children/me/stats', {}, tok).then(function(st){
          document.getElementById('who').innerHTML = '<span class="av">' + esc(st.avatarEmoji || '🐆') + '</span><div><b style="font-family:\'Baloo 2\',sans-serif;font-size:1.3rem;color:#1D3557">' + esc(st.name) + '</b><div class="pr-note">' + esc(t('srv_line', { l: st.level && st.level.level, s: st.starsTotal, a: (st.achievements || []).length })) + '</div></div>';
        }).catch(function(){});
      }
    } catch(e){}
  }
})();
</script>
</body>
</html>
