<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Основатель и инвестор — Білім Аралы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<style>
  .fd{max-width:760px;margin:0 auto;padding:10px 16px 50px;position:relative;z-index:3}
  .fd-card{background:#fff;border-radius:28px;padding:28px 22px 30px;box-shadow:0 8px 0 rgba(0,0,0,.08);text-align:center}
  .fd-photo{width:min(300px,70vw);aspect-ratio:543/707;margin:0 auto 20px;border-radius:26px;overflow:hidden;border:6px solid #FFC93C;box-shadow:0 8px 0 rgba(29,53,87,.14)}
  .fd-photo img{display:block;width:100%;height:100%;object-fit:cover}
  .fd-tag{display:inline-block;padding:6px 18px;border-radius:999px;background:#FFE08A;color:#1D3557;font:800 1rem 'Baloo 2',sans-serif;margin-bottom:12px}
  .fd-line{color:#35506B;font-weight:800;font-size:1.15rem;line-height:1.4;margin-bottom:8px}
  .fd-name{font:800 clamp(1.7rem,5.5vw,2.4rem)/1.2 'Baloo 2',sans-serif;color:#1D3557;text-wrap:balance}
</style>
</head>
<body>
<div class="cloud cloud1"></div><div class="cloud cloud2"></div><div class="cloud cloud3"></div>
<header>
  <a href="index.html" class="logo"><span class="logo-dot">🐆</span> Білім Аралы</a>
  <div class="lang-toggle">
    <button class="active" data-lang="ru" onclick="applyLang('ru')">RU</button>
    <button data-lang="kz" onclick="applyLang('kz')">ҚАЗ</button>
    <button data-lang="en" onclick="applyLang('en')">EN</button>
    <button data-lang="zh" onclick="applyLang('zh')">中文</button>
    <button data-lang="uz" onclick="applyLang('uz')">O'ZB</button>
    <button data-lang="tg" onclick="applyLang('tg')">ТҶК</button>
    <button data-lang="ug" onclick="applyLang('ug')">ئۇيغۇر</button>
  </div>
</header>
<main class="fd">
  <a href="index.html" class="back-link" data-i18n="back_home">← На главную</a>
  <div class="fd-card">
    <div class="fd-photo"><img src="assets/photos/founder.jpg" alt="Суннатов Максат Нурмухамматович" width="543" height="707"></div>
    <div class="fd-tag" data-i18n="founder_btn">Основатель и инвестор</div>
    <p class="fd-line" data-i18n="founder_line">Основатель и инвестор сайта «Білім Аралы»</p>
    <h1 class="fd-name">Суннатов Максат Нурмухамматович</h1>
  </div>
</main>
<footer data-i18n="footer"></footer>
<script src="assets/i18n.js"></script>
</body>
</html>
