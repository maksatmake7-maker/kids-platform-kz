<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

</head>
<body>
<div class="cloud cloud1"></div>
<div class="cloud cloud2"></div>

<header>
  <a href="index.html" class="logo"><span class="logo-dot">🐆</span> Білім Аралы</a>
  <div class="lang-toggle">
    <button class="active" data-lang="ru" onclick="applyLang('ru')">RU</button>
    <button data-lang="kz" onclick="applyLang('kz')">ҚАЗ</button>
    <button data-lang="en" onclick="applyLang('en')">EN</button>

      <circle cx="138" cy="55" r="17" fill="#C7D0DA"/>
      <circle cx="62" cy="57" r="9" fill="#7E8998"/>
      <circle cx="138" cy="57" r="9" fill="#7E8998"/>

      <ellipse cx="100" cy="140" rx="40" ry="30" fill="#F5F8FA"/>

      <path d="M100 132 L92 140 L108 140 Z" fill="#F4847A"/>
      <path d="M100 140 Q100 148 90 150 M100 140 Q100 148 110 150" stroke="#1D3557" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M62 158 Q100 180 138 158 Q100 195 62 158 Z" fill="#FF6B5B"/>

    <div class="speech"><span data-i18n="speech"></span></div>

  <h1 data-i18n="hero_title"></h1>
  <p class="sub" data-i18n="hero_sub"></p>
  <a href="#subjects" class="cta" data-i18n="cta"></a>
</section>

<section class="subjects" id="subjects">
  <span class="grade-tag" data-i18n="grade_tag"></span>
  <h2 data-i18n="subjects_h2"></h2>
  <p class="lead" data-i18n="subjects_lead"></p>

  <div class="island-grid">
    <a href="grades/grade-1/math/index.html" class="island math ready" style="text-decoration:none;">
      <span class="emoji">🔢</span>
      <h3 data-i18n="math_title"></h3>
      <p data-i18n="math_desc"></p>
      <span class="badge" data-i18n="badge_play"></span>

    <div class="island read locked">
      <span class="emoji">📖</span>
      <h3 data-i18n="read_title"></h3>
      <p data-i18n="read_desc"></p>
      <span class="badge" data-i18n="badge_soon"></span>
    </div>
    <div class="island kaz locked">
      <span class="emoji">🌾</span>
      <h3 data-i18n="kaz_title"></h3>
      <p data-i18n="kaz_desc"></p>

      <h3 data-i18n="game_title"></h3>
