<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход — Білім Аралы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<div class="cloud cloud1"></div>
<div class="cloud cloud2"></div>
<div class="cloud cloud3"></div>

<header>
  <a href="index.html" class="logo"><span class="logo-dot">🐆</span> Білім Аралы</a>
</header>

<section class="game-shell" style="max-width:480px;">
  <div class="game-card" style="text-align:center;">
    <h1 style="margin-bottom:24px;">Вход для родителей и школ</h1>

    <div class="auth-tabs">
      <div class="auth-tab active" id="tab-login" onclick="showTab('login')">Вход</div>
      <div class="auth-tab" id="tab-register" onclick="showTab('register')">Регистрация</div>
    </div>

    <!-- ФОРМА ВХОДА -->
    <div id="form-login">
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" class="form-input" id="login-email" placeholder="you@example.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label">Пароль</label>
        <input type="password" class="form-input" id="login-password" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button class="cta" style="width:100%;" onclick="doLogin()">Войти →</button>
      <div class="form-error" id="login-error"></div>
    </div>

    <!-- ФОРМА РЕГИСТРАЦИИ -->
    <div id="form-register" style="display:none;">
      <div class="account-type-picker">
        <div class="account-type-btn active" id="type-individual" onclick="setAccountType('individual')">👨‍👩‍👧 Я родитель</div>
        <div class="account-type-btn" id="type-organization" onclick="setAccountType('organization')">🏫 Я школа/центр</div>
      </div>

      <div class="form-group" id="org-name-group" style="display:none;">
        <label class="form-label">Название школы/центра</label>
        <input type="text" class="form-input" id="register-orgname" placeholder="Например: Школа №5">
      </div>

      <div class="form-group">
        <label class="form-label">Ваше имя</label>
        <input type="text" class="form-input" id="register-name" placeholder="Как к вам обращаться">
      </div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" class="form-input" id="register-email" placeholder="you@example.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label">Пароль</label>
        <input type="password" class="form-input" id="register-password" placeholder="Не короче 6 символов" autocomplete="new-password">
        <div class="form-hint">Регистрация бесплатна</div>
      </div>
      <button class="cta" style="width:100%;" onclick="doRegister()">Создать аккаунт →</button>
      <div class="form-error" id="register-error"></div>
    </div>

    <p style="margin-top:20px;">
      <a href="index.html" style="color:#8B95A3; font-size:0.9rem;">← Продолжить без входа</a>
    </p>
  </div>
</section>

<footer>Білім Аралы — растём и учимся вместе 🌟</footer>

<script src="assets/auth.js"></script>
<script src="assets/progress.js"></script>
<script>
  var currentAccountType = 'individual';

  function showTab(tab){
    document.getElementById('tab-login').classList.toggle('active', tab === 'login');
    document.getElementById('tab-register').classList.toggle('active', tab === 'register');
    document.getElementById('form-login').style.display = tab === 'login' ? 'block' : 'none';
    document.getElementById('form-register').style.display = tab === 'register' ? 'block' : 'none';
  }

  function setAccountType(type){
    currentAccountType = type;
    document.getElementById('type-individual').classList.toggle('active', type === 'individual');
    document.getElementById('type-organization').classList.toggle('active', type === 'organization');
    document.getElementById('org-name-group').style.display = type === 'organization' ? 'block' : 'none';
  }

  function doLogin(){
    var email = document.getElementById('login-email').value.trim();
    var password = document.getElementById('login-password').value;
    var errorEl = document.getElementById('login-error');
    errorEl.textContent = '';

    if(!email || !password){
      errorEl.textContent = 'Заполните email и пароль';
      return;
    }
    loginAccount(email, password).then(function(){
      window.location.href = 'profiles.html';
    }).catch(function(e){
      errorEl.textContent = e.message;
    });
  }

  function doRegister(){
    var orgName = document.getElementById('register-orgname').value.trim();
    var name = document.getElementById('register-name').value.trim();
    var email = document.getElementById('register-email').value.trim();
    var password = document.getElementById('register-password').value;
    var errorEl = document.getElementById('register-error');
    errorEl.textContent = '';

    if(!email || !password){
      errorEl.textContent = 'Заполните email и пароль';
      return;
    }
    if(currentAccountType === 'organization' && !orgName){
      errorEl.textContent = 'Укажите название школы/центра';
      return;
    }
    registerAccount(currentAccountType, orgName, email, password, name).then(function(){
      window.location.href = 'profiles.html';
    }).catch(function(e){
      errorEl.textContent = e.message;
    });
  }
</script>
</body>
</html>
