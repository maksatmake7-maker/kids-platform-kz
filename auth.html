<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход — Білім Аралы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<div class="cloud cloud1"></div>
<div class="cloud cloud2"></div>
<div class="cloud cloud3"></div>

<header>
  <a href="index.html" class="logo"><span class="logo-dot">🐆</span> Білім Аралы</a>
  <div class="lang-toggle">
    <button class="active" data-lang="ru" onclick="applyLang('ru')">RU</button>
    <button data-lang="kz" onclick="applyLang('kz')">ҚАЗ</button>
    <button data-lang="en" onclick="applyLang('en')">EN</button>
    <button data-lang="zh" onclick="applyLang('zh')">中文</button>
    <button data-lang="uz" onclick="applyLang('uz')">O'ZB</button>
    <button data-lang="tg" onclick="applyLang('tg')">ТҶК</button>
    <button data-lang="ug" onclick="applyLang('ug')">ئۇيغۇر</button>
  </div>
</header>

<section class="game-shell" style="max-width:480px;">
  <div class="game-card" style="text-align:center;">
    <h1 style="margin-bottom:24px;" data-i18n="auth_title"></h1>

    <div class="auth-tabs">
      <div class="auth-tab active" id="tab-login" onclick="showTab('login')" data-i18n="auth_tab_login"></div>
      <div class="auth-tab" id="tab-register" onclick="showTab('register')" data-i18n="auth_tab_register"></div>
    </div>

    <!-- ФОРМА ВХОДА -->
    <div id="form-login">
      <div class="form-group">
        <label class="form-label" data-i18n="auth_email_label"></label>
        <input type="email" class="form-input" id="login-email" placeholder="you@example.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label" data-i18n="auth_password_label"></label>
        <input type="password" class="form-input" id="login-password" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button class="cta" style="width:100%;" onclick="doLogin()"><span data-i18n="auth_login_btn"></span></button>
      <div class="form-error" id="login-error"></div>
    </div>

    <!-- ФОРМА РЕГИСТРАЦИИ -->
    <div id="form-register" style="display:none;">
      <div class="account-type-picker">
        <div class="account-type-btn active" id="type-individual" onclick="setAccountType('individual')">👨‍👩‍👧 <span data-i18n="auth_type_parent"></span></div>
        <div class="account-type-btn" id="type-organization" onclick="setAccountType('organization')">🏫 <span data-i18n="auth_type_org"></span></div>
      </div>

      <div class="form-group" id="org-name-group" style="display:none;">
        <label class="form-label" data-i18n="auth_orgname_label"></label>
        <input type="text" class="form-input" id="register-orgname" data-i18n-placeholder="auth_orgname_placeholder">
      </div>

      <div class="form-group">
        <label class="form-label" data-i18n="auth_name_label"></label>
        <input type="text" class="form-input" id="register-name" data-i18n-placeholder="auth_name_placeholder">
      </div>
      <div class="form-group">
        <label class="form-label" data-i18n="auth_email_label"></label>
        <input type="email" class="form-input" id="register-email" placeholder="you@example.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label" data-i18n="auth_password_label"></label>
        <input type="password" class="form-input" id="register-password" data-i18n-placeholder="auth_password_placeholder" autocomplete="new-password">
        <div class="form-hint" data-i18n="auth_free_hint"></div>
      </div>
      <button class="cta" style="width:100%;" onclick="doRegister()"><span data-i18n="auth_register_btn"></span></button>
      <div class="form-error" id="register-error"></div>
    </div>

    <p style="margin-top:20px;">
      <a href="index.html" style="color:#8B95A3; font-size:0.9rem;" data-i18n="auth_continue_without"></a>
    </p>
  </div>
</section>

<footer data-i18n="footer"></footer>

<script src="assets/i18n.js"></script>
<script src="assets/auth.js"></script>
<script src="assets/progress.js"></script>
<script>
  var currentAccountType = 'individual';

  function showTab(tab){
    document.getElementById('tab-login').classList.toggle('active', tab === 'login');
    document.getElementById('tab-register').classList.toggle('active', tab === 'register');
    document.getElementById('form-login').style.display = tab === 'login' ? 'block' : 'none';
    document.getElementById('form-register').style.display = tab === 'register' ? 'block' : 'none';
  }

  function setAccountType(type){
    currentAccountType = type;
    document.getElementById('type-individual').classList.toggle('active', type === 'individual');
    document.getElementById('type-organization').classList.toggle('active', type === 'organization');
    document.getElementById('org-name-group').style.display = type === 'organization' ? 'block' : 'none';
  }

  function tr(key){
    var lang = document.documentElement.getAttribute('data-current') || 'ru';
    return (translations[lang] && translations[lang][key]) || translations.ru[key] || key;
  }

  function doLogin(){
    var email = document.getElementById('login-email').value.trim();
    var password = document.getElementById('login-password').value;
    var errorEl = document.getElementById('login-error');
    errorEl.textContent = '';

    if(!email || !password){
      errorEl.textContent = tr('auth_err_fill_both');
      return;
    }
    loginAccount(email, password).then(function(){
      window.location.href = 'profiles.html';
    }).catch(function(e){
      errorEl.textContent = e.message;
    });
  }

  function doRegister(){
    var orgName = document.getElementById('register-orgname').value.trim();
    var name = document.getElementById('register-name').value.trim();
    var email = document.getElementById('register-email').value.trim();
    var password = document.getElementById('register-password').value;
    var errorEl = document.getElementById('register-error');
    errorEl.textContent = '';

    if(!email || !password){
      errorEl.textContent = tr('auth_err_fill_both');
      return;
    }
    if(currentAccountType === 'organization' && !orgName){
      errorEl.textContent = tr('auth_err_need_orgname');
      return;
    }
    registerAccount(currentAccountType, orgName, email, password, name).then(function(){
      window.location.href = 'profiles.html';
    }).catch(function(e){
      errorEl.textContent = e.message;
    });
  }
</script>
</body>
</html>
