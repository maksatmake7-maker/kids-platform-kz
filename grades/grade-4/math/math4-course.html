GENS.m4q2l24t = mkTF([{"q": "Если первый выехал раньше, до выезда второго он едет один.", "a": "Верно", "h": "Расстояние в это время сокращает только первый."}, {"q": "Путь первого до выезда второго находят умножением скорости на время: 60 · 2 = 120 км.", "a": "Верно", "h": "Скорость умножаем на время."}, {"q": "Скорость сближения считают, пока едет один объект.", "a": "Неверно", "h": "Скорость сближения — сумма скоростей двух объектов, которые уже едут."}, {"q": "Если между поездами осталось 300 км, а скорость сближения 100 км/ч, то они встретятся через 3 ч.", "a": "Верно", "h": "300 : 100 = 3 (ч)."}, {"q": "Если один объект выехал раньше, то до встречи он будет в пути дольше второго.", "a": "Верно", "h": "Время в пути первого = время второго + h."}, {"q": "Время встречи равно расстоянию, делённому на скорость первого.", "a": "Неверно", "h": "Делят остаток расстояния на скорость сближения."}, {"q": "Если Асет выехал в 9:00, Ержан — в 10:00, а встреча через 3 ч после выезда Ержана, то встреча в 13:00.", "a": "Верно", "h": "10:00 + 3 ч = 13:00."}, {"q": "Сумма путей двух объектов до встречи равна расстоянию между ними.", "a": "Верно", "h": "48 + 54 = 102 (км)."}, {"q": "Если первый выехал на 2 ч раньше, то остаток расстояния равен S − v₁ · 2.", "a": "Верно", "h": "Остаток = расстояние минус путь первого за 2 ч."}, {"q": "При встрече первый проехал 12 · 4 = 48 км, а второй 18 · 4 = 72 км.", "a": "Неверно", "h": "Неверно: второй ехал на 1 ч меньше, 18 · 3 = 54 (км)."}, {"q": "В задаче про 540 км и скорости 50 км/ч и 60 км/ч (первый выехал раньше на 2 ч) время после выезда второго равно 4 ч.", "a": "Верно", "h": "540 − 100 = 440, 440 : 110 = 4 (ч)."}, {"q": "Схема помогает увидеть, какую часть пути прошёл первый до выезда второго.", "a": "Верно", "h": "На схеме отмечают отрезок, пройденный первым в одиночку."}]);
GENS.m4q2l25q = mkQuiz([{"q": "Два автомобиля выехали из одного места в противоположных направлениях со скоростями 75 км/ч и 45 км/ч. Чему равна скорость удаления?", "a": "120 км/ч", "w": ["30 км/ч", "130 км/ч"], "h": "Скорость удаления равна сумме скоростей: 75 + 45 = 120 (км/ч)."}, {"q": "Как найти скорость удаления, если два тела движутся в противоположных направлениях?", "a": "сложить скорости", "w": ["вычесть из большей скорости меньшую", "умножить скорости"], "h": "При движении в противоположных направлениях скорость удаления равна сумме скоростей: v₁ + v₂ = v_уд."}, {"q": "Со станции Арыс одновременно отправились два поезда в противоположных направлениях. Скорость одного 85 км/ч, другого 75 км/ч. Какое расстояние будет между поездами через 3 ч?", "a": "480 км", "w": ["160 км", "30 км"], "h": "1) 85 + 75 = 160 (км/ч) — скорость удаления. 2) 160 · 3 = 480 (км)."}, {"q": "Два велосипедиста выехали из одного села в противоположных направлениях. Один ехал со скоростью 18 км/ч, другой — 14 км/ч. Какое расстояние между ними будет через 5 ч?", "a": "160 км", "w": ["20 км", "32 км"], "h": "(18 + 14) · 5 = 32 · 5 = 160 (км)."}, {"q": "Из Астаны одновременно вылетели два самолёта в противоположные стороны. Скорость одного 800 км/ч, другого — 900 км/ч. Какое расстояние будет между самолётами через 2 ч?", "a": "3 400 км", "w": ["1 700 км", "200 км"], "h": "Скорость удаления: 800 + 900 = 1 700 (км/ч). Расстояние: 1 700 · 2 = 3 400 (км)."}, {"q": "Два грузовика выехали из одного пункта в противоположных направлениях: один со скоростью 60 км/ч, другой — 65 км/ч. Через сколько часов расстояние между ними будет 500 км?", "a": "4 ч", "w": ["20 ч", "5 ч"], "h": "1) 60 + 65 = 125 (км/ч). 2) 500 : 125 = 4 (ч)."}, {"q": "Два лыжника побежали от кордона в противоположные стороны со скоростями 11 км/ч и 9 км/ч. Через сколько часов расстояние между ними станет 60 км?", "a": "3 ч", "w": ["30 ч", "5 ч"], "h": "Скорость удаления: 11 + 9 = 20 (км/ч). Время: 60 : 20 = 3 (ч)."}, {"q": "Какой формулой находят время, если известны расстояние и скорость удаления?", "a": "t = S : v_уд", "w": ["t = S · v_уд", "t = v_уд : S"], "h": "Чтобы найти время, расстояние делим на скорость удаления: t = S : v_уд."}, {"q": "Какой формулой находят расстояние между объектами, которые движутся в противоположных направлениях?", "a": "S = v_уд · t", "w": ["S = v_уд : t", "S = v₁ − v₂"], "h": "Расстояние равно скорости удаления, умноженной на время: S = v_уд · t."}, {"q": "Два катера отплыли от причала в разные стороны со скоростями 55 км/ч и 65 км/ч. На сколько километров увеличивается расстояние между ними каждый час?", "a": "на 120 км", "w": ["на 10 км", "на 130 км"], "h": "За 1 час расстояние растёт на скорость удаления: 55 + 65 = 120 (км)."}, {"q": "Два пешехода идут от одного дома в противоположных направлениях: 5 км/ч и 4 км/ч. Какое выражение показывает расстояние между ними через 3 ч?", "a": "(5 + 4) · 3", "w": ["5 + 4 · 3", "(5 − 4) · 3"], "h": "Сначала находим скорость удаления (5 + 4), потом умножаем на время."}, {"q": "Какое первое действие во 2-м способе решения задачи на движение в противоположных направлениях?", "a": "найти скорость удаления", "w": ["найти разность скоростей", "найти путь первого объекта"], "h": "Во втором способе сначала складываем скорости и получаем скорость удаления."}, {"q": "Два мотоциклиста выехали из одного села в разные стороны. Через 2 ч расстояние между ними стало 160 км. Какова скорость удаления?", "a": "80 км/ч", "w": ["162 км/ч", "320 км/ч"], "h": "Скорость удаления — это расстояние за 1 час: 160 : 2 = 80 (км/ч)."}, {"q": "Расстояние между двумя автобусами, которые едут в разные стороны, увеличивается на 120 км за каждый час. Какое расстояние будет между ними через 4 ч после начала движения из одной точки?", "a": "480 км", "w": ["124 км", "360 км"], "h": "Скорость удаления 120 км/ч. 120 · 4 = 480 (км)."}, {"q": "В каких единицах измеряют скорость удаления двух автомобилей?", "a": "км/ч", "w": ["км", "ч"], "h": "Скорость удаления — это тоже скорость, её измеряют в километрах в час."}, {"q": "Два пешехода вышли из одного места в противоположных направлениях. Первый шёл 4 км/ч, второй — 5 км/ч. Какое расстояние между ними будет через 2 ч?", "a": "18 км", "w": ["8 км", "10 км"], "h": "4 · 2 = 8 (км) прошёл первый, 5 · 2 = 10 (км) — второй. Вместе 18 км."}]);
GENS.m4q2l25t = mkTF([{"q": "Скорость удаления при движении в противоположных направлениях равна сумме скоростей.", "a": "Верно", "h": "Например, 60 + 40 = 100 (км/ч)."}, {"q": "Скорость удаления равна разности скоростей.", "a": "Неверно", "h": "Разность находят, когда объекты едут в одну сторону. А в противоположные — скорости складывают."}, {"q": "S = v_уд · t — формула расстояния между объектами, которые удаляются друг от друга.", "a": "Верно", "h": "Расстояние равно скорости удаления, умноженной на время."}, {"q": "Чтобы найти время, надо скорость удаления разделить на расстояние.", "a": "Неверно", "h": "Наоборот: t = S : v_уд, расстояние делим на скорость удаления."}, {"q": "Если два велосипедиста выехали из одного места в разные стороны, в начале расстояние между ними равно нулю.", "a": "Верно", "h": "Они стоят в одной точке, и только потом начинают удаляться."}, {"q": "При движении в противоположных направлениях расстояние между объектами уменьшается.", "a": "Неверно", "h": "Расстояние увеличивается: объекты отдаляются друг от друга."}, {"q": "Если скорости 70 км/ч и 50 км/ч, то скорость удаления равна 120 км/ч.", "a": "Верно", "h": "70 + 50 = 120 (км/ч)."}, {"q": "За 3 ч при скоростях 60 км/ч и 40 км/ч расстояние между двумя автомобилями станет 300 км.", "a": "Верно", "h": "(60 + 40) · 3 = 300 (км)."}, {"q": "За 4 ч при скоростях 60 км/ч и 40 км/ч расстояние между двумя автомобилями станет 300 км.", "a": "Неверно", "h": "Неверно: (60 + 40) · 4 = 400 (км), а 300 км — это за 3 часа."}, {"q": "Скорость удаления может быть меньше скорости каждого из объектов.", "a": "Неверно", "h": "Скорость удаления — сумма скоростей, поэтому она больше каждой из них."}, {"q": "Такую задачу можно решить двумя способами.", "a": "Верно", "h": "Можно сначала найти пути каждого и сложить, а можно сразу найти скорость удаления."}, {"q": "Два поезда, у которых скорость 50 км/ч, за 2 ч отдалятся друг от друга на 300 км.", "a": "Неверно", "h": "Неверно: скорость удаления 100 км/ч, 300 км будет за 3 часа, а не за 2."}, {"q": "Если скорости объектов 8 км/ч и 6 км/ч, расстояние между ними вырастет на 14 км за 1 ч.", "a": "Верно", "h": "8 + 6 = 14 (км) за каждый час."}]);
GENS.m4q2l26q = mkQuiz([{"q": "Из двух сёл, расстояние между которыми 12 км, одновременно выехали два велосипедиста в противоположных направлениях — друг от друга. Скорости 15 км/ч и 13 км/ч. Какое расстояние будет между ними через 3 ч?", "a": "96 км", "w": ["84 км", "40 км"], "h": "1) 15 + 13 = 28 (км/ч). 2) 28 · 3 = 84 (км) — они отдалились. 3) 84 + 12 = 96 (км)."}, {"q": "Из двух аулов, расстояние между которыми 50 км, выехали в противоположных направлениях два мотоциклиста: 60 км/ч и 70 км/ч. Какое расстояние будет между ними через 3 ч?", "a": "440 км", "w": ["390 км", "180 км"], "h": "Скорость удаления: 60 + 70 = 130 (км/ч). За 3 ч они отдалятся на 390 км. Вместе с начальными 50 км получится 440 км."}, {"q": "Расстояние между двумя катерами 8 км. Они поплыли в разные стороны со скоростями 22 км/ч и 18 км/ч. Через сколько часов между ними будет 168 км?", "a": "4 ч", "w": ["5 ч", "3 ч"], "h": "Сначала найдём, на сколько они должны отдалиться: 168 − 8 = 160 (км). Скорость удаления 40 км/ч. Время: 160 : 40 = 4 (ч)."}, {"q": "Два поезда одновременно вышли с одной станции в противоположных направлениях. Через 4 ч расстояние между ними стало 560 км. Скорость одного поезда 65 км/ч. С какой скоростью шёл другой поезд?", "a": "75 км/ч", "w": ["205 км/ч", "140 км/ч"], "h": "1) 560 : 4 = 140 (км/ч) — скорость удаления. 2) 140 − 65 = 75 (км/ч)."}, {"q": "Два велосипедиста выехали из одной точки в разные стороны. Скорости 14 км/ч и 16 км/ч. Сколько часов они ехали, если расстояние между ними стало 150 км?", "a": "5 ч", "w": ["75 ч", "6 ч"], "h": "Скорость удаления 30 км/ч. 150 : 30 = 5 (ч)."}, {"q": "1 узел примерно равен 2 км/ч. Катер идёт со скоростью 15 узлов. Примерно сколько это километров в час?", "a": "30 км/ч", "w": ["17 км/ч", "35 км/ч"], "h": "Узел — единица скорости. Если округлить, 1 узел ≈ 2 км/ч, значит 15 · 2 = 30 (км/ч)."}, {"q": "Через 4 ч расстояние между поездами, которые ушли с одной станции в разные стороны, стало 560 км. Скорость одного — 65 км/ч, другого — x км/ч. Какое уравнение подходит?", "a": "(x + 65) · 4 = 560", "w": ["x + 65 · 4 = 560", "(x − 65) · 4 = 560"], "h": "Скорость удаления — это x + 65. Умножаем её на время и получаем расстояние."}, {"q": "Реши уравнение: (x + 24) · 5 = 300. Чему равен x?", "a": "36", "w": ["60", "276"], "h": "(x + 24) · 5 = 300, значит x + 24 = 300 : 5 = 60. Тогда x = 60 − 24 = 36."}, {"q": "Двое друзей выехали на мотоциклах из одного места в разные стороны. Через 3 ч между ними было 270 км. Первый ехал со скоростью 40 км/ч. С какой скоростью ехал второй?", "a": "50 км/ч", "w": ["130 км/ч", "90 км/ч"], "h": "Скорость удаления: 270 : 3 = 90 (км/ч). Скорость второго: 90 − 40 = 50 (км/ч)."}, {"q": "Два катера стоят на расстоянии 20 км друг от друга. Они одновременно отплыли в противоположные стороны, а скорость удаления у них 30 км/ч. Какое расстояние будет между ними через 2 ч?", "a": "80 км", "w": ["60 км", "50 км"], "h": "30 · 2 = 60 (км) — на столько они отдалятся. Прибавляем начальные 20 км: 80 км."}, {"q": "Объекты выехали из разных мест в противоположных направлениях. Как найти время, за которое между ними станет заданное расстояние?", "a": "из заданного расстояния вычесть начальное и разделить на скорость удаления", "w": ["заданное расстояние разделить на разность скоростей", "умножить начальное расстояние на скорость удаления"], "h": "Начальное расстояние у них уже есть. Остаётся отдалиться на разницу: (S − S₀) : v_уд."}, {"q": "Сколько действий нужно, чтобы решить вторым способом задачу про два автобуса, которые выехали из одной точки в разные стороны (даны скорости и время)?", "a": "2", "w": ["1", "4"], "h": "1) Скорость удаления: v₁ + v₂. 2) Расстояние: v_уд · t."}, {"q": "Из Тараза в противоположные стороны выехали две машины: 90 км/ч и 80 км/ч. Какое расстояние будет между ними через 2 ч?", "a": "340 км", "w": ["170 км", "20 км"], "h": "(90 + 80) · 2 = 170 · 2 = 340 (км)."}, {"q": "Двое ребят пошли от костра в противоположных направлениях: 4 км/ч и 6 км/ч. Какое расстояние будет между ними через 3 ч?", "a": "30 км", "w": ["12 км", "18 км"], "h": "(4 + 6) · 3 = 30 (км)."}]);
GENS.m4q2l26t = mkTF([{"q": "Если объекты выехали из разных мест в противоположных направлениях, то расстояние между ними увеличивается.", "a": "Верно", "h": "Они отдаляются друг от друга, и расстояние растёт."}, {"q": "При движении из двух разных точек друг от друга надо к пройденному расстоянию прибавить начальное.", "a": "Верно", "h": "Например, 12 + 84 = 96: начальные 12 км и ещё 84 км, на которые они отдалились."}, {"q": "Два мотоциклиста выехали из двух мест, между которыми 20 км, в разные стороны со скоростями 30 км/ч и 20 км/ч. Через 2 ч расстояние между ними будет 120 км.", "a": "Верно", "h": "(30 + 20) · 2 + 20 = 120 (км)."}, {"q": "В той же задаче через 2 ч расстояние между ними будет 100 км.", "a": "Неверно", "h": "Неверно: начальные 20 км тоже надо прибавить: 100 + 20 = 120 (км)."}, {"q": "Чтобы найти вторую скорость, надо из скорости удаления вычесть первую скорость.", "a": "Верно", "h": "v₂ = v_уд − v₁. Например, 140 − 65 = 75 (км/ч)."}, {"q": "Скорость удаления можно найти делением расстояния на время.", "a": "Верно", "h": "v_уд = S : t. Например, 560 : 4 = 140 (км/ч)."}, {"q": "1 узел примерно равен 2 км/ч.", "a": "Верно", "h": "Это приближённое значение: 1 узел — это 1 852 м в час."}, {"q": "Если (x + 24) · 5 = 300, то x = 60.", "a": "Неверно", "h": "Неверно: x + 24 = 300 : 5 = 60, а x = 60 − 24 = 36."}, {"q": "Если x + 24 = 60, то x = 36.", "a": "Верно", "h": "60 − 24 = 36."}, {"q": "Катера, между которыми 8 км, отплыли в разные стороны со скоростями 22 км/ч и 18 км/ч. Расстояние 168 км между ними будет через 4 ч.", "a": "Верно", "h": "(168 − 8) : (22 + 18) = 160 : 40 = 4 (ч)."}, {"q": "В задаче на противоположное движение расстояние можно найти только одним способом.", "a": "Неверно", "h": "Способов два: сложить пути или сразу найти скорость удаления."}, {"q": "Скорость удаления бывает меньше любой из скоростей.", "a": "Неверно", "h": "Это сумма скоростей, поэтому она больше каждой из них."}, {"q": "Через 3 ч при скорости удаления 90 км/ч расстояние равно 270 км.", "a": "Верно", "h": "90 · 3 = 270 (км)."}]);
GENS.m4q2l27q = mkQuiz([{"q": "Два друга живут в разных концах улицы и одновременно вышли друг другу навстречу. Какой это вид движения?", "a": "встречное движение", "w": ["движение в противоположных направлениях", "движение в одном направлении"], "h": "Они идут друг к другу, расстояние между ними уменьшается. Это встречное движение."}, {"q": "Из одного аэропорта в одно время вылетели два самолёта: один на запад, другой на восток. Какой это вид движения?", "a": "движение в противоположных направлениях", "w": ["встречное движение", "движение в одном направлении"], "h": "Они удаляются друг от друга. Это движение в противоположных направлениях."}, {"q": "Два поезда вышли из Алматы и Астаны навстречу друг другу. Какой это вид движения?", "a": "встречное движение", "w": ["движение в противоположных направлениях", "движение в одном направлении"], "h": "Поезда идут навстречу — это встречное движение. Скорости складываем и находим скорость сближения."}, {"q": "От одного родника два пастуха погнали стада в противоположные стороны. Какой это вид движения?", "a": "движение в противоположных направлениях", "w": ["встречное движение", "движение в одном направлении"], "h": "Расстояние между стадами растёт. Это движение в противоположных направлениях."}, {"q": "Из двух городов, расстояние между которыми 840 км, навстречу друг другу выехали два автомобиля: 55 км/ч и 65 км/ч. Через сколько часов они встретятся?", "a": "7 ч", "w": ["84 ч", "8 ч"], "h": "1) 55 + 65 = 120 (км/ч) — скорость сближения. 2) 840 : 120 = 7 (ч)."}, {"q": "Расстояние между двумя турбазами 20 км. Туристы одновременно пошли от них в противоположные стороны со скоростями 8 км/ч и 6 км/ч. Какое расстояние будет между ними через 3 ч?", "a": "62 км", "w": ["42 км", "72 км"], "h": "Туристы удаляются: (8 + 6) · 3 = 42 (км). Прибавим начальные 20 км: 62 км."}, {"q": "От двух пристаней, между которыми 30 км, одновременно отплыли в противоположных направлениях два катера. Через 2 ч расстояние между ними стало 100 км. Скорость второго катера 15 км/ч. Какова скорость первого?", "a": "20 км/ч", "w": ["35 км/ч", "50 км/ч"], "h": "1) 100 − 30 = 70 (км) — на столько они отдалились. 2) 70 : 2 = 35 (км/ч) — скорость удаления. 3) 35 − 15 = 20 (км/ч)."}, {"q": "На схеме стрелки направлены в разные стороны, S — расстояние между объектами. О каком движении эта схема?", "a": "движение в противоположных направлениях", "w": ["встречное движение", "движение в одном направлении"], "h": "Стрелки в разные стороны — объекты удаляются друг от друга."}, {"q": "Что общего у скорости сближения и скорости удаления двух объектов?", "a": "обе равны сумме скоростей", "w": ["обе равны разности скоростей", "обе равны произведению скоростей"], "h": "Если объекты едут навстречу или в противоположные стороны, скорости складываем."}, {"q": "Ученик нашёл скорость сближения двух поездов так: 60 − 40 = 20 км/ч. В чём ошибка?", "a": "скорости надо было сложить", "w": ["время надо было вычесть", "надо было умножить скорости"], "h": "Скорость сближения при встречном движении равна сумме скоростей: 60 + 40 = 100 (км/ч)."}, {"q": "Из двух станций навстречу друг другу вышли поезда со скоростями 50 км/ч и 70 км/ч, расстояние между станциями 600 км. Какое уравнение даёт время t до встречи?", "a": "(50 + 70) · t = 600", "w": ["50 + 70 · t = 600", "(70 − 50) · t = 600"], "h": "Скорость сближения 50 + 70, умножаем на время t и получаем всё расстояние 600 км. Тогда t = 5 ч."}, {"q": "Два самолёта вылетели навстречу друг другу из городов, расстояние между которыми 3 000 км. Скорости 700 км/ч и 800 км/ч. Через сколько часов самолёты встретятся?", "a": "2 ч", "w": ["30 ч", "3 ч"], "h": "Скорость сближения: 700 + 800 = 1 500 (км/ч). 3 000 : 1 500 = 2 (ч)."}, {"q": "Из двух городов навстречу друг другу выехали два автомобиля: 60 км/ч и 70 км/ч. Они встретились через 3 ч. Какое расстояние между городами?", "a": "390 км", "w": ["130 км", "30 км"], "h": "Скорость сближения 130 км/ч. 130 · 3 = 390 (км)."}, {"q": "Что нужно найти в любой задаче на движение двух объектов в первую очередь, если даны обе скорости?", "a": "скорость сближения или удаления", "w": ["только время", "только расстояние"], "h": "Складываем скорости: получаем скорость сближения (навстречу) или удаления (в разные стороны)."}, {"q": "Из двух деревень, расстояние между которыми 36 км, навстречу друг другу вышли два пешехода: 5 км/ч и 4 км/ч. Какое расстояние будет между ними через 2 ч?", "a": "18 км", "w": ["54 км", "27 км"], "h": "Они сближаются на 9 км за час. За 2 часа сблизились на 18 км. Осталось 36 − 18 = 18 (км)."}, {"q": "Два велосипедиста выехали навстречу друг другу со скоростями 25 км/ч и 17 км/ч, расстояние 84 км. Какое из выражений показывает скорость сближения?", "a": "25 + 17", "w": ["25 − 17", "84 : 25"], "h": "Скорость сближения — сумма скоростей: 25 + 17 = 42 (км/ч). Встретятся через 2 ч."}]);
GENS.m4q2l27t = mkTF([{"q": "Выбирая вид задачи на движение, смотрим на направление движения: навстречу или в разные стороны.", "a": "Верно", "h": "От этого зависит, сближаются объекты или удаляются."}, {"q": "В задаче на встречное движение скорости складывают.", "a": "Верно", "h": "Получаем скорость сближения."}, {"q": "В задаче на движение в противоположных направлениях скорости вычитают.", "a": "Неверно", "h": "Скорости складывают и получают скорость удаления."}, {"q": "Поезда идут навстречу со скоростями 50 км/ч и 70 км/ч, между станциями 600 км. Они встретятся через 5 ч.", "a": "Верно", "h": "(50 + 70) · t = 600, t = 600 : 120 = 5 (ч)."}, {"q": "В той же задаче поезда встретятся через 6 ч.", "a": "Неверно", "h": "Неверно: 600 : 120 = 5 (ч)."}, {"q": "Если объекты вышли из разных мест в противоположные стороны, расстояние между ними можно найти без начального расстояния.", "a": "Неверно", "h": "Начальное расстояние надо прибавить к тому, на сколько они отдалились."}, {"q": "Схема помогает увидеть, что известно и что надо найти.", "a": "Верно", "h": "На схеме отмечают v₁, v₂, t и S."}, {"q": "Уравнение к задаче на движение можно составить, если ввести букву x для неизвестного.", "a": "Верно", "h": "Например, (x + 24) · 5 = 300."}, {"q": "Задача на движение 20 + (30 + 20) · 2 решается так: сначала скорость удаления, потом отдаление, потом прибавляем начальные 20 км.", "a": "Неверно", "h": "Действия: 30 + 20 = 50, 50 · 2 = 100, 100 + 20 = 120."}, {"q": "Расстояние между объектами в задаче на встречное движение со временем растёт.", "a": "Неверно", "h": "При встрече расстояние уменьшается, пока не станет равно 0."}, {"q": "Время встречи находят делением расстояния между объектами на скорость сближения.", "a": "Верно", "h": "t = S : v_сбл."}, {"q": "Решая задачу об отдалении, надо проверять ответ: он должен быть больше начального расстояния.", "a": "Верно", "h": "Если объекты удаляются, расстояние становится больше."}, {"q": "Задачи на встречное движение и на движени GENS.m4q2l28q = mkQuiz([{"q": "Станок на заводе в Павлодаре делает 45 деталей в час. Сколько деталей он сделает за 8 ч?", "a": "360 дет.", "w": ["53 дет.", "400 дет."], "h": "A = v · t: 45 · 8 = 360 (дет.)."}, {"q": "Пекарня должна выпечь 1 200 лепёшек, выпекая по 80 лепёшек в час. За сколько часов она справится?", "a": "15 ч", "w": ["20 ч", "96 000 ч"], "h": "t = A : v: 1 200 : 80 = 15 (ч)."}, {"q": "Две швеи шьют шапки: одна 35 шапок в день, другая — 25. За сколько дней они сошьют 480 шапок, работая вместе?", "a": "8 дн.", "w": ["10 дн.", "16 дн."], "h": "Совместная производительность: 35 + 25 = 60 (шапок в день). 480 : 60 = 8 (дн.)."}, {"q": "Как найти совместную производительность двух мастеров?", "a": "сложить их производительности", "w": ["вычесть из большей меньшую", "умножить производительности"], "h": "v₁ + v₂ = v_совм. Каждый час (день) они делают вместе столько, сколько один плюс столько, сколько другой."}, {"q": "Двое рабочих изготовили 56 деталей. Один работал 3 ч, другой — 4 ч, производительность у них одинаковая. Сколько деталей изготовил каждый?", "a": "24 и 32", "w": ["32 и 20", "28 и 28"], "h": "1) 3 + 4 = 7 (ч) — всего. 2) 56 : 7 = 8 (дет.) — за 1 час. 3) 8 · 3 = 24, 8 · 4 = 32."}, {"q": "Два мастера за 3 ч и 5 ч сшили вместе 160 шапок. Они работали с одинаковой производительностью. Сколько шапок сшил первый мастер?", "a": "60", "w": ["100", "20"], "h": "Всего часов: 8. За 1 час: 160 : 8 = 20. Первый: 20 · 3 = 60."}, {"q": "С чего начинают решение задачи на пропорциональное деление, когда известны общее количество и время каждого, а производительность одинакова?", "a": "находят общее время", "w": ["находят разность времени", "умножают общее количество на время"], "h": "Сначала складываем время, потом делим общее количество на общее время — получаем количество за 1 час."}, {"q": "На швейной фабрике сшили 8 платьев и 5 рубашек. На платья ткани ушло на 6 м больше, чем на рубашки. На каждое изделие ткани уходит поровну. Сколько метров ткани на одно изделие?", "a": "2 м", "w": ["3 м", "8 м"], "h": "1) 8 − 5 = 3 (шт.) — на столько изделий больше. 2) 6 : 3 = 2 (м) — на одно изделие."}, {"q": "За 9 одинаковых тетрадей заплатили на 150 тенге больше, чем за 6 таких же. Сколько стоит одна тетрадь?", "a": "50 тенге", "w": ["25 тенге", "60 тенге"], "h": "Тетрадей на 3 больше, а цена за них — на 150 тенге больше. 150 : 3 = 50 (тенге)."}, {"q": "За 9 одинаковых тетрадей заплатили на 150 тенге больше, чем за 6 таких же. Сколько заплатили за 9 тетрадей?", "a": "450 тенге", "w": ["300 тенге", "1 350 тенге"], "h": "Одна тетрадь: 150 : 3 = 50 тенге. За 9 тетрадей: 50 · 9 = 450 (тенге)."}, {"q": "Что надо сделать в первую очередь в задаче на неизвестное по двум разностям?", "a": "найти разность двух других известных величин", "w": ["сложить все числа из условия", "найти произведение двух величин"], "h": "В такой задаче три связанные величины. Сначала узнаём разность двух из них, а потом делим разность значений третьей на неё."}, {"q": "Из двух сёл, расстояние между которыми 500 км, навстречу друг другу выехали два грузовика: 60 км/ч и 65 км/ч. Через сколько часов они встретятся?", "a": "4 ч", "w": ["100 ч", "5 ч"], "h": "Скорость сближения: 60 + 65 = 125 (км/ч). 500 : 125 = 4 (ч)."}, {"q": "Два поезда одновременно отошли от одной станции в противоположных направлениях. Скорости 85 км/ч и 75 км/ч. Какое расстояние будет между поездами через 3 ч?", "a": "480 км", "w": ["160 км", "30 км"], "h": "Скорость удаления: 85 + 75 = 160 (км/ч). 160 · 3 = 480 (км)."}, {"q": "Из двух сёл, расстояние между которыми 12 км, выехали в противоположных направлениях два велосипедиста: 15 км/ч и 13 км/ч. Какое расстояние будет между ними через 3 ч?", "a": "96 км", "w": ["84 км", "40 км"], "h": "(15 + 13) · 3 = 84 (км) — отдалились. Прибавляем начальные 12 км: 96 км."}, {"q": "Чем похожи скорость сближения и скорость удаления?", "a": "обе равны сумме скоростей", "w": ["обе равны разности скоростей", "обе равны скорости одного объекта"], "h": "Если объекты движутся навстречу друг другу или в противоположные стороны, скорости складывают."}, {"q": "Два поезда одновременно вышли с одной станции в разные стороны. Через 4 ч между ними было 560 км. Скорость одного 65 км/ч. Какова скорость другого?", "a": "75 км/ч", "w": ["205 км/ч", "140 км/ч"], "h": "560 : 4 = 140 (км/ч) — скорость удаления. 140 − 65 = 75 (км/ч)."}]);
GENS.m4q2l28t = mkTF([{"q": "Производительность — это объём работы за единицу времени.", "a": "Верно", "h": "Например, 45 деталей в час."}, {"q": "A = v · t, где A — объём работы, v — производительность, t — время.", "a": "Верно", "h": "Объём равен производительности, умноженной на время."}, {"q": "Чтобы найти время работы, надо объём разделить на производительность.", "a": "Верно", "h": "t = A : v."}, {"q": "Совместная производительность двух швей, которые шьют 35 и 25 шапок в день, равна 60 шапок в день.", "a": "Верно", "h": "35 + 25 = 60."}, {"q": "Совместная производительность находится вычитанием производительностей.", "a": "Неверно", "h": "Производительности складывают."}, {"q": "Если 56 деталей сделали за 3 ч и 4 ч с одинаковой производительностью, то за один час делали 8 деталей.", "a": "Верно", "h": "56 : (3 + 4) = 8."}, {"q": "В той же задаче первый рабочий сделал 24 детали.", "a": "Верно", "h": "8 · 3 = 24 (дет.)."}, {"q": "В задаче на неизвестное по двум разностям сначала находят разность двух других величин.", "a": "Верно", "h": "Например, 8 − 5 = 3 (шт.), потом 6 : 3 = 2 (м)."}, {"q": "Если за 9 тетрадей на 150 тенге больше, чем за 6, то одна тетрадь стоит 25 тенге.", "a": "Неверно", "h": "Неверно: 150 : (9 − 6) = 50 (тенге), а не 150 : 6."}, {"q": "Время встречи равно расстоянию, делённому на скорость сближения.", "a": "Верно", "h": "t = S : v_сбл."}, {"q": "При движении в противоположных направлениях скорость удаления равна разности скоростей.", "a": "Неверно", "h": "Скорость удаления равна сумме скоростей."}, {"q": "Два поезда ушли с одной станции в разные стороны со скоростями 85 км/ч и 75 км/ч. Через 3 ч между ними 480 км.", "a": "Верно", "h": "(85 + 75) · 3 = 480 (км)."}, {"q": "Задача на встречное движение и задача на движение в противоположных направлениях решаются по одной схеме действий: сначала сумма скоростей.", "a": "Верно", "h": "Это общее: находим скорость сближения или удаления."}]);

  {"id": "m4q1l01", "icon": "", "title": "Урок 1. Повторение пройденного в 3 классе", "goal": "Повторить числа, четыре арифметические действия, порядок действий и решение простых задач", "steps": [{"id": "m4q1l01s1", "scene": "infoTap", "gate": true, "title": "Знакомимся с темой", "text": "Привет! Это Барсик. Вспомним всё, что мы учили в 3 классе: числа, четыре действия, порядок действий и задачи. Нажимай на карточки.", "need": 5, "items": [{"k": "порядок действий", "v": "", "t": "Сначала выполняют действия в скобках. Потом умножение и деление, затем сложение и вычитание. Пример: 240 + (118 − 80) · 3 = 354."}, {"k": "без скобок", "v": "", "t": "Если есть только сложение и вычитание, считаем слева направо. Пример: 100 − 40 + 25 = 85."}, {"k": "названия чисел", "v": "", "t": "При сложении есть слагаемые и сумма. При вычитании — уменьшаемое, вычитаемое и разность. При умножении — множители и произведение. При делении — делимое, делитель и частное. Пример: 56 : 8 = 7, число 7 — частное."}, {"k": "величины", "v": "", "t": "Заменяем крупные единицы мелкими, считаем, потом переводим обратно. Пример: 1 ч 16 мин − 45 мин = 76 мин − 45 мин = 31 мин."}, {"k": "проверка", "v": "", "t": "Сложение проверяем вычитанием, а деление — умножением. Пример: 56 : 8 = 7, проверка: 7 · 8 = 56."}, {"k": "задача", "v": "", "t": "Читай условие, выдели, что известно и что нужно найти. Пример: 9 билетов стоят 108 000 тенге, один билет стоит 108 000 : 9 = 12 000 тенге."}]}, {"id": "m4q1l01s2", "scene": "sortGroups", "gate": true, "title": "Разложи по группам", "text": "Разложи карточки по группам. Выбери, к какой группе относится каждая карточка.", "q": "В какую группу относится?", "take": 8, "groups": [{"e": "", "k": "Скобки"}, {"e": "", "k": "Умножение или деление"}, {"e": "", "k": "Слева направо"}], "items": [{"g": 0, "e": "", "t": "240 + (118 − 80) · 3", "h": "в скобках 118 − 80 = 38"}, {"g": 0, "e": "", "t": "(95 + 305) : 5", "h": "в скобках 95 + 305 = 400"}, {"g": 0, "e": "", "t": "630 − (   {"id": "m4q1l02", "icon": "", "title": "Урок 2. Многозначные числа. Последовательности", "goal": "Называть разряды и классы чисел до 999 999, сравнивать числа и находить закономерность в ряду чисел", "steps": [{"id": "m4q1l02s1", "scene": "infoTap", "gate": true, "title": "Знакомимся с темой", "text": "Привет! Это Барсик. Сегодня работаем с большими числами: до 999 999. Узнаем про классы и разряды, будем читать, сравнивать числа и продолжать ряды. Нажимай на карточки.", "need": 5, "items": [{"k": "классы и разряды", "v": "", "t": "В каждом классе по 3 разряда: единицы, десятки, сотни. Класс единиц — это первые три разряда справа. Класс тысяч — следующие три. Пример: в числе 345 678 класс тысяч — 345, класс единиц — 678."}, {"k": "названия разрядов", "v": "", "t": "В классе тысяч разряды называют так: единицы тысяч, десятки тысяч, сотни тысяч. Пример: в числе 485 207 цифра 8 стоит в разряде десятков тысяч."}, {"k": "как читать", "v": "", "t": "Читаем сначала класс тысяч и добавляем слово «тысяч», затем класс единиц. Пример: 405 102 — четыреста пять тысяч сто два."}, {"k": "разрядные слагаемые", "v": "", "t": "Число можно записать суммой разрядных слагаемых. Нулевые разряды не пишем. Пример: 71 362 = 70 000 + 1 000 + 300 + 60 + 2."}, {"k": "сравнение", "v": "", "t": "Больше цифр — больше число. Если цифр поровну, сравниваем слева направо по разрядам. Пример: 457 321 > 457 231, потому что сотен 3 и 2."}, {"k": "ряд чисел", "v": "", "t": "Чтобы продолжить ряд, найди закономерность: на сколько каждое число больше или меньше соседнего. Пример: 15 000, 25 000, 35 000 — шаг 10 000, дальше 45 000."}]}, {"id": "m4q1l02s2", "scene": "sortGroups", "gate": true, "title": "Разложи по группам", "text": "Разложи карточки по группам. Выбери, к какой группе относится каждая карточка.", "q": "В какую группу относится?", "take": 8, "groups": [{"e": "", "k": "Единицы тысяч"}, {"e": "", "k": "Десятки тысяч"}, {"e": "", "k": "Сотни тысяч"}], "items": [{"g": 0, "e": "", "t": "Цифра 4 в ч   {"id": "m4q1l03", "icon": "", "title": "Урок 3. Класс миллионов", "goal": "Читать и записывать числа в пределах миллиарда и записывать их суммой разрядных слагаемых", "steps": [{"id": "m4q1l03s1", "scene": "infoTap", "gate": true, "title": "Знакомимся с темой", "text": "Привет! Это Барсик. Сегодня мы узнаем про самые большие числа: миллионы. Научимся их читать, записывать и раскладывать на разрядные слагаемые. Нажимай на карточки.", "need": 5, "items": [{"k": "миллион", "v": "", "t": "Миллион — это тысяча тысяч. Записывают его как единицу и шесть нулей: 1 000 000. Миллион — новая счётная единица класса миллионов. Пример: 1 000 · 1 000 = 1 000 000."}, {"k": "класс миллионов", "v": "", "t": "Это третий класс числа. В нём три разряда: единицы миллионов, десятки миллионов и сотни миллионов. Пример: в числе 523 312 005 класс миллионов — 523."}, {"k": "как читать", "v": "", "t": "Читаем по классам слева направо. Называем число класса и его имя: «миллионов», «тысяч». Класс единиц имя не получает. Пример: 26 890 909 — двадцать шесть миллионов восемьсот девяносто тысяч девятьсот девять."}, {"k": "как записать", "v": "", "t": "Записываем класс за классом. Если в классе нет единиц нужного разряда, ставим 0. Пример: «пять миллионов сорок тысяч» — это 5 040 000."}, {"k": "разрядные слагаемые", "v": "", "t": "Записываем каждую цифру с нужным количеством нулей и ставим плюсы. Нулевые разряды пропускаем. Пример: 3 405 021 = 3 000 000 + 400 000 + 5 000 + 20 + 1."}, {"k": "самое большое число", "v": "", "t": "Самое большое девятизначное число — 999 999 999. Если прибавить к нему 1, получится 1 000 000 000. Это тысяча миллионов, или миллиард."}]}, {"id": "m4q1l03s2", "scene": "sortGroups", "gate": true, "title": "Разложи по группам", "text": "Разложи карточки по группам. Выбери, к какой группе относится каждая карточка.", "q": "В какую группу относится?", "take": 8, "groups": [{"e": "", "k": "Единицы миллионов"}, {"e": "", "k": "Десятки миллионов"}, {"e": "", "k": "Сотни миллионов"}   {"id": "m4q1l04", "icon": "", "title": "Урок 4. Округление чисел", "goal": "Округлять натуральные числа до заданного разряда и записывать приближённые значения", "steps": [{"id": "m4q1l04s1", "scene": "infoTap", "gate": true, "title": "Знакомимся с темой", "text": "Привет! Это Барсик. Иногда точное число не нужно, хватит приблизительного. Научимся округлять числа до нужного разряда. Нажимай на карточки.", "need": 5, "items": [{"k": "что такое округление", "v": "", "t": "Округлить число — значит заменить его близким круглым числом. Это приближённое значение. Пишем знак «≈». Пример: 3 764 ≈ 3 800."}, {"k": "цифры 0, 1, 2, 3, 4", "v": "", "t": "Смотрим на цифру справа от разряда округления. Если она от 0 до 4, цифру разряда оставляем, а остальные заменяем нулями. Пример: 52 314 ≈ 52 000 (до тысяч)."}, {"k": "цифры 5, 6, 7, 8, 9", "v": "", "t": "Если справа цифра от 5 до 9, цифру разряда увеличиваем на 1, а остальные заменяем нулями. Пример: 52 714 ≈ 53 000 (до тысяч)."}, {"k": "цифра 9 в разряде", "v": "", "t": "Если нужно увеличить девятку, получится переход в следующий разряд. Пример: 79 600 ≈ 80 000 (до тысяч), 4 996 ≈ 5 000 (до десятков)."}, {"k": "как называют разряд", "v": "", "t": "Можно округлять до десятков, сотен, тысяч, десятков тысяч, сотен тысяч. Пример: 396 871 ≈ 400 000 (до десятков тысяч), 396 871 ≈ 397 000 (до тысяч)."}, {"k": "где пригодится", "v": "", "t": "Приближённые числа удобны, когда точность не важна: численность зрителей, расстояния. Пример: 1 213 км ≈ 1 200 км (до сотен)."}]}, {"id": "m4q1l04s2", "scene": "sortGroups", "gate": true, "title": "Разложи по группам", "text": "Разложи карточки по группам. Выбери, к какой группе относится каждая карточка.", "q": "В какую группу относится?", "take": 8, "groups": [{"e": "", "k": "Округлим вниз"}, {"e": "", "k": "Округлим вверх"}, {"e": "", "k": "Число не изменится"}], "items": [{"g": 0, "e": "", "t": "Округлить 52 314 до тысяч", "h": "52 314 ≈ 52 000"}, {"g": 0, "e": "", "t": "Округлить 3 721 до с   {"id": "m4q1l05", "icon": "", "title": "Урок 5. Арифметические действия с многозначными числами", "goal": "Выполнять действия с многозначными числами, находить неизвестный компонент в уравнении и решать задачи", "steps": [{"id": "m4q1l05s1", "scene": "infoTap", "gate": true, "title": "Знакомимся с темой", "text": "Привет! Это Барсик. Сегодня считаем с большими числами: устно, по порядку действий, решаем уравнения и задачи. Нажимай на карточки.", "need": 5, "items": [{"k": "устный счёт", "v": "", "t": "Круглые многозначные числа считаем по классам. Пример: 48 000 + 5 000 = 53 000, потому что 48 + 5 = 53 тысячи."}, {"k": "разрядные слагаемые", "v": "", "t": "Число можно разбить на разрядные слагаемые и вычитать по частям. Пример: 126 987 − 20 000 − 80 = 106 987 − 80 = 106 907."}, {"k": "порядок действий", "v": "", "t": "Сначала считаем в скобках. Потом умножение и деление, затем сложение и вычитание. Пример: 90 000 − (24 000 + 6 000) : 3 = 90 000 − 10 000 = 80 000."}, {"k": "уравнение", "v": "", "t": "Неизвестное слагаемое равно сумме без известного слагаемого. Пример: x + 12 000 = 20 000, x = 20 000 − 12 000 = 8 000."}, {"k": "уменьшаемое и вычитаемое", "v": "", "t": "Неизвестное уменьшаемое равно разности плюс вычитаемое. Неизвестное вычитаемое равно уменьшаемому без разности. Пример: 50 000 − x = 18 000, x = 32 000."}, {"k": "задача и проверка", "v": "", "t": "В задаче найди, что известно и что нужно найти. Реши, проверь по смыслу и прикидкой. Пример: 48 700 + 31 200 ≈ 50 000 + 30 000 = 80 000."}]}, {"id": "m4q1l05s2", "scene": "sortGroups", "gate": true, "title": "Разложи по группам", "text": "Разложи карточки по группам. Выбери, к какой группе относится каждая карточка.", "q": "В какую группу относится?", "take": 8, "groups": [{"e": "", "k": "Неизвестное слагаемое"}, {"e": "", "k": "Неизвестное уменьшаемое"}, {"e": "", "k": "Неизвестное вычитаемое"}], "items": [{"g": 0, "e": "", "t": "x + 12 000 = 20 000", "h": "x = 20 000 − 12 000 = 8 000"}, {"g": 0, "e": "",   {"id": "m4q1l06", "icon": "", "title": "Урок 6. Письменное сложение многозначных чисел", "goal": "Складывать многозначные числа столбиком, переносить десяток в следующий разряд и проверять сумму вычитанием", "steps": [{"id": "m4q1l06s1", "scene": "infoTap", "gate": true, "title": "Знакомимся с темой", "text": "Привет! Это Барсик. Сегодня учимся складывать большие числа столбиком. Нажимай на карточки.", "need": 5, "items": [{"k": "как записать", "v": "", "t": "Пишем числа так, чтобы единицы стояли под единицами, десятки под десятками, сотни под сотнями, тысячи под тысячами. Пример: в записи 45 678 + 3 254 цифра 8 стоит над цифрой 4 — это единицы."}, {"k": "порядок", "v": "", "t": "Складываем справа налево: сначала единицы с единицами, потом десятки с десятками, сотни с сотнями и так далее. Пример: 45 678 + 3 254: сначала 8 + 4 = 12."}, {"k": "перенос", "v": "", "t": "Если в разряде получилось 10 или больше, пишем только единицы этого разряда, а один десяток переносим в следующий разряд. Пример: 8 + 4 = 12 — пишем 2, переносим 1."}, {"k": "нет разряда", "v": "", "t": "Если в одном числе не хватает разряда, считаем там 0. Пример: в числе 3 254 нет десятков тысяч, значит в этом разряде 0, и 4 + 0 = 4."}, {"k": "проверка", "v": "", "t": "Сумму проверяем вычитанием: из суммы вычитаем одно слагаемое — должно получиться другое. Пример: 45 678 + 3 254 = 48 932, а 48 932 − 3 254 = 45 678."}, {"k": "частая ошибка", "v": "", "t": "Часто забывают прибавить перенесённый десяток. Пример: 3 568 + 2 475 = 6 043. Если забыть про переносы, получится неверно 5 933 — это на 110 меньше."}]}, {"id": "m4q1l06s2", "scene": "sortGroups", "gate": true, "title": "Разложи по группам", "text": "Разложи карточки по группам. Выбери, к какой группе относится каждая карточка.", "q": "В какую группу относится?", "take": 8, "groups": [{"e": "", "k": "Переносов нет"}, {"e": "", "k": "Один перенос"}, {"e": "", "k": "Два переноса и больше"}], "items": [{"g": 0, "e": "", "t": "371 311 + 10 417", "h": "с   {"id": "m4q1l07", "icon": "", "title": "Урок 7. Письменное вычитание многозначных чисел", "goal": "Вычитать многозначные числа столбиком, занимать единицу у соседнего разряда, в том числе через нули, и проверять разность сложением", "steps": [{"id": "m4q1l07s1", "scene": "infoTap", "gate": true, "title": "Знакомимся с темой", "text": "Привет! Это Барсик. Сегодня учимся вычитать большие числа столбиком. Нажимай на карточки.", "need": 5, "items": [{"k": "как записать", "v": "", "t": "Пишем уменьшаемое, а вычитаемое под ним: единицы под единицами, десятки под десятками, сотни под сотнями. Пример: 7 462 − 2 819 — цифра 9 стоит под цифрой 2."}, {"k": "порядок", "v": "", "t": "Вычитаем справа налево: единицы из единиц, десятки из десятков, сотни из сотен. Пример: в разряде сотен 4 − 8 не получится — без займа здесь не обойтись."}, {"k": "заём", "v": "", "t": "Если цифра уменьшаемого меньше цифры вычитаемого, занимаем 1 у соседнего старшего разряда: это 10 единиц нашего разряда. Пример: из 2 единиц нельзя вычесть 9, занимаем десяток: 12 − 9 = 3."}, {"k": "через нули", "v": "", "t": "Если рядом нули, занимаем у ближайшей цифры, не равной нулю. Нули превращаются в девятки, а в нужном разряде получается 10. Пример: 30 004 − 1 275 = 28 729."}, {"k": "проверка", "v": "", "t": "Вычитание проверяем сложением: разность плюс вычитаемое должно дать уменьшаемое. Пример: 7 462 − 2 819 = 4 643, а 4 643 + 2 819 = 7 462."}, {"k": "частая ошибка", "v": "", "t": "Нельзя вычитать из большей цифры меньшую и забывать про заём. Пример: 7 462 − 2 819 = 4 643, а не 5 457."}]}, {"id": "m4q1l07s2", "scene": "sortGroups", "gate": true, "title": "Разложи по группам", "text": "Разложи карточки по группам. Выбери, к какой группе относится каждая карточка.", "q": "В какую группу относится?", "take": 8, "groups": [{"e": "", "k": "Заёма нет"}, {"e": "", "k": "Заём у соседней цифры"}, {"e": "", "k": "Заём через нули"}], "items": [{"g": 0, "e": "", "t": "689 759 − 17 225", "h": "сравни цифры по разрядам   {"id": "m4q1l08", "icon": "", "title": "Урок 8. Миллиграмм", "goal": "Узнать, что такое миллиграмм, выражать массу в разных единицах и сравнивать значения масс", "steps": [{"id": "m4q1l08s1", "scene": "infoTap", "gate": true, "title": "Знакомимся с темой", "text": "Привет! Это Барсик. Сегодня знакомимся с очень маленькой единицей массы — миллиграммом. Нажимай на карточки.", "need": 5, "items": [{"k": "что это", "v": "", "t": "Миллиграмм (мг) — меньшая единица измерения массы. Им измеряют очень лёгкое: например, дозу лекарства в таблетке. Пример: в таблетке 500 мг."}, {"k": "грамм и мг", "v": "", "t": "1 г = 1 000 мг. Пример: 3 г = 3 000 мг."}, {"k": "кг и мг", "v": "", "t": "1 кг = 1 000 г = 1 000 000 мг. Пример: 2 кг = 2 000 000 мг."}, {"k": "таблица масс", "v": "", "t": "Вспомним: 1 т = 10 ц, 1 ц = 100 кг, 1 кг = 1 000 г. Пример: 1 т = 10 · 100 = 1 000 кг."}, {"k": "как переводить", "v": "", "t": "Из крупной единицы в мелкую — умножаем, из мелкой в крупную — делим. Пример: 6 г 40 мг = 6 040 мг, а 7 000 мг = 7 г."}, {"k": "как сравнивать", "v": "", "t": "Чтобы сравнить массы, переводим их в одну единицу. Пример: 3 г 61 мг и 3 100 мг: 3 061 мг < 3 100 мг."}]}, {"id": "m4q1l08s2", "scene": "sortGroups", "gate": true, "title": "Разложи по группам", "text": "Разложи карточки по группам. Выбери, к какой группе относится каждая карточка.", "q": "В какую группу относится?", "take": 8, "groups": [{"e": "", "k": "Миллиграммы"}, {"e": "", "k": "Граммы"}, {"e": "", "k": "Килограммы"}], "items": [{"g": 0, "e": "", "t": "масса комара", "h": "очень лёгкое, доли грамма"}, {"g": 0, "e": "", "t": "доза лекарства в таблетке", "h": "очень лёгкое, доли грамма"}, {"g": 0, "e": "", "t": "масса пчелы", "h": "очень лёгкое, доли грамма"}, {"g": 1, "e": "", "t": "масса шоколадки", "h": "несколько граммов или сотен граммов"}, {"g": 1, "e": "", "t": "золотое кольцо", "h": "несколько граммов или сотен граммов"}, {"g": 1, "e": "", "t": "чайная ложка сахара", "h": "несколько граммов или сотен   {"id": "m4q1l09", "icon": "", "title": "Урок 9. Пространственные фигуры. Измерение объёма", "goal": "Узнавать пространственные фигуры, находить объём куба и прямоугольного параллелепипеда и переводить единицы объёма", "steps": [{"id": "m4q1l09s1", "scene": "infoTap", "gate": true, "title": "Знакомимся с темой", "text": "Привет! Это Барсик. Сегодня учимся измерять объём тел кубиками. Нажимай на карточки.", "need": 5, "items": [{"k": "фигуры", "v": "", "t": "Куб, прямоугольный параллелепипед, цилиндр, конус, шар и пирамида — пространственные фигуры. Пример: коробка из-под обуви — прямоугольный параллелепипед."}, {"k": "объём", "v": "", "t": "Объём показывает, сколько места занимает тело. Его обозначают буквой V. Измеряют кубическими единицами. Пример: V = 60 см³."}, {"k": "см³", "v": "", "t": "1 см³ — это объём кубика с ребром 1 см. Пример: в коробку 5 см × 3 см × 4 см помещается 60 таких кубиков, значит её объём 60 см³."}, {"k": "как считать", "v": "", "t": "Считаем кубики в одном слое (длина · ширина), потом умножаем на число слоёв (высота). Пример: 5 · 3 = 15, 15 · 4 = 60."}, {"k": "таблица", "v": "", "t": "1 см³ = 1 000 мм³, 1 дм³ = 1 000 см³, 1 м³ = 1 000 дм³. Пример: 3 дм³ = 3 000 см³."}, {"k": "литр", "v": "", "t": "1 л воды занимает объём 1 дм³. Пример: в аквариум 4 дм × 5 дм × 3 дм вмещается 60 л воды."}]}, {"id": "m4q1l09s2", "scene": "sortGroups", "gate": true, "title": "Разложи по группам", "text": "Разложи карточки по группам. Выбери, к какой группе относится каждая карточка.", "q": "В какую группу относится?", "take": 8, "groups": [{"e": "", "k": "Кубический сантиметр"}, {"e": "", "k": "Кубический дециметр"}, {"e": "", "k": "Кубический метр"}], "items": [{"g": 0, "e": "", "t": "игральная кость", "h": "совсем маленький объём"}, {"g": 0, "e": "", "t": "кубик сахара-рафинада", "h": "совсем маленький объём"}, {"g": 0, "e": "", "t": "чайная ложка воды", "h": "совсем маленький объём"}, {"g": 1, "e": "", "t": "пакет молока на 1 литр", "h": "литры"}, {"g": 1,   {"id": "m4q1l10", "icon": "", "title": "Урок 10. Ар и гектар", "goal": "Узнать новые единицы площади — ар и гектар — и переводить их в другие единицы площади", "steps": [{"id": "m4q1l10s1", "scene": "infoTap", "gate": true, "title": "Знакомимся с темой", "text": "Привет! Это Барсик. Сегодня узнаем, чем измеряют большие участки земли: арами и гектарами. Нажимай на карточки.", "need": 5, "items": [{"k": "ар (сотка)", "v": "", "t": "Ар — единица площади, равная площади квадрата со стороной 10 м: 1 а = 10 м · 10 м = 100 м². Ар называют соткой. Пример: 6 а = 600 м²."}, {"k": "гектар", "v": "", "t": "Гектар — площадь квадрата со стороной 100 м: 1 га = 100 м · 100 м = 10 000 м² = 100 а. Пример: 3 га = 30 000 м²."}, {"k": "таблица площадей", "v": "", "t": "1 см² = 100 мм², 1 дм² = 100 см², 1 м² = 100 дм², 1 а = 100 м², 1 га = 100 а, 1 км² = 1 000 000 м². Пример: 2 м² = 200 дм²."}, {"k": "что чем измеряют", "v": "", "t": "Комнату измеряют в м², дачный участок — в арах, поле или парк — в гектарах, область — в км². Пример: поле 500 м на 200 м — это 100 000 м², то есть 10 га."}, {"k": "алгоритм", "v": "", "t": "Действия с величинами: 1) крупные единицы заменяем мелкими; 2) выполняем действие; 3) мелкие единицы заменяем крупными. Пример: 2 га − 2 000 м² = 20 000 м² − 2 000 м² = 18 000 м² = 1 га 80 а."}, {"k": "как сравнивать", "v": "", "t": "Чтобы сравнить площади, переводим их в одну единицу. Пример: 5 а и 450 м²: 5 а = 500 м², а 500 м² > 450 м²."}]}, {"id": "m4q1l10s2", "scene": "sortGroups", "gate": true, "title": "Разложи по группам", "text": "Разложи карточки по группам. Выбери, к какой группе относится каждая карточка.", "q": "В какую группу относится?", "take": 8, "groups": [{"e": "", "k": "Квадратные метры"}, {"e": "", "k": "Ары"}, {"e": "", "k": "Гектары"}], "items": [{"g": 0, "e": "", "t": "пол классной комнаты", "h": "небольшая площадь"}, {"g": 0, "e": "", "t": "школьный ковёр", "h": "небольшая площадь"}, {"g": 0, "e": "", "t": "школьная доска", "h": "небольшая площ   {"id": "m4q1l12", "icon": "", "title": "Урок 12. Доли единиц времени", "goal": "Находить доли часа, суток, года и века и переводить единицы времени", "steps": [{"id": "m4q1l12s1", "scene": "infoTap", "gate": true, "title": "Знакомимся с темой", "text": "Привет! Это Барсик. Сегодня находим доли часа, суток и года. Нажимай на карточки.", "need": 5, "items": [{"k": "мера времени", "v": "", "t": "1 мин = 60 с, 1 ч = 60 мин, 1 сут. = 24 ч, 1 год = 12 мес., 1 век = 100 лет. В году 365 суток, в високосном году — 366."}, {"k": "доли часа", "v": "", "t": "1/2 ч = 30 мин, 1/4 ч = 15 мин, 1/3 ч = 20 мин, 1/60 ч = 1 мин. Например, 1/3 ч = 60 : 3 = 20 мин."}, {"k": "доли суток", "v": "", "t": "1/2 сут. = 12 ч, 1/3 сут. = 8 ч, 1/4 сут. = 6 ч, 1/24 сут. = 1 ч. Например, 1/8 сут. = 24 : 8 = 3 ч."}, {"k": "доли года и века", "v": "", "t": "1/12 года = 1 мес., 1/4 года = 3 мес., 1/100 века = 1 год, 1/10 века = 10 лет. Например, 1/5 века = 100 : 5 = 20 лет."}, {"k": "как найти долю", "v": "", "t": "Переводим целое в мелкие единицы и делим на знаменатель дроби. 1/4 мин = 60 с : 4 = 15 с."}, {"k": "время словами", "v": "", "t": "Половина шестого — 5 ч 30 мин. Четверть шестого — 5 ч 15 мин. Без четверти шесть — 5 ч 45 мин."}]}, {"id": "m4q1l12s2", "scene": "sortGroups", "gate": true, "title": "Разложи по группам", "text": "Разложи карточки по группам. Выбери, к какой группе относится каждая карточка.", "q": "В какую группу относится?", "take": 8, "groups": [{"e": "", "k": "Половина"}, {"e": "", "k": "Четверть"}, {"e": "", "k": "Без четверти"}], "items": [{"g": 0, "e": "", "t": "7 ч 30 мин", "h": "30 минут"}, {"g": 0, "e": "", "t": "12 ч 30 мин", "h": "30 минут"}, {"g": 0, "e": "", "t": "5 ч 30 мин", "h": "30 минут"}, {"g": 1, "e": "", "t": "3 ч 15 мин", "h": "15 минут"}, {"g": 1, "e": "", "t": "6 ч 15 мин", "h": "15 минут"}, {"g": 1, "e": "", "t": "11 ч 15 мин", "h": "15 минут"}, {"g": 2, "e": "", "t": "2 ч 45 мин", "h": "45 минут"}, {"g": 2, "e": "", "t": "8 ч 45 мин", "h": "45 минут"   {"id": "m4q1l13", "icon": "", "title": "Урок 13. Валюты: евро, доллар, рубль", "goal": "Узнавать валюты, разменивать суммы и выполнять действия с евро, долларами и рублями", "steps": [{"id": "m4q1l13s1", "scene": "infoTap", "gate": true, "title": "Знакомимся с темой", "text": "Привет! Это Барсик. Сегодня знакомимся с евро, долларом и рублём. Нажимай на карточки.", "need": 5, "items": [{"k": "евро", "v": "", "t": "Евро (€) — единая валюта Европейского союза. 1 € = 100 евроцентов (с). Есть монеты в 1 и 2 € и в 1, 2, 5, 10, 20, 50 с."}, {"k": "доллар", "v": "", "t": "Доллар ($) — название валют нескольких стран. 1 $ = 100 центов. Дайм — 10 центов, четверть доллара — 25 центов, полдоллара — 50 центов."}, {"k": "рубль", "v": "", "t": "Рубль (₽) — валюта России. 1 руб. = 100 коп. Например, 3 руб. 20 коп. = 300 + 20 = 320 коп."}, {"k": "размен", "v": "", "t": "Сумму можно набрать разными купюрами и монетами. 35 € = 10 € + 10 € + 10 € + 2 € + 2 € + 1 €. Например, 2 € = 200 с = 50 с + 50 с + 50 с + 50 с."}, {"k": "сложение сумм", "v": "", "t": "Складываем рубли с рублями, копейки с копейками. 12 руб. 30 коп. + 4 руб. 90 коп.: копейки 120 = 1 руб. 20 коп., итого 17 руб. 20 коп."}, {"k": "вычитание сумм", "v": "", "t": "Если копеек не хватает, занимаем 1 руб. = 100 коп. Например, 5 руб. 20 коп. − 2 руб. 75 коп. = 520 коп. − 275 коп. = 245 коп. = 2 руб. 45 коп."}]}, {"id": "m4q1l13s2", "scene": "sortGroups", "gate": true, "title": "Разложи по группам", "text": "Разложи карточки по группам. Выбери, к какой группе относится каждая карточка.", "q": "В какую группу относится?", "take": 8, "groups": [{"e": "", "k": "Евро"}, {"e": "", "k": "Доллар"}, {"e": "", "k": "Рубль"}], "items": [{"g": 0, "e": "", "t": "валюта Европейского союза", "h": "Европа"}, {"g": 0, "e": "", "t": "купюра в 500 €", "h": "знак €"}, {"g": 0, "e": "", "t": "монета в 50 с", "h": "евроценты"}, {"g": 1, "e": "", "t": "валюта США", "h": "Америка"}, {"g": 1, "e": "", "t": "монета в 10 центов", "h": "дайм"}, {"g"   {"id": "m4q1l14", "icon": "", "title": "Урок 14. Устные приёмы вычислений", "goal": "Вычислять устно с многозначными числами, раскладывая их на разрядные слагаемые и применяя свойства действий", "steps": [{"id": "m4q1l14s1", "scene": "infoTap", "gate": true, "title": "Знакомимся с темой", "text": "Привет! Это Барсик. Сегодня считаем устно большие числа. Нажимай на карточки.", "need": 5, "items": [{"k": "разрядные слагаемые", "v": "", "t": "Многозначное число раскладываем на разрядные слагаемые: 4 372 = 4 000 + 300 + 70 + 2."}, {"k": "умножаем сумму", "v": "", "t": "(a + b) · c = a · c + b · c. Умножаем каждое слагаемое: 1 234 · 2 = 1 000 · 2 + 200 · 2 + 30 · 2 + 4 · 2 = 2 468."}, {"k": "делим сумму", "v": "", "t": "(a + b) : c = a : c + b : c. Делим каждое слагаемое: 2 468 : 2 = 2 000 : 2 + 400 : 2 + 60 : 2 + 8 : 2 = 1 234."}, {"k": "удобный способ", "v": "", "t": "Разбиваем так, чтобы каждое слагаемое делилось на число. (8 000 + 400 + 20) : 2 = 4 000 + 200 + 10 = 4 210."}, {"k": "делим на произведение", "v": "", "t": "a : (b · c) = a : b : c. 96 : (4 · 2) = 96 : 4 : 2 = 12. Делитель стал больше в 2 раза, поэтому частное меньше в 2 раза."}, {"k": "порядок и проверка", "v": "", "t": "Без скобок сначала умножение и деление, потом сложение и вычитание: 100 000 − 42 000 : 2 = 79 000. Деление проверяем умножением."}]}, {"id": "m4q1l14s2", "scene": "sortGroups", "gate": true, "title": "Разложи по группам", "text": "Разложи карточки по группам. Выбери, к какой группе относится каждая карточка.", "q": "В какую группу относится?", "take": 8, "groups": [{"e": "", "k": "Умножаем сумму"}, {"e": "", "k": "Делим сумму"}, {"e": "", "k": "Делим на произведение"}], "items": [{"g": 0, "e": "", "t": "(3 000 + 400) · 2", "h": "знак ·"}, {"g": 0, "e": "", "t": "5 · (20 000 + 300 + 6)", "h": "знак ·"}, {"g": 0, "e": "", "t": "(70 000 + 5 000 + 80) · 3", "h": "знак ·"}, {"g": 1, "e": "", "t": "(9 000 + 600 + 30) : 3", "h": "знак :"}, {"g": 1, "e": "", "t": "(40 000 + 2 000 + 800) : 2",   {"id": "m4q1l16", "icon": "", "title": "Урок 16. Деление многозначного числа на однозначное", "goal": "Делить многозначное число на однозначное уголком, помнить про нуль в частном и проверять деление умножением", "steps": [{"id": "m4q1l16s1", "scene": "infoTap", "gate": true, "title": "Знакомимся с темой", "text": "Привет! Это Барсик. Сегодня учимся делить многозначные числа на однозначное: уголком, с нулём в частном и с проверкой. Нажимай на карточки.", "need": 5, "items": [{"k": "названия чисел", "v": "", "t": "При делении делимое делим на делитель, получается частное. Пример: 7 284 : 4 = 1 821. Здесь 7 284 — делимое, 4 — делитель, 1 821 — частное."}, {"k": "деление уголком", "v": "", "t": "Делим по разрядам слева направо. Берём первое неполное делимое — первые цифры, которые не меньше делителя. Пример: 11 778 : 2: 11 : 2 = 5 (ост. 1); 17 : 2 = 8 (ост. 1); 17 : 2 = 8 (ост. 1); 18 : 2 = 9. Частное 5 889."}, {"k": "нуль в частном", "v": "", "t": "Если очередное неполное делимое меньше делителя, в частном пишем 0 и сносим следующую цифру. Пример: 28 040 : 5 = 5 608."}, {"k": "сколько цифр в частном", "v": "", "t": "Смотри на первую цифру делимого. Если она меньше делителя, то первое неполное делимое — две цифры. Пример: 3 648 : 4 — первая цифра 3 меньше 4, значит, берём 36. В частном 3 цифры: 912."}, {"k": "остаток", "v": "", "t": "Остаток всегда меньше делителя. Пример: 7 404 : 8 = 925 (ост. 4), и 4 < 8."}, {"k": "проверка", "v": "", "t": "Деление проверяют умножением: частное · делитель = делимое. С остатком: частное · делитель + остаток = делимое. Пример: 925 · 8 + 4 = 7 404."}]}, {"id": "m4q1l16s2", "scene": "sortGroups", "gate": true, "title": "Разложи по группам", "text": "Разложи карточки по группам. Выбери, к какой группе относится каждая карточка.", "q": "В какую группу относится?", "take": 8, "groups": [{"e": "", "k": "Без остатка, без нулей в частном"}, {"e": "", "k": "Нуль в частном"}, {"e": "", "k": "С остатком"}], "items": [{"g": 2, "e": "", "t": "10   {"id": "m4q1l17", "icon": "", "title": "Урок 17. Признаки делимости на 2, 5, 10", "goal": "Определять по последней цифре, делится ли число на 2, на 5 и на 10", "steps": [{"id": "m4q1l17s1", "scene": "infoTap", "gate": true, "title": "Знакомимся с темой", "text": "Привет! Это Барсик. Сегодня узнаем, как быстро понять, делится ли число на 2, на 5 и на 10, не выполняя деления. Нажимай на карточки.", "need": 5, "items": [{"k": "признак делимости на 10", "v": "", "t": "На 10 делятся числа, которые оканчиваются на 0. Пример: 34 560 = 3 456 · 10 (проверка: 3456 · 10 = 34560)."}, {"k": "признак делимости на 5", "v": "", "t": "На 5 делятся числа, которые оканчиваются на 0 или на 5. Пример: 42 650 : 5 = 8 530, а 42 651 : 5 — остаток 1."}, {"k": "признак делимости на 2", "v": "", "t": "На 2 делятся числа, которые оканчиваются на 0, 2, 4, 6 или 8. Пример: 54 272 : 2 = 27 136."}, {"k": "последняя цифра", "v": "", "t": "Чтобы узнать, делится ли число на 2, 5 или 10, смотрим только на последнюю цифру. Пример: 30 875 оканчивается на 5 — значит, делится на 5, но не на 2."}, {"k": "круги Эйлера", "v": "", "t": "Нарисуем два круга: «делятся на 2» и «делятся на 5». В общей части кругов — числа, которые делятся и на 2, и на 5. Они оканчиваются на 0. Пример: 6 540."}, {"k": "подсказка и проверка", "v": "", "t": "Проверяй себя делением и умножением: 65 540 : 10 = 6 554, 6 554 · 10 = 65 540. Если число оканчивается на 0, оно делится на 10, на 5 и на 2."}]}, {"id": "m4q1l17s2", "scene": "sortGroups", "gate": true, "title": "Разложи по группам", "text": "Разложи карточки по группам. Выбери, к какой группе относится каждая карточка.", "q": "В какую группу относится?", "take": 8, "groups": [{"e": "", "k": "Делится на 2, но не на 5"}, {"e": "", "k": "Делится на 5, но не на 2"}, {"e": "", "k": "Делится на 10"}], "items": [{"g": 0, "e": "", "t": "922", "h": "последняя цифра 2"}, {"g": 2, "e": "", "t": "98 850", "h": "последняя цифра 0"}, {"g": 1, "e": "", "t": "457 575", "h": "последняя цифра 5   {"id": "m4q1l18", "icon": "", "title": "Урок 18. Умножение и деление на 10, 100, 1 000", "goal": "Выполнять устно умножение и деление чисел на 10, 100, 1 000", "steps": [{"id": "m4q1l18s1", "scene": "infoTap", "gate": true, "title": "Знакомимся с темой", "text": "Привет! Это Барсик. Сегодня учимся быстро умножать и делить на 10, 100 и 1 000 — просто приписывая или отбрасывая нули. Нажимай на карточки.", "need": 5, "items": [{"k": "умножение на 10, 100, 1 000", "v": "", "t": "При умножении числа на 10, 100, 1 000 справа приписываем столько нулей, сколько их в числе, на которое умножаем. Пример: 37 · 100 = 3 700 — приписали два нуля."}, {"k": "деление на 10, 100, 1 000", "v": "", "t": "При делении на 10, 100, 1 000 справа отбрасываем столько нулей, сколько их в делителе. Пример: 48 000 : 1 000 = 48 — отбросили три нуля."}, {"k": "в числе уже есть нули", "v": "", "t": "Если число уже оканчивается нулями, нули всё равно приписываем. Пример: 350 · 100 = 35 000. Было 350, стало 35 000."}, {"k": "на 10 000 и 1 000 000", "v": "", "t": "Правило то же. Пример: 6 · 10 000 = 60 000 (четыре нуля), 8 000 000 : 10 000 = 800 (отбросили четыре нуля)."}, {"k": "во сколько раз изменилось", "v": "", "t": "При умножении на 1 000 число увеличивается в 1 000 раз, а при делении на 1 000 — уменьшается в 1 000 раз. Пример: 5 → 5 000 (в 1 000 раз больше)."}, {"k": "проверка", "v": "", "t": "Умножение проверяем делением, а деление — умножением. Пример: 18 · 1 000 = 18 000, проверка: 18 000 : 1 000 = 18."}]}, {"id": "m4q1l18s2", "scene": "sortGroups", "gate": true, "title": "Разложи по группам", "text": "Разложи карточки по группам. Выбери, к какой группе относится каждая карточка.", "q": "В какую группу относится?", "take": 8, "groups": [{"e": "", "k": "Ответ: 4 цифры"}, {"e": "", "k": "Ответ: 5 цифр"}, {"e": "", "k": "Ответ: 6 цифр"}], "items": [{"g": 1, "e": "", "t": "435 · 100", "h": "ответ 43 500"}, {"g": 2, "e": "", "t": "546 · 1 000", "h": "ответ 546 000"}, {"g": 0, "e": "", "t": "29 4
