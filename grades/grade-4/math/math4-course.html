йди значение выражения c · (a − b) при a = 4, b = 3 и c = 6.", "a": "6", "w": ["21", "7", "8"], "h": "c · (a − b) = 6 · (4 − 3) = 6 · 1 = 6"}, {"q": "Найди x. 5 · x + 28 = 58", "a": "6", "w": ["30", "17", "5"], "h": "5 · x + 28 = 58 5 · x = 58 − 28 = 30 x = 30 : 5 = 6"}, {"q": "Найди значение выражения. 4 + 12 · 3 : 3 + 4 · 7", "a": "44", "w": ["54", "34", "46"], "h": "Сначала действия в скобках, потом умножение и деление слева направо, в конце сложение и вычитание. Ответ: 4 + 12 · 3 : 3 + 4 · 7 = 44"}, {"q": "Найди x. 26 · x + 42 = 188 : 2", "a": "2", "w": ["3", "1", "94"], "h": "Правая часть: 188 : 2 = 94 26 · x = 94 − 42 = 52 x = 52 : 26 = 2"}, {"q": "Найди x. (x + 18) · 9 = 270", "a": "12", "w": ["30", "243", "10"], "h": "(x + 18) · 9 = 270 x + 18 = 270 : 9 = 30 x = 30 − 18 = 12"}, {"q": "Найди x. 28 + 21 : x = 31", "a": "7", "w": ["3", "6", "9"], "h": "28 + 21 : x = 31 21 : x = 31 − 28 = 3 Неизвестный делитель = делимое : частное: x = 21 : 3 = 7"}, {"q": "Найди x. 19 + 16 : x = 21", "a": "8", "w": ["2", "9", "6"], "h": "19 + 16 : x = 21 16 : x = 21 − 19 = 2 Неизвестный делитель = делимое : частное: x = 16 : 2 = 8"}, {"q": "Найди значение выражения. 7 · 9 − 12 − (10 + 8)", "a": "33", "w": ["43", "23", "34"], "h": "Сначала действия в скобках, потом умножение и деление слева направо, в конце сложение и вычитание. Ответ: 7 · 9 − 12 − (10 + 8) = 33"}, {"q": "Упрости выражение. 7a − 6a", "a": "1a", "w": ["2a", "4a", "3a"], "h": "Слагаемые с одной и той же буквой можно соединить: считаем числа при букве, букву оставляем. 7a − 6a = (7 − 6) · a = 1a"}]);
GENS.m417q = mkQuiz([{"q": "На складе было 610 кг картофеля. В первый день отпустили 220 кг, во второй — 80 кг. Сколько килограммов осталось?", "a": "310", "w": ["390", "910", "320"], "h": "Отпустили всего: 220 + 80 = 300 кг Осталось: 610 − 300 = 310 кг"}, {"q": "Купили 2 тетради по 250 тенге и 7 ручек по 150 тенге. Сколько тенге стоит вся покупка?", "a": "1 550", "w": ["650", "2 250", "1 540"], "h": "Тетради: 2 · 250 = 500 тг Ручки: 7 · 150 = 1 050 тг Всё вместе: 500 + 1 050 = 1 550 тг"}, {"q": "Мастер работает 9 часов в день и получает 450 тенге за час. Сколько тенге он заработает за 6 дней?", "a": "24 300", "w": ["4 050", "2 700", "24 750"], "h": "За день: 9 · 450 = 4 050 тг За 6 дней: 4 050 · 6 = 24 300 тг"}, {"q": "В первой корзине 65 яблок, во второй на 13 яблок больше, а в третьей на 3 яблока меньше, чем во второй. Сколько яблок в трёх корзинах?", "a": "218", "w": ["143", "221", "217"], "h": "Во второй: 65 + 13 = 78 В третьей: 78 − 3 = 75 Всего: 65 + 78 + 75 = 218"}, {"q": "В первой корзине 32 яблока, во второй на 8 яблок больше, а в третьей на 3 яблока меньше, чем во второй. Сколько яблок в трёх корзинах?", "a": "109", "w": ["72", "112", "99"], "h": "Во второй: 32 + 8 = 40 В третьей: 40 − 3 = 37 Всего: 32 + 40 + 37 = 109"}, {"q": "В первой корзине 43 яблока, во второй на 11 яблок больше, а в третьей на 3 яблока меньше, чем во второй. Сколько яблок в трёх корзинах?", "a": "148", "w": ["97", "151", "149"], "h": "Во второй: 43 + 11 = 54 В третьей: 54 − 3 = 51 Всего: 43 + 54 + 51 = 148"}, {"q": "В первой корзине 79 яблок, во второй на 16 яблок больше, а в третьей на 3 яблока меньше, чем во второй. Сколько яблок в трёх корзинах?", "a": "266", "w": ["174", "269", "267"], "h": "Во второй: 79 + 16 = 95 В третьей: 95 − 3 = 92 Всего: 79 + 95 + 92 = 266"}, {"q": "В первой корзине 87 яблок, во второй на 12 яблок больше, а в третьей на 3 яблока меньше, чем во второй. Сколько яблок в трёх корзинах?", "a": "282", "w": ["186", "285", "292"], "h": "Во второй: 87 + 12 = 99 В третьей: 99 − 3 = 96 Всего: 87 + 99 + 96 = 282"}, {"q": "На складе было 530 кг картофеля. В первый день отпустили 200 кг, во второй — 120 кг. Сколько килограммов осталось?", "a": "210", "w": ["330", "850", "220"], "h": "Отпустили всего: 200 + 120 = 320 кг Осталось: 530 − 320 = 210 кг"}, {"q": "На складе было 840 кг картофеля. В первый день отпустили 250 кг, во второй — 130 кг. Сколько килограммов осталось?", "a": "460", "w": ["590", "1 220", "470"], "h": "Отпустили всего: 250 + 130 = 380 кг Осталось: 840 − 380 = 460 кг"}, {"q": "Бассейн имеет форму прямоугольного параллелепипеда: длина 11 м, ширина 9 м, глубина 2 м. Дно нужно покрыть плиткой. Найди площадь дна.", "a": "99 м²", "w": ["22 м²", "18 м²", "198 м²"], "h": "Дно — прямоугольник: длина и ширина. 11 · 9 = 99 м²"}, {"q": "Объём прямоугольного параллелепипеда 384 см³, длина 8 см, ширина 6 см. Найди высоту.", "a": "8 см", "w": ["48 см", "64 см", "6 см"], "h": "Площадь основания: 8 · 6 = 48 см² Высота: 384 : 48 = 8 см"}, {"q": "Бассейн имеет форму прямоугольного параллелепипеда: длина 5 м, ширина 8 м, глубина 3 м. Дно нужно покрыть плиткой. Найди площадь дна.", "a": "40 м²", "w": ["15 м²", "24 м²", "120 м²"], "h": "Дно — прямоугольник: длина и ширина. 5 · 8 = 40 м²"}, {"q": "Длина ящика 2 дм, ширина 10 дм, высота 9 дм. Найди объём ящика.", "a": "180 дм³", "w": ["21 дм³", "20 дм³", "256 дм³"], "h": "V = a · b · c = 2 · 10 · 9 = 180 дм³"}, {"q": "Автобус ехал 2 часа со скоростью 90 км/ч, а потом 2 часа с той же скоростью. Сколько километров он проехал? Выбери выражение для решения задачи.", "a": "90 · 2 + 90 · 2", "w": ["90 · 2 · 2", "90 + 2 + 2", "(90 + 90) · (2 + 2)"], "h": "Путь равен скорости, умноженной на время. За первые часы 90 · 2, за вторые — 90 · 2. Складываем."}, {"q": "Бассейн имеет форму прямоугольного параллелепипеда: длина 9 м, ширина 7 м, глубина 4 м. Дно нужно покрыть плиткой. Найди площадь дна.", "a": "63 м²", "w": ["36 м²", "28 м²", "252 м²"], "h": "Дно — прямоугольник: длина и ширина. 9 · 7 = 63 м²"}, {"q": "Купили 5 тетрадей по 170 тенге и 8 ручек по 190 тенге. Сколько тенге стоит вся покупка? Выбери выражение для решения задачи.", "a": "5 · 170 + 8 · 190", "w": ["(5 + 8) · 170", "5 · 170 + 190", "5 + 170 + 8 + 190"], "h": "Тетради стоят 5 · 170, ручки — 8 · 190. Вся покупка — сумма этих стоимостей."}, {"q": "Бассейн имеет форму прямоугольного параллелепипеда: длина 10 м, ширина 9 м, глубина 2 м. Дно нужно покрыть плиткой. Найди площадь дна.", "a": "90 м²", "w": ["20 м²", "18 м²", "180 м²"], "h": "Дно — прямоугольник: длина и ширина. 10 · 9 = 90 м²"}, {"q": "Бассейн имеет форму прямоугольного параллелепипеда: длина 12 м, ширина 2 м, глубина 3 м. Дно нужно покрыть плиткой. Найди площадь дна.", "a": "24 м²", "w": ["36 м²", "6 м²", "72 м²"], "h": "Дно — прямоугольник: длина и ширина. 12 · 2 = 24 м²"}, {"q": "Бассейн имеет форму прямоугольного параллелепипеда: длина 5 м, ширина 5 м, глубина 2 м. Дно нужно покрыть плиткой. Найди площадь дна.", "a": "25 м²", "w": ["10 м²", "50 м²", "26 м²"], "h": "Дно — прямоугольник: длина и ширина. 5 · 5 = 25 м²"}, {"q": "В библиотеке было 120 книг. Каждый день выдавали по 20 книг, и так 4 дня. Потом привезли ещё 70 книг. Сколько книг стало в библиотеке?", "a": "110", "w": ["40", "190", "80"], "h": "Выдали: 20 · 4 = 80 Осталось: 120 − 80 = 40 Стало: 40 + 70 = 110"}, {"q": "Задумали число, умножили его на 8, прибавили 10 и получили 122. Составь уравнение и найди задуманное число.", "a": "14", "w": ["112", "15", "16"], "h": "Уравнение: x · 8 + 10 = 122 x · 8 = 122 − 10 = 112 x = 112 : 8 = 14"}, {"q": "Автомобиль проехал 120 км за 3 часа. За сколько часов он проедет это расстояние, если увеличит скорость на 20 км/ч?", "a": "2", "w": ["3", "4", "1"], "h": "Скорость: 120 : 3 = 40 км/ч Новая скорость: 40 + 20 = 60 км/ч Время: 120 : 60 = 2 ч"}, {"q": "За 4 книги и 4 альбома заплатили 440 тенге. Книга стоит 50 тенге. Сколько тенге стоит один альбом?", "a": "60", "w": ["110", "50", "70"], "h": "Книги: 4 · 50 = 200 тг Альбомы: 440 − 200 = 240 тг Один альбом: 240 : 4 = 60 тг"}, {"q": "В библиотеке было 160 книг. Каждый день выдавали по 20 книг, и так 5 дней. Потом привезли ещё 80 книг. Сколько книг стало в библиотеке?", "a": "140", "w": ["60", "240", "100"], "h": "Выдали: 20 · 5 = 100 Осталось: 160 − 100 = 60 Стало: 60 + 80 = 140"}, {"q": "Ребро куба равно 2 см. Найди объём куба.", "a": "8 см³", "w": ["6 см³", "4 см³", "24 см³"], "h": "У куба длина, ширина и высота равны ребру. V = a · a · a = 2 · 2 · 2 = 8 см³"}, {"q": "Задача: «Купили 3 пачки печенья по 180 тенге. Сколько заплатили?» Решим обратную задачу: «За пачки печенья заплатили 540 тенге, пачка стоит 180 тенге. Сколько пачек купили?»", "a": "3", "w": ["4", "2", "54"], "h": "В обратной задаче известны стоимость и цена, а ищем количество. 540 : 180 = 3"}, {"q": "В библиотеке было 210 книг. Каждый день выдавали по 30 книг, и так 4 дня. Потом привезли ещё 30 книг. Сколько книг стало в библиотеке?", "a": "120", "w": ["90", "240", "121"], "h": "Выдали: 30 · 4 = 120 Осталось: 210 − 120 = 90 Стало: 90 + 30 = 120"}, {"q": "Задача: «Купили 4 пачки печенья по 150 тенге. Сколько заплатили?» Решим обратную задачу: «За пачки печенья заплатили 600 тенге, пачка стоит 150 тенге. Сколько пачек купили?»", "a": "4", "w": ["5", "3", "60"], "h": "В обратной задаче известны стоимость и цена, а ищем количество. 600 : 150 = 4"}, {"q": "В библиотеке было 360 книг. Каждый день выдавали по 50 книг, и так 6 дней. Потом привезли ещё 20 книг. Сколько книг стало в библиотеке?", "a": "80", "w": ["60", "380", "300"], "h": "Выдали: 50 · 6 = 300 Осталось: 360 − 300 = 60 Стало: 60 + 20 = 80"}]);

°", "360°", "210°"], "h": "За 1 минуту стрелка поворачивается на 360° : 60 = 6°. 30 · 6° = 180°"}, {"q": "В равнобедренном треугольнике два угла при основании равны, каждый 40°. Чему равен угол при вершине?", "a": "100°", "w": ["140°", "80°", "50°"], "h": "Углы при основании: 40° + 40° = 80°. Угол при вершине: 180° − 80° = 100°"}]);
GENS.m4q1l01q = mkQuiz([{"q": "Какое действие выполняют первым в выражении 240 + (118 − 80) · 3?", "a": "118 − 80", "w": ["240 + 118", "80 · 3"], "h": "Сначала действие в скобках: 118 − 80 = 38."}, {"q": "Найди значение выражения 240 + (118 − 80) · 3.", "a": "354", "w": ["834", "118"], "h": "Скобки: 118 − 80 = 38. Потом 38 · 3 = 114. Потом 240 + 114 = 354."}, {"q": "Найди значение выражения 980 − 137 · 6 + 125.", "a": "283", "w": ["5 183", "33"], "h": "Сначала умножение: 137 · 6 = 822. Дальше слева направо: 980 − 822 = 158, 158 + 125 = 283."}, {"q": "Найди значение выражения 631 − (683 − 185) : 6.", "a": "548", "w": ["83", "133"], "h": "В скобках 683 − 185 = 498. Делим: 498 : 6 = 83. Вычитаем: 631 − 83 = 548."}, {"q": "Найди значение выражения (95 + 305) : 5.", "a": "80", "w": ["156", "2 000"], "h": "В скобках 95 + 305 = 400. Потом 400 : 5 = 80."}, {"q": "Как удобно вычислить 448 + 60 + 242?", "a": "сложить 448 и 242, потом прибавить 60", "w": ["вычесть 60 из 448", "умножить 448 на 60"], "h": "448 + 242 = 690, потом 690 + 60 = 750. Так считать проще: получилось круглое число."}, {"q": "Вычисли: 1 ч 16 мин − 45 мин.", "a": "31 мин", "w": ["29 мин", "1 ч 31 мин"], "h": "Не хватает минут. Заменяем 1 ч на 60 мин: 60 + 16 = 76 мин. Потом 76 − 45 = 31 мин."}, {"q": "Вычисли: 7 м 48 см − 1 м 69 см.", "a": "5 м 79 см", "w": ["6 м 21 см", "6 м 79 см"], "h": "Заменяем крупные единицы мелкими: 748 см − 169 см = 579 см = 5 м 79 см."}, {"q": "9 билетов в купе стоят 108 000 тенге. Один билет в плацкарте на 3 000 тенге дешевле. Сколько стоят 11 билетов в плацкарт?", "a": "99 000 тенге", "w": ["132 000 тенге", "129 000 тенге"], "h": "Билет в купе: 108 000 : 9 = 12 000 тенге. В плацкарте: 12 000 − 3 000 = 9 000 тенге. За 11 билетов: 9 000 · 11 = 99 000 тенге."}, {"q": "На карте 1 см — это 4 км. Между двумя городами на карте 8 см. Сколько километров между ними?", "a": "32 км", "w": ["2 км", "12 км"], "h": "Каждый сантиметр — 4 км, значит 8 · 4 = 32 км."}, {"q": "Как называется резуль  "Скорость сближения — сумма, она больше каждой из скоростей."}, {"q": "Два самолёта летят в противоположные стороны, значит, расстояние между ними растёт.", "a": "Верно", "h": "Они удаляются друг от друга."}]);
GENS.m4q1l24q = mkQuiz([{"q": "Даны множества A = { 1; 2; 3; 4 } и B = { 3; 4; 5 }. Найдите пересечение A ∩ B.", "a": "{ 3; 4 }", "w": ["{ 1; 2; 3; 4; 5 }", "{ 3 }"], "h": "Пересечение — общие элементы: { 3; 4 }."}, {"q": "Даны множества A = { 1; 2; 3; 4 } и B = { 3; 4; 5 }. Найдите объединение A ∪ B.", "a": "{ 1; 2; 3; 4; 5 }", "w": ["{ 3; 4 }", "{ 1; 2; 3; 4; 5; 6 }"], "h": "Объединение — все элементы обоих множеств, повторы записываем один раз: { 1; 2; 3; 4; 5 }."}, {"q": "Известно, что A ∩ B = { 3; 4 }. Чему равно B ∩ A?", "a": "{ 3; 4 }", "w": ["{ 1; 2; 3; 4; 5 }", "{ 4 }"], "h": "Пересечение не зависит от порядка множеств (переместительное свойство): B ∩ A = A ∩ B."}, {"q": "Даны множества B = { 3; 4; 5 } и C = { 4; 7; 8 }. Найдите B ∩ C.", "a": "{ 4 }", "w": ["{ 3; 4; 5; 7; 8 }", "{ 3; 4 }"], "h": "Общий элемент у B и C только число 4."}, {"q": "Даны A = { 1; 2; 3; 4 }, B = { 3; 4; 5 }, C = { 4; 7; 8 }. Найдите (A ∩ B) ∩ C.", "a": "{ 4 }", "w": ["{ 3; 4 }", "{ 1; 2; 3; 4; 5; 7; 8 }"], "h": "Сначала A ∩ B = { 3; 4 }. Затем общий элемент с C — число 4."}, {"q": "Даны A = { 1; 2; 3; 4 }, B = { 3; 4; 5 }, C = { 4; 7; 8 }. Найдите (A ∪ B) ∪ C.", "a": "{ 1; 2; 3; 4; 5; 7; 8 }", "w": ["{ 4 }", "{ 1; 2; 3; 4; 5 }"], "h": "Собираем все элементы трёх множеств, повторы записываем один раз."}, {"q": "Даны M = { 2; 4; 6; 8; 10 } и K = { 4; 8; 12 }. Сколько элементов в пересечении M ∩ K?", "a": "2", "w": ["6", "3"], "h": "Общие элементы: { 4; 8 }. Их 2."}, {"q": "Даны M = { 2; 4; 6; 8; 10 } и K = { 4; 8; 12 }. Сколько элементов в объединении M ∪ K?", "a": "6", "w": ["8", "2"], "h": "Объединение: { 2; 4; 6; 8; 10; 12 }. Общие элементы 4 и 8 считаем один раз, поэтому всего 6."}, {"q": "В кружок рисования ходят Арман, Дана и Нурлан, в кружок шахмат — Дана, Арман и Сауле. Кто ходит в оба кружка?", "a": "{ Арман; Дана }", "w": ["{ Арман; Дана; Нурлан; Сауле }", "{ Нурлан; Сауле }"], "h": "В оба кружка ходят те, кто есть в обоих списках — это пересечение: { Арман; Дана }."}, {"q": "Равенство A ∩ B = B ∩ A — это…", "a": "переместительное свойство пересечения", "w": ["сочетательное свойство пересечения", "переместительное свойство объединения"], "h": "Порядок множеств изменили, результат тот же — это переместительное свойство. Знак ∩ — пересечение."}, {"q": "Равенство (A ∪ B) ∪ C = A ∪ (B ∪ C) — это…", "a": "сочетательное свойство объединения", "w": ["переместительное свойство объединения", "сочетательное свойство пересечения"], "h": "Скобки по-разному, результат тот же — сочетательное свойство. Знак ∪ — объединение."}, {"q": "Как по-другому записать M ∩ K?", "a": "K ∩ M", "w": ["K ∪ M", "M ∪ K"], "h": "Пересечение можно записать в любом порядке множеств: M ∩ K = K ∩ M."}, {"q": "Как по-другому записать (M ∩ K) ∩ T?", "a": "M ∩ (K ∩ T)", "w": ["(M ∪ K) ∩ T", "M ∪ (K ∩ T)"], "h": "Сочетательное свойство пересечения: скобки можно переставить, знаки остаются те же."}, {"q": "Как по-другому записать M ∪ K?", "a": "K ∪ M", "w": ["K ∩ M", "M ∩ K"], "h": "Переместительное свойство объединения: M ∪ K = K ∪ M."}, {"q": "Что входит в объединение множеств?", "a": "все элементы, которые есть хотя бы в одном из множеств", "w": ["только общие элементы", "только элементы первого множества"], "h": "Объединение собирает вместе всё из обоих множеств."}, {"q": "Что входит в пересечение множеств?", "a": "только общие элементы обоих множеств", "w": ["все элементы обоих множеств", "только элементы второго множества"], "h": "Пересечение — то, что есть в обоих множествах сразу."}, {"q": "Что показывает общая часть двух пересекающихся кругов Эйлера?", "a": "пересечение множеств", "w": ["объединение множеств", "каждое множество по отдельности"], "h": "Общая часть кругов — элементы, которые принадлежат обоим множествам."}]);
GENS.m4q1l24t = mkTF([{"q": "Пересечение множеств не зависит от порядка множеств: A ∩ B = B ∩ A.", "a": "Верно", "h": "Это переместительное свойство пересечения."}, {"q": "Объединение множеств не зависит от порядка множеств: A ∪ B = B ∪ A.", "a": "Верно", "h": "Это переместительное свойство объединения."}, {"q": "Равенство (A ∩ B) ∩ C = A ∩ (B ∩ C) называют сочетательным свойством пересечения.", "a": "Верно", "h": "Скобки можно ставить по-разному, результат тот же."}, {"q": "Равенство A ∪ B = B ∪ A называют сочетательным свойством объединения.", "a": "Неверно", "h": "Это переместительное свойство: меняется порядок множеств, а не скобки."}, {"q": "Если A = { 1; 2; 3; 4 } и B = { 3; 4; 5 }, то A ∩ B = { 3; 4 }.", "a": "Верно", "h": "Общие элементы: 3 и 4."}, {"q": "Если A = { 1; 2; 3; 4 } и B = { 3; 4; 5 }, то B ∩ A = { 3; 4; 5 }.", "a": "Неверно", "h": "B ∩ A = A ∩ B = { 3; 4 }."}, {"q": "Если A = { 1; 2; 3; 4 } и B = { 3; 4; 5 }, то A ∪ B = { 1; 2; 3; 4; 5 }.", "a": "Верно", "h": "В объединении повторяющиеся элементы записываем один раз."}, {"q": "Знак ∩ обозначает объединение множеств.", "a": "Неверно", "h": "Знак ∩ — пересечение, знак ∪ — объединение."}, {"q": "Знак ∪ обозначает объединение множеств.", "a": "Верно", "h": "∪ — объединение, ∩ — пересечение."}, {"q": "От перестановки множеств в объединении результат меняется.", "a": "Неверно", "h": "Результат не меняется: A ∪ B = B ∪ A."}, {"q": "В (A ∪ B) ∪ C можно сначала объединить B и C.", "a": "Верно", "h": "(A ∪ B) ∪ C = A ∪ (B ∪ C) — сочетательное свойство."}, {"q": "Для A = { 1; 2; 3; 4 }, B = { 3; 4; 5 } и C = { 4; 7; 8 } выполняется (A ∩ B) ∩ C = { 4 }.", "a": "Верно", "h": "И так, и так получаем { 4 }."}, {"q": "Пересечение двух множеств всегда содержит больше элементов, чем их объединение.", "a": "Неверно", "h": "В пересечении элементов не больше, чем в объединении."}]);
GENS.m4q1l25q = mkQuiz([{"q": "В классе 28 учеников. 17 занимаются футболом, 15 — шахматами, 6 — и футболом, и шахматами. Сколько учеников занимаются хотя бы одним из этих видов?", "a": "26 уч.", "w": ["32 уч.", "22 уч."], "h": "Складываем 17 + 15 = 32, но 6 учеников посчитаны дважды. Вычитаем: 32 − 6 = 26."}, {"q": "В классе 28 учеников. 17 занимаются футболом, 15 — шахматами, 6 — обоими. Сколько учеников не занимаются ни тем, ни другим?", "a": "2 уч.", "w": ["26 уч.", "11 уч."], "h": "Хотя бы чем-то занимаются 26 учеников. 28 − 26 = 2."}, {"q": "В классе 28 учеников. 17 занимаются футболом, из них 6 ещё и шахматами. Сколько учеников занимаются только футболом?", "a": "11 уч.", "w": ["6 уч.", "17 уч."], "h": "Из 17 футболистов вычитаем тех, кто ещё и шахматист: 17 − 6 = 11."}, {"q": "В классе 28 учеников. 15 занимаются шахматами, из них 6 ещё и футболом. Сколько учеников занимаются только шахматами?", "a": "9 уч.", "w": ["13 уч.", "15 уч."], "h": "15 − 6 = 9."}, {"q": "В походе 30 ребят. Каждый пьёт хотя бы один напиток: чай пьют 20 ребят, какао — 18. Сколько ребят пьют и чай, и какао?", "a": "8 реб.", "w": ["12 реб.", "38 реб."], "h": "20 + 18 = 38. Всего ребят 30, значит, 38 − 30 = 8 посчитаны дважды — это те, кто пьёт оба напитка."}, {"q": "В классе 25 учеников. 14 учатся плавать, 12 — бороться, 4 — и плавать, и бороться. Сколько учеников не ходят ни в одну секцию?", "a": "3 уч.", "w": ["11 уч.", "13 уч."], "h": "14 + 12 − 4 = 22 ходят хотя бы в одну секцию. 25 − 22 = 3."}, {"q": "В классе 25 учеников. 14 учатся плавать, 12 — бороться, 4 — и плавать, и бороться. Сколько учеников ходят только в одну секцию?", "a": "18 уч.", "w": ["10 уч.", "26 уч."], "h": "Только плавание: 14 − 4 = 10. Только борьба: 12 − 4 = 8. Вместе 18."}, {"q": "В группе 30 туристов. На Чарынском каньоне были 18 человек, на Кольсайских озёрах — 15, а на обоих местах — 9. Сколько туристов побывали только на каньоне?", "a": "9 тур.", "w": ["6 тур.", "18 тур."], "h": "18 − 9 = 9."}, {"q": "В группе 30 туристов. На Чарынском каньоне были 18 человек, на Кольсайских озёрах — 15, а на обоих местах — 9. Сколько туристов не были ни там, ни там?", "a": "6 тур.", "w": ["9 тур.", "12 тур."], "h": "18 + 15 − 9 = 24 были хотя бы в одном месте. 30 − 24 = 6."}, {"q": "Круги Эйлера: только в первом круге — 9 элементов, только во втором — 7, в общей части — 5. Сколько всего элементов в обоих кругах?", "a": "21", "w": ["16", "26"], "h": "Складываем три части: 9 + 7 + 5 = 21."}, {"q": "Как найти число элементов объединения двух множеств?", "a": "сложить числа элементов и вычесть число общих", "w": ["сложить числа элементов и прибавить число общих", "из большего числа вычесть меньшее"], "h": "Общие элементы при сложении посчитаны дважды, поэтому один раз их вычитаем."}, {"q": "Что показывает общая часть двух кругов Эйлера?", "a": "элементы, которые входят в оба множества", "w": ["элементы только первого множества", "элементы, которых нет ни в одном множестве"], "h": "Общая часть — это пересечение множеств."}, {"q": "Все скрипачи — музыканты. Как нарисовать круги «Скрипачи» и «Музыканты»?", "a": "круг «Скрипачи» внутри круга «Музыканты»", "w": ["круги не пересекаются", "круг «Музыканты» внутри круга «Скрипачи»"], "h": "Каждый скрипач — музыкант, значит, всё множество скрипачей лежит внутри множества музыкантов."}, {"q": "Множества «Овощи» и «Фрукты» не имеют общих элементов. Как нарисовать круги?", "a": "два круга отдельно, без общей части", "w": ["один круг внутри другого", "два круга с общей частью"], "h": "Нет предмета, который одновременно и овощ, и фрукт."}]);
GENS.m4q1l25t = mkTF([{"q": "Круги Эйлера помогают решать задачи о множествах.", "a": "Верно", "h": "Их рисуют, чтобы наглядно увидеть, какие элементы входят в каждое множество."}, {"q": "Общая часть двух кругов Эйлера — это пересечение множеств.", "a": "Верно", "h": "Там элементы, которые входят в оба множества."}, {"q": "В классе 17 футболистов и 15 шахматистов, 6 ребят — и то и другое. Число ребят, которые занимаются хотя бы одним видом, равно 32.", "a": "Неверно", "h": "Нужно вычесть общих: 17 + 15 − 6 = 26."}, {"q": "В классе 17 футболистов и 15 шахматистов, 6 ребят — и то и другое. Число ребят, которые занимаются хотя бы одним видом, равно 26.", "a": "Верно", "h": "17 + 15 − 6 = 26."}, {"q": "Если все скрипачи — музыканты, то круг «Скрипачи» рисуют внутри круга «Музыканты».", "a": "Верно", "h": "Одно множество входит в другое."}, {"q": "Круги «Овощи» и «Фрукты» должны пересекаться.", "a": "Неверно", "h": "Общих элементов нет, поэтому общей части у кругов нет."}, {"q": "Если 14 учеников ходят в плавание, из них 4 ещё и в борьбу, то число учеников, которые ходят только в плавание, равно 10.", "a": "Верно", "h": "14 − 4 = 10."}, {"q": "Если 14 учеников ходят в плавание, из них 4 ещё и в борьбу, то число учеников, которые ходят только в плавание, равно 18.", "a": "Неверно", "h": "Общих нужно вычесть: 14 − 4 = 10, а не прибавить."}, {"q": "При сложении числа элементов двух множеств общие элементы считают дважды.", "a": "Верно", "h": "Поэтому их один раз вычитают."}, {"q": "В классе 25 учеников, из них 22 ходят в секции. Значит, число учеников, которые не ходят в секции, равно 3.", "a": "Верно", "h": "25 − 22 = 3."}, {"q": "Подмножество — это часть множества, все элементы которой входят в большое множество.", "a": "Верно", "h": "Например, тюльпаны — подмножество цветов."}, {"q": "Если у множеств нет общих элементов, то их объединение равно пересечению.", "a": "Неверно", "h": "Пересечение тогда пустое, а объединение содержит все элементы."}]);
GENS.m4q1l26q = mkQuiz([{"q": "Длина коробки 9 см, ширина 7 см, высота 7 см. Найди объём коробки.", "a": "441 см³", "w": ["63 см³", "70 см³"], "h": "V = a · b · c. V = 9 · 7 · 7 = 441. Объём коробки — 441 см³."}, {"q": "Ребро куба равно 5 дм. Чему равен объём куба?", "a": "125 дм³", "w": ["30 дм³", "130 дм³"], "h": "V = a · a · a = a³. 5 · 5 · 5 = 125. Объём куба — 125 дм³."}, {"q": "Выразим в других единицах. 6 м³ = ? дм³", "a": "6 000 дм³", "w": ["60 000 дм³", "60 дм³"], "h": "В 1 м³ содержится 1 000 дм³. 6 · 1 000 = 6 000. Значит, 6 м³ = 6 000 дм³."}, {"q": "Выразим в других единицах. 3 000 см³ = ? дм³", "a": "3 дм³", "w": ["3 000 дм³", "4 дм³"], "h": "В 1 дм³ содержится 1 000 см³. 3 000 : 1 000 = 3. Значит, 3 000 см³ = 3 дм³."}, {"q": "Сколько рёбер у куба?", "a": "12", "w": ["4", "8"], "h": "Рёбра — это отрезки, по которым встречаются грани. Внизу 4 ребра, вверху 4 ребра и ещё 4 боковых. 4 + 4 + 4 = 12."}, {"q": "Сколько граней у прямоугольного параллелепипеда?", "a": "6", "w": ["8", "10"], "h": "Грани — это плоские части поверхности: верх, низ и четыре боковые. Всего 6 граней."}, {"q": "Объём коробки 240 дм³, длина 8 дм, ширина 6 дм. Чему равна высота?", "a": "5 дм", "w": ["14 дм", "6 дм"], "h": "V = a · b · c, значит, c = V : (a · b). 240 : (8 · 6) = 240 : 48 = 5. Высота — 5 дм."}, {"q": "Аквариум имеет форму прямоугольного параллелепипеда: длина 6 дм, ширина 3 дм, высота 6 дм. Сколько литров воды в него поместится? (1 л = 1 дм³)", "a": "108 литров", "w": ["1 080 литров", "108 000 литров"], "h": "V = 6 · 3 · 6 = 108 дм³. Так как 1 л = 1 дм³, в аквариум поместится 108 л."}, {"q": "Бассейн имеет форму прямоугольного параллелепипеда: длина 30 м, ширина 8 м, глубина 3 м. Найди объём бассейна.", "a": "720 м³", "w": ["72 м³", "480 м³"], "h": "V = a · b · c = 30 · 8 · 3 = 720. Объём бассейна — 720 м³."}, {"q": "В коробку размером 6 см × 3 см × 2 см укладывают кубики с ребром 1 см. Сколько кубиков поместится?", "a": "36", "w": ["20", "33"], "h": "Объём коробки 36 см³ (6 · 3 · 2). Объём одного кубика 1 см³. Значит, кубиков 36."}, {"q": "Как изменится объём прямоугольного параллелепипеда, если высоту увеличить в 3 раза, а остальные измерения оставить прежними?", "a": "увеличится в 3 раза", "w": ["увеличится на 3 единицы", "не изменится"], "h": "V = a · b · c. Один множитель стал в 3 раза больше — произведение тоже стало в 3 раза больше. Пример: 2 · 3 · 4 = 24, а 2 · 3 · 12 = 72."}, {"q": "Размеры коробки А: 9 см × 4 см × 6 см. Размеры коробки Б: 3 см × 6 см × 3 см. У какой коробки объём больше?", "a": "коробка А", "w": ["коробка Б", "объёмы равны"], "h": "Коробка А: 9 · 4 · 6 = 216 см³. Коробка Б: 3 · 6 · 3 = 54 см³. Больше объём у коробки А."}, {"q": "Аквариум: длина 8 дм, ширина 4 дм, высота 4 дм. Сколько литров воды нужно, чтобы налить его наполовину?", "a": "64 литра", "w": ["32 литра", "60 литров"], "h": "Весь объём: 8 · 4 · 4 = 128 дм³ = 128 л. Половина: 128 : 2 = 64 л."}, {"q": "Площадь пола комнаты 20 м², высота комнаты 5 м. Найди объём комнаты.", "a": "100 м³", "w": ["45 м³", "200 м³"], "h": "Площадь пола — это a · b. Тогда V = (a · b) · c = 20 · 5 = 100. Объём комнаты — 100 м³."}, {"q": "Объём куба 343 дм³. Чему равно ребро куба?", "a": "7 дм", "w": ["8 дм", "14 дм"], "h": "Ищем число, которое три раза умножено само на себя и даёт 343. 7 · 7 · 7 = 343. Ребро куба — 7 дм."}, {"q": "Какая запись верна для объёма куба с ребром a?", "a": "V = a · a · a", "w": ["V = a · 3", "V = a + a + a"], "h": "У куба все три измерения равны ребру a. Поэтому V = a · a · a = a³."}, {"q": "В каких единицах измеряют объём?", "a": "в кубических сантиметрах (см³)", "w": ["в сантиметрах (см)", "в квадратных сантиметрах (см²)"], "h": "Объём измеряют в кубических единицах: см³, дм³, м³. Квадратные единицы — для площади."}, {"q": "Что показывает объём фигуры?", "a": "сколько места занимает фигура в пространстве", "w": ["сколько мест в квадрате занимает рисунок", "какова длина всех рёбер"], "h": "Объём фигуры — это мера пространства, которое занимает фигура."}, {"q": "Сколько кубических дециметров в одном литре?", "a": "1", "w": ["1 000", "100"], "h": "1 литр — это объём кубика с ребром 1 дм. Значит, 1 л = 1 дм³."}]);
GENS.m4q1l26t = mkTF([{"q": "Объём коробки 5 см × 3 см × 5 см равен 75 см³.", "a": "Верно", "h": "5 · 3 · 5 = 75. Верно."}, {"q": "Объём коробки 4 дм × 4 дм × 2 дм равен 10 дм³.", "a": "Неверно", "h": "Измерения складывать нельзя. V = 4 · 4 · 2 = 32 дм³, а не 10 дм³."}, {"q": "Объём куба с ребром 7 дм равен 343 дм³.", "a": "Верно", "h": "7 · 7 · 7 = 343. Верно."}, {"q": "Объём куба с ребром 5 см равен 25 см³.", "a": "Неверно", "h": "Ребро нужно умножить на себя три раза: 5 · 5 · 5 = 125 см³. А 25 — это площадь грани в см²."}, {"q": "У прямоугольного параллелепипеда 6 граней.", "a": "Верно", "h": "Верх, низ и четыре боковые грани — всего 6."}, {"q": "Противоположные грани прямоугольного параллелепипеда равны.", "a": "Верно", "h": "Верх равен низу, передняя грань равна задней, левая равна правой."}, {"q": "Все грани куба — равные квадраты.", "a": "Верно", "h": "У куба все рёбра равны, поэтому каждая грань — квадрат, и все грани одинаковые."}, {"q": "У куба 8 рёбер.", "a": "Неверно", "h": "Рёбер у куба 12. А вот вершин 8."}, {"q": "3 дм³ = 3 000 см³.", "a": "Верно", "h": "1 дм³ = 1 000 см³. 3 · 1 000 = 3 000."}, {"q": "2 м³ = 200 дм³.", "a": "Неверно", "h": "В 1 м³ не 100, а 1 000 дм³. Правильно: 2 м³ = 2 000 дм³."}, {"q": "Один литр равен одному кубическому дециметру.", "a": "Верно", "h": "1 л = 1 дм³."}, {"q": "Если одно измерение параллелепипеда увеличить в 3 раза, а другие не менять, объём увеличится в 3 раза.", "a": "Верно", "h": "Один множитель стал больше в несколько раз — и произведение стало больше во столько же раз."}, {"q": "Объём измеряют в квадратных сантиметрах.", "a": "Неверно", "h": "Объём измеряют в кубических единицах (см³, дм³, м³). Квадратные — для площади."}, {"q": "Если V = 96 см³, a = 6 см, b = 4 см, то высота c = 4 см.", "a": "Верно", "h": "c = V : (a · b) = 96 : 24 = 4."}, {"q": "Если V = 210 см³, a = 7 см, b = 5 см, то высота c = 175 см.", "a": "Неверно", "h": "Высоту находим делением: c = 210 : (7 · 5) = 6 см."}]);
GENS.m4q1l27q = mkQuiz([{"q": "1 кг моркови стоит 770 тг. Сколько нужно заплатить за 2 кг?", "a": "1 540 тг", "w": ["772 тг", "2 310 тг"], "h": "Стоимость = цена · количество. 770 · 2 = 1 540. Нужно заплатить 1 540 тг."}, {"q": "За 2 кг груш заплатили 1 260 тг. Сколько стоит 1 кг?", "a": "630 тг", "w": ["632 тг", "730 тг"], "h": "Цена = стоимость : количество. 1 260 : 2 = 630. Один килограмм стоит 630 тг."}, {"q": "Одна булочка стоит 330 тг. Сколько можно купить на 1 650 тг?", "a": "5 булочек", "w": ["15 булочек", "7 булочек"], "h": "Количество = стоимость : цена. 1 650 : 330 = 5. Можно купить 5 булочек."}, {"q": "Как найти стоимость покупки, если известны цена и количество?", "a": "цену умножить на количество", "w": ["цену сложить с количеством", "цену разделить на количество"], "h": "Стоимость = цена · количество. Например: 50 · 4 = 200."}, {"q": "Как найти количество товара, если известны стоимость и цена?", "a": "стоимость разделить на цену", "w": ["стоимость умножить на цену", "цену разделить на стоимость"], "h": "Количество = стоимость : цена. Например: 200 : 50 = 4."}, {"q": "В магазине предлагают: 750 тг за 3 кг мандаринов или 850 тг за 5 кг. Где мандарины дешевле?", "a": "850 тг за 5 кг", "w": ["750 тг за 3 кг", "цена одинаковая"], "h": "Сравним цену 1 кг. 750 : 3 = 250, 850 : 5 = 170. Дешевле там, где за 1 кг платят меньше: 850 тг за 5 кг."}, {"q": "1 кг сахара стоит 520 тг, 1 кг муки — 300 тг. Сколько стоят 5 кг сахара и 2 кг муки?", "a": "3 200 тг", "w": ["2 540 тг", "3 720 тг"], "h": "Сахар: 520 · 5 = 2 600. Мука: 300 · 2 = 600. Вместе: 2 600 + 600 = 3 200. Стоят 3 200 тг."}, {"q": "2 кг винограда стоят 380 тг. Сколько стоят 4 кг такого винограда?", "a": "760 тг", "w": ["384 тг", "950 тг"], "h": "Цена 1 кг: 380 : 2 = 190. Стоимость 4 кг: 190 · 4 = 760. Ответ: 760 тг."}, {"q": "В таблице известны измерения a = 11 м, b = 7 м и объём V = 308 м³. Чему равно измерение c?", "a": "4 м", "w": ["77 м", "290 м"], "h": "V = a · b · c, поэтому c = V : (a · b). 308 м у ближайшей ненулевой цифры слева, нули превращаются в девятки. 1 000 000 − 280 870 = 719 130. Проверка: 719 130 + 280 870 = 1 000 000."}, {"q": "Выразим в крупных единицах: 8 000 мг = ? г", "a": "8 г", "w": ["80 г", "9 г"], "h": "1 г = 1 000 мг. 8 000 : 1 000 = 8. Значит, 8 000 мг = 8 г."}, {"q": "Сколько центнеров в 6 т? (1 т = 10 ц)", "a": "60 ц", "w": ["6 000 ц", "600 ц"], "h": "В 1 тонне 10 центнеров. 6 · 10 = 60. Значит, 6 т = 60 ц."}, {"q": "9 дм³ = ? см³", "a": "9 000 см³", "w": ["1 009 см³", "900 см³"], "h": "В 1 дм³ содержится 1 000 см³. 9 · 1 000 = 9 000."}, {"q": "70 000 м² = ? га", "a": "7 га", "w": ["7 000 га", "8 га"], "h": "1 га = 10 000 м². 70 000 : 10 000 = 7."}, {"q": "Выразим в мелких единицах: 7 м 30 см = ? см", "a": "730 см", "w": ["37 см", "740 см"], "h": "1 м = 100 см. 7 · 100 = 700. 700 + 30 = 730."}, {"q": "Сколько это: 1/4 минуты = ? с", "a": "15 с", "w": ["16 с", "45 с"], "h": "В целой единице 60 с. Одна 4-я часть: 60 : 4 = 15. Ответ: 15 с."}, {"q": "3 ₽ 40 коп. = ? копеек", "a": "340 копеек", "w": ["440 копеек", "43 копеек"], "h": "1 рубль = 100 копеек. 3 · 100 = 300. 300 + 40 = 340."}, {"q": "В кошельке 5 монет по 2 € и 4 монеты по 50 центов. Сколько центов всего?", "a": "1 200 центов", "w": ["1 300 центов", "450 центов"], "h": "2 € = 200 центов. 5 · 200 = 1000. 4 · 50 = 200. 1000 + 200 = 1200."}, {"q": "Вычисли удобным способом: 50 · 7 · 2", "a": "700", "w": ["750", "364"], "h": "Переставим множители: 50 · 2 = 100. Потом 100 · 7 = 700."}, {"q": "Вычисли устно, разложив число на разрядные слагаемые: 57 · 6", "a": "342", "w": ["63", "307"], "h": "57 = 50 + 7. 50 · 6 = 300, 7 · 6 = 42. 300 + 42 = 342."}, {"q": "Умножь столбиком: 15 030 · 6 = ?", "a": "90 180", "w": ["90 190", "90 280"], "h": "Умножаем каждый разряд на 6, начиная с единиц, и переносим десятки. 15 030 · 6 = 90 180. Проверка: 90 180 : 6 = 15 030."}, {"q": "Раздели уголком: 197 412 : 3 = ?", "a": "65 804", "w": ["6 584", "65 704"], "h": "Делим по разрядам; если в каком-то р  = 3 (ост. 75).", "a": "Неверно", "h": "Справа отделяем две цифры — это остаток. 7 503 : 100 = 75 (ост. 3)."}]);
GENS.m4q1l30q = mkQuiz([{"q": "Автобус едет со скоростью 50 км/ч. Какое расстояние он преодолеет за 9 часов?", "a": "450 км", "w": ["500 км", "400 км"], "h": "Расстояние S = v · t. 50 · 9 = 450. За 9 часов пройдёт 450 км."}, {"q": "Грузовик проехал 560 км за 7 часов. С какой скоростью он ехал?", "a": "80 км/ч", "w": ["70 км/ч", "567 км/ч"], "h": "Скорость v = S : t. 560 : 7 = 80. Скорость 80 км/ч."}, {"q": "От школы до дома 1 020 м. Данияр идёт со скоростью 60 м/мин. За сколько минут он дойдёт до дома?", "a": "17 мин", "w": ["960 мин", "22 мин"], "h": "Время t = S : v. 1 020 : 60 = 17. Дорога займёт 17 мин."}, {"q": "Выразим в других единицах скорости: 18 км/ч = ? м/мин", "a": "300 м/мин", "w": ["1 800 м/мин", "310 м/мин"], "h": "18 км = 18 000 м, 1 ч = 60 мин. 18 000 : 60 = 300. Значит, 18 км/ч = 300 м/мин."}, {"q": "Расстояние между двумя посёлками 600 км. Навстречу друг другу одновременно выехали два автомобиля со скоростями 90 км/ч и 60 км/ч. Через сколько часов они встретятся?", "a": "4 часа", "w": ["5 часов", "450 часов"], "h": "За каждый час расстояние между ними уменьшается на 90 + 60 = 150 км. 600 : 150 = 4. Встретятся через 4 часа."}, {"q": "Из одного села в противоположных направлениях одновременно выехали два автомобиля со скоростями 90 км/ч и 60 км/ч. Какое расстояние будет между ними через 4 часа?", "a": "600 км", "w": ["120 км", "240 км"], "h": "Каждый час расстояние растёт на 90 + 60 = 150 км. 150 · 4 = 600. Через 4 часа между ними 600 км."}, {"q": "Впереди идёт турист со скоростью 5 км/ч. За ним выехал велосипедист со скоростью 12 км/ч. Между ними 28 км. Через сколько часов велосипедист догонит туриста?", "a": "4 часа", "w": ["8 часов", "3 часа"], "h": "Каждый час расстояние между ними сокращается на 12 − 5 = 7 км. 28 : 7 = 4. Велосипедист догонит туриста через 4 часа."}, {"q": "Автобус ехал 3 часа со скоростью 60 км/ч, а потом 2 часа со скоростью 50 км/ч. Какой путь он проехал?", "a": "280 км", "w": ["550 км", "340 км"], "h": "Первая часть: 60 · 3 = 180 км. Вторая часть: 50 · 2 = 100 км. Весь путь: 180 + 100 = 280 км."}, {"q": "По какой формуле находят расстояние, если известны скорость и время?", "a": "S = v · t", "w": ["S = v : t", "S = t : v"], "h": "Чтобы найти расстояние, скорость движения умножаем на время: S = v · t."}, {"q": "Как найти время движения, если известны расстояние и скорость?", "a": "расстояние разделить на скорость", "w": ["расстояние умножить на скорость", "скорость вычесть из расстояния"], "h": "Время t = S : v: расстояние делим на скорость."}, {"q": "A = { 1; 2; 5; 6; 7 }, B = { 1; 3; 7; 9; 11 }. Найди объединение A ∪ B.", "a": "{ 1; 2; 3; 5; 6; 7; 9; 11 }", "w": ["{ 1; 7 }", "{ 2; 3; 5; 6; 9; 11 }"], "h": "Объединение — все элементы из A или из B; общие записываем один раз: { 1; 2; 3; 5; 6; 7; 9; 11 }."}, {"q": "В классе 28 учеников. Плаванием занимаются 18, шахматами — 12, а и плаванием, и шахматами — 7. Сколько учеников занимаются хотя бы чем-то одним?", "a": "23", "w": ["24", "22"], "h": "Тех, кто занимается и тем и другим, при сложении посчитали дважды. 18 + 12 − 7 = 23. Ответ: 23."}, {"q": "17 детей любят футбол, 11 — волейбол, 5 — и футбол, и волейбол. Сколько детей любят только футбол?", "a": "12", "w": ["17", "13"], "h": "Из 17 любителей футбола 5 любят ещё и волейбол. 17 − 5 = 12."}, {"q": "A = { 5; 6; 10 }, B = { 6; 5; 10 }, C = { 2; 5; 6 }. Какие множества равны?", "a": "A и B", "w": ["A и C", "B и C"], "h": "Равные множества совпадают по составу элементов, порядок записи неважен. A и B состоят из одних и тех же чисел. В C есть число 2, поэтому оно не равно A."}, {"q": "Как называют множество, в котором нет ни одного элемента?", "a": "пустое множество (∅)", "w": ["объединение", "подмножество"], "h": "Множество без элементов называют пустым и обозначают ∅."}, {"q": "A = { 2; 4; 8 }, B = { 1; 3; 7 }. Чему равно пересечение A ∩ B?", "a": "пустому множеству (∅)", "w": ["{ 1; 3; 7 }", "{ 1; 2; 3; 4; 7; 8 }"], "h": "В A только чётные числа, в B только нечётные. Общих элементов нет, значит, A ∩ B = ∅."}, {"q": "Какое равенство выражает переместительное свойство пересечения множеств?", "a": "A ∩ B = B ∩ A", "w": ["A ∩ B = A ∪ B", "A ∪ B = A ∩ B"], "h": "Пересечение не зависит от порядка множеств: A ∩ B = B ∩ A."}, {"q": "Какое равенство выражает сочетательное свойство объединения множеств?", "a": "(A ∪ B) ∪ C = A ∪ (B ∪ C)", "w": ["(A ∪ B) ∪ C = A ∩ (B ∪ C)", "A ∪ B = B ∪ A"], "h": "При объединении трёх множеств скобки можно расставлять по-разному: (A ∪ B) ∪ C = A ∪ (B ∪ C)."}, {"q": "В названии множества есть слово «И»: «числа, которые делятся на 2 и на 5». Что это за множество?", "a": "пересечение двух множеств", "w": ["объединение двух множеств", "подмножество"], "h": "Слово «И» означает, что элемент должен быть в обоих множествах сразу — это пересечение. Слово «ИЛИ» означает объединение."}, {"q": "Найди объём коробки: длина 9 дм, ширина 4 дм, высота 5 дм.", "a": "180 дм³", "w": ["176 дм³", "36 дм³"], "h": "V = a · b · c = 9 · 4 · 5 = 180. Объём 180 дм³."}, {"q": "Ребро куба 6 дм. Найди объём куба.", "a": "216 дм³", "w": ["222 дм³", "18 дм³"], "h": "V = a · a · a = 6 · 6 · 6 = 216. Объём 216 дм³."}, {"q": "Объём коробки 168 дм³. Длина коробки 7 дм, ширина 4 дм. Чему равна высота?", "a": "6 дм", "w": ["15 дм", "24 дм"], "h": "c = V : (a · b) = 168 : (7 · 4) = 168 : 28 = 6. Высота 6 дм."}, {"q": "Размеры контейнера: 4 м × 3 м × 2 м. Сколько коробок размером 2 м × 1 м × 1 м можно в него уложить? (Коробки укладывают без пустого места.)", "a": "12", "w": ["13", "24"], "h": "Объём контейнера: 4 · 3 · 2 = 24 м³. Объём коробки: 2 · 1 · 1 = 2 м³. 24 : 2 = 12."}, {"q": "Коробку 19 см × 11 см × 5 см нужно целиком оклеить цветной бумагой. Сколько квадратных сантиметров бумаги потребуется?", "a": "718 см²", "w": ["70 см²", "927 см²"], "h": "У коробки 3 пары одинаковых граней: 19 · 11 = 209, 11 · 5 = 55, 19 · 5 = 95. Сумма: 209 + 55 + 95 = 359. Удваиваем: 359 · 2 = 718 см²."}, {"q": "Из прямоугольника 13 м × 10 м в углу вырезали прямоугольник 4 м × 2 м. Найди площадь оставшейся фигуры.", "a": "122 м²", "w": ["46 м²", "124 м²"], "h": "Площадь всего прямоугольника: 13 · 10 = 130 м². Площадь выреза: 4 · 2 = 8 м². 130 − 8 = 122 м²."}, {"q": "Площадка составлена из двух прямоугольников 11 м × 3 м и 5 м × 5 м. Найди площадь площадки.", "a": "58 м²", "w": ["24 м²", "69 м²"], "h": "S = 11 · 3 + 5 · 5 = 33 + 25 = 58. Площадь 58 м²."}, {"q": "Аквариум: длина 6 дм, ширина 4 дм, высота 6 дм. Сколько литров воды нужно, чтобы налить его наполовину? (1 л = 1 дм³)", "a": "72 литра", "w": ["720 литров", "68 литров"], "h": "V = 6 · 4 · 6 = 144 дм³ = 144 л. Половина: 144 : 2 = 72 л."}]);
GENS.m4q1l30t = mkTF([{"q": "За 4 часа со скоростью 50 км/ч автобус проедет 200 км.", "a": "Верно", "h": "50 · 4 = 200."}, {"q": "За 4 часа со скоростью 80 км/ч автобус проедет 84 км.", "a": "Неверно", "h": "Расстояние находим умножением: 80 · 4 = 320 км."}, {"q": "Если за 8 часов прошли 400 км, то скорость 50 км/ч.", "a": "Верно", "h": "400 : 8 = 50."}, {"q": "Если за 9 часов прошли 540 км, то скорость 4 860 км/ч.", "a": "Неверно", "h": "Скорость v = S : t = 540 : 9 = 60 км/ч."}, {"q": "Если двое идут навстречу друг другу со скоростями 6 км/ч и 5 км/ч, то каждый час расстояние между ними уменьшается на 11 км.", "a": "Верно", "h": "6 + 5 = 11."}, {"q": "Если двое идут в противоположные стороны со скоростями 6 км/ч и 4 км/ч, то каждый час расстояние между ними увеличивается на 2 км.", "a": "Неверно", "h": "Расстояние растёт на сумму скоростей: 6 + 4 = 10 км в час."}, {"q": "6 км/ч = 100 м/мин.", "a": "Верно", "h": "6 000 м : 60 мин = 100 м/мин."}, {"q": "12 км/ч = 1 200 м/мин.", "a": "Неверно", "h": "Верно: 12 км/ч = 12 000 м : 60 мин = 200 м/мин."}, {"q": "Пересечение множеств не зависит от порядка: A ∩ B = B ∩ A.", "a": "Верно", "h": "Общие элементы A и B одни и те же, как ни меняй порядок."}, {"q": "Объединение множеств A ∪ B состоит только из общих элементов A и B.", "a": "Неверно", "h": "Общие элементы — это пересечение. Объединение — все элементы из A или из B."}, {"q": "Множество, в котором нет элементов, называют пустым и обозначают ∅.", "a": "Верно", "h": "Например, множество нечётных чисел, которые делятся на 2."}, {"q": "{ 2; 7 } — подмножество множества { 2; 7; 8; 9 }.", "a": "Верно", "h": "Оба элемента первого множества есть во втором."}, {"q": "{ 3; 8 } — подмножество множества { 6; 7; 8; 9 }.", "a": "Неверно", "h": "Число 3 не входит в { 6; 7; 8; 9 }."}, {"q": "Если 14 детей любят футбол, 12 — волейбол, а 5 — и то и другое, то хотя бы один из этих видов любят 21 детей.", "a": "Верно", "h": "14 + 12 − 5 = 21."}, {"q": "Если 10 детей любят футбол, 9 — волейбол, а 6 — и то и другое, то хотя бы один из этих видов любят 19 детей.", "a": "Неверно", "h": "Тех, кто любит оба вида, посчитали дважды. Правильно: 10 + 9 − 6 = 13."}, {"q": "Объём коробки 9 см × 5 см × 4 см равен 180 см³.", "a": "Верно", "h": "9 · 5 · 4 = 180."}, {"q": "Объём коробки 3 дм × 2 дм × 6 дм равен 11 дм³.", "a": "Неверно", "h": "Измерения умножаем: 3 · 2 · 6 = 36 дм³."}, {"q": "Из прямоугольника 8 м × 9 м вырезали прямоугольник 5 м × 3 м. Осталось 87 м².", "a": "Неверно", "h": "Вырез вычитаем: 8 · 9 − 5 · 3 = 57 м²."}, {"q": "Площадь фигуры из двух прямоугольников 7 м × 3 м и 6 м × 5 м равна 51 м².", "a": "Верно", "h": "7 · 3 + 6 · 5 = 21 + 30 = 51."}]);
GENS.m4q2l01q = mkQuiz([{"q": "Вычисли: 25 · 17 · 4 = ?", "a": "1 700", "w": ["170", "17 000"], "h": "25 · 4 = 100, затем 17 · 100 = 1 700. Так считать удобнее всего."}, {"q": "Вычисли: 8 · (125 · 13) = ?", "a": "13 000", "w": ["1 300", "130 000"], "h": "Сначала 8 · 125 = 1 000, затем 1 000 · 13 = 13 000."}, {"q": "Вычисли: 5 · 38 · 2 = ?", "a": "380", "w": ["190", "3 800"], "h": "5 · 2 = 10, затем 38 · 10 = 380."}, {"q": "Вычисли: 72 : (2 · 6) = ?", "a": "6", "w": ["216", "3"], "h": "Делим по очереди: 72 : 2 = 36, 36 : 6 = 6. Или сразу 72 : 12 = 6."}, {"q": "Вычисли: 360 : (4 · 9) = ?", "a": "10", "w": ["810", "100"], "h": "4 · 9 = 36, а 360 : 36 = 10. Или по очереди: 360 : 4 = 90, 90 : 9 = 10."}, {"q": "Вычисли: 840 : (2 · 5 · 7) = ?", "a": "12", "w": ["588", "120"], "h": "Делим по очереди: 840 : 2 = 420, 420 : 5 = 84, 84 : 7 = 12."}, {"q": "Вычисли: 4 · 28 · 25 = ?", "a": "2 800", "w": ["280", "28 000"], "h": "4 · 25 = 100, затем 28 · 100 = 2 800."}, {"q": "Вычисли: 15 · (2 · 3) = ?", "a": "90", "w": ["45", "900"], "h": "2 · 3 = 6, значит, 15 · 6 = 90. Можно и так: 15 · 2 = 30, 30 · 3 = 90."}, {"q": "Вычисли: 125 · 7 · 8 = ?", "a": "7 000", "w": ["875", "70 000"], "h": "125 · 8 = 1 000, затем 7 · 1 000 = 7 000."}, {"q": "Вычисли: 300 : (5 · 6) = ?", "a": "10", "w": ["1 800", "100"], "h": "5 · 6 = 30, а 300 : 30 = 10."}, {"q": "В магазине в Караганде 4 полки. На каждой полке по 10 пачек чая, в каждой пачке 25 пакетиков. Сколько пакетиков чая в магазине?", "a": "1 000 пакетиков", "w": ["250 пакетиков", "10 000 пакетиков"], "h": "4 · (10 · 25) = (4 · 25) · 10 = 100 · 10 = 1 000 пакетиков."}, {"q": "Тренер купил 240 мячей и поровну раздал их 4 командам. В каждой команде 6 игроков. Сколько мячей получит каждый игрок?", "a": "10 мячей", "w": ["40 мячей", "1 440 мячей"], "h": "240 : (4 · 6) = 240 : 4 : 6 = 60 : 6 = 10 мячей."}, {"q": "С какого действия удобно начать, чтобы вычислить 25 · 13 · 4?", "a": "25 · 4 = 100", "w": ["25 · 13 = 325", "13 · 4 = 52"], "h": "Пара 25 ."}, {"q": "Бригада в Таразе кладёт 25 м дорожки в день. Сколько метров она проложит за 12 дней?", "a": "300 м", "w": ["37 м", "325 м"], "h": "A = v · t = 25 · 12 = 300 (м)."}, {"q": "Нужно проложить 300 м водопровода. Рабочие прокладывают 25 м в день. За сколько дней они закончат?", "a": "12 дн.", "w": ["7 500 дн.", "275 дн."], "h": "t = A : v = 300 : 25 = 12 (дн.)."}, {"q": "Первый станок делает 12 деталей в час, второй — 15. На сколько деталей больше сделает второй станок за 8 часов?", "a": "24 дет.", "w": ["120 дет.", "96 дет."], "h": "За 8 часов: 120 − 96 = 24 (дет.)."}, {"q": "За 9 дней пекарня в Астане выпекла 720 батонов. Сколько батонов она выпекает в день?", "a": "80 батонов", "w": ["6 480 батонов", "711 батонов"], "h": "v = A : t = 720 : 9 = 80 (батонов в день)."}, {"q": "Вычисли: 25 · 12 = ?", "a": "300", "w": ["37", "325"], "h": "25 · 12 = 300. Это A = v · t при v = 25 и t = 12."}, {"q": "Вычисли: 720 : 9 = ?", "a": "80", "w": ["90", "70"], "h": "720 : 9 = 80. Так находят v = A : t."}, {"q": "Швейная фабрика шьёт 40 рубашек в час. Сколько часов нужно, чтобы выполнить заказ на 1 200 рубашек?", "a": "30 ч", "w": ["48 000 ч", "1 160 ч"], "h": "t = A : v = 1 200 : 40 = 30 (ч)."}]);
GENS.m4q2l16t = mkTF([{"q": "Работу можно найти по формуле A = v · t.", "a": "Верно", "h": "Работа равна производительности, умноженной на время."}, {"q": "Чтобы найти производительность, надо время разделить на работу.", "a": "Неверно", "h": "Неверно: v = A : t — работу делим на время."}, {"q": "Время работы находят по формуле t = A : v.", "a": "Верно", "h": "Работу делим на производительность."}, {"q": "За 4 часа сделали 36 деталей, значит, производительность 9 дет./ч.", "a": "Верно", "h": "36 : 4 = 9 (дет./ч)."}, {"q": "Станок делает 15 деталей в час, за 6 часов он сделает 80 деталей.", "a": "Неверно", "h": "Неверно: 15 · 6 = 90 деталей."}, {"q": "Производительность измеряют в часах.", "a": "Неверно", "h": "Неверно: часы — единица времени. Производительность — это, например, «деталей в час»."}, {"q": "Если работу 120 деталей делать по 20 в час, понадобится 6 часов.", "a": "Верно", "h": "120 : 20 = 6 (ч)."}, {"q": "Формулы — это верные равенства, которые связывают величины.", "a": "Верно", "h": "Формулы устанавливают взаимосвязь между величинами."}, {"q": "Принтер печатает 5 листов в минуту. За 2 часа он напечатает 10 листов.", "a": "Неверно", "h": "Неверно: 2 ч = 120 мин, 5 · 120 = 600 листов."}, {"q": "Если время работы не меняется, то чем выше производительность, тем больше выполнено работы.", "a": "Верно", "h": "A = v · t: при том же t большее v даёт большее A."}, {"q": "Чтобы найти работу, нужно производительность разделить на время.", "a": "Неверно", "h": "Неверно: работу находят умножением: A = v · t."}, {"q": "720 : 9 = 80.", "a": "Верно", "h": "9 · 80 = 720, значит, всё верно."}]);
GENS.m4q2l17q = mkQuiz([{"q": "Как найти совместную производительность двух мастеров?", "a": "сложить их производительности", "w": ["умножить их производительности", "вычесть меньшую из большей"], "h": "v совм. = v₁ + v₂. Например, 20 дет./ч и 10 дет./ч дают 30 дет./ч."}, {"q": "Как найти время совместной работы?", "a": "разделить объём работы на совместную производительность", "w": ["умножить объём работы на совместную производительность", "сложить время каждого мастера"], "h": "t = A : v совм."}, {"q": "Что такое v совм.?", "a": "производительность двух участников, работающих вместе", "w": ["производительность одного участника", "время, за которое работу делают вдвоём"], "h": "v совм. — это сколько работы делают вместе за единицу времени."}, {"q": "Работая вместе, двое выполнят заказ быстрее или медленнее, чем каждый один?", "a": "быстрее", "w": ["медленнее", "так же"], "h": "Вместе делают больше за час, поэтому и времени нужно меньше."}, {"q": "Мастер вытачивает 20 деталей в час, а ученик — вдвое меньше. Сколько деталей они сделают вместе за 3 часа?", "a": "90 дет.", "w": ["60 дет.", "30 дет."], "h": "Ученик делает 10 дет./ч. Вместе: 20 + 10 = 30 дет./ч. За 3 ч: 30 · 3 = 90 дет."}, {"q": "Нужно испечь 480 пирожков. Один пекарь справится за 8 часов, другой — за 24 часа. За сколько часов они испекут пирожки вместе?", "a": "6 ч", "w": ["32 ч", "16 ч"], "h": "Первый печёт 60 пирожков в час, второй — 20. Вместе 60 + 20 = 80 в час. Время: 480 : 80 = 6 ч."}, {"q": "Двое рабочих изготовили 56 деталей. Один работал 3 часа, другой — 4 часа, а производительность у них одинаковая. Сколько деталей изготовил второй?", "a": "32 дет.", "w": ["24 дет.", "28 дет."], "h": "Всего они работали 3 + 4 = 7 ч. Производительность: 56 : 7 = 8 дет./ч. Второй: 8 · 4 = 32 дет."}, {"q": "Одна косилка убирает 6 га в час, другая — 9 га в час. За сколько часов они вместе скосят поле в 75 га?", "a": "5 ч", "w": ["15 ч", "60 ч"], "h": "v совм. = 6 + 9 = 15 га/ч. t = 75 : 15 = 5 ч."}, {"q": "Дорогу длиной 900 м одна бригада может отремонтировать за 30 дней, а другая — за 45 дней. За сколько дней они сделают это вместе, если начнут с двух концов?", "a": "18 дн.", "w": ["75 дн.", "50 дн."], "h": "Первая ремонтирует 30 м в день, вторая — 20 м. Вместе 50 м в день. 900 : 50 = 18 дн."}, {"q": "Тираж 120 книг первый станок печатает за 4 часа, второй — за 6 часов. Какова их совместная производительность?", "a": "50 книг/ч", "w": ["30 книг/ч", "12 книг/ч"], "h": "Первый печатает 30 книг в час, второй — 20. Вместе: 30 + 20 = 50 книг в час."}, {"q": "Один насос качает 40 вёдер воды в час, другой — 25. Сколько вёдер они накачают вместе за 4 часа?", "a": "260 вёдер", "w": ["160 вёдер", "65 вёдер"], "h": "v совм. = 40 + 25 = 65 вёдер в час. A = 65 · 4 = 260."}, {"q": "Три швеи шьют 4, 6, 9 платьев в день. Сколько платьев они сошьют вместе за 5 дней?", "a": "95 платьев", "w": ["19 платьев", "285 платьев"], "h": "В день: 4 + 6 + 9 = 19 платьев. За 5 дней: 19 · 5 = 95."}, {"q": "Два принтера печатают 40 и 20 листов в минуту. Сколько минут им нужно, чтобы вместе напечатать 600 листов?", "a": "10 мин", "w": ["15 мин", "30 мин"], "h": "v совм. = 40 + 20 = 60 листов/мин. t = 600 : 60 = 10 мин."}, {"q": "Айдос и Дана раскладывают открытки: Айдос по 12 в час, Дана — по 8. Сколько открыток они разложат вместе за 5 часов?", "a": "100 открыток", "w": ["20 открыток", "60 открыток"], "h": "Вместе 12 + 8 = 20 открыток в час. За 5 ч: 20 · 5 = 100."}, {"q": "Вычисли: 480 : 80 = ?", "a": "6", "w": ["60", "5"], "h": "480 : 80 = 6, потому что 80 · 6 = 480. Так находят t = A : v совм."}, {"q": "Вычисли: 30 · 3 = ?", "a": "90", "w": ["33", "60"], "h": "30 · 3 = 90. Так находят A = v совм. · t."}]);
GENS.m4q2l17t = mkTF([{"q": "Совместная производительность равна сумме производительностей участников.", "a": "Верно", "h": "v совм. = v₁ + v₂."}, {"q": "Один мастер делает 6 деталей в час, другой — 4. Вместе они делают 10 деталей в час.", "a": "Верно", "h": "6 + 4 = 10 (дет./ч)."}, {"q": "Чтобы найти время совместной работы, объём работы умножают на совместную производительность.", "a": "Неверно", "h": "Неверно: t = A : v совм. Объём делим на производительность."}, {"q": "Объём совместной работы находят по формуле A = v совм. · t.", "a": "Верно", "h": "Совместную производительность умножаем на время."}, {"q": "Два комбайна убирают 8 и 12 га в час. Поле в 100 га они уберут за 5 часов.", "a": "Верно", "h": "8 + 12 = 20 га/ч, 100 : 20 = 5 ч."}, {"q": "Время работы двоих вместе равно сумме времени каждого.", "a": "Неверно", "h": "Неверно: вместе работа делается быстрее, время будет меньше, чем у каждого."}, {"q": "Если двое работают с одинаковой производительностью поровну, каждый сделает половину работы.", "a": "Верно", "h": "Одинаковое время и одинаковая v дают одинаковый объём."}, {"q": "Мастер делает 20 деталей в час, ученик — 10. Вместе за 3 часа они сделают 60 деталей.", "a": "Неверно", "h": "Неверно: (20 + 10) · 3 = 90 деталей."}, {"q": "Каждый из двоих выполняет заказ за 6 дней. Вместе они справятся за 12 дней.", "a": "Неверно", "h": "Неверно: вместе вдвое быстрее, за 3 дня. 6 дней — время одного."}, {"q": "Совместная производительность больше производительности каждого из участников.", "a": "Верно", "h": "Складываем две положительные производительности, сумма больше каждого слагаемого."}, {"q": "Два крана наполняют бак: 30 и 20 вёдер в минуту. Бак в 200 вёдер наполнится за 4 минуты.", "a": "Верно", "h": "30 + 20 = 50, 200 : 50 = 4 (мин)."}, {"q": "Если один рабочий делает 15 деталей в час, а другой — 5, то вместе они делают 75 деталей в час.", "a": "Неверно", "h": "Неверно: производительности складывают, 15 + 5 = 20 деталей в час."}]);
GENS.m4q2l18q = mkQuiz([{"q": "Что делают первым действием в задачах на приведение к единице?", "a": "находят, сколько приходится на единицу (делят)", "w": ["умножают числа из условия", "складывают все числа"], "h": "Сначала делением находим то, что приходится на единицу: на 1 час, 1 кг, 1 штуку. Потом находим ответ на вопрос задачи."}, {"q": "Что принимают за единицу в задаче: «За 4 ч спилили 36 м³ леса. Сколько спилят за 7 ч?»", "a": "1 час", "w": ["1 кубометр", "7 часов"], "h": "Спрашивают про разное время, поэтому находим, сколько спиливают за 1 час."}, {"q": "Как проверить, что за 5 ч — 40 л, а за 9 ч — 72 л (расход одинаковый)?", "a": "40 : 5 = 8 и 72 : 9 = 8 — расход за 1 час одинаковый", "w": ["72 + 40 = 112", "72 − 9 = 63"], "h": "Если ответ верный, на единицу приходится одно и то же число: 8 л в час."}, {"q": "Автомобиль за 5 часов израсходовал 40 литров бензина. Сколько литров ему нужно на 9 часов при той же норме расхода?", "a": "72 л", "w": ["8 л", "360 л"], "h": "1) 40 : 5 = 8 (л) — расход за 1 час. 2) 8 · 9 = 72 (л)."}, {"q": "Комбайнёр убрал 36 га пшеницы за 4 дня. Сколько гектаров он уберёт за 7 дней, работая так же?", "a": "63 га", "w": ["9 га", "252 га"], "h": "1) 36 : 4 = 9 (га в день). 2) 9 · 7 = 63 (га)."}, {"q": "За 6 м ткани на базаре заплатили 3 600 тг. Сколько стоят 10 м такой ткани?", "a": "6 000 тг", "w": ["600 тг", "36 000 тг"], "h": "1) 3 600 : 6 = 600 (тг) — цена 1 м. 2) 600 · 10 = 6 000 (тг)."}, {"q": "7 одинаковых ручек стоят 490 тг. Сколько стоит одна ручка?", "a": "70 тг", "w": ["3 430 тг", "483 тг"], "h": "490 : 7 = 70 (тг)."}, {"q": "Станок за 8 часов делает 96 деталей. За сколько часов он сделает 156 деталей?", "a": "13 ч", "w": ["12 ч", "60 ч"], "h": "1) 96 : 8 = 12 (дет. в час). 2) 156 : 12 = 13 (ч). Здесь второе действие — деление: ищем, сколько раз по 12 в 156."}, {"q": "Туристы прошли по степи 54 км за 3 дня. Сколько километров они пройдут за 5 дней в том же темпе?", "a": "90 км", "w": ["18 км", "270 км"], "h": "1) 54 : 3 = 18 (км в день). 2) 18 · 5 = 90 (км)."}, {"q": "В 9 одинаковых пакетах 63 кг муки. Сколько килограммов муки в 5 таких пакетах?", "a": "35 кг", "w": ["7 кг", "315 кг"], "h": "1) 63 : 9 = 7 (кг в одном пакете). 2) 7 · 5 = 35 (кг)."}, {"q": "Мама купила 4 кг картофеля за 480 тг. Сколько стоят 7 кг такого картофеля?", "a": "840 тг", "w": ["120 тг", "3 360 тг"], "h": "1) 480 : 4 = 120 (тг за 1 кг). 2) 120 · 7 = 840 (тг)."}, {"q": "Школьница вяжет шарф и вяжет каждый день поровну: за 6 дней она связала 90 рядов. Сколько рядов она свяжет за 10 дней?", "a": "150 рядов", "w": ["15 рядов", "900 рядов"], "h": "1) 90 : 6 = 15 (рядов в день). 2) 15 · 10 = 150 (рядов)."}, {"q": "На 9 одинаковых платьев ушло 27 м ткани. Сколько таких платьев получится из 15 м?", "a": "5 платьев", "w": ["3 платьев", "135 платьев"], "h": "1) 27 : 9 = 3 (м на одно платье). 2) 15 : 3 = 5 (платьев)."}, {"q": "Вычисли: 480 : 6 = ?", "a": "80", "w": ["8", "800"], "h": "480 : 6 = 80. Это первое действие: сколько приходится на единицу."}, {"q": "Вычисли: 84 · 5 = ?", "a": "420", "w": ["89", "400"], "h": "84 · 5 = 420. Это второе действие: умножаем на нужное количество единиц."}, {"q": "Вычисли: 72 : 8 = ?", "a": "9", "w": ["8", "64"], "h": "72 : 8 = 9."}]);
GENS.m4q2l18t = mkTF([{"q": "В задачах на приведение к единице первое действие — деление.", "a": "Верно", "h": "Сначала находим, что приходится на единицу."}, {"q": "За 5 часов израсходовали 40 литров, значит, за 1 час — 8 литров.", "a": "Верно", "h": "40 : 5 = 8 (л)."}, {"q": "За 4 часа израсходовали 36 литров, значит, за 7 часов — 61 литр.", "a": "Неверно", "h": "Неверно: 36 : 4 = 9, 9 · 7 = 63 литра."}, {"q": "Если за 1 час расходуется одно и то же, то чем больше часов, тем больше расход.", "a": "Верно", "h": "Расход за 1 час одинаковый, а часов больше — значит, и литров больше."}, {"q": "Единицей в задаче может быть 1 час, 1 килограмм или 1 метр.", "a": "Верно", "h": "За единицу принимают то, что спрашивают «на один»."}, {"q": "Задача на приведение к единице решается одним действием.", "a": "Неверно", "h": "Неверно: нужно два действия — найти на единицу и найти ответ."}, {"q": "Если 6 м ткани стоят 3 600 тг, то 1 м стоит 600 тг.", "a": "Верно", "h": "3 600 : 6 = 600 (тг)."}, {"q": "Если 7 ручек стоят 490 тг, то 12 таких ручек стоят 840 тг.", "a": "Верно", "h": "490 : 7 = 70, 70 · 12 = 840 (тг)."}, {"q": "За 6 дней сделали 480 деталей, значит, за 9 дней сделают 640 деталей.", "a": "Неверно", "h": "Неверно: 480 : 6 = 80, 80 · 9 = 720 деталей."}, {"q": "Второе действие в таких задачах всегда умножение.", "a": "Неверно", "h": "Не всегда. Если ищем, сколько раз единица помещается в количестве, делим: 156 : 12 = 13."}, {"q": "Если 9 пакетов муки весят 63 кг, то в одном пакете 7 кг.", "a": "Верно", "h": "63 : 9 = 7 (кг)."}, {"q": "Чтобы найти, что приходится на единицу, надо всё количество умножить на число единиц.", "a": "Неверно", "h": "Неверно: количество делим на число единиц."}]);
GENS.m4q2l19q = mkQuiz([{"q": "Что находят первым действием: «Купили 3 кг яблок и 5 кг груш по одной цене. Всего заплатили 2 400 тг»?", "a": "сколько всего килограммов купили", "w": ["сколько стоят яблоки", "сколько стоят груши"], "h": "Сначала находим сумму количеств: 3 + 5 = 8 кг. Тогда можно узнать цену 1 кг."}, {"q": "Сколько величин связаны в задаче на нахождение неизвестного по двум суммам?", "a": "три", "w": ["две", "четыре"], "h": "Это три взаимосвязанные величины, например цена, количество и стоимость."}, {"q": "Что дано в условии задачи на нахождение неизвестного по двум суммам?", "a": "сумма двух значений одной величины", "w": ["разность двух значений одной величины", "произведение двух значений одной величины"], "h": "Например, общая стоимость двух покупок. Чтобы найти искомую величину, надо сначала узнать сумму двух других известных величин."}, {"q": "Яблоки и груши стоят одинаково за 1 кг. Купили 3 кг яблок и 5 кг груш и заплатили 2 400 тг. Сколько стоит 1 кг?", "a": "300 тг", "w": ["800 тг", "480 тг"], "h": "1) 3 + 5 = 8 (кг) — всего. 2) 2 400 : 8 = 300 (тг) — цена 1 кг."}, {"q": "Яблоки и груши стоят одинаково за 1 кг. Купили 3 кг яблок и 5 кг груш и заплатили 2 400 тг. Сколько стоят яблоки?", "a": "900 тг", "w": ["1 500 тг", "800 тг"], "h": "1) 8 кг всего. 2) 300 тг — цена 1 кг. 3) 300 · 3 = 900 (тг) — яблоки. Проверка: 900 + 1 500 = 2 400."}, {"q": "На базаре в Шымкенте купили 4 кг абрикосов и 6 кг слив по одной цене за килограмм. Всего заплатили 4 500 тг. Сколько стоят абрикосы?", "a": "1 800 тг", "w": ["2 700 тг", "1 125 тг"], "h": "1) 4 + 6 = 10 (кг). 2) 4 500 : 10 = 450 (тг за 1 кг). 3) 450 · 4 = 1 800 (тг)."}, {"q": "Два самосвала перевезли 120 т песка, сделав одинаковое число рейсов. Один за рейс возил 6 т, другой — 9 т. Сколько рейсов сделал каждый самосвал?", "a": "8 рейсов", "w": ["20 рейсов", "15 рейсов"], "h": "1) 6 + 9 = 15 (т) — перевозят за один рейс оба. 2) 120 : 15 = 8 (рейсов)."}, {"q": "Два самосвала перевезли 120 т песка, сделав одинаковое число рейсов. Один за рейс возил 6 т, другой — 9 т. Сколько тонн песка перевёз второй самосвал?", "a": "72 т", "w": ["48 т", "60 т"], "h": "Рейсов было 8. Второй перевёз 9 · 8 = 72 т. Первый — 48 т. Проверка: 48 + 72 = 120."}, {"q": "Айгерим и Дина купили одинаковые ручки: Айгерим взяла 4 ручки, Дина — 3. Вместе они заплатили 560 тг. Сколько заплатила Айгерим?", "a": "320 тг", "w": ["240 тг", "140 тг"], "h": "1) 4 + 3 = 7 ручек. 2) 560 : 7 = 80 тг — цена одной. 3) 80 · 4 = 320 тг."}, {"q": "В двух цехах хлебозавода хлеб выпекают в одинаковых формах: в первом цехе 7 форм, во втором — 5. Всего в них 3 600 булок. Сколько булок в одной форме?", "a": "300 булок", "w": ["720 булок", "1 800 булок"], "h": "1) 7 + 5 = 12 (форм). 2) 3 600 : 12 = 300 (булок)."}, {"q": "Мама и дочь собирали виноград в одинаковые вёдра. Дочь наполнила 3 ведра, мама — 6 вёдер, а вместе они собрали 54 кг. Сколько килограммов собрала мама?", "a": "36 кг", "w": ["18 кг", "27 кг"], "h": "1) 3 + 6 = 9 (вёдер). 2) 54 : 9 = 6 (кг в ведре). 3) 6 · 6 = 36 (кг)."}, {"q": "По одной цене за килограмм купили 2 кг яблок и 3 кг груш; всего заплатили 1 500 тг. Сколько стоят груши?", "a": "900 тг", "w": ["600 тг", "500 тг"], "h": "1) 5 кг всего. 2) 1 500 : 5 = 300 тг за 1 кг. 3) 300 · 3 = 900 тг. Проверка: 600 + 900 = 1 500."}, {"q": "Как проверить ответ: яблоки стоят 900 тг, груши — 1 500 тг, а всего заплатили 2 400 тг?", "a": "сложить: 900 + 1 500 = 2 400", "w": ["вычесть: 1 500 − 900 = 600", "умножить: 900 · 1 500"], "h": "В этой задаче известна сумма. Если части сложить, получится вся сумма."}, {"q": "Вычисли: 2 400 : 8 = ?", "a": "300", "w": ["30", "600"], "h": "2 400 : 8 = 300, потому что 300 · 8 = 2 400."}, {"q": "Вычисли: 5 000 : 10 = ?", "a": "500", "w": ["50", "550"], "h": "5 000 : 10 = 500: делим 50 сотен на 10."}, {"q": "Дачник купил 6 ящиков под яблоки и 4 таких же ящиков под груши. За все ящики он заплатил 5 000 тг. Сколько стоят ящики под яблоки?", "a": "3 000 тг", "w": ["2 000 тг", "500 тг"], "h": "Всего ящиков: 10. Один ящик: 5 000 : 10 = 500 тг. Под яблоки: 500 · 6 = 3 000 тг."}]);
GENS.m4q2l19t = mkTF([{"q": "Купили 3 кг и 5 кг по одной цене — всего получилось 8 кг.", "a": "Верно", "h": "3 + 5 = 8 (кг)."}, {"q": "Цену килограмма находят, деля общую стоимость на 3, если купили 3 кг и 5 кг.", "a": "Неверно", "h": "Неверно: общую стоимость делим на всё количество, 3 + 5 = 8."}, {"q": "2 400 : 8 = 300.", "a": "Верно", "h": "300 · 8 = 2 400, значит, верно."}, {"q": "Если яблоки стоят 900 тг, а груши — 1 500 тг, то вместе 2 400 тг.", "a": "Верно", "h": "900 + 1 500 = 2 400."}, {"q": "В задаче по двум суммам надо сначала найти сумму двух других известных величин.", "a": "Верно", "h": "Например, общее количество товара."}, {"q": "Задача на нахождение неизвестного по двум суммам решается одним действием.", "a": "Неверно", "h": "Неверно: нужно несколько действий — общее количество, значение на единицу, значение каждого."}, {"q": "6 ящиков и 4 ящика стоят 5 000 тг, значит, один ящик стоит 500 тг.", "a": "Верно", "h": "6 + 4 = 10, 5 000 : 10 = 500 (тг)."}, {"q": "Если один ящик стоит 500 тг, то 6 ящиков стоят 3 000 тг.", "a": "Верно", "h": "500 · 6 = 3 000 (тг)."}, {"q": "Если один ящик стоит 500 тг, то 4 ящика стоят 2 500 тг.", "a": "Неверно", "h": "Неверно: 500 · 4 = 2 000 тг."}, {"q": "Ответ в такой задаче можно проверить сложением частей.", "a": "Верно", "h": "Сумма частей должна быть равна всей данной сумме."}, {"q": "Два самосвала перевезли 120 т песка за одинаковое число рейсов, возя по 6 т и по 9 т. Рейсов было по 8.", "a": "Верно", "h": "6 + 9 = 15 т за пару рейсов, 120 : 15 = 8."}, {"q": "Чтобы найти цену одного ящика, надо стоимость умножить на количество.", "a": "Неверно", "h": "Неверно: цена = стоимость : количество."}]);
GENS.m4q2l20q = mkQuiz([{"q": "Что находят первым действием: «Купили 7 м шёлка и 4 м шерсти по одной цене; за шёлк заплатили на 1 800 тг больше»?", "a": "на сколько метров шёлка больше", "w": ["сколько всего метров купили", "сколько стоит шерсть"], "h": "Сначала находим разность количеств: 7 − 4 = 3 м."}, {"q": "Что дано в условии задачи на нахождение неизвестного по двум разностям?", "a": "разность двух значений одной величины", "w": ["сумма двух значений одной величины", "произведение двух значений одной величины"], "h": "Например, «на 1 800 тг больше». Чтобы найти искомую величину, надо сначала узнать разность двух других известных величин."}, {"q": "Чем задача по двум разностям отличается от задачи по двум суммам?", "a": "в одной дана разность значений, в другой — сумма", "w": ["в одной ищут сумму, в другой — разность", "в одной три величины, в другой две"], "h": "В обеих задачах три связанные величины. По двум суммам дана сумма значений, по двум разностям — разность."}, {"q": "Купили 7 м шёлка и 4 м шерсти по одной цене за метр. За шёлк заплатили на 1 800 тг больше, чем за шерсть. Сколько стоит 1 м ткани?", "a": "600 тг", "w": ["450 тг", "5 400 тг"], "h": "1) 7 − 4 = 3 (м) — на столько метров шёлка больше. 2) 1 800 : 3 = 600 (тг) — цена 1 м."}, {"q": "Купили 7 м шёлка и 4 м шерсти по одной цене за метр. За шёлк заплатили на 1 800 тг больше, чем за шерсть. Сколько заплатили за шёлк?", "a": "4 200 тг", "w": ["2 400 тг", "12 600 тг"], "h": "1) 3 м — разность. 2) 600 тг — цена 1 м. 3) 600 · 7 = 4 200 (тг). Проверка: 4 200 − 2 400 = 1 800."}, {"q": "Купили 7 м шёлка и 4 м шерсти по одной цене за метр. За шёлк заплатили на 1 800 тг больше, чем за шерсть. Сколько заплатили за шерсть?", "a": "2 400 тг", "w": ["4 200 тг", "1 800 тг"], "h": "600 · 4 = 2 400 (тг). Проверка: 4 200 − 2 400 = 1 800."}, {"q": "Магазин продал блокноты и тетради по одной цене. За блокноты получил 2 100 тг, за тетради — 1 200 тг. Блокнотов продали на 6 штук больше. Сколько тетрадей продали?", "a": "8 шт.", "w": ["14 шт.", "6 шт."], "h": "1) 2 100 − 1 200 = 900 (тг) — разность стоимости. 2) 900 : 6 = 150 (тг) — цена одной. 3) 1 200 : 150 = 8 (шт.)."}, {"q": "У двух комнат одинаковая ширина. Длина первой — 7 м, второй — 5 м, а площадь первой на 8 м² больше. Какова ширина комнат?", "a": "4 м", "w": ["8 м", "2 м"], "h": "1) 7 − 5 = 2 (м) — разность длин. 2) 8 : 2 = 4 (м) — ширина."}, {"q": "У двух комнат одинаковая ширина. Длина первой — 7 м, второй — 5 м, а площадь первой на 8 м² больше. Какова площадь первой комнаты?", "a": "28 м²", "w": ["20 м²", "56 м²"], "h": "Ширина 4 м. Площадь первой: 7 · 4 = 28 м². Второй: 5 · 4 = 20 м². Разность 8 м² — верно."}, {"q": "Две бригады работали с одинаковой производительностью. Первая работала 9 дней, вторая — 6 дней и сделала на 120 деталей меньше. Сколько деталей сделала первая бригада?", "a": "360 дет.", "w": ["240 дет.", "1 080 дет."], "h": "1) 9 − 6 = 3 (дн.). 2) 120 : 3 = 40 (дет. в день). 3) 40 · 9 = 360 (дет.)."}, {"q": "На двух полях пшеница даёт одинаковый урожай с каждого гектара. С поля в 9 га собрали на 36 ц больше, чем с поля в 5 га. Сколько центнеров собрали с большего поля?", "a": "81 ц", "w": ["45 ц", "36 ц"], "h": "1) 9 − 5 = 4 (га). 2) 36 : 4 = 9 (ц с 1 га). 3) 9 · 9 = 81 (ц)."}, {"q": "В двух ящиках лежат яблоки по одной цене. В первом 11 кг, во втором — 4 кг. На сколько килограммов больше в первом ящике?", "a": "7 кг", "w": ["15 кг", "44 кг"], "h": "11 − 4 = 7 (кг). Это первое действие в задаче по двум разностям."}, {"q": "Как проверить ответ: шёлк — 4 200 тг, шерсть — 2 400 тг, а по условию разность 1 800 тг?", "a": "вычесть: 4 200 − 2 400 = 1 800", "w": ["сложить: 4 200 + 2 400 = 6 600", "разделить: 4 200 : 2 400"], "h": "В задаче известна разность, поэтому и проверяем вычитанием."}, {"q": "Вычисли: 1 800 : 3 = ?", "a": "600", "w": ["60", "6 000"], "h": "1 800 : 3 = 600, потому что 600 · 3 = 1 800."}, {"q": "Вычисли: 600 · 7 = ?", "a": "4 200", "w": ["420", "3 600"], "h": "600 · 7 = 4 200: 6 сотен · 7 = 42 сотни."}, {"q": "Вычисли: 12 − 7 = ?", "a": "5", "w": ["19", "4"], "h": "12 − 7 = 5. Так находят разность количеств."}]);
GENS.m4q2l20t = mkTF([{"q": "В задаче по двум разностям первым действием находят разность количеств.", "a": "Верно", "h": "Например, 7 − 4 = 3 (м)."}, {"q": "Если разность стоимости 1 800 тг, а разность количеств 3 м, то цена 1 м — 600 тг.", "a": "Верно", "h": "1 800 : 3 = 600 (тг)."}, {"q": "Чтобы найти цену, разность стоимости умножают на разность количеств.", "a": "Неверно", "h": "Неверно: разность стоимости делят на разность количеств."}, {"q": "Если шёлк стоит 4 200 тг, а шерсть — 2 400 тг, то шёлк дороже на 1 800 тг.", "a": "Верно", "h": "4 200 − 2 400 = 1 800."}, {"q": "Разность 11 и 4 равна 15.", "a": "Неверно", "h": "Неверно: 11 − 4 = 7. 15 получится при сложении."}, {"q": "В задаче по двум разностям три связанные величины.", "a": "Верно", "h": "Например, цена, количество и стоимость."}, {"q": "Задача по двум разностям отличается тем, что в ней дана сумма двух значений.", "a": "Неверно", "h": "Неверно: в ней дана разность двух значений одной величины."}, {"q": "Цена одинаковая. Одно количество больше другого на 3 м, разность стоимости 1 800 тг. Тогда 7 м стоят 4 200 тг.", "a": "Верно", "h": "600 · 7 = 4 200 (тг)."}, {"q": "У комнат одинаковая ширина 4 м, длины 7 м и 5 м. Разность площадей 6 м².", "a": "Неверно", "h": "Неверно: 28 − 20 = 8 м²."}, {"q": "Чтобы найти искомую величину, надо сначала узнать разность двух других известных величин.", "a": "Верно", "h": "Так устроено решение задач по двум разностям."}, {"q": "Если бригады работают с одной производительностью, то та, что работала больше дней, сделала больше работы.", "a": "Верно", "h": "При одной производительности работа растёт вместе со временем."}, {"q": "Задача по двум разностям решается одним действием.", "a": "Неверно", "h": "Неверно: нужно найти разность, потом значение на единицу, потом значение каждого."}]);
GENS.m4q2l21q = mkQuiz([{"q": "Айдос купил 9 тетрадей, а Дана — 5 таких же. Айдос заплатил на 160 тг больше. Сколько стоит одна тетрадь?", "a": "40 тг", "w": ["160 тг", "360 тг"], "h": "9 − 5 = 4 (тетради) — на столько больше купил Айдос. 160 : 4 = 40 (тг) — цена одной тетради."}, {"q": "В магазине в Таразе продали 14 м ситца и 9 м такого же ситца. За первый кусок заплатили на 1 500 тг больше. Сколько стоит первый кусок?", "a": "4 200 тг", "w": ["2 700 тг", "1 500 тг"], "h": "14 − 9 = 5 (м). 1 500 : 5 = 300 (тг) — цена 1 м. 14 · 300 = 4 200 (тг)."}, {"q": "Сауле купила 3 пачки чая, а Берик — 8 таких же пачек. Берик заплатил на 1 250 тг больше. Сколько заплатила Сауле?", "a": "750 тг", "w": ["2 000 тг", "1 250 тг"], "h": "8 − 3 = 5 (пачек). 1 250 : 5 = 250 (тг) — цена пачки. 3 · 250 = 750 (тг)."}, {"q": "На фабрике сшили 180 брюк и 120 курток. Расход ткани на каждое изделие одинаковый. На брюки ушло на 120 м больше, чем на куртки. Сколько метров ткани уходит на одно изделие?", "a": "2 м", "w": ["120 м", "60 м"], "h": "180 − 120 = 60 (изделий). 120 : 60 = 2 (м) — расход на одно изделие."}, {"q": "Расход ткани на одно изделие 2 м. Брюк сшили 180, курток — 120. Сколько метров ткани ушло на куртки?", "a": "240 м", "w": ["360 м", "120 м"], "h": "120 · 2 = 240 (м)."}, {"q": "Для мальчиков сшили костюмы из 560 м ткани, а для девочек — из 440 м. Расход ткани на костюм одинаковый. Костюмов для мальчиков на 30 больше. Сколько метров ткани уходит на один костюм?", "a": "4 м", "w": ["120 м", "6 м"], "h": "560 − 440 = 120 (м) — на столько больше ткани ушло на костюмы для мальчиков. 120 : 30 = 4 (м) на один костюм."}, {"q": "Один костюм требует 4 м ткани. Для мальчиков ушло 560 м, для девочек — 440 м. Сколько костюмов сшили для девочек?", "a": "110", "w": ["140", "30"], "h": "440 : 4 = 110 (костюмов)."}, {"q": "На стройке в Актау привезли 5 400 кирпичей на первую машину и 3 600 на вторую. Кирпичи на каждом поддоне одинаковы. На первой машине поддонов на 6 больше. Сколько кирпичей на одном поддоне?", "a": "300", "w": ["1 800", "18"], "h": "5 400 − 3 600 = 1 800 (кирпичей) — разность. 1 800 : 6 = 300 (кирпичей) на одном поддоне."}, {"q": "Первая бригада работала 9 ч, а вторая — 5 ч. Они работают с одинаковой производительностью. Первая бригада сделала на 192 детали больше. Сколько деталей в час делает бригада?", "a": "48 дет.", "w": ["192 дет.", "432 дет."], "h": "9 − 5 = 4 (ч). 192 : 4 = 48 (деталей в час)."}, {"q": "Два комбайна в степи под Костанаем убирали пшеницу с одинаковой производительностью. Первый работал 14 ч, второй — 6 ч. Первый убрал на 120 га больше. Сколько гектаров убрал второй?", "a": "90 га", "w": ["210 га", "15 га"], "h": "14 − 6 = 8 (ч). 120 : 8 = 15 (га в час). 6 · 15 = 90 (га)."}, {"q": "Какое действие надо выполнить первым в задаче «по двум разностям»?", "a": "найти разность двух известных значений одной величины", "w": ["сложить все числа из условия", "умножить два первых числа"], "h": "Сначала находим разность значений одной величины, чтобы потом узнать, чему равна другая величина на одну штуку."}, {"q": "Как найти цену одной вещи, если известно, на сколько штук больше купили и на сколько тенге больше заплатили?", "a": "разность стоимости разделить на разность количества", "w": ["разность количества разделить на разность стоимости", "разность стоимости умножить на разность количества"], "h": "Цена — это стоимость одной штуки. Поэтому разность стоимости делим на разность количества."}, {"q": "Из условия: брюк 180 шт., курток 120 шт. Какой вопрос задают первым?", "a": "На сколько изделий больше сшили брюк?", "w": ["Сколько всего изделий сшили?", "Во сколько раз курток меньше?"], "h": "180 − 120 = 60. Это первая разность, она нужна, чтобы найти расход ткани на одно изделие."}, {"q": "Как проверить решение: цена 40 тг, купили 9 и 5 тетрадей, разность стоимости 160 тг?", "a": "(9 − 5) · 40 = 160", "w": ["(9 + 5) · 40 = 160", "9 · 5 = 160"], "h": "4 · 40 = 160. Разность стоимости совпадает с условием."}, {"q": "Один сорт лука купили в двух корзинах: 11 кг и 4 кг. Первая корзина стоила на 840 тг больше. Сколько стоит 1 кг лука?", "a": "120 тг", "w": ["840 тг", "1 320 тг"], "h": "11 − 4 = 7 (кг). 840 : 7 = 120 (тг) за 1 кг."}]);
GENS.m4q2l21t = mkTF([{"q": "В задачах по двум разностям известна разность значений одной величины.", "a": "Верно", "h": "Например, на сколько тенге больше заплатили или на сколько метров больше ткани ушло."}, {"q": "Чтобы найти цену, надо разность стоимости разделить на разность количества.", "a": "Верно", "h": "160 : 4 = 40 (тг) — цена."}, {"q": "Если купили 9 и 5 тетрадей, то разность количества равна 14.", "a": "Неверно", "h": "9 − 5 = 4. Разность находят вычитанием, а не сложением."}, {"q": "Если за 6 кг заплатили на 240 тг больше, чем за 2 кг, то цена 1 кг равна 60 тг.", "a": "Верно", "h": "6 − 2 = 4 (кг), 240 : 4 = 60 (тг)."}, {"q": "Расход ткани на одно изделие находят делением разности расходов на разность количества изделий.", "a": "Верно", "h": "120 м : 60 изделий = 2 м на изделие."}, {"q": "Разность стоимости можно делить на сумму количества.", "a": "Неверно", "h": "Делить надо на разность количества, а не на сумму."}, {"q": "Если на одно изделие уходит 2 м, то на 120 изделий уйдёт 240 м.", "a": "Верно", "h": "120 · 2 = 240 (м)."}, {"q": "Задачи по двум разностям можно проверить, найдя разность стоимости заново.", "a": "Верно", "h": "Подставь найденную цену: (9 − 5) · 40 = 160."}, {"q": "Если разность стоимости 1 500 тг, а разность количества 5 м, то 1 м стоит 7 500 тг.", "a": "Неверно", "h": "Неверно: 1 500 : 5 = 300 (тг)."}, {"q": "Если за 8 ч сделали на 192 детали больше, чем за 4 ч, то в час делают 48 деталей.", "a": "Верно", "h": "Разность времени 8 − 4 = 4 (ч). 192 : 4 = 48."}, {"q": "Если число изделий неизвестно, но дана разность расходов и разность изделий, найти расход на одно изделие нельзя.", "a": "Неверно", "h": "Расход на одно изделие = разность расходов : разность изделий."}, {"q": "Цена не может быть равна нулю тенге, если за разность количества заплатили разность стоимости.", "a": "Верно", "h": "Если разность стоимости больше нуля, то и цена больше нуля."}]);
GENS.m4q2l22q = mkQuiz([{"q": "Из двух посёлков навстречу друг другу выехали два велосипедиста: Арман со скоростью 14 км/ч и Света со скоростью 12 км/ч. С какой скоростью они сближаются?", "a": "26 км/ч", "w": ["2 км/ч", "52 км/ч"], "h": "Скорость сближения равна сумме скоростей: 14 + 12 = 26 (км/ч)."}, {"q": "Грузовик едет из Караганды со скоростью 60 км/ч, а навстречу ему из Астаны едет легковая машина со скоростью 40 км/ч. Чему равна скорость сближения?", "a": "100 км/ч", "w": ["20 км/ч", "400 км/ч"], "h": "60 + 40 = 100 (км/ч)."}, {"q": "Расстояние между двумя городами 400 км. Из них одновременно навстречу друг другу выехали две машины со скоростями 60 км/ч и 40 км/ч. Через сколько часов они встретятся?", "a": "4 ч", "w": ["8 ч", "6 ч"], "h": "60 + 40 = 100 (км/ч) — скорость сближения. 400 : 100 = 4 (ч)."}, {"q": "Два поезда вышли навстречу друг другу из станций, расстояние между которыми 420 км. Скорости поездов 75 км/ч и 65 км/ч. Через сколько часов они встретятся?", "a": "3 ч", "w": ["6 ч", "5 ч"], "h": "75 + 65 = 140 (км/ч). 420 : 140 = 3 (ч)."}, {"q": "Арман едет со скоростью 14 км/ч, Света — 12 км/ч. Они выехали навстречу друг другу и встретились через 2 ч. Какое расстояние между посёлками?", "a": "52 км", "w": ["28 км", "26 км"], "h": "Скорость сближения 14 + 12 = 26 (км/ч). 26 · 2 = 52 (км)."}, {"q": "Два автобуса одновременно выехали из Шымкента и Туркестана навстречу друг другу. Скорости 90 км/ч и 80 км/ч. Встретились через 5 ч. Чему равно расстояние между городами?", "a": "850 км", "w": ["450 км", "950 км"], "h": "90 + 80 = 170 (км/ч). 170 · 5 = 850 (км)."}, {"q": "Две машины выехали навстречу друг другу и встретились через 2 ч. Первая ехала со скоростью 60 км/ч. Расстояние между пунктами 200 км. Какова скорость второй машины?", "a": "40 км/ч", "w": ["100 км/ч", "140 км/ч"], "h": "200 : 2 = 100 (км/ч) — скорость сближения. 100 − 60 = 40 (км/ч)."}, {"q": "Мотоциклист и велосипедист выехали навстречу друг другу из двух сёл и встретились через 3 ч. Мотоц
