йди значение выражения c · (a − b) при a = 4, b = 3 и c = 6.", "a": "6", "w": ["21", "7", "8"], "h": "c · (a − b) = 6 · (4 − 3) = 6 · 1 = 6"}, {"q": "Найди x. 5 · x + 28 = 58", "a": "6", "w": ["30", "17", "5"], "h": "5 · x + 28 = 58 5 · x = 58 − 28 = 30 x = 30 : 5 = 6"}, {"q": "Найди значение выражения. 4 + 12 · 3 : 3 + 4 · 7", "a": "44", "w": ["54", "34", "46"], "h": "Сначала действия в скобках, потом умножение и деление слева направо, в конце сложение и вычитание. Ответ: 4 + 12 · 3 : 3 + 4 · 7 = 44"}, {"q": "Найди x. 26 · x + 42 = 188 : 2", "a": "2", "w": ["3", "1", "94"], "h": "Правая часть: 188 : 2 = 94 26 · x = 94 − 42 = 52 x = 52 : 26 = 2"}, {"q": "Найди x. (x + 18) · 9 = 270", "a": "12", "w": ["30", "243", "10"], "h": "(x + 18) · 9 = 270 x + 18 = 270 : 9 = 30 x = 30 − 18 = 12"}, {"q": "Найди x. 28 + 21 : x = 31", "a": "7", "w": ["3", "6", "9"], "h": "28 + 21 : x = 31 21 : x = 31 − 28 = 3 Неизвестный делитель = делимое : частное: x = 21 : 3 = 7"}, {"q": "Найди x. 19 + 16 : x = 21", "a": "8", "w": ["2", "9", "6"], "h": "19 + 16 : x = 21 16 : x = 21 − 19 = 2 Неизвестный делитель = делимое : частное: x = 16 : 2 = 8"}, {"q": "Найди значение выражения. 7 · 9 − 12 − (10 + 8)", "a": "33", "w": ["43", "23", "34"], "h": "Сначала действия в скобках, потом умножение и деление слева направо, в конце сложение и вычитание. Ответ: 7 · 9 − 12 − (10 + 8) = 33"}, {"q": "Упрости выражение. 7a − 6a", "a": "1a", "w": ["2a", "4a", "3a"], "h": "Слагаемые с одной и той же буквой можно соединить: считаем числа при букве, букву оставляем. 7a − 6a = (7 − 6) · a = 1a"}]);
GENS.m417q = mkQuiz([{"q": "На складе было 610 кг картофеля. В первый день отпустили 220 кг, во второй — 80 кг. Сколько килограммов осталось?", "a": "310", "w": ["390", "910", "320"], "h": "Отпустили всего: 220 + 80 = 300 кг Осталось: 610 − 300 = 310 кг"}, {"q": "Купили 2 тетради по 250 тенге и 7 ручек по 150 тенге. Сколько тенге стоит вся покупка?", "a": "1 550", "w": ["650", "2 250", "1 540"], "h": "Тетради: 2 · 250 = 500 тг Ручки: 7 · 150 = 1 050 тг Всё вместе: 500 + 1 050 = 1 550 тг"}, {"q": "Мастер работает 9 часов в день и получает 450 тенге за час. Сколько тенге он заработает за 6 дней?", "a": "24 300", "w": ["4 050", "2 700", "24 750"], "h": "За день: 9 · 450 = 4 050 тг За 6 дней: 4 050 · 6 = 24 300 тг"}, {"q": "В первой корзине 65 яблок, во второй на 13 яблок больше, а в третьей на 3 яблока меньше, чем во второй. Сколько яблок в трёх корзинах?", "a": "218", "w": ["143", "221", "217"], "h": "Во второй: 65 + 13 = 78 В третьей: 78 − 3 = 75 Всего: 65 + 78 + 75 = 218"}, {"q": "В первой корзине 32 яблока, во второй на 8 яблок больше, а в третьей на 3 яблока меньше, чем во второй. Сколько яблок в трёх корзинах?", "a": "109", "w": ["72", "112", "99"], "h": "Во второй: 32 + 8 = 40 В третьей: 40 − 3 = 37 Всего: 32 + 40 + 37 = 109"}, {"q": "В первой корзине 43 яблока, во второй на 11 яблок больше, а в третьей на 3 яблока меньше, чем во второй. Сколько яблок в трёх корзинах?", "a": "148", "w": ["97", "151", "149"], "h": "Во второй: 43 + 11 = 54 В третьей: 54 − 3 = 51 Всего: 43 + 54 + 51 = 148"}, {"q": "В первой корзине 79 яблок, во второй на 16 яблок больше, а в третьей на 3 яблока меньше, чем во второй. Сколько яблок в трёх корзинах?", "a": "266", "w": ["174", "269", "267"], "h": "Во второй: 79 + 16 = 95 В третьей: 95 − 3 = 92 Всего: 79 + 95 + 92 = 266"}, {"q": "В первой корзине 87 яблок, во второй на 12 яблок больше, а в третьей на 3 яблока меньше, чем во второй. Сколько яблок в трёх корзинах?", "a": "282", "w": ["186", "285", "292"], "h": "Во второй: 87 + 12 = 99 В третьей: 99 − 3 = 96 Всего: 87 + 99 + 96 = 282"}, {"q": "На складе было 530 кг картофеля. В первый день отпустили 200 кг, во второй — 120 кг. Сколько килограммов осталось?", "a": "210", "w": ["330", "850", "220"], "h": "Отпустили всего: 200 + 120 = 320 кг Осталось: 530 − 320 = 210 кг"}, {"q": "На складе было 840 кг картофеля. В первый день отпустили 250 кг, во второй — 130 кг. Сколько килограммов осталось?", "a": "460", "w": ["590", "1 220", "470"], "h": "Отпустили всего: 250 + 130 = 380 кг Осталось: 840 − 380 = 460 кг"}, {"q": "Бассейн имеет форму прямоугольного параллелепипеда: длина 11 м, ширина 9 м, глубина 2 м. Дно нужно покрыть плиткой. Найди площадь дна.", "a": "99 м²", "w": ["22 м²", "18 м²", "198 м²"], "h": "Дно — прямоугольник: длина и ширина. 11 · 9 = 99 м²"}, {"q": "Объём прямоугольного параллелепипеда 384 см³, длина 8 см, ширина 6 см. Найди высоту.", "a": "8 см", "w": ["48 см", "64 см", "6 см"], "h": "Площадь основания: 8 · 6 = 48 см² Высота: 384 : 48 = 8 см"}, {"q": "Бассейн имеет форму прямоугольного параллелепипеда: длина 5 м, ширина 8 м, глубина 3 м. Дно нужно покрыть плиткой. Найди площадь дна.", "a": "40 м²", "w": ["15 м²", "24 м²", "120 м²"], "h": "Дно — прямоугольник: длина и ширина. 5 · 8 = 40 м²"}, {"q": "Длина ящика 2 дм, ширина 10 дм, высота 9 дм. Найди объём ящика.", "a": "180 дм³", "w": ["21 дм³", "20 дм³", "256 дм³"], "h": "V = a · b · c = 2 · 10 · 9 = 180 дм³"}, {"q": "Автобус ехал 2 часа со скоростью 90 км/ч, а потом 2 часа с той же скоростью. Сколько километров он проехал? Выбери выражение для решения задачи.", "a": "90 · 2 + 90 · 2", "w": ["90 · 2 · 2", "90 + 2 + 2", "(90 + 90) · (2 + 2)"], "h": "Путь равен скорости, умноженной на время. За первые часы 90 · 2, за вторые — 90 · 2. Складываем."}, {"q": "Бассейн имеет форму прямоугольного параллелепипеда: длина 9 м, ширина 7 м, глубина 4 м. Дно нужно покрыть плиткой. Найди площадь дна.", "a": "63 м²", "w": ["36 м²", "28 м²", "252 м²"], "h": "Дно — прямоугольник: длина и ширина. 9 · 7 = 6       Q("m418s1", "infoTap", "Знакомимся с темой", "Треугольники бывают разными. Нажимай на карточки.", {"need": 5, "items": [{"k": "по сторонам", "v": "", "t": "Равносторонний — все стороны равны. Равнобедренный — две равны. Разносторонний — все разные."}, {"k": "по углам", "v": "", "t": "Остроугольный — все углы острые, прямоугольный — есть прямой угол, тупоугольный — есть тупой."}, {"k": "сумма углов", "v": "", "t": "Сумма углов треугольника равна 180°."}, {"k": "симметрия", "v": "", "t": "Ось симметрии делит фигуру на две одинаковые части."}, {"k": "площадь комбинированной фигуры", "v": "", "t": "Комбинированную фигуру разбиваем на простые, находим их площади и складываем."}, {"k": "развёртки", "v": "", "t": "Развёртка цилиндра — прямоугольник и два круга, конуса — круг и часть круга, пирамиды — основание и треугольники, куба — шесть квадратов."}, {"k": "равнобедренный", "v": "", "t": "В равнобедренном треугольнике две стороны равны, а два угла при основании тоже равны. Сумма углов треугольника всё равно 180°."}]}),
      Q("m418s2", "quiz", "Проверяем себя", "Проверим, что ты запомнил. Выбери верный ответ.", {"count": 6, "gens": ["m418q"]})
    ] },
  { id: "m4fin", icon: '', title: 'Итоговый урок', goal: 'Повторить главное из курса',
    steps: [
      Q("m4fin1", 'finale', 'Курс пройден!', "Поздравляю! Ты прошёл курс математики четвёртого класса. Закрепляй знания в играх!", {})
    ] }
];

/* ================= движок ================= */
const S = { li: 0, si: 0, mist: 0, token: 0, passed: {} };
let P = loadP();
function view(name){ ['map', 'lesson', 'end'].forEach(v => { $('#ac-v-' + v).style.display = v === name ? '' : 'none'; }); window.scrollTo(0, 0); }
const starsTxt = n => '★'.repeat(n) + '☆'.repeat(3 - n);

function renderMap(){
  let done = 0, h = '';
  LESSONS.forEach(function(L, i){
    const st = P[L.id] || 0; if (st) done++;
    h += '<div class="ac-lcard' + (st ? ' ac-done' : '') + '"><div class="ac-lnum">Урок ' + (i + 1) + '</div><div class="ac-licon">' + L.icon + '</div><div class="ac-ltitle">' + L.title + '</div><div class="ac-lgoal">' + L.goal + '</div><div class="ac-lstars" style="color:#F5B400">' + (st ? starsTxt(st) : '') + '</div><button class="ac-btn' + (st ? ' ac-alt' : ' ac-go') + '" data-i="' + i + '">' + (st ? 'Пройти снова' : 'Начать') + '</button></div>';
  });
  $('#ac-map').innerHTML = h;
  $('#ac-pfill').style.width = (done * 100 / LESSONS.length) + '%';
  $('#ac-ptxt').textContent = done + ' из ' + LESSONS.length;
  $$('#ac-map .ac-btn').forEach(b => b.onclick = () => openLesson(+b.dataset.i));
}
function openLesson(i){ S.li = i; S.si = 0; S.mist = 0; S.passed = {}; view('lesson'); renderStep(); }
function renderDots(){
  const L = LESSONS[S.li]; let h = '';
  L.steps.forEach((s, k) => { h += '<span class="ac-sdot' + (S.passed[k] ? ' ac-sd-done' : '') + (k === S.si ? ' ac-sd-cur' : '') + '"></span>'; });
  $('#ac-dots').innerHTML = h;
}
function renderStep(){
  stopSpeak();
  const L = LESSONS[S.li], st = L.steps[S.si], tok = ++S.token, stage = $('#ac-stage');
  const gated = !!st.gate && !S.passed[S.si];
  $('#ac-stepno').textContent = 'Шаг ' + (S.si + 1) + ' из ' + L.steps.length;
  $('#ac-lessonname').textContent = 'Урок ' + (S.li + 1) + ': ' + L.title;
  $('#ac-title').textContent = st.title;
  $('#ac-bubble').innerHTML = st.text;
  stage.innerHTML = ''; $('#ac-fb').textContent = ''; $('#ac-fb').className = 'ac-fb';
  const next = $('#ac-next'), prev = $('#ac-prev');
  next.disabled = gated; next.classList.remove('ac-pulse');
  if (BS){ BS.base(gated ? 'think' : 'idle'); if (S.si === 0) BS.react('wave', 2400); }
  next.textContent = S.si === L.steps.length - 1 ? 'Завершить урок ✓' : 'Дальше →';
  prev.disabled = S.si === 0;
  const ctx = {
    alive: () => tok === S.token,
    done: () => { if (tok !== S.token) return; S.passed[S.si] = true; next.disabled = false; if (BS) BS.base('idle'); if (!S.passed['_p' + S.si]){ S.passed['_p' + S.si] = 1; next.classList.add('ac-pulse'); } renderDots(); },
    miss: () => { S.mist++; },
    fb: (t, kind) => { if (kind === 'ok') bsReact('happy', 1500); else if (kind === 'bad') bsReact('oops', 1600); const f = $('#ac-fb'); f.textContent = t; f.className = 'ac-fb ' + (kind === 'ok' ? 'ac-ok' : kind === 'bad' ? 'ac-bad' : 'ac-info'); }
  };
  renderDots();
  SCENES[st.scene](stage, st, ctx);
  if ($('#ac-auto').checked) speak(st.id, st.say || st.text);
}
/* ===== награды: звёзды сайта, наклейка за курс, журнал занятий ===== */
function courseReward(L, oldStars, newStars){
  try {
    const slug = KEY.replace(/^bilim_/, '').replace(/_v\d+$/, '');
    const gain = Math.max(0, newStars - oldStars) * 3;
    if (gain > 0 && window.recordGameResult) recordGameResult('course_' + slug + '_' + L.id, gain, 9); /* внутри уже пишется журнал занятий */
    else if (window.logActivity) logActivity();
    if (LESSONS.every(x => (P[x.id] || 0) > 0)){
      let al = {}; try { al = JSON.parse(localStorage.getItem('bilim_stickers_v1')) || {}; } catch(e){}
      if (!al[slug]){
        al[slug] = Date.now(); try { localStorage.setItem('bilim_stickers_v1', JSON.stringify(al)); } catch(e){}
        const name = document.title.replace(/^Курс:\s*/, '').replace(/\s*—.*$/, '');
        if (window.showCelebrationQueue) showCelebrationQueue([{ type: 'achievement', icon: '🏅', titleKey: 'Курс «' + name + '» пройден! Наклейка добавлена в альбом.' }]);
      }
    }
  } catch(e){}
}
function finishLesson(){
  const L = LESSONS[S.li];
  const stars = S.mist <= 1 ? 3 : S.mist <= 4 ? 2 : 1;
  const oldStars = P[L.id] || 0; P[L.id] = Math.max(oldStars, stars); saveP(P); courseReward(L, oldStars, stars);
  stopSpeak();
  $('#ac-endtitle').textContent = 'Урок «' + L.title + '» пройден!';
  let h = ''; for (let k = 0; k < 3; k++) h += '<span style="animation-delay:' + (k * 250) + 'ms;color:' + (k < stars ? '#F5B400' : '#D5DCE4') + '">★</span>';
  $('#ac-endstars').innerHTML = h;
  $('#ac-endtext').textContent = S.mist === 0 ? 'Без единой ошибки — великолепно!' : S.mist <= 4 ? 'Ошибок: ' + S.mist + '. Хороший результат!' : 'Ошибок: ' + S.mist + '. Можно пройти урок ещё раз и улучшить результат.';
  $('#ac-endnext').style.display = S.li < LESSONS.length - 1 ? '' : 'none';
  if (BS) BS.talk(false);
  if (!BSE && window.Barsik) BSE = Barsik.mount($('#ac-endbs'));
  if (BSE) BSE.set(stars >= 2 ? 'cheer' : 'happy');
  view('end');
}
$('#ac-next').onclick = function(){
  const L = LESSONS[S.li];
  if (S.si < L.steps.length - 1){ S.si++; renderStep(); window.scrollTo(0, 0); } else finishLesson();
};
$('#ac-prev').onclick = function(){ if (S.si > 0){ S.si--; renderStep(); } };
$('#ac-tomap').onclick = function(){ stopSpeak(); if (BS) BS.base('idle'); S.token++; renderMap(); view('map'); };
$('#ac-endmap').onclick = function(){ renderMap(); view('map'); };
$('#ac-endnext').onclick = function(){ openLesson(S.li + 1); };
$('#ac-speak').onclick = function(){
  if (this.classList.contains('ac-on')){ stopSpeak(); return; }
  const st = LESSONS[S.li].steps[S.si]; speak(st.id, st.say || st.text);
};
$('#ac-auto').checked = loadAuto();
$('#ac-auto').onchange = function(){ saveAuto(this.checked); if (this.checked){ const st = LESSONS[S.li].steps[S.si]; speak(st.id, st.say || st.text); } else stopSpeak(); };
if (window.speechSynthesis){ speechSynthesis.onvoiceschanged = function(){}; speechSynthesis.getVoices(); }

window.__ac = { open: function(l, s){ S.li = l; S.si = s || 0; S.mist = 0; S.passed = {}; view('lesson'); renderStep(); }, LESSONS: LESSONS, GENS: GENS }; // для проверки
renderMap();
})();
</script>
