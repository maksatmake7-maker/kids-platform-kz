<!DOCTYPE html>
<html lang="ru">
<head>
<script src="../../../assets/media-base.js"></script>
<meta name="robots" content="noindex, nofollow">
<script src="../../../assets/stats.js" defer></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Курс: Математика 4 класс — Білім Аралы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../assets/styles.css">
<link rel="stylesheet" href="../../../assets/world.css">
<link rel="stylesheet" href="../../../assets/subject.css">
<style>
  /* Стили только для этого курса (префикс ac-) — остальной сайт не затрагивают */
  .ac-shell{position:relative;z-index:2;max-width:880px;margin:0 auto;padding:10px 16px 80px;}
  .ac-back{display:inline-block;color:#fff;font-weight:800;text-decoration:none;opacity:1;background:rgba(29,53,87,.6);border:none;font-size:.95rem;cursor:pointer;font-family:'Nunito',sans-serif;padding:7px 16px;border-radius:999px;}
  .ac-back:hover{opacity:1;}
  .ac-card{background:#fff;border-radius:28px;padding:26px 22px 22px;box-shadow:0 12px 0 rgba(29,53,87,.08),0 18px 34px rgba(29,53,87,.12);}
  .ac-card h1,.ac-card h2{font-family:'Baloo 2',sans-serif;color:#1D3557;text-align:center;}
  .ac-sub{text-align:center;color:#5C7690;font-weight:700;margin:4px 0 8px;}
  .ac-note{text-align:center;font-size:.8rem;color:#8B95A3;margin-bottom:16px;}

  /* ----- карта курса ----- */
  .ac-progress{display:flex;align-items:center;gap:12px;max-width:520px;margin:12px auto 22px;}
  .ac-progress-bar{flex:1;height:14px;background:#E5EAF0;border-radius:999px;overflow:hidden;}
  .ac-progress-fill{height:100%;background:linear-gradient(90deg,#FFC93C,#FF9F1C);border-radius:999px;transition:width .5s ease;}
  .ac-progress-txt{font-family:'Baloo 2',sans-serif;font-weight:800;color:#1D3557;white-space:nowrap;}
  .ac-map{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;}
  .ac-lcard{border:2px solid #E1E8EF;border-radius:20px;padding:16px;text-align:left;background:#FAFCFE;display:flex;flex-direction:column;gap:6px;}
  .ac-lcard.ac-done{border-color:#3FAE5A;background:#F3FBF4;}
  .ac-lnum{font-size:.78rem;font-weight:800;color:#8B95A3;text-transform:uppercase;letter-spacing:.04em;}
  .ac-licon{font-size:2.2rem;line-height:1;}
  .ac-ltitle{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:1.2rem;color:#1D3557;line-height:1.15;}
  .ac-lgoal{font-size:.9rem;color:#5C6B7A;flex:1;}
  .ac-lstars{font-size:1.1rem;letter-spacing:2px;min-height:1.4em;}
  .ac-btn{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:1rem;background:#1D3557;color:#fff;border:none;border-radius:999px;padding:11px 24px;cursor:pointer;transition:transform .15s ease,background .2s ease;}
  .ac-btn:hover:not(:disabled){transform:translateY(-1px);background:#27487a;}
  .ac-btn:disabled{opacity:.4;cursor:default;}
  .ac-btn.ac-alt{background:#fff;color:#1D3557;border:2px solid #1D3557;}
  .ac-btn.ac-go{background:#3FB088;}
  .ac-btn.ac-go:hover:not(:disabled){background:#35a07a;}
  .ac-btn.ac-pulse{animation:acPulse 1.2s ease-in-out infinite;}
  @keyframes acPulse{0%,100%{box-shadow:0 0 0 0 rgba(63,176,136,.5);}50%{box-shadow:0 0 0 10px rgba(63,176,136,0);}}

  /* ----- урок ----- */
  .ac-topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
  .ac-dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;background:rgba(29,53,87,.6);padding:7px 12px;border-radius:999px;}
  .ac-sdot{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.4);border:2px solid transparent;}
  .ac-sdot.ac-sd-done{background:#FFC93C;}
  .ac-sdot.ac-sd-cur{background:#fff;border-color:#FFC93C;transform:scale(1.25);}
  .ac-stephead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;}
  .ac-stepno{font-size:.8rem;font-weight:800;color:#8B95A3;white-space:nowrap;}
  .ac-guide{display:flex;gap:12px;align-items:flex-start;margin:10px 0 8px;}
  .ac-mascot{width:104px;flex:none;}
  @keyframes acBob{0%,100%{transform:translateY(0);}50%{transform:translateY(-4px);}}
  .ac-bubble{position:relative;background:#EEF6FF;border-radius:18px;padding:12px 16px;font-size:1.02rem;line-height:1.5;color:#1D3557;text-align:left;flex:1;}
  .ac-bubble::before{content:'';position:absolute;left:-8px;top:18px;border:8px solid transparent;border-right-color:#EEF6FF;border-left:0;}
  .ac-bubble b{color:#E8453C;}
  .ac-speakrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0 10px;padding-left:4px;}
  .ac-speak{display:inline-flex;align-items:center;gap:6px;background:#fff;border:2px solid #1D3557;color:#1D3557;font-family:'Baloo 2',sans-serif;font-weight:700;padding:6px 14px;border-radius:999px;cursor:pointer;font-size:.9rem;}
  .ac-speak:hover{background:#1D3557;color:#fff;}
  .ac-speak.ac-on{background:#F4847A;border-color:#F4847A;color:#fff;}
  .ac-auto{font-size:.85rem;color:#5C7690;display:inline-flex;align-items:center;gap:6px;cursor:pointer;}
  .ac-stage{margin:8px 0 6px;min-height:80px;}
  .ac-fb{text-align:center;font-family:'Baloo 2',sans-serif;font-weight:800;min-height:1.7em;margin:8px 0;font-size:1.05rem;}
  .ac-fb.ac-ok{color:#1D6B2E;} .ac-fb.ac-bad{color:#8C2A20;} .ac-fb.ac-info{color:#1D3557;}
  .ac-nav{display:flex;justify-content:space-between;gap:10px;margin-top:10px;}

  .ac-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0;}
  .ac-eq{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:2.4rem;color:#1D3557;text-align:center;margin:6px 0;min-height:1.3em;}
  .ac-eq .n1,.ac-red{color:#E8453C;} .ac-eq .n2,.ac-grn{color:#5B9A1E;} .ac-eq b{color:#1D3557;}
  .ac-bigeq{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:2.8rem;text-align:center;color:#1D3557;margin:10px 0 18px;}

  /* сцены */
  .ac-join{width:100%;height:auto;max-height:340px;display:block;}
  .ac-mv{transition:transform .9s cubic-bezier(.45,0,.2,1);}
  .ac-frame{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:340px;margin:8px auto;}
  .ac-cell{aspect-ratio:1;border-radius:14px;background:#EEF3F8;border:2px dashed #C9D5E2;transition:all .25s ease;}
  .ac-cell.a{background:radial-gradient(circle at 35% 30%,#FF9A8F,#E8453C);border:none;transform:scale(.92);}
  .ac-cell.b{background:radial-gradient(circle at 35% 30%,#FFE082,#F5B400);border:none;transform:scale(.92);}
  .ac-steprow{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin:10px 0;}
  .ac-stp{display:flex;align-items:center;gap:8px;font-family:'Baloo 2',sans-serif;font-weight:800;color:#1D3557;}
  .ac-stp button{width:40px;height:40px;border-radius:50%;border:2px solid #1D3557;background:#fff;color:#1D3557;font-size:1.4rem;font-weight:800;cursor:pointer;line-height:1;}
  .ac-stp button:hover:not(:disabled){background:#1D3557;color:#fff;} .ac-stp button:disabled{opacity:.35;cursor:default;}
  .ac-stp .v{min-width:30px;text-align:center;font-size:1.5rem;}
  .ac-goal{text-align:center;font-weight:800;font-size:1.1rem;margin:4px 0;}
  .ac-chips{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;margin:14px 0 6px;font-family:'Baloo 2',sans-serif;font-size:2.3rem;font-weight:800;}
  .ac-chip{border:3px solid #CBD6E2;border-radius:16px;background:#F5F8FA;min-width:62px;padding:2px 12px;cursor:pointer;color:#1D3557;font:inherit;transition:all .2s;}
  .ac-chip:hover{border-color:#1D3557;}
  .ac-chip.on.k0{background:#FFE3DF;border-color:#E8453C;} .ac-chip.on.k1{background:#FFF1C9;border-color:#F5B400;} .ac-chip.on.k2{background:#DFF5E1;border-color:#3FAE5A;}
  .ac-chipname{text-align:center;min-height:2.6em;font-weight:800;font-size:1.05rem;}
  .ac-op{color:#F2A03D;}
  .ac-nl{width:100%;height:auto;display:block;}
  .ac-nl text{font-family:'Baloo 2',sans-serif;font-weight:800;}
  .ac-nlnum circle{fill:#fff;stroke:#1D3557;stroke-width:2;transition:all .2s;}
  .ac-nlnum text{fill:#1D3557;font-size:16px;}
  .ac-nlnum.on circle{fill:#FFC93C;stroke:#E8A200;}
  .ac-nlnum.click{cursor:pointer;} .ac-nlnum.click:hover circle{fill:#EAF3FF;}
  .ac-nlnum.bad circle{fill:#FBE4E1;stroke:#E0574A;}
  .ac-nlnum.good circle{fill:#DFF5E1;stroke:#3FAE5A;}
  .ac-count{display:flex;justify-content:center;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:2.2rem;}
  .ac-pop{background:#FFF1C9;border:3px solid #F5B400;border-radius:14px;min-width:54px;text-align:center;padding:2px 10px;animation:acPopIn .45s ease;}
  .ac-big{background:#FFE3DF;border:3px solid #E8453C;border-radius:14px;min-width:54px;text-align:center;padding:2px 10px;}
  @keyframes acPopIn{0%{transform:scale(.2);opacity:0;}70%{transform:scale(1.2);}100%{transform:scale(1);opacity:1;}}
  .ac-house{max-width:420px;margin:6px auto 0;}
  .ac-roof{height:84px;background:linear-gradient(180deg,#FF8A7A,#E8453C);clip-path:polygon(50% 0,100% 100%,0 100%);display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;color:#fff;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:2.2rem;}
  .ac-hbody{display:grid;grid-template-columns:1fr 1fr;gap:12px;background:#FFE9B8;padding:14px;border-radius:0 0 18px 18px;}
  .ac-win{min-height:130px;background:#CDEBFF;border:5px solid #8B5E34;border-radius:10px;display:flex;flex-wrap:wrap;gap:6px;align-content:center;justify-content:center;padding:8px;}
  .ac-dot{width:26px;height:26px;border-radius:50%;animation:acPopIn .3s ease;}
  .ac-dot.l{background:radial-gradient(circle at 35% 30%,#FF9A8F,#E8453C);} .ac-dot.r{background:radial-gradient(circle at 35% 30%,#FFE082,#F5B400);}
  .ac-pairs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin:12px 0;}
  .ac-pair{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#F5F8FA;border-radius:12px;padding:6px 12px;font-family:'Baloo 2',sans-serif;font-weight:800;color:#1D3557;opacity:0;animation:acSlide .45s ease forwards;}
  .ac-pair .dots{display:flex;gap:3px;}
  .ac-pair .dots i{width:11px;height:11px;border-radius:50%;display:block;} .ac-pair .dots i.l{background:#E8453C;} .ac-pair .dots i.r{background:#F5B400;}
  @keyframes acSlide{0%{opacity:0;transform:translateX(-14px);}100%{opacity:1;transform:none;}}
  .ac-swap{position:relative;height:110px;margin:10px 0;}
  .ac-grp{position:absolute;top:0;width:41%;display:flex;flex-wrap:wrap;gap:4px;justify-content:center;align-content:center;height:100%;transition:left .9s cubic-bezier(.45,0,.2,1);}
  .ac-swap .ac-plus{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:'Baloo 2',sans-serif;font-weight:800;font-size:2.6rem;color:#F2A03D;}
  .ac-tabs{display:flex;gap:8px;justify-content:center;margin-bottom:12px;}
  .ac-tab{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:1.1rem;border:2px solid #1D3557;color:#1D3557;background:#fff;border-radius:999px;padding:6px 20px;cursor:pointer;}
  .ac-tab.on{background:#1D3557;color:#fff;}
  .ac-row{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin:10px 0;}
  .ac-tray{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;align-items:center;min-width:88px;min-height:56px;max-width:230px;padding:8px;border-radius:16px;background:#F5F8FA;}
  .ac-tray.empty{border:3px dashed #B8C4D2;background:#fff;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:1.8rem;color:#8B95A3;}
  .ac-sign{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:2.2rem;color:#F2A03D;}
  .ac-tbl{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;max-width:600px;margin:8px auto;}
  .ac-tc{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:8px;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:clamp(.7rem,2.7vw,1.1rem);border:none;padding:0;}
  .ac-th{background:#FFE9B8;color:#8A5A00;} .ac-th.rowh{background:#FFE3DF;color:#B8402F;} .ac-corner{background:transparent;color:#F2A03D;}
  .ac-void{background:#F1F4F7;}
  .ac-cellbtn{background:#F5F8FA;color:#1D3557;cursor:pointer;transition:all .15s;}
  .ac-cellbtn:hover{background:#DDEBFA;}
  .ac-cellbtn.rowhl{background:#FFE3DF;} .ac-cellbtn.colhl{background:#FFF1C9;} .ac-cellbtn.cur{background:#1D3557;color:#fff;transform:scale(1.1);} .ac-cellbtn.mirror{background:#3FB088;color:#fff;}
  .ac-cellbtn.found{background:#DFF5E1;color:#1D6B2E;box-shadow:inset 0 0 0 2px #3FAE5A;} .ac-cellbtn.flash{background:#FBE4E1;color:#8C2A20;}
  .ac-qcount{text-align:center;font-size:.85rem;font-weight:800;color:#8B95A3;margin-bottom:4px;}
  .ac-opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:420px;margin:0 auto;}
  .ac-opt{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:1.5rem;padding:14px 8px;border-radius:16px;border:2px solid #DCE3EA;background:#F5F8FA;color:#1D3557;cursor:pointer;transition:all .2s;}
  .ac-opt:hover:not(:disabled){border-color:#1D3557;} .ac-opt:disabled{cursor:default;}
  .ac-opt.ok{background:#DFF5E1;border-color:#3FAE5A;color:#1D6B2E;} .ac-opt.bad{background:#FBE4E1;border-color:#E0574A;color:#8C2A20;opacity:.8;}
  .ac-hint{background:#FFF8E1;border-left:5px solid #F5B400;border-radius:10px;padding:10px 14px;margin:14px auto 0;max-width:520px;text-align:left;font-size:.98rem;color:#5A4300;}
  .ac-qpics{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin:6px 0 14px;}
  .es-pick{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:6px 0 10px;}
  .es-pb{border:3px solid transparent;border-radius:16px;background:#F3F7FB;font-size:2.1rem;line-height:1;padding:8px 12px;cursor:pointer;transition:all .15s;font-family:inherit;color:#1D3557;}
  .es-pb:hover{background:#EAF3FF;transform:translateY(-2px);} .es-pb.cur{border-color:#F5B400;background:#FFF1C9;} .es-pb.seen{border-color:#3FAE5A;}
  .es-pb small{display:block;font:800 .78rem 'Baloo 2',sans-serif;margin-top:3px;}
  .es-card{display:flex;flex-direction:column;align-items:center;gap:6px;max-width:420px;margin:8px auto;padding:12px 18px;border-radius:22px;background:#F5F8FA;border:3px solid #DCE6F0;text-align:center;font:800 1.1rem/1.3 'Baloo 2',sans-serif;color:#1D3557;}
  .es-card .em{font-size:3.6rem;line-height:1.1;} .es-card .nm{font-size:1.35rem;} .es-card .tx{font-weight:700;font-size:1rem;color:#41566E;}
  .es-nb{border:3px solid #1D3557;border-radius:999px;background:#fff;color:#1D3557;font:800 1.05rem 'Baloo 2',sans-serif;padding:9px 18px;cursor:pointer;} .es-nb.seen{background:#DFF5E1;border-color:#3FAE5A;}
  .gm-task{max-width:460px;margin:0 auto 8px;} .gm-ti{font:800 .92rem/1.3 'Baloo 2',sans-serif;color:#1D3557;padding:6px 10px;border-radius:12px;background:#FFF1C9;border:2px solid #F5B400;} .gm-ti small{display:block;font-weight:700;font-size:.8rem;color:#41566E;margin-top:2px;} .gm-ti.ok{background:#E9F7EC;border-color:#3FAE5A;color:#2F8A47;}
  .gm-tb{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0;} .gm-col{width:34px;height:34px;border-radius:50%;border:3px solid #1D3557;cursor:pointer;} .gm-col.cur{outline:4px solid #F5B400;}
  .gm-canvas{display:block;width:100%;max-width:420px;margin:6px auto;background:#FFFDF4;border:3px solid #DCE6F0;border-radius:18px;touch-action:none;}
  .ac-qtxt{text-align:center;font-weight:800;font-size:1.15rem;margin:6px 0 12px;}
  .ac-finish{text-align:center;padding:10px 0;}
  .ac-stars{font-size:3.4rem;letter-spacing:6px;margin:8px 0;}
  .ac-stars span{display:inline-block;animation:acPopIn .6s ease both;}
  .ac-link{text-decoration:none;display:inline-block;}
  @media (max-width:520px){
    .ac-card{padding:20px 14px 18px;} .ac-eq{font-size:2rem;} .ac-bigeq{font-size:2.3rem;}
    .ac-mascot{width:78px;} .ac-bubble{font-size:.96rem;padding:10px 12px;}
    .ac-opt{font-size:1.3rem;} .ac-chips{font-size:1.9rem;}
  }
  @media (prefers-reduced-motion:reduce){.ac-btn.ac-pulse{animation:none;}.ac-mv,.ac-grp{transition:none;}}
  /* ----- курс «Числа и счёт» ----- */
  .nc-items{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:480px;margin:8px auto;}
  .nc-it{position:relative;background:#F5F8FA;border:2px solid #DCE3EA;border-radius:16px;padding:6px;cursor:pointer;transition:all .2s;line-height:0;}
  .nc-it:hover:not(:disabled){border-color:#1D3557;}
  .nc-it.counted{background:#FFF1C9;border-color:#F5B400;cursor:default;}
  .nc-badge{position:absolute;right:-6px;top:-8px;min-width:24px;height:24px;border-radius:12px;background:#E8453C;color:#fff;font:800 .95rem 'Baloo 2',sans-serif;line-height:24px;text-align:center;padding:0 5px;animation:acPopIn .35s ease;}
  .nc-chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:430px;margin:10px auto;}
  .nc-chip{min-width:52px;height:52px;border-radius:14px;border:3px solid #CBD6E2;background:#F5F8FA;color:#1D3557;font:800 1.6rem 'Baloo 2',sans-serif;cursor:pointer;transition:all .15s;}
  .nc-chip:hover{border-color:#1D3557;}
  .nc-chip.seen{background:#EEF6FF;border-color:#9DB9D8;}
  .nc-chip.cur{background:#FFC93C;border-color:#E8A200;transform:scale(1.1);}
  .nc-chip.prev{background:#FFE3DF;border-color:#E8453C;}
  .nc-chip.next{background:#DFF5E1;border-color:#3FAE5A;}
  .nc-show{text-align:center;min-height:130px;margin:6px 0;}
  .nc-show .big{font:800 3.6rem 'Baloo 2',sans-serif;color:#1D3557;line-height:1.1;}
  .nc-show .wd{font:800 1.4rem 'Baloo 2',sans-serif;color:#E8453C;}
  .nc-dots{display:grid;grid-template-columns:repeat(5,22px);gap:6px;justify-content:center;margin:8px auto;}
  .nc-dots i{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FF9A8F,#E8453C);display:block;animation:acPopIn .3s ease both;}
  .nc-dots i.y{background:radial-gradient(circle at 35% 30%,#FFE082,#F5B400);}
  .nc-seq{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;margin:10px 0 16px;}
  .nc-cell{display:inline-flex;align-items:center;justify-content:center;min-width:52px;height:52px;padding:0 6px;border-radius:14px;background:#F5F8FA;border:3px solid #CBD6E2;font:800 1.7rem 'Baloo 2',sans-serif;color:#1D3557;}
  .nc-cell.q{background:#FFF1C9;border-color:#F5B400;color:#E8A200;}
  .nc-cell.done{background:#DFF5E1;border-color:#3FAE5A;color:#1D6B2E;}
  .nc-cell.empty{background:#fff;border-style:dashed;color:#B8C4D2;}
  .nc-tiles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:12px 0;}
  .nc-tile{min-width:62px;height:62px;border-radius:16px;border:3px solid #1D3557;background:#fff;color:#1D3557;font:800 1.9rem 'Baloo 2',sans-serif;cursor:pointer;transition:all .15s;}
  .nc-tile:hover:not(:disabled){background:#EEF6FF;}
  .nc-tile:disabled{opacity:.25;cursor:default;}
  .nc-tile.bad{background:#FBE4E1;border-color:#E0574A;animation:ncShake .35s;}

function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
const sleep = ms => new Promise(r => setTimeout(r, ms));

function nums(correct, lo, hi){ // 4 варианта ответа
  const set = new Set([correct]);
  const near = shuffle([correct - 2, correct - 1, correct + 1, correct + 2, correct + 3, correct - 3]).filter(x => x >= lo && x <= hi);
  for (const x of near){ if (set.size >= 4) break; set.add(x); }
  let k = lo; while (set.size < 4 && k <= hi){ set.add(k++); }
  return shuffle(Array.from(set));

const MALE_RE = /pavel|dmitri|dmitry|dmitriy|yuri|yury|maxim|ivan|aleksandr|alexander|mikhail|boris|павел|дмитр|юри|максим|иван|александр|михаил|борис|male|мужск/i;
const FEMALE_RE = /milena|alena|katya|svetlana|dariya|daria|irina|tatyana|elena|anna|female|женск|милена|алён|алена|катя|светлан|дарь|ирин|татьян|елен|анна/i;
function bestVoice(){
  const vs = (window.speechSynthesis && speechSynthesis.getVoices()) || [];
  const ru = vs.filter(v => /^ru/i.test(v.lang));
  if (!ru.length) return null;
  /* Барсик — мальчик: сначала ищем мужской голос, женские опускаем вниз */
  const score = v => (MALE_RE.test(v.name) ? 20 : 0) - (FEMALE_RE.test(v.name) ? 8 : 0) + (/natural|online|neural/i.test(v.name) ? 4 : 0) + (v.localService ? 0 : 1);
  return ru.sort((a, b) => score(b) - score(a))[0];
}

    if (tok !== speakToken || !window.speechSynthesis) return end();

    u.lang = 'ru-RU'; u.rate = .92; u.pitch = 1;

    u.onend = end; u.onerror = end;

}

к по цепочке вправо (нули становятся девятками). 800 000 − 124 983 = 675 017"}, {"q": "Округли каждое число до сотен тысяч и найди приближённое значение разности. 854 481 − 127 624 ≈ ?", "a": "800 000", "w": ["900 000", "700 000", "1 000 000"], "h": "Округляем числа: 854 481 ≈ 900 000, 127 624 ≈ 100 000. 900 000 − 100 000 = 800 000. Прикидка помогает заметить грубую ошибку в вычислениях."}, {"q": "Как проверить вычитание?", "a": "сложением: разность + вычитаемое", "w": ["сложением: уменьшаемое + вычитаемое", "умножением на 2", "делением на вычитаемое"], "h": "Если разность прибавить к вычитаемому, получится уменьшаемое."}, {"q": "Вычисли устно, разложив числа на разрядные слагаемые. 304 000 − 20 700 = ?", "a": "283 300", "w": ["284 300", "282 300", "293 300"], "h": "Складываем и вычитаем по разрядам: сотни тысяч, десятки тысяч, тысячи, сотни. 304 000 − 20 700 = 283 300"}, {"q": "Вычти числа столбиком. Внимание: в уменьшаемом есть нули. 500 001 − 116 646 = ?", "a": "383 355", "w": ["416 645", "383 365", "383 455"], "h": "Нули не позволяют занять у соседнего разряда — занимаем у ближайшего ненулевого разряда слева: единица старшего разряда даёт 10 единиц следующего, и так по цепочке вправо (нули становятся девятками). 500 001 − 116 646 = 383 355"}, {"q": "Как называется число, которое вычитают?", "a": "вычитаемое", "w": ["уменьшаемое", "разность", "сумма"], "h": "Вычитаемое — так называют этот компонент вычитания."}, {"q": "Сложи числа столбиком. 223 747 + 150 498 = ?", "a": "374 245", "w": ["373 135", "374 255", "374 145"], "h": "Подписываем разряд под разрядом и складываем справа налево. Когда в разряде получается 10 и больше, переносим единицу в следующий разряд. 223 747 + 150 498 = 374 245"}, {"q": "Найди неизвестное число x. x − 44 116 = 65 133", "a": "109 249", "w": ["21 017", "110 249", "109 349"], "h": "Неизвестное уменьшаемое = разность + вычитаемое: 65 133 + 44 116 = 109 249"}, {"q": "Найди значение выражения, не вычисляя столбиком. 781 051 · 1 = ?", "a": "7 ается 0. 312 098 · 0 = 0"}, {"q": "Найди значение выражения, не вычисляя столбиком. 276 131 · 1 = ?", "a": "276 131", "w": ["0", "1", "2 761 310"], "h": "Если умножить число на 1, получится то же число. 276 131 · 1 = 276 131"}, {"q": "Вычисли устно: считаем тысячами. 48 000 + 47 000 = ?", "a": "95 000", "w": ["105 000", "85 000", "94 999"], "h": "48 тыс. + 47 тыс. = 95 тыс. 48 000 + 47 000 = 95 000"}, {"q": "Как называется число, из которого вычитают?", "a": "уменьшаемое", "w": ["вычитаемое", "разность", "слагаемое"], "h": "Уменьшаемое — так называют этот компонент вычитания."}, {"q": "Вычисли удобным способом: сначала складываем числа, которые дают круглое число. 20 250 + 32 000 + 2 750 = ?", "a": "55 000", "w": ["56 000", "54 000", "55 250"], "h": "20 250 + 2 750 = 23 000 — круглое число. 23 000 + 32 000 = 55 000. Так удобнее: переставляем слагаемые и группируем их (переместительное и сочетательное свойства сложения)."}]);

"], "h": "В сутках 24 часа: 4 · 24 + 10 = 106 ч."}, {"q": "Вырази в составных единицах: 9 135 см³ = ? дм³ см³.", "a": "9 дм³ 135 см³", "w": ["135 дм³ 9 см³", "10 дм³ 135 см³", "90 дм³ 135 см³"], "h": "1 дм³ = 1 000 см³. 9 135 : 1 000 = 9 (ост. 135). Значит, 9 дм³ 135 см³"}, {"q": "Вырази в составных единицах: 853 мм² = ? см² мм².", "a": "8 см² 53 мм²", "w": ["53 см² 8 мм²", "9 см² 53 мм²", "80 см² 53 мм²"], "h": "1 см² = 100 мм². 853 : 100 = 8 (ост. 53). Значит, 8 см² 53 мм²"}, {"q": "Участок занимает 3 а. Сколько это в квадратных метрах?", "a": "300", "w": ["3 000", "30", "3"], "h": "1 а = 100 м². 3 · 100 = 300 м²"}, {"q": "Вырази в арах: 59 га 85 а.", "a": "5 985", "w": ["5 900", "144", "59 085"], "h": "1 га = 100 а. 59 га = 5 900 а; 5 900 + 85 = 5 985 а"}, {"q": "Вырази в мелких единицах. 5 м³ 721 дм³ = ? дм³", "a": "5 721", "w": ["5 000", "726", "50 721"], "h": "1 м³ = 1 000 дм³. 5 м³ = 5 000 дм³; 5 000 + 721 = 5 721"}, {"q": "Вырази в днях: 3 нед. 3 дн.", "a": "24", "w": ["33", "6", "18"], "h": "В неделе 7 дней: 3 · 7 + 3 = 24 дн."}, {"q": "Площадь поля 200 а. Сколько это в гектарах?", "a": "2", "w": ["20", "200", "3"], "h": "1 га = 100 а. 200 : 100 = 2 га"}, {"q": "Сколько центов в 2 долларах? (1 доллар = 100 центов)", "a": "200", "w": ["20", "2 000", "102"], "h": "1 доллар = 100 центов. 2 · 100 = 200"}, {"q": "Вырази в евроцентах: 4 евро 45 евроцентов.", "a": "445", "w": ["400", "49", "4 045"], "h": "1 евро = 100 евроцентов. 4 · 100 + 45 = 445"}, {"q": "Вырази в метрах: 5 км 956 м.", "a": "5 956", "w": ["50 956", "5 000", "1 456"], "h": "1 км = 1 000 м. 5 · 1 000 + 956 = 5 956"}, {"q": "Вырази в центах: 4 доллара 25 центов.", "a": "425", "w": ["400", "29", "4 025"], "h": "1 доллар = 100 центов. 4 · 100 + 25 = 425"}, {"q": "Вырази в рублях: 500 копеек. (1 рубль = 100 копеек)", "a": "5", "w": ["50", "500", "6"], "h": "1 рубль = 100 копеек. 500 : 100 = 5"}, {"q": "Вырази в кубических дециметрах: 4 м³ 723 дм³.", "a": "4 723", "w": ["40 723", "4 000", "1 123"], "h": "1 м³ = 1 000 дм³. 4 · 1 000 + 723 = 4 723"}, {"q": "Вырази в евро: 600 евроцентов. (1 евро = 100 евроцентов)", "a": "6", "w": ["60", "600", "7"], "h": "1 евро = 100 евроцентов. 600 : 100 = 6"}, {"q": "В кошельке 2 купюры по 2 000 тенге, 2 купюры по 5 000 тенге и 3 купюры по 10 000 тенге. Сколько тенге в кошельке?", "a": "44 000", "w": ["17 000", "34 000", "46 000"], "h": "2 000 · 2 = 4 000; 5 000 · 2 = 10 000; 10 000 · 3 = 30 000. Всего: 44 000"}, {"q": "Вырази в метрах: 7 км 921 м.", "a": "7 921", "w": ["70 921", "7 000", "1 621"], "h": "1 км = 1 000 м. 7 · 1 000 + 921 = 7 921"}, {"q": "Сколько см³ в 8 м³?", "a": "8 000 000", "w": ["800", "80", "80 000 000"], "h": "1 м³ = 1 000 000 см³. 8 · 1 000 000 = 8 000 000"}]);
GENS.m46q = mkQuiz([{"q": "Продолжи ряд чисел: какое число должно быть следующим? 130, 1 130, 2 130, 3 130, ?", "a": "4 130", "w": ["3 130", "4 140", "4 120"], "h": "Смотрим, как меняются числа: каждое больше предыдущего на 1 000. 3 130 + 1 000 = 4 130"}, {"q": "По какому правилу составлен ряд? 36, 61, 86, 111, …", "a": "прибавляют 25", "w": ["вычитают 25", "прибавляют 50", "умножают на 2"], "h": "61 − 36 = 25. Каждое следующее число больше на 25."}, {"q": "Найди пропущенное число в ряду. 15, ?, 21, 24, 27, 30", "a": "18", "w": ["15", "21", "19"], "h": "Соседние числа отличаются на 3. Пропущенное число равно 15 + 3 = 18."}, {"q": "Продолжи ряд чисел: какое число должно быть следующим? 144, 129, 114, 99, ?", "a": "84", "w": ["99", "83", "85"], "h": "Смотрим, как меняются числа: каждое меньше предыдущего на 15. 99 − 15 = 84"}, {"q": "По какому правилу составлен ряд? 11, 19, 27, 35, …", "a": "прибавляют 8", "w": ["вычитают 8", "прибавляют 16", "умножают на 2"], "h": "19 − 11 = 8. Каждое следующее число больше на 8."}, {"q": "Найди пропущенное число в ряду. 10, 19, 28, ?, 46, 55", "a": "37", "w": ["28", "46", "38"], "h": "Соседние числа отличаются на 9. Пропущенное число равно 28 + 9 = 37."}, {"q": "Продолжи ряд чисел: какое число должно быть следующим? 12 008, 11 008, 10 008, 9 008, ?", "a": "8 008", "w": ["9 008", "7 998", "8 018"], "h": "Смотрим, как меняются числа: каждое меньше предыдущего на 1 000. 9 008 − 1 000 = 8 008"}, {"q": "По какому правилу составлен ряд? 198, 183, 168, 153, …", "a": "вычитают 15", "w": ["прибавляют 15", "вычитают 30", "умножают на 2"], "h": "198 − 183 = 15. Каждое следующее число меньше на 15."}, {"q": "Найди пропущенное число в ряду. 2 009, ?, 1 509, 1 259, 1 009, 759", "a": "1 759", "w": ["2 009", "1 509", "1 769"], "h": "Соседние числа отличаются на 250. Пропущенное число равно 2 009 − 250 = 1 759."}, {"q": "Продолжи ряд чисел: какое число должно быть следующим? 45, 52, 59, 66, ?", "a": "73", "w": ["66", "74", "72"], "h": "Смотрим, как меняются числа: каждое больше предыдущего на 7. 66 + 7 = 73"}, {"q": "Прибавляемое число каждый раз растёт. Найди следующее число. 44, 84, 164, 284, ?", "a": "444", "w": ["404", "484", "324"], "h": "Разности между соседними числами: 40, 80, 120. Следующая разность — 160. 284 + 160 = 444"}, {"q": "Продолжи ряд: какое число следующее? 4, 40, 400, 4 000, ?", "a": "40 000", "w": ["7 600", "44 000", "4 004"], "h": "Каждое число в 10 раз больше предыдущего: 4 000 · 10 = 40 000."}, {"q": "Ряд составлен по двум правилам, которые чередуются. Найди следующее число. 50, 55, 53, 58, 56, ?", "a": "61", "w": ["54", "58", "62"], "h": "Действия чередуются: + 5, − 2, + 5, − 2, … Следующее действие: +5. 56 + 5 = 61"}, {"q": "Одно число в ряду записано не по правилу. Найди лишнее число. 17, 28, 39, 51, 61, 72, 83", "a": "51", "w": ["28", "72", "39"], "h": "Числа должны расти на 11: 17, 28, 39, 50, 61, 72, 83. Число 51 не подходит — вместо него должно быть 50."}, {"q": "Каждое число меньше предыдущего в одно и то же число раз. Найди следующее. 1 920, 960, 480, 240, ?", "a": "120", "w": ["239", "60", "118"], "h": "Каждое число в 2 раза меньше предыдущего: 240 : 2 = 120"}, {"q": "Прибавляемое число каждый раз растёт. Найди следующее число. 84, 94, 114, 144, ?", "a": "184", "w": ["174", "194", "154"], "h": "Разности между соседними числами: 10, 20, 30. Следующая разность — 40. 144 + 40 = 184"}, {"q": "Продолжи ряд: какое число следующее? 20, 40, 80, 160, ?", "a": "320", "w": ["240", "480", "180"], "h": "Каждое число в 2 раза больше предыдущего: 160 · 2 = 320."}, {"q": "Ряд составлен по двум правилам, которые чередуются. Найди следующее число. 26, 38, 33, 45, 40, ?", "a": "52", "w": ["35", "45", "53"], "h": "Действия чередуются: + 12, − 5, + 12, − 5, … Следующее действие: +12. 40 + 12 = 52"}, {"q": "Одно число в ряду записано не по правилу. Найди лишнее число. 30, 38, 46, 52, 62, 70, 78", "a": "52", "w": ["30", "70", "38"], "h": "Числа должны расти на 8: 30, 38, 46, 54, 62, 70, 78. Число 52 не подходит — вместо него должно быть 54."}, {"q": "Каждое число меньше предыдущего в одно и то же число раз. Найди следующее. 5 120, 2 560, 1 280, 640, ?", "a": "320", "w": ["639", "160", "319"], "h": "Каждое число в 2 раза меньше предыдущего: 640 : 2 = 320"}, {"q": "В ряду каждое следующее число больше предыдущего на 4. Какое число стоит на 9-м месте? 10, 14, 18, 22, …", "a": "42", "w": ["46", "38", "44"], "h": "Чтобы дойти до 9-го места, нужно 8 раз прибавить 4: 10 + 4 · 8 = 42"}, {"q": "Выбери ряд, составленный по правилу «начать с 51 и вычитать 5».", "a": "51, 46, 41, 36", "w": ["36, 41, 46, 51", "51, 44, 37, 30", "51, 46, 42, 36"], "h": "Первое число — 51. Каждое следующее получаем вычитанием 5. 51, 46, 41, 36"}, {"q": "Какое из чисел встретится в этом ряду? 4, 10, 16, 22, …", "a": "124", "w": ["125", "123", "126"], "h": "Каждое число ряда больше предыдущего на 6, значит, от 4 до нужного числа разность делится на 6. 124 − 4 = 120; 120 : 6 = 20. Делится без остатка — число есть в ряду."}, {"q": "В ряду каждое следующее число больше предыдущего на 5. Какое число стоит на 8-м месте? 12, 17, 22, 27, …", "a": "47", "w": ["52", "42", "49"], "h": "Чтобы дойти до 8-го места, нужно 7 раз прибавить 5: 12 + 5 · 7 = 47"}, {"q": "Это двойной ряд: числа на нечётных местах составлены по одному правилу, на чётных — по другому. Найди следующее число. 37, 29, 35, 32, 33, 35, ?", "a": "31", "w": ["35", "36", "33"], "h": "Выпишем числа на нечётных местах: 37, 35, 33 — они уменьшаются на 2. На чётных местах: 29, 32, 35 — они увеличиваются на 3. Следующее число — на нечётном месте: 33 − 2 = 31"}, {"q": "Выбери ряд, составленный по правилу «начать с 41 и вычитать 3».", "a": "41, 38, 35, 32", "w": ["32, 35, 38, 41", "41, 36, 31, 26", "41, 38, 36, 32"], "h": "Первое число — 41. Каждое следующее получаем вычитанием 3. 41, 38, 35, 32"}, {"q": "Выбери ряд, составленный по правилу «начать с 54 и вычитать 10».", "a": "54, 44, 34, 24", "w": ["24, 34, 44, 54", "54, 42, 30, 18", "54, 44, 35, 24"], "h": "Первое число — 54. Каждое следующее получаем вычитанием 10. 54, 44, 34, 24"}, {"q": "Выбери ряд, составленный по правилу «начать с 51 и вычитать 3».", "a": "51, 48, 45, 42", "w": ["42, 45, 48, 51", "51, 46, 41, 36", "51, 48, 46, 42"], "h": "Первое число — 51. Каждое следующее получаем вычитанием 3. 51, 48, 45, 42"}, {"q": "В ряду каждое следующее число больше предыдущего на 8. Какое число стоит на 10-м месте? 15, 23, 31, 39, …", "a": "87", "w": ["95", "79", "870"], "h": "Чтобы дойти до 10-го места, нужно 9 раз прибавить 8: 15 + 8 · 9 = 87"}, {"q": "В ряду каждое следующее число больше предыдущего на 7. Какое число стоит на 8-м месте? 2, 9, 16, 23, …", "a": "51", "w": ["58", "44", "41"], "h": "Чтобы дойти до 8-го места, нужно 7 раз прибавить 7: 2 + 7 · 7 = 51"}]);
GENS.m47q = mkQuiz([{"q": "Лыжник двигался со скоростью 160 м/мин и преодолел 800 метров. Сколько времени он был в пути?", "a": "5", "w": ["155", "6", "10"], "h": "Время = расстояние : скорость: t = S : v = 800 : 160 = 5 мин"}, {"q": "Автомобиль двигался со скоростью 80 км/ч. Время в пути — 4 часа. Какое расстояние он проехал?", "a": "320", "w": ["84", "400", "240"], "h": "Расстояние = скорость · время: S = v · t = 80 · 4 = 320 км"}, {"q": "Автомобиль за 3 часа преодолел 330 километров. Найди скорость.", "a": "110", "w": ["327", "120", "220"], "h": "Скорость = расстояние : время: v = S : t = 330 : 3 = 110 км/ч"}, {"q": "Лыжник шёл со скоростью 180 м/мин. Время в пути — 7 минут. Какое расстояние он прошёл?", "a": "1 260", "w": ["187", "1 440", "1 080"], "h": "Расстояние = скорость · время: S = v · t = 180 · 7 = 1 260 м"}, {"q": "Автомобиль за 7 часов преодолел 420 километров. Найди скорость.", "a": "60", "w": ["413", "70", "120"], "h": "Скорость = расстояние : время: v = S : t = 420 : 7 = 60 км/ч"}, {"q": "Пешеход шёл со скоростью 70 м/мин. Время в пути — 11 минут. Какое расстояние он прошёл?", "a": "770", "w": ["81", "840", "700"], "h": "Расстояние = скорость · время: S = v · t = 70 · 11 = 770 м"}, {"q": "Пешеход шёл со скоростью 90 м/мин. Время в пути — 11 минут. Какое расстояние он прошёл?", "a": "990", "w": ["101", "1 080", "900"], "h": "Расстояние = скорость · время: S = v · t = 90 · 11 = 990 м"}, {"q": "Велосипедист двигался со скоростью 20 км/ч. Время в пути — 3 часа. Какое расстояние он проехал?", "a": "60", "w": ["23", "80", "40"], "h": "Расстояние = скорость · время: S = v · t = 20 · 3 = 60 км"}, {"q": "Самолёт летел со скоростью 500 км/ч. Время в полёте — 6 часов. Какое расстояние он пролетел?", "a": "3 000", "w": ["506", "3 500", "2 500"], "h": "Расстояние = скорость · время: S = v · t = 500 · 6 = 3 000 км"}, {"q": "Лыжник шёл со скоростью 220 м/мин. Время в пути — 6 минут. Какое расстояние он прошёл?", "a": "1 320", "w": ["226", "1 540", "1 100"], "h": "Расстояние = скорость · время: S = v · t = 220 · 6 = 1 320 м"}, {"q": "Первый автомобиль ехал 4 часа со скоростью 80 км/ч. Второй ехал 3 часа со скоростью 90 км/ч. Кто проехал больше?", "a": "Первый", "w": ["Второй", "Одинаково"], "h": "Первый проехал 80 · 4 = 320 км, второй — 90 · 3 = 270 км. Больше проехал первый."}, {"q": "Что означает скорость 60 км/ч?", "a": "За 1 час проходят 60 км", "w": ["За 60 часов проходят 1 км", "Всего проходят 60 км и останавливаются", "Путь равен 60 км/ч"], "h": "Скорость показывает, какое расстояние проходят за единицу времени. 60 км/ч — за один час проходят 60 километров."}, {"q": "Турист шёл 3 часа со скоростью 4 км/ч, а потом ехал на велосипеде 3 часа со скоростью 15 км/ч. Какой путь он проделал?", "a": "57", "w": ["114", "12", "45"], "h": "Находим путь на каждом участке и складываем: 4 · 3 = 12 км; 15 · 3 = 45 км 12 + 45 = 57"}, {"q": "Что означает скорость 15 м/с?", "a": "За 1 секунду проходят 15 м", "w": ["За 15 секунд проходят 1 м", "Всего проходят 15 м и останавливаются", "Путь равен 15 м/с"], "h": "Скорость показывает, какое расстояние проходят за единицу времени. 15 м/с — за одну секунду проходят 15 метров."}, {"q": "Турист шёл 2 часа со скоростью 3 км/ч, а потом ехал на велосипеде 2 часа со скоростью 15 км/ч. Какой путь он проделал?", "a": "36", "w": ["72", "6", "30"], "h": "Находим путь на каждом участке и складываем: 3 · 2 = 6 км; 15 · 2 = 30 км 6 + 30 = 36"}, {"q": "Турист шёл 4 часа со скоростью 5 км/ч, а потом ехал на велосипеде 3 часа со скоростью 15 км/ч. Какой путь он проделал?", "a": "65", "w": ["140", "20", "45"], "h": "Находим путь на каждом участке и складываем: 5 · 4 = 20 км; 15 · 3 = 45 км 20 + 45 = 65"}, {"q": "Турист шёл 3 часа со скоростью 3 км/ч, а потом ехал на велосипеде 4 часа со скоростью 15 км/ч. Какой путь он проделал?", "a": "69", "w": ["126", "9", "60"], "h": "Находим путь на каждом участке и складываем: 3 · 3 = 9 км; 15 · 4 = 60 км 9 + 60 = 69"}, {"q": "Турист шёл 4 часа со скоростью 6 км/ч, а потом ехал на велосипеде 3 часа со скоростью 10 км/ч. Какой путь он проделал?", "a": "54", "w": ["112", "24", "30"], "h": "Находим путь на каждом участке и складываем: 6 · 4 = 24 км; 10 · 3 = 30 км 24 + 30 = 54"}, {"q": "Турист шёл 4 часа со скоростью 3 км/ч, а потом ехал на велосипеде 3 часа со скоростью 20 км/ч. Какой путь он проделал?", "a": "72", "w": ["161", "12", "60"], "h": "Находим путь на каждом участке и складываем: 3 · 4 = 12 км; 20 · 3 = 60 км 12 + 60 = 72"}, {"q": "Турист шёл 3 часа со скоростью 6 км/ч, а потом ехал на велосипеде 3 часа со скоростью 10 км/ч. Какой путь он проделал?", "a": "48", "w": ["96", "18", "30"], "h": "Находим путь на каждом участке и складываем: 6 · 3 = 18 км; 10 · 3 = 30 км 18 + 30 = 48"}, {"q": "Автобус проехал 280 км за 4 часа. За сколько часов он проедет обратный путь, если скорость увеличить в 2 раза?", "a": "2", "w": ["8", "4", "5"], "h": "Новая скорость: 70 · 2 = 140 км/ч. Время: 280 : 140 = 2 ч. Скорость выросла в 2 раза — время уменьшилось в 2 раза."}, {"q": "За 4 часа автобус проехал 120 км. Сколько километров он проедет за 2 часа при той же скорости?", "a": "60", "w": ["120", "240", "30"], "h": "Скорость: 120 : 4 = 30 км/ч. За 2 ч: 30 · 2 = 60 км"}, {"q": "Расстояние между городами 210 км. Автомобиль выехал в 8:00 и ехал со скоростью 70 км/ч. Во сколько он приедет, если не будет остановок?", "a": "11:00", "w": ["12:00", "10:00", "13:00"], "h": "Время в пути: 210 : 70 = 3 ч. 8:00 + 3 ч = 11:00."}, {"q": "Скорость мотоцикла 120 км/ч, это в 6 раз больше скорости велосипедиста. Какое расстояние проедет велосипедист за 4 часа?", "a": "80", "w": ["480", "120", "24"], "h": "Скорость велосипедиста: 120 : 6 = 20 км/ч. Расстояние: 20 · 4 = 80 км"}, {"q": "Расстояние между городами 150 км. Автомобиль выехал в 8:00 и ехал со скоростью 50 км/ч. Во сколько он приедет, если не будет остановок?", "a": "11:00", "w": ["12:00", "10:00", "13:00"], "h": "Время в пути: 150 : 50 = 3 ч. 8:00 + 3 ч = 11:00."}, {"q": "Скорость мотоцикла 75 км/ч, это в 5 раз больше скорости велосипедиста. Какое расстояние проедет велосипедист за 3 часа?", "a": "45", "w": ["225", "75", "18"], "h": "Скорость велосипедиста: 75 : 5 = 15 км/ч. Расстояние: 15 · 3 = 45 км"}, {"q": "Расстояние между городами 180 км. Автомобиль выехал в 8:00 и ехал со скоростью 60 км/ч. Во сколько он приедет, если не будет остановок?", "a": "11:00", "w": ["12:00", "10:00", "13:00"], "h": "Время в пути: 180 : 60 = 3 ч. 8:00 + 3 ч = 11:00."}, {"q": "Расстояние между городами 400 км. Автомобиль выехал в 8:00 и ехал со скоростью 80 км/ч. Во сколько он приедет, если не будет остановок?", "a": "13:00", "w": ["14:00", "12:00", "15:00"], "h": "Время в пути: 400 : 80 = 5 ч. 8:00 + 5 ч = 13:00."}, {"q": "Автобус проехал 160 км за 4 часа. За сколько часов он проедет обратный путь, если скорость увеличить в 2 раза?", "a": "2", "w": ["8", "4", "5"], "h": "Новая скорость: 40 · 2 = 80 км/ч. Время: 160 : 80 = 2 ч. Скорость выросла в 2 раза — время уменьшилось в 2 раза."}, {"q": "Два автомобиля выехали одновременно. Скорость первого 70 км/ч, второго — 90 км/ч. На сколько километров второй проедет больше за 3 часа?", "a": "60", "w": ["210", "270", "20"], "h": "Первый проедет 210 км, второй — 270 км. 270 − 210 = 60"}]);
GENS.m48q = mkQuiz([{"q": "Сколько граней у куба?", "a": "6", "w": ["8", "12", "4"], "h": "Грани — плоские части поверхности фигуры: верх, низ и четыре боковые. Куб: 6 граней."}, {"q": "Объём прямоугольного параллелепипеда 24 дм³. Два его измерения 3 дм и 4 дм. Найди третье измерение (ширина) в дм.", "a": "2", "w": ["8", "17", "3"], "h": "Из формулы V = a · b · c получаем: неизвестное ребро = V : (произведение двух известных): 24 : (3 · 4) = 24 : 12 = 2 дм"}, {"q": "Сколько кубических сантиметров в одном кубическом дециметре?", "a": "1 000", "w": ["10", "100", "10 000"], "h": "1 дм³ — это куб с ребром 10 см: 10 · 10 · 10 = 1 000 см³."}, {"q": "Сколько вершин у параллелепипеда ABCDA₁B₁C₁D₁?", "a": "8", "w": ["4", "6", "12"], "h": "Названы 8 вершин: A, B, C, D и A₁, B₁, C₁, D₁."}, {"q": "Длина 9 см, ширина 9 см, высота 7 см. Найди сумму длин всех рёбер параллелепипеда.", "a": "100", "w": ["25", "50", "108"], "h": "Рёбер каждой длины по 4: 4 · (9 + 9 + 7) = 4 · 25 = 100 см"}, {"q": "Аквариум имеет длину 5 дм, ширину 6 дм и высоту 4 дм. Сколько литров воды в нём поместится? (1 л = 1 дм³)", "a": "120", "w": ["15", "30", "88"], "h": "Объём: 5 · 6 · 4 = 120 дм³. Так как 1 дм³ = 1 л, поместится 120 литров."}, {"q": "Что верно для куба?", "a": "все рёбра равны", "w": ["все грани разные", "у него 4 вершины", "у него круглые грани"], "h": "У куба все 12 рёбер одной длины."}, {"q": "Ребро куба равно 2 см. Найди сумму длин всех его рёбер.", "a": "24", "w": ["12", "16", "8"], "h": "У куба 12 рёбер одинаковой длины: 2 · 12 = 24 см"}, {"q": "Какая формула верна для объёма прямоугольного параллелепипеда?", "a": "V = a · b · c", "w": ["V = a + b + c", "V = 2 · (a + b)", "V = a · b"], "h": "Объём — это произведение трёх измерений: длины, ширины и высоты."}, {"q": "Какую форму имеют все грани куба?", "a": "квадрат", "w": ["круг", "треугольник", "трапеция"], "h": "Все 6 граней куба — равные квадраты."}, {"q": "Ребро куба равно 4 см. Найди сумму длин всех его рёбер.", "a": "48", "w": ["24", "32", "16"], "h": "У куба 12 рёбер одинаковой длины: 4 · 12 = 48 см"}, {"q": "Какой предмет имеет форму куба?", "a": "модель куба с равными рёбрами", "w": ["апельсин", "ведро", "рулон бумаги"], "h": "Правильный ответ: модель куба с равными рёбрами. У такого предмета плоские грани, рёбра и вершины."}, {"q": "Ребро куба увеличили в 3 раза. Во сколько раз увеличился его объём?", "a": "в 27 раз", "w": ["в 3 раза", "в 9 раз", "в 24 раза"], "h": "Было: 2 · 2 · 2 = 8. Стало: 6 · 6 · 6 = 216. Это в 27 раз больше."}, {"q": "Сколько граней у прямоугольного параллелепипеда?", "a": "6", "w": ["8", "12", "4"], "h": "Грани — плоские части поверхности фигуры: верх, низ и четыре боковые. Параллелепипед: 6 граней."}, {"q": "Длина 9 см, ширина 2 см, высота 5 см. Найди сумму длин всех рёбер параллелепипеда.", "a": "64", "w": ["16", "32", "108"], "h": "Рёбер каждой длины по 4: 4 · (9 + 2 + 5) = 4 · 16 = 64 см"}, {"q": "Объём прямоугольного параллелепипеда 100 см³. Два его измерения 5 см и 5 см. Найди третье измерение (ширина) в см.", "a": "4", "w": ["20", "90", "5"], "h": "Из формулы V = a · b · c получаем: неизвестное ребро = V : (произведение двух известных): 100 : (5 · 5) = 100 : 25 = 4 см"}, {"q": "Сколько вершин у прямоугольного параллелепипеда?", "a": "8", "w": ["6", "12", "4"], "h": "Вершины — это «углы» фигуры: четыре снизу и четыре сверху. Параллелепипед: 8 вершин."}, {"q": "Какой предмет имеет форму прямоугольного параллелепипеда?", "a": "аквариум", "w": ["мяч", "ведро", "рулон бумаги"], "h": "Правильный ответ: аквариум. У такого предмета плоские грани, рёбра и вершины."}, {"q": "Аквариум имеет длину 8 дм, ширину 5 дм и высоту 4 дм. Сколько литров воды в нём поместится? (1 л = 1 дм³)", "a": "160", "w": ["17", "40", "104"], "h": "Объём: 8 · 5 · 4 = 160 дм³. Так как 1 дм³ = 1 л, поместится 160 литров."}, {"q": "Сколько рёбер у прямоугольного параллелепипеда?", "a": "12", "w": ["6", "8", "4"], "h": "Рёбра — это отрезки, где сходятся грани: 4 снизу, 4 сверху и 4 боковых. Параллелепипед: 12 рёбер."}, {"q": "Найди площадь фигуры (в см²). Из прямоугольника 5 на 6 вырезан прямоугольник 2 на 2 (в углу).", "a": "26", "w": ["30", "4", "34"], "h": "Большой прямоугольник: 5 · 6 = 30 см². Вырез: 2 · 2 = 4 см². 30 − 4 = 26 см²"}, {"q": "Какую форму имеют грани прямоугольного параллелепипеда?", "a": "прямоугольники", "w": ["круги", "треугольники", "трапеции"], "h": "Грани прямоугольного параллелепипеда — прямоугольники. Противоположные грани равны."}, {"q": "Сколько рёбер у куба?", "a": "12", "w": ["6", "8", "4"], "h": "Рёбра — это отрезки, где сходятся грани: 4 снизу, 4 сверху и 4 боковых. Куб: 12 рёбер."}, {"q": "В каких единицах измеряют объём?", "a": "в кубических сантиметрах (см³)", "w": ["в сантиметрах (см)", "в квадратных сантиметрах (см²)", "в граммах (г)"], "h": "Объём показывает, сколько кубиков с ребром 1 см помещается в фигуре, поэтому измеряется в см³ (а также в мм³, дм³, м³)."}]);
GENS.m49q = mkQuiz([{"q": "Равны ли множества A = {1; 5; 6; 8} и B = {9; 6; 5; 1}?", "a": "не равны", "w": ["равны"], "h": "Элементы не совпадают: у A есть 8, а у B его нет. Множества не равны."}, {"q": "Равны ли множества A = {4; 5; 6; 8} и B = {4; 8; 6; 5}?", "a": "равны", "w": ["не равны"], "h": "В обоих множествах одни и те же элементы: {4; 5; 6; 8}. Порядок записи не важен — множества равны. Записываем: A = B."}, {"q": "Равны ли множества A = {2; 3; 4; 7} и B = {2; 8; 3; 4}?", "a": "не равны", "w": ["равны"], "h": "Элементы не совпадают: у A есть 7, а у B его нет. Множества не равны."}, {"q": "Равны ли множества A = {1; 2; 6; 9} и B = {2; 1; 9; 6}?", "a": "равны", "w": ["не равны"], "h": "В обоих множествах одни и те же элементы: {1; 2; 6; 9}. Порядок записи не важен — множества равны. Записываем: A = B."}, {"q": "Множество A — чётные числа, множество B — нечётные числа. Как связаны A и B?", "a": "A и B не пересекаются", "w": ["A — подмножество B", "A и B равны", "A и B частично пересекаются"], "h": "Число не может быть и чётным, и нечётным, общих элементов нет."}, {"q": "Множество A — все яблоки, множество B — все фрукты. Как связаны A и B?", "a": "A — подмножество B", "w": ["A и B не пересекаются", "A и B равны", "B — подмножество A"], "h": "Каждое яблоко — это фрукт, значит, A входит в B."}, {"q": "Равны ли множества A = {1; 4; 5; 8} и B = {1; 4; 9; 5}?", "a": "не равны", "w": ["равны"], "h": "Элементы не совпадают: у A есть 8, а у B его нет. Множества не равны."}, {"q": "Равны ли множества A = {3; 6; 7; 8} и B = {8; 6; 7; 3}?", "a": "равны", "w": ["не равны"], "h": "В обоих множествах одни и те же элементы: {3; 6; 7; 8}. Порядок записи не важен — множества равны. Записываем: A = B."}, {"q": "Равны ли множества A = {3; 6; 7; 8} и B = {3; 6; 9; 7}?", "a": "не равны", "w": ["равны"], "h": "Элементы не совпадают: у A есть 8, а у B его нет. Множества не равны."}, {"q": "Множество A — буквы слова «кот», множество B — буквы слова «ток». Как связаны A и B?", "a": "A и B равны", "w": ["A и B не пересекаются", "A — подмножество B, и они не равны", "A и B частично пересекаются"], "h": "В обоих словах одни и те же буквы: к, о, т. Значит, множества равны."}, {"q": "Найди объединение множеств A = {1; 3; 5; 6; 7; 9} и B = {1; 3; 4; 6; 10}. Общие элементы пишем один раз.", "a": "{1; 3; 4; 5; 6; 7; 9; 10}", "w": ["{1; 3; 5; 6; 7; 9}", "{1; 3; 6}", "{3; 4; 5; 6; 7; 9; 10}"], "h": "Объединение — все элементы обоих множеств, общие пишем один раз. A ∪ B = {1; 3; 4; 5; 6; 7; 9; 10}"}, {"q": "Найди объединение множеств A = {1; 6; 8; 10; 12} и B = {5; 6; 7; 11; 12}. Общие элементы пишем один раз.", "a": "{1; 5; 6; 7; 8; 10; 11; 12}", "w": ["{5; 6; 7; 8; 10; 11; 12}", "{1; 5; 6; 7; 8; 10; 11}", "{6; 12}"], "h": "Объединение — все элементы обоих множеств, общие пишем один раз. A ∪ B = {1; 5; 6; 7; 8; 10; 11; 12}"}, {"q": "C = {3; 8}, A = {3; 5; 11; 12}. Является ли C подмножеством A, то есть верно ли, что C ⊂ A?", "a": "нет", "w": ["да"], "h": "Элемента 8 нет в A, значит, C — не подмножество A."}, {"q": "Найди объединение множеств A = {1; 2; 4; 5; 8; 10} и B = {4; 5; 7; 8; 11}. Общие элементы пишем один раз.", "a": "{1; 2; 4; 5; 7; 8; 10; 11}", "w": ["{2; 4; 5; 7; 8; 10; 11}", "{4; 5; 8}", "{1; 2; 4; 5; 8; 10}"], "h": "Объединение — все элементы обоих множеств, общие пишем один раз. A ∪ B = {1; 2; 4; 5; 7; 8; 10; 11}"}, {"q": "C = {3; 10}, A = {1; 3; 6; 8; 10; 11}. Является ли C подмножеством A, то есть верно ли, что C ⊂ A?", "a": "да", "w": ["нет"], "h": "Все элементы C есть и в A, значит, C — подмножество A: C ⊂ A."}, {"q": "C = {4; 12}, A = {3; 4; 10; 12}. Является ли C подмножеством A, то есть верно ли, что C ⊂ A?", "a": "да", "w": ["нет"], "h": "Все элементы C есть и в A, значит, C — подмножество A: C ⊂ A."}, {"q": "A = {3; 10; 11; 12}, B = {3; 10; 12}. Какая запись верна?", "a": "B ⊂ A", "w": ["A ⊂ B", "A = B", "A ∩ B = ∅"], "h": "Все элементы B есть в A, а в A есть и другие. B — часть A, значит, B ⊂ A."}, {"q": "C = {9; 10; 11}, A = {6; 7; 8; 9; 10; 11}. Является ли C подмножеством A, то есть верно ли, что C ⊂ A?", "a": "да", "w": ["нет"], "h": "Все элементы C есть и в A, значит, C — подмножество A: C ⊂ A."}, {"q": "Найди объединение множеств A = {1; 4; 6; 7; 10; 11} и B = {5; 8; 11}. Общие элементы пишем один раз.", "a": "{1; 4; 5; 6; 7; 8; 10; 11}", "w": ["{11}", "{1; 4; 6; 7; 10; 11}", "{1; 4; 5; 6; 7; 8; 10}"], "h": "Объединение — все элементы обоих множеств, общие пишем один раз. A ∪ B = {1; 4; 5; 6; 7; 8; 10; 11}"}, {"q": "Найди объединение множеств A = {1; 2; 3; 4; 6; 9} и B = {2; 7; 11; 12}. Общие элементы пишем один раз.", "a": "{1; 2; 3; 4; 6; 7; 9; 11; 12}", "w": ["{2}", "{1; 2; 3; 4; 6; 7; 9; 11}", "{1; 2; 3; 4; 6; 9}"], "h": "Объединение — все элементы обоих множеств, общие пишем один раз. A ∪ B = {1; 2; 3; 4; 6; 7; 9; 11; 12}"}, {"q": "Среди ребят 10 любят «рисование», 10 любят «пение», а 3 любят и то, и другое. Сколько всего ребят в этой группе?", "a": "17", "w": ["20", "14", "23"], "h": "Только первое: 10 − 3 = 7. Только второе: 10 − 3 = 7. Оба: 3. Всего: 7 + 7 + 3 = 17"}, {"q": "В классе 18 учеников. 12 ходят в кружок рисования, 11 — в кружок пения, 6 — в оба. Сколько учеников не ходят ни в один кружок?", "a": "1", "w": ["7", "17", "2"], "h": "В кружки ходят: 12 + 11 − 6 = 17. Не ходят: 18 − 17 = 1"}, {"q": "Среди ребят 11 любят «рисование», 9 любят «пение», а 6 любят и то, и другое. Сколько всего ребят в этой группе?", "a": "14", "w": ["20", "8", "26"], "h": "Только первое: 11 − 6 = 5. Только второе: 9 − 6 = 3. Оба: 6. Всего: 5 + 3 + 6 = 14"}, {"q": "Допиши равенство: M ∩ K = ?", "a": "K ∩ M", "w": ["M ∪ K", "M", "K"], "h": "Переместительное свойство: пересечение не зависит от порядка записи."}, {"q": "Среди ребят 18 любят «футбол», 18 любят «шахматы», а 9 любят и то, и другое. Сколько всего ребят в этой группе?", "a": "27", "w": ["36", "18", "45"], "h": "Только первое: 18 − 9 = 9. Только второе: 18 − 9 = 9. Оба: 9. Всего: 9 + 9 + 9 = 27"}, {"q": "Среди ребят 11 любят «чай», 8 любят «кофе», а 3 любят и то, и другое. Сколько всего ребят в этой группе?", "a": "16", "w": ["19", "13", "22"], "h": "Только первое: 11 − 3 = 8. Только второе: 8 − 3 = 5. Оба: 3. Всего: 8 + 5 + 3 = 16"}, {"q": "В классе 27 учеников. 12 ходят в кружок рисования, 12 — в кружок пения, 5 — в оба. Сколько учеников не ходят ни в один кружок?", "a": "8", "w": ["3", "13", "19"], "h": "В кружки ходят: 12 + 12 − 5 = 19. Не ходят: 27 − 19 = 8"}, {"q": "Допиши равенство: (M ∩ K) ∩ N = ?", "a": "M ∩ (K ∩ N)", "w": ["(M ∪ K) ∩ N", "M ∪ (K ∩ N)", "M ∩ K"], "h": "Сочетательное свойство: пересечение трёх множеств не зависит от расстановки скобок."}, {"q": "В классе 27 учеников. 15 ходят в кружок рисования, 10 — в кружок пения, 5 — в оба. Сколько учеников не ходят ни в один кружок?", "a": "7", "w": ["2", "12", "20"], "h": "В кружки ходят: 15 + 10 − 5 = 20. Не ходят: 27 − 20 = 7"}, {"q": "В классе 26 учеников. 15 ходят в кружок рисования, 13 — в кружок пения, 3 — в оба. Сколько учеников не ходят ни в один кружок?", "a": "1", "w": ["4", "25", "2"], "h": "В кружки ходят: 15 + 13 − 3 = 25. Не ходят: 26 − 25 = 1"}]);

Первый", "Одинаково"], "h": "Производительность = работа : время. Первый: 114 : 6 = 19 в час. Второй: 160 : 8 = 20 в час. 19 < 20"}, {"q": "Первая швея шьёт 23 платьев в день, вторая — 32. На сколько платьев больше сошьёт вторая за 3 дня?", "a": "27", "w": ["69", "96", "9"], "h": "Первая: 23 · 3 = 69. Вторая: 32 · 3 = 96. 96 − 69 = 27"}, {"q": "Два работника работают вместе: один делает 19 булочек в час, второй — 15. Сколько булочек они сделают вместе за 7 часов?", "a": "238", "w": ["133", "34", "245"], "h": "Вместе за единицу времени: 19 + 15 = 34. За 7: 34 · 7 = 238"}, {"q": "Два работника работают вместе: один делает 24 детали в час, второй — 24. Сколько деталей они сделают вместе за 8 часов?", "a": "384", "w": ["192", "48", "392"], "h": "Вместе за единицу времени: 24 + 24 = 48. За 8: 48 · 8 = 384"}, {"q": "Первая швея шьёт 25 платьев в день, вторая — 31. На сколько платьев больше сошьёт вторая за 6 дней?", "a": "36", "w": ["150", "186", "6"], "h": "Первая: 25 · 6 = 150. Вторая: 31 · 6 = 186. 186 − 150 = 36"}, {"q": "Нужно изготовить 180 деталей. Мастер делает 20 деталей в час и работал 6 часов. Сколько деталей осталось изготовить?", "a": "60", "w": ["120", "180", "80"], "h": "Сделал: 20 · 6 = 120. Осталось: 180 − 120 = 60"}, {"q": "Два работника работают вместе: один делает 12 кг ягод в день, второй — 18. Сколько кг ягод они сделают вместе за 8 дней?", "a": "240", "w": ["96", "30", "248"], "h": "Вместе за единицу времени: 12 + 18 = 30. За 8: 30 · 8 = 240"}, {"q": "Первая швея шьёт 28 платьев в день, вторая — 30. На сколько платьев больше сошьёт вторая за 5 дней?", "a": "10", "w": ["140", "150", "2"], "h": "Первая: 28 · 5 = 140. Вторая: 30 · 5 = 150. 150 − 140 = 10"}, {"q": "Первый рабочий сделал 40 деталей за 8 часов, второй — 30 деталей за 6 часов. Кто работает быстрее, то есть чья производительность больше?", "a": "Одинаково", "w": ["Первый", "Второй"], "h": "Производительность = работа : время. Первый: 40 : 8 = 5 в час. Второй: 30 : 6 = 5 в час. 5 = 5"}, {"q": "Два работника работают вместе: один делает 13 платьев в день, второй — 9. Сколько платьев они сделают вместе за 9 дней?", "a": "198", "w": ["117", "22", "207"], "h": "Вместе за единицу времени: 13 + 9 = 22. За 9: 22 · 9 = 198"}, {"q": "Один насос наполняет бассейн, подавая 3 м³ воды в час, другой — 5 м³ в час. За сколько часов они вместе наполнят бассейн объёмом 32 м³?", "a": "4", "w": ["5", "3", "6"], "h": "Вместе за час: 3 + 5 = 8 м³. Время: 32 : 8 = 4 ч"}, {"q": "Для приготовления компота взяли 1 часть яблок, 2 части груш и 5 частей слив. Всего взяли 176 кг. Сколько килограммов груш взяли?", "a": "44", "w": ["22", "110", "42"], "h": "Всего частей: 1 + 2 + 5 = 8. Одна часть: 176 : 8 = 22 кг. груш: 2 · 22 = 44 кг"}, {"q": "Для приготовления компота взяли 3 части изюма и 5 частей орехов. Всего взяли 48 кг. Сколько килограммов изюма взяли?", "a": "18", "w": ["30", "24", "45"], "h": "Всего частей: 3 + 5 = 8. Одна часть: 48 : 8 = 6 кг. изюма: 3 · 6 = 18 кг"}, {"q": "Для приготовления компота взяли 3 части изюма и 2 части орехов. Всего взяли 55 кг. Сколько килограммов изюма взяли?", "a": "33", "w": ["22", "52", "31"], "h": "Всего частей: 3 + 2 = 5. Одна часть: 55 : 5 = 11 кг. изюма: 3 · 11 = 33 кг"}, {"q": "Первая типография печатает весь тираж за 15 часов, вторая — за 30 часов. Тираж — 60 книг. За сколько часов они напечатают его вместе?", "a": "10", "w": ["45", "15", "9"], "h": "Первая за час: 60 : 15 = 4. Вторая: 60 : 30 = 2. Вместе за час: 4 + 2 = 6. Время: 60 : 6 = 10 ч"}, {"q": "7 одинаковых тетрадей стоят 2 100 тенге. Сколько стоят 9 таких тетрадей?", "a": "2 700", "w": ["2 100", "300", "2 109"], "h": "Цена одной тетради: 2 100 : 7 = 300 тг. 9 тетрадей: 300 · 9 = 2 700 тг"}, {"q": "Первая типография печатает весь тираж за 10 часов, вторая — за 40 часов. Тираж — 40 книг. За сколько часов они напечатают его вместе?", "a": "8", "w": ["50", "25", "30"], "h": "Первая за час: 40 : 10 = 4. Вторая: 40 : 40 = 1. Вместе за час: 4 + 1 = 5. Время: 40 : 5 = 8 ч"}, {"q": "Д ": "240", "w": ["80", "160", "280"], "h": "За 2 часа автобус проехал 80 км. Скорость сближения: 60 − 40 = 20 км/ч. Время догона: 80 : 20 = 4 ч. Машина проедет: 60 · 4 = 240 км"}]);
GENS.m413q = mkQuiz([{"q": "Какое высказывание ложное?", "a": "45 делится на 2", "w": ["25 делится на 5", "30 делится на 10", "100 делится на 10"], "h": "45 оканчивается на 5, поэтому на 2 не делится."}, {"q": "Какое высказывание ложное?", "a": "45 делится на 2", "w": ["25 делится на 5", "30 делится на 10", "100 делится на 10"], "h": "45 оканчивается на 5, поэтому на 2 не делится."}, {"q": "Какое высказывание ложное?", "a": "У окружности 2 стороны", "w": ["У треугольника 3 стороны", "У квадрата 4 стороны", "У куба 6 граней"], "h": "Окружность — это линия, у неё нет сторон."}, {"q": "Какое из предложений — высказывание?", "a": "25 больше 30.", "w": ["Чему равна сумма 25 и 30?", "Сложи 25 и 30.", "Какое число следует за 25?"], "h": "Высказывание — повествовательное предложение, про которое можно точно сказать, истинно оно или ложно. Вопрос и просьба (приказ) не истинны и не ложны. «25 больше 30.» — высказывание."}, {"q": "Какое из предложений — высказывание?", "a": "25 больше 30.", "w": ["Чему равна сумма 25 и 30?", "Сложи 25 и 30.", "Какое число следует за 25?"], "h": "Высказывание — повествовательное предложение, про которое можно точно сказать, истинно оно или ложно. Вопрос и просьба (приказ) не истинны и не ложны. «25 больше 30.» — высказывание."}, {"q": "Какое высказывание ложное?", "a": "10 − 7 = 4", "w": ["2 + 2 = 4", "3 · 3 = 9", "12 : 4 = 3"], "h": "10 − 7 = 3, а не 4."}, {"q": "Какое из предложений — высказывание?", "a": "Число 12 делится на 3.", "w": ["В 4 классе уже 20 учеников?", "Реши задачу.", "Какое число больше?"], "h": "Высказывание — повествовательное предложение, про которое можно точно сказать, истинно оно или ложно. Вопрос и просьба (приказ) не истинны и не ложны. «Число 12 делится на 3.» — высказывание."}, {"q": "У игрального кубика сумма очков на противоположных гранях равна 7. Сколько очков на нижней грани, если на верхней 6?", "a": "1", "w": ["6", "3", "5"], "h": "Очки на верхней и нижней гранях в сумме дают 7: 7 − 6 = 1."}, {"q": "Башня из кубиков: в каждом слое 4 ряда по 3 кубика, слоёв 3. Сколько кубиков в башне?", "a": "36", "w": ["10", "12", "37"], "h": "В слое 4 ряда по 3: 4 · 3 = 12 кубиков. Слоёв 3: 12 · 3 = 36"}, {"q": "Из кубиков сложен большой куб 4 × 4 × 4. Сколько кубиков нужно добавить, чтобы получился куб 5 × 5 × 5?", "a": "61", "w": ["125", "16", "57"], "h": "Кубиков в большом кубе: 5 · 5 · 5 = 125. Уже есть: 64. Нужно добавить: 125 − 64 = 61"}, {"q": "Из кубиков сложен большой куб 2 × 2 × 2. Сколько кубиков нужно добавить, чтобы получился куб 3 × 3 × 3?", "a": "19", "w": ["27", "4", "17"], "h": "Кубиков в большом кубе: 3 · 3 · 3 = 27. Уже есть: 8. Нужно добавить: 27 − 8 = 19"}, {"q": "Башня из кубиков: в каждом слое 6 рядов по 5 кубиков, слоёв 3. Сколько кубиков в башне?", "a": "90", "w": ["14", "30", "18"], "h": "В слое 6 рядов по 5: 6 · 5 = 30 кубиков. Слоёв 3: 30 · 3 = 90"}, {"q": "У игрального кубика сумма очков на противоположных гранях равна 7. Сколько очков на нижней грани, если на верхней 1?", "a": "6", "w": ["4", "3", "5"], "h": "Очки на верхней и нижней гранях в сумме дают 7: 7 − 1 = 6."}, {"q": "У игрального кубика сумма очков на противоположных гранях равна 7. Сколько очков на нижней грани, если на верхней 4?", "a": "3", "w": ["6", "1", "5"], "h": "Очки на верхней и нижней гранях в сумме дают 7: 7 − 4 = 3."}, {"q": "Из кубиков сложен большой куб 3 × 3 × 3. Сколько кубиков нужно добавить, чтобы получился куб 4 × 4 × 4?", "a": "37", "w": ["64", "9", "34"], "h": "Кубиков в большом кубе: 4 · 4 · 4 = 64. Уже есть: 27. Нужно добавить: 64 − 27 = 37"}, {"q": "Башня из кубиков: в каждом слое 6 рядов по 3 кубика, слоёв 3. Сколько кубиков в башне?", "a": "54", "w": ["12", "18", "53"], "h": "В слое 6 рядов по 3: 6 · 3 = 18 кубиков. Слоёв 3: 18 · 3 = 54"}, {"q": "У игрального кубика сумма очков на противоположных гранях равна 7. Сколько очков на нижней грани, если на верхней 2?", "a": "5", "w": ["4", "6", "3"], "h": "Очки на верхней и нижней гранях в сумме дают 7: 7 − 2 = 5."}, {"q": "Сколько различных двузначных чисел можно записать цифрами 1, 2, если цифры могут повторяться?", "a": "4", "w": ["8", "7", "2"], "h": "Выписываем числа по порядку, по возрастанию: 11, 12, 21, 22. Всего 4 числа."}, {"q": "Три друга — Аян, Мира, Тимур — встали в очередь. Сколько существует разных вариантов порядка в очереди?", "a": "6", "w": ["3", "9", "12"], "h": "На первое место можно поставить любого из трёх, на второе — любого из двух оставшихся, на третье — последнего: 3 · 2 · 1 = 6."}, {"q": "В кафе можно выбрать 4 первых блюда, 2 вторых блюда и 3 напитка. Сколько разных обедов из трёх блюд можно составить?", "a": "24", "w": ["9", "11", "28"], "h": "Выбираем по одному из каждого списка и перемножаем: 4 · 2 · 3 = 24"}, {"q": "Сколько различных двузначных чисел можно записать цифрами 1, 2, 3, если цифры не повторяются?", "a": "6", "w": ["12", "9", "4"], "h": "Выписываем числа по порядку, по возрастанию: 12, 13, 21, 23, 31, 32. Всего 6 чисел."}, {"q": "7 друзей при встрече пожали друг другу руки (каждый с каждым по одному разу). Сколько всего рукопожатий?", "a": "21", "w": ["7", "42", "49"], "h": "Первый пожмёт руки 6 друзьям, второй — 5 новым и так далее. 6 + 5 + 4 + 3 + 2 + 1 = 21"}, {"q": "Сколько различных двузначных чисел можно записать цифрами 1, 4, 6, если цифры могут повторяться?", "a": "9", "w": ["18", "12", "7"], "h": "Выписываем числа по порядку, по возрастанию: 11, 14, 16, 41, 44, 46, 61, 64, 66. Всего 9 чисел."}, {"q": "У Айдара 3 футболки, 3 пары шорт и 3 кепки. Сколько разных комплектов можно составить (футболка + шорты + кепка)?", "a": "27", "w": ["9", "12", "30"], "h": "К каждой футболке подходит каждая пара шорт и каждая кепка: 3 · 3 · 3 = 27"}, {"q": "В кафе можно выбрать 2 первых блюда, 3 вторых блюда и 3 напитка. Сколько разных обедов из трёх блюд можно составить?", "a": "18", "w": ["8", "9", "20"], "h": "Выбираем по одному из каждого списка и перемножаем: 2 · 3 · 3 = 18"}, {"q": "Три друга — Алия, Дана, Ерлан — встали в очередь. Сколько существует разных вариантов порядка в очереди?", "a": "6", "w": ["3", "9", "12"], "h": "На первое место можно поставить любого из трёх, на второе — любого из двух оставшихся, на третье — последнего: 3 · 2 · 1 = 6."}, {"q": "Из села A в село B ведут 4 дороги, а из села B в село C — 3 дороги. Сколькими способами можно проехать из A в C через B?", "a": "12", "w": ["7", "16", "24"], "h": "Каждую из 4 дорог первого участка можно соединить с каждой из 3 дорог второго: 4 · 3 = 12"}]);
GENS.m414q = mkQuiz([{"q": "Какой дроби равны 20 %?", "a": "1/5", "w": ["1/100", "1/2", "1/4"], "h": "20 % = 20/100 = 1/5 — это пятая часть целого."}, {"q": "Сравни дробь с единицей. <span style=\"display:inline-block;text-align:center;vertical-align:middle;line-height:1;margin:0 2px\"><span style=\"display:block;padding:0 4px 2px;border-bottom:2px solid currentColor\">3</span><span style=\"display:block;padding-top:2px\">4</span></span> ? 1", "a": "<", "w": [">", "="], "h": "Единица — это 4/4. Числитель меньше знаменателя, значит, дробь меньше единицы."}, {"q": "Сравни дробь с единицей. <span style=\"display:inline-block;text-align:center;vertical-align:middle;line-height:1;margin:0 2px\"><span style=\"display:block;padding:0 4px 2px;border-bottom:2px solid currentColor\">5</span><span style=\"display:block;padding-top:2px\">5</span></span> ? 1", "a": "=", "w": ["<", ">"], "h": "Единица — это 5/5. Числитель равен знаменателю, значит, дробь равна единице."}, {"q": "Что такое один процент?", "a": "сотая часть целого", "w": ["десятая часть целого", "половина целого", "всё целое"], "h": "Процент — это одна сотая часть: 1 % = 1/100."}, {"q": "Как называют это число? <span style=\"display:inline-block;text-align:center;vertical-align:middle;line-height:1;margin:0 2px\"><span style=\"display:block;padding:0 4px 2px;border-bottom:2px solid currentColor\">10</span><span style=\"display:block;padding-top:2px\">5</span></span>", "a": "неправильная дробь", "w": ["правильная дробь", "смешанное число"], "h": "Числитель больше или равен знаменателю — дробь не меньше единицы. 10/5 — неправильная дробь."}, {"q": "Какой дроби равны 25 %?", "a": "1/4", "w": ["1/100", "1/2", "1/10"], "h": "25 % = 25/100 = 1/4 — это четверть целого."}, {"q": "Как называют это число? <span style=\"display:inline-block;text-align:center;vertical-align:middle;line-height:1;margin:0 2px\"><span style=\"display:block;padding:0 4px 2px;border-bottom:2px solid currentColor\">11</span><span style=\"display:block;padding-top:2px\">5</span></span>", "a": "неправильная дробь", "w": ["правильная дробь", "смешанное число"], "h": "Числитель больше или равен знаменателю — дробь не меньше единицы. 11/5 — неправильная дробь."}, {"q": "Сравни дробь с единицей. <span style=\"display:inline-block;text-align:center;vertical-align:middle;line-height:1;margin:0 2px\"><span style=\"display:block;padding:0 4px 2px;border-bottom:2px solid currentColor\">10</span><span style=\"display:block;padding-top:2px\">10</span></span> ? 1", "a": "=", "w": ["<", ">"], "h": "Единица — это 10/10. Числитель равен знаменателю, значит, дробь равна единице."}, {"q": "Как называют это число? 5 <span style=\"display:inline-block;text-align:center;vertical-align:middle;line-height:1;margin:0 2px\"><span style=\"display:block;padding:0 4px 2px;border-bottom:2px solid currentColor\">2</span><span style=\"display:block;padding-top:2px\">7</span></span></span>", "a": "смешанное число", "w": ["правильная дробь", "неправильная дробь"], "h": "Смешанное число — это сумма натурального числа и правильной дроби. 5 2/7 — смешанное число."}, {"q": "Сравни дроби с одинаковыми знаменателями. <span style=\"display:inline-block;text-align:center;vertical-align:middle;line-height:1;margin:0 2px\"><span style=\"display:block;padding:0 4px 2px;border-bottom:2px solid currentColor\">7</span><span style=\"display:block;padding-top:2px\">11</span></span> ? <span style=\"display:inline-block;text-align:center;vertical-align:middle;line-height:1;margin:0 2px\"><span style=\"display:block;padding:0 4px 2px;border-bottom:2px solid currentColor\">6</span><span style=\"display:block;padding-top:2px\">11</span></span>", "a": ">", "w": ["<", "="], "h": "У дробей с одинаковыми знаменателями больше та, у которой больше числитель: 7 > 6."}, {"q": "Вычти дроби с одинаковыми знаменателями. <span style=\"display:inline-block;text-align:center;vertical-align:middle;line-height:1;margin:0 2px\"><span style=\"display:block;padding:0 4px 2px;border-bottom:2px solid currentColor\">6</span><span style=\"display:block;padding-top:2px\">12</span></span> − <span style=\"display:inline-block;text-align:center;vertical-align:middle;line-height:1;margin:0 2px\"><span style=\"display:block;padding:0 4px 2px;border-bottom:2px solid currentColor\">3</span><span style=\"display:block;padding-top:2px\">12</span></span> = ?", "a": "3/12", "w": ["3/13", "9/12", "3/24"], "h": "Знаменатель не меняем, числители вычитаем: 6 − 3 = 3. 6/12 − 3/12 = 3/12"}, {"q": "Вычти дроби с одинаковыми знаменателями. <span style=\"display:inline-block;text-align:center;vertical-align:middle;line-height:1;margin:0 2px\"><span style=\"display:block;padding:0 4px 2px;border-bottom:2px solid currentColor\">5</span><span style=\"display:block;padding-top:2px\">11</span></span> − <span style=\"display:inline-block;text-align:center;vertical-align:middle;line-height:1;margin:0 2px\"><span style=\"display:block;padding:0 4px 2px;border-bottom:2px solid currentColor\">1</span><span style=\"display:block;padding-top:2px\">11</span></span> = ?", "a": "4/11", "w": ["4/12", "6/11", "4/22"], "h": "Знаменатель не меняем, числители вычитаем: 5 − 1 = 4. 5/11 − 1/11 = 4/11"}, {"q": "Найди две четвёртых числа 40.", "a": "20", "w": ["10", "30", "19"], "h": "Сначала находим одну долю: 40 : 4 = 10. Потом умножаем на числитель 2: 10 · 2 = 20"}, {"q": "Преобразуй неправильную дробь в смешанное число. <span style=\"display:inline-block;text-align:center;vertical-align:middle;line-height:1;margin:0 2px\"><span style=\"display:block;padding:0 4px 2px;border-bottom:2px solid currentColor\">7</span><span style=\"display:block;padding-top:2px\">5</span></span> = ?", "a": "1 2/5", "w": ["2 2/5", "1 3/5", "2 1/5"], "h": "Делим числитель на знаменатель: 7 : 5 = 1 (ост. 2). Целая часть — 1, остаток 2 — числитель дробной части. 7/5 = 1 2/5"}, {"q": "Вычти дроби с одинаковыми знаменателями. <span style=\"display:inline-block;text-align:center;vertical-align:middle;line-height:1;m ock;padding-top:2px\">7</span></span> − 2 <span style=\"display:inline-block;text-align:center;vertical-align:middle;line-height:1;margin:0 2px\"><span style=\"display:block;padding:0 4px 2px;border-bottom:2px solid currentColor\">1</span><span style=\"display:block;padding-top:2px\">7</span></span> = ?", "a": "1 4/7", "w": ["1 5/7", "2 4/7", "5 6/7"], "h": "Целые части вычитаем: 3 − 2 = 1. Дроби вычитаем: 5/7 − 1/7 = 4/7. Ответ: 1 4/7"}, {"q": "Найди 10 % от числа 90.", "a": "9", "w": ["90", "45", "18"], "h": "10 % — это одна десятая числа. 90 · 10 : 100 = 9"}, {"q": "Одна десятая числа равна 5. Найди число.", "a": "50", "w": ["5", "15", "40"], "h": "Число разделено на 10 равных частей. Одна часть равна 5. Всё число: 5 · 10 = 50"}, {"q": "Найди 50 % от числа 18.", "a": "9", "w": ["18", "14", "10"], "h": "50 % — это половина числа. 18 · 50 : 100 = 9"}, {"q": "Одна третья числа равна 4. Найди число.", "a": "12", "w": ["4", "7", "11"], "h": "Число разделено на 3 равные части. Одна часть равна 4. Всё число: 4 · 3 = 12"}, {"q": "Найди 75 % от числа 12.", "a": "9", "w": ["12", "6", "18"], "h": "75 % — это три четвёртых числа. 12 · 75 : 100 = 9"}]);
GENS.m415q = mkQuiz([{"q": "Радиус окружности 2 см. Чему равен диаметр?", "a": "4", "w": ["2", "3", "6"], "h": "Диаметр в 2 раза больше радиуса: 2 · 2 = 4 см"}, {"q": "Радиус окружности 8 см. Какой наибольшей длины может быть отрезок, соединяющий две точки этой окружности?", "a": "16", "w": ["8", "24", "10"], "h": "Самый длинный такой отрезок проходит через центр — это диаметр. Он равен 8 · 2 = 16 см."}, {"q": "Радиус окружности 11 см. Чему равен диаметр?", "a": "22", "w": ["11", "13", "121"], "h": "Диаметр в 2 раза больше радиуса: 11 · 2 = 22 см"}, {"q": "Какие радиусы одной окружности?", "a": "все равны", "w": ["все разной длины", "только два равных", "они равны диаметру"], "h": "Все радиусы одной окружности равны между собой."}, {"q": "Нужно начертить окружность радиусом 7 см. Какой раствор циркуля поставить?", "a": "7", "w": ["14", "8", "6"], "h": "Раствор циркуля равен радиусу: 7 см."}, {"q": "Каким инструментом чертят окружность?", "a": "циркулем", "w": ["линейкой", "угольником", "транспортиром"], "h": "Окружность чертят циркулем: ножка с иглой в центре, ножка с грифелем рисует линию."}, {"q": "Диаметр окружности 44 см. Найди радиус.", "a": "22", "w": ["44", "24", "88"], "h": "R = d : 2 = 44 : 2 = 22 см"}, {"q": "Нужно начертить окружность диаметром 4 см. Какой раствор циркуля поставить?", "a": "2", "w": ["4", "3", "8"], "h": "Раствор циркуля равен радиусу: 4 : 2 = 2 см."}, {"q": "Окружность с центром A и радиусом 9 см и окружность с центром B и радиусом 2 см имеют общую точку C, которая лежит на отрезке AB. Найди длину отрезка AB.", "a": "11", "w": ["7", "18", "13"], "h": "AC и CB — радиусы окружностей, точка C лежит на отрезке AB, поэтому AB = AC + CB = 9 + 2 = 11 см."}, {"q": "Сравни диаметр окружности радиусом 8 см и отрезок длиной 14 см. диаметр ? 14 см", "a": ">", "w": ["<", "="], "h": "Диаметр: 8 · 2 = 16 см. Сравниваем 16 и 14: диаметр больше отрезка."}, {"q": "Нужно начертить окружность радиусом 8 см. Какой раствор циркуля поставить?", "a": "8", "w": ["16", "9", "7"], "h": "Раствор циркуля равен радиусу: 8 см."}, {"q": "В ряд положили 6 одинаковых круглых монет радиусом 2 см так, что они касаются друг друга. Какова длина ряда?", "a": "24", "w": ["12", "4", "26"], "h": "Диаметр одной монеты: 2 · 2 = 4 см. Длина ряда: 4 · 6 = 24 см"}, {"q": "Сравни диаметр окружности радиусом 5 см и отрезок длиной 10 см. диаметр ? 10 см", "a": "=", "w": ["<", ">"], "h": "Диаметр: 5 · 2 = 10 см. Сравниваем 10 и 10: диаметр равен отрезку."}, {"q": "Диаметр окружности 38 см. Найди радиус.", "a": "19", "w": ["38", "21", "76"], "h": "R = d : 2 = 38 : 2 = 19 см"}, {"q": "Где ставят иглу циркуля?", "a": "в центр окружности", "w": ["на окружность", "вне окружности", "на диаметр"], "h": "Иглу циркуля ставят в центр, чтобы все точки окружности были на одинаковом расстоянии от него."}, {"q": "Клумба имеет форму круга диаметром 4 м. Вокруг неё сделали дорожку шириной 3 м. Каков диаметр круга вместе с дорожкой?", "a": "10", "w": ["7", "4", "12"], "h": "Дорожка есть с двух сторон клумбы: диаметр вырос на 3 · 2 = 6 м. 4 + 6 = 10 м"}, {"q": "Сколько радиусов можно провести в окружности?", "a": "сколько угодно", "w": ["один", "два", "четыре"], "h": "От центра можно провести бесконечно много радиусов, и все они равны."}, {"q": "Радиус окружности 12 см. Чему равен диаметр?", "a": "24", "w": ["12", "14", "144"], "h": "Диаметр в 2 раза больше радиуса: 12 · 2 = 24 см"}, {"q": "Радиус окружности 9 см. Чему равен диаметр?", "a": "18", "w": ["9", "11", "81"], "h": "Диаметр в 2 раза больше радиуса: 9 · 2 = 18 см"}, {"q": "Что показывает раствор циркуля?", "a": "радиус окружности", "w": ["диаметр окружности", "длину окружности", "площадь круга"], "h": "Расстояние между иглой и грифелем циркуля равно радиусу окружности."}, {"q": "В ряд положили 3 одинаковые круглые монеты радиусом 3 см так, что они касаются друг друга. Какова длина ряда?", "a": "18", "w": ["9", "6", "21"], "h": "Диаметр одной монеты: 3 · 2 = 6 см. Длина ряда: 6 · 3 = 18 см"}, {"q": "Радиус первой окружности 2 см. Радиус второй окружности на 3 см больше. Чему равен диаметр второй окружности?", "a": "10", "w": ["5", "7", "4"], "h": "Радиус второй окружности: 2 + 3 = 5 см. Диаметр: 5 · 2 = 10 см"}, {"q": "Радиус окружности 9 см. Точка A находится на расстоянии 12 см от центра. Где лежит точка A?", "a": "вне круга", "w": ["внутри круга", "на окружности"], "h": "Сравним расстояние с радиусом: 12 > 9. Значит, точка вне круга."}, {"q": "Радиус окружности 3 см. Найди диаметр.", "a": "6", "w": ["3", "5", "12"], "h": "d = R · 2 = 3 · 2 = 6 см"}, {"q": "Радиус окружности 4 см. Точка A находится на расстоянии 7 см от центра. Где лежит точка A?", "a": "вне круга", "w": ["внутри круга", "на окружности"], "h": "Сравним расстояние с радиусом: 7 > 4. Значит, точка вне круга."}, {"q": "Квадратная плитка со стороной 18 см. В неё вписали самый большой круг. Каков радиус круга?", "a": "9", "w": ["18", "11", "36"], "h": "Диаметр наибольшего круга равен стороне квадрата: 18 см. Радиус: 18 : 2 = 9 см."}, {"q": "Радиус окружности 8 см. Найди диаметр.", "a": "16", "w": ["8", "10", "32"], "h": "d = R · 2 = 8 · 2 = 16 см"}, {"q": "Чем окружность отличается от круга?", "a": "окружность — линия, круг — часть плоскости внутри неё", "w": ["окружность — часть плоскости, круг — линия", "это одно и то же", "у круга нет центра"], "h": "Окружность — это замкнутая линия. Круг — вся часть плоскости внутри этой линии, вместе с центром."}, {"q": "Нужно начертить окружность диаметром 10 см. Какой раствор циркуля поставить?", "a": "5", "w": ["10", "6", "20"], "h": "Раствор циркуля равен радиусу: 10 : 2 = 5 см."}, {"q": "Круглые крышки радиусом 5 см укладывают в коробку ровными рядами, крышки касаются друг друга и стенок коробки: 3 ряда, в каждом ряду 3 крышки. Какова ширина коробки вдоль ряда?", "a": "30", "w": ["15", "35", "31"], "h": "Диаметр одной крышки: 5 · 2 = 10 см. Ширина: 10 · 3 = 30 см"}]);
GENS.m416q = mkQuiz([{"q": "Сколько натуральных чисел x удовлетворяют неравенству? 44 < x < 48", "a": "3", "w": ["4", "5", "2"], "h": "Числа от 45 до 47: всего 3."}, {"q": "Найди x. 87 · x + 80 = 1 364 : 4", "a": "3", "w": ["4", "2", "341"], "h": "Правая часть: 1 364 : 4 = 341 87 · x = 341 − 80 = 261 x = 261 : 87 = 3"}, {"q": "Найди значение выражения. 7 · 9 · 4 + 4 + 5", "a": "261", "w": ["271", "251", "2 610"], "h": "Сначала действия в скобках, потом умножение и деление слева направо, в конце сложение и вычитание. Ответ: 7 · 9 · 4 + 4 + 5 = 261"}, {"q": "Найди x. 4 · x + 13 = 45", "a": "8", "w": ["32", "14", "7"], "h": "4 · x + 13 = 45 4 · x = 45 − 13 = 32 x = 32 : 4 = 8"}, {"q": "Сколько действий в выражении? 3 · (10 + 2) − 7 − (3 − 2)", "a": "5", "w": ["4", "6", "7"], "h": "Считаем знаки действий: + − · : — их 5."}, {"q": "Найди значение выражения. 9 · (10 − 2) + 11 · 4", "a": "116", "w": ["126", "106", "118"], "h": "Сначала действия в скобках, потом умножение и деление слева направо, в конце сложение и вычитание. Ответ: 9 · (10 − 2) + 11 · 4 = 116"}, {"q": "Найди значение выражения при a = 5 и b = 24. 3 · a + b : 3", "a": "23", "w": ["39", "13", "22"], "h": "Подставляем: 3 · 5 + 24 : 3 = 15 + 8 = 23"}, {"q": "Верно ли, что x = 22 — корень уравнения? 9 · x + 20 = 200", "a": "Неверно", "w": ["Верно"], "h": "Подставим: 9 · 22 + 20 = 218. Нужно 200, значит, неверно."}, {"q": "Найди значение выражения c · (a − b) при a = 5, b = 3 и c = 6.", "a": "12", "w": ["27", "8", "11"], "h": "c · (a − b) = 6 · (5 − 3) = 6 · 2 = 12"}, {"q": "Найди x. (x + 20) · 3 = 102", "a": "14", "w": ["34", "79", "13"], "h": "(x + 20) · 3 = 102 x + 20 = 102 : 3 = 34 x = 34 − 20 = 14"}, {"q": "Упрости выражение. 4y + 7y", "a": "11y", "w": ["28y", "11", "12y"], "h": "Слагаемые с одной и той же буквой можно соединить: считаем числа при букве, букву оставляем. 4y + 7y = (4 + 7) · y = 11y"}, {"q": "Найди значение выражения. (12 + 2) · 2 − 3 + 3 · 11", "a": "58", "w": ["68", "48", "60"], "h": "Снач
