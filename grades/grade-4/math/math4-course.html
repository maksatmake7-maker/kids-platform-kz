  {"id": "m4q1l19", "icon": "", "title": "Урок 19. Деление с остатком на 10, 100, 1 000", "goal": "Выполнять деление многозначных чисел на 10, 100, 1 000 с остатком и проверять результат", "steps": [{"id": "m4q1l19s1", "scene": "infoTap", "gate": true, "title": "Знакомимся с темой", "text": "Привет! Это Барсик. Сегодня учимся делить числа на 10, 100 и 1 000 с остатком — просто отделяя цифры справа. Нажимай на карточки.", "need": 5, "items": [{"k": "правило", "v": "", "t": "Чтобы разделить число на 10, 100, 1 000 с остатком, отделяем справа столько цифр, сколько нулей в делителе. Оставшееся число — частное, отделённые цифры — остаток. Пример: 80 786 : 100 = 807 (ост. 86)."}, {"k": "деление на 10", "v": "", "t": "На 10 отделяем одну цифру. Пример: 6 861 : 10 = 686 (ост. 1)."}, {"k": "деление на 1 000", "v": "", "t": "На 1 000 отделяем три цифры. Пример: 36 990 : 1 000 = 36 (ост. 990)."}, {"k": "нуль в начале остатка", "v": "", "t": "Если отделённые цифры начинаются с нуля, нуль в остатке не пишем. Пример: 5 006 : 1 000 = 5 (ост. 6), ведь отделили 006."}, {"k": "остаток меньше делителя", "v": "", "t": "Остаток всегда меньше делителя. При делении на 100 остаток от 0 до 99, при делении на 1 000 — от 0 до 999."}, {"k": "проверка", "v": "", "t": "Проверяем так: частное · делитель + остаток = делимое. Пример: 807 · 100 + 86 = 80 786."}]}, {"id": "m4q1l19s2", "scene": "sortGroups", "gate": true, "title": "Разложи по группам", "text": "Разложи карточки по группам. Выбери, к какой группе относится каждая карточка.", "q": "В какую группу относится?", "take": 8, "groups": [{"e": "", "k": "Однозначное частное"}, {"e": "", "k": "Двузначное частное"}, {"e": "", "k": "Трёхзначное частное"}], "items": [{"g": 1, "e": "", "t": "394 : 10", "h": "остаток 4"}, {"g": 0, "e": "", "t": "8 166 : 1 000", "h": "остаток 166"}, {"g": 0, "e": "", "t": "9 956 : 1 000", "h": "остаток 956"}, {"g": 1, "e": "", "t": "2 576 : 100", "h": "остаток 76"}, {"g": 2, "e": "", "t": "2 845 : 10", "h": "остаток 5"}, {"g": 0, "e": "", "t": "651 : 100", "h": "остаток 51"}, {"g": 2, "e": "", "t": "55 234 : 100", "h": "остаток 34"}, {"g": 2, "e": "", "t": "867 320 : 1 000", "h": "остаток 320"}, {"g": 1, "e": "", "t": "38 967 : 1 000", "h": "остаток 967"}]}, {"id": "m4q1l19s3", "scene": "quiz", "gate": true, "title": "Проверяем себя", "text": "Выбери верный ответ.", "count": 6, "gens": ["m4q1l19q"]}, {"id": "m4q1l19s4", "scene": "quiz", "gate": true, "title": "Верно или неверно", "text": "Верно или неверно? Подумай и выбери ответ.", "count": 5, "gens": ["m4q1l19t"]}]},
  {"id": "m4q1l20", "icon": "", "title": "Урок 20. Отношения между множествами", "goal": "Определять отношения между множествами: равные, подмножество, пересечение, объединение", "steps": [{"id": "m4q1l20s1", "scene": "infoTap", "gate": true, "title": "Знакомимся с темой", "text": "Привет! Это Барсик. Сегодня узнаем, как могут быть связаны два множества: равные, подмножество, пересечение и объединение. Нажимай на карточки.", "need": 5, "items": [{"k": "множество", "v": "", "t": "Множество — группа объектов, которых что-то объединяет. Объекты — элементы множества. Записываем в фигурных скобках: A = {К, О, Т}. В этом множестве 3 элемента."}, {"k": "равные множества", "v": "", "t": "Равные множества совпадают по составу и количеству элементов. Порядок не важен: {К, О, Т} = {Т, К, О}. Записывают A = B."}, {"k": "подмножество", "v": "", "t": "Если все элементы множества A есть в множестве B, то A — подмножество B. Записывают A ⊂ B. Пример: {2, 4} ⊂ {1, 2, 3, 4}."}, {"k": "пересечение", "v": "", "t": "Пересечение — общие элементы двух множеств (в названии слово «И»). Пример: для {1, 2, 3} и {2, 3, 4} пересечение — {2, 3}. Если общих элементов нет, множества не пересекаются."}, {"k": "объединение", "v": "", "t": "Объединение — все элементы обоих множеств (в названии слово «ИЛИ»). Общие элементы записываем один раз. Пример: для {1, 2, 3} и {2, 3, 4} объединение — {1, 2, 3, 4}."}, {"k": "круги Эйлера", "v": "", "t": "Множества рисуют кругами. Общая часть двух кругов — пересечение. Круги не соприкасаются — множества не пересекаются. Подмножество рисуют внутри большого круга."}]}, {"id": "m4q1l20s2", "scene": "sortGroups", "gate": true, "title": "Разложи по группам", "text": "Разложи карточки по группам. Выбери, к какой группе относится каждая карточка.", "q": "В какую группу относится?", "take": 8, "groups": [{"e": "", "k": "Равные множества"}, {"e": "", "k": "Подмножество"}, {"e": "", "k": "Нет общих элементов"}], "items": [{"g": 0, "e": "", "t": "{Алматы, Тараз, Актау} и {Тараз, Алматы, Актау}", "h": "те же элементы"}, {"g": 0, "e": "", "t": "{Павлодар, Шымкент} и {Шымкент, Павлодар}", "h": "те же элементы"}, {"g": 1, "e": "", "t": "{арбуз, абрикос, груша} и {груша, слива, арбуз, абрикос, яблоко}", "h": "один внутри другого"}, {"g": 1, "e": "", "t": "{Шымкент, Туркестан, Тараз, Павлодар} и {Павлодар, Тараз}", "h": "один внутри другого"}, {"g": 0, "e": "", "t": "{персик, виноград, яблоко} и {персик, яблоко, виноград}", "h": "те же элементы"}, {"g": 2, "e": "", "t": "{дыня, яблоко, Шымкент} и {Семей, Атырау}", "h": "ничего общего"}, {"g": 1, "e": "", "t": "{персик, груша} и {абрикос, груша, арбуз, персик}", "h": "один внутри другого"}, {"g": 2, "e": "", "t": "{дыня, слива, Актау} и {Астана, яблоко}", "h": "ничего общего"}, {"g": 2, "e": "", "t": "{виноград, слива} и {Павлодар, абрикос}", "h": "ничего общего"}]}, {"id": "m4q1l20s3", "scene": "quiz", "gate": true, "title": "Проверяем себя", "text": "Выбери верный ответ.", "count": 6, "gens": ["m4q1l20q"]}, {"id": "m4q1l20s4", "scene": "quiz", "gate": true, "title": "Верно или неверно", "text": "Верно или неверно? Подумай и выбери ответ.", "count": 5, "gens": ["m4q1l20t"]}]},
  {"id": "m4q1l21", "icon": "", "title": "Урок 21. Задачи на движение: скорость", "goal": "Находить скорость по расстоянию и времени и записывать её в км/ч, м/мин, м/с", "steps": [{"id": "m4q1l21s1", "scene": "infoTap", "gate": true, "title": "Знакомимся с темой", "text": "Привет! Это Барсик. Сегодня учимся решать задачи на движение и находить скорость. Нажимай на карточки.", "need": 5, "items": [{"k": "скорость", "v": "", "t": "Скорость — это расстояние, пройденное за единицу времени: за 1 час, 1 минуту или 1 секунду. Например, 60 км/ч — это 60 км за каждый час."}, {"k": "единицы скорости", "v": "", "t": "Скорость измеряют в км/ч, м/мин, м/с. Бегун, который пробегает 5 м за каждую секунду, имеет скорость 5 м/с."}, {"k": "формула скорости", "v": "", "t": "v = S : t. Чтобы найти скорость, расстояние делим на время. Поезд прошёл 210 км за 3 ч: 210 : 3 = 70 км/ч."}, {"k": "три величины", "v": "", "t": "Есть три связанные величины: скорость v, время t и расстояние S. S = v · t, v = S : t, t = S : v. Например, 40 · 3 = 120, 120 : 3 = 40."}, {"k": "единицы должны совпадать", "v": "", "t": "Метры и минуты дают м/мин, километры и часы — км/ч. Алия прошла 600 м за 10 мин: 600 : 10 = 60 м/мин, а не км/ч."}, {"k": "проверка", "v": "", "t": "Проверяем умножением: скорость · время = расстояние. Было 70 км/ч, и 70 · 3 = 210 км — совпало."}]}, {"id": "m4q1l21s2", "scene": "sortGroups", "gate": true, "title": "Разложи по группам", "text": "Разложи карточки по группам. Выбери, к какой группе относится каждая карточка.", "q": "В какую группу относится?", "take": 8, "groups": [{"e": "", "k": "Скорость"}, {"e": "", "k": "Время"}, {"e": "", "k": "Расстояние"}], "items": [{"g": 0, "e": "", "t": "За каждый час поезд проходит 70 км", "h": "за 1 час"}, {"g": 0, "e": "", "t": "Измеряется в км/ч, м/мин, м/с", "h": "единицы"}, {"g": 0, "e": "", "t": "Расстояние, делённое на время", "h": "деление"}, {"g": 1, "e": "", "t": "Сколько часов автобус ехал до Туркестана", "h": "сколько длился путь"}, {"g": 1, "e": "", "t": "Измеряется в ч, мин, с", "h": "единицы"}, {"g": 1, "e": "", "t": "Находят, разделив путь на скорость", "h": "деление"}, {"g": 2, "e": "", "t": "Длина пути от Шымкента до Туркестана", "h": "длина пути"}, {"g": 2, "e": "", "t": "Измеряется в км и м", "h": "единицы"}, {"g": 2, "e": "", "t": "Находят, умножив скорость на время", "h": "умножение"}]}, {"id": "m4q1l21s3", "scene": "quiz", "gate": true, "title": "Проверяем себя", "text": "Выбери верный ответ.", "count": 6, "gens": ["m4q1l21q"]}, {"id": "m4q1l21s4", "scene": "quiz", "gate": true, "title": "Верно или неверно", "text": "Верно или неверно? Подумай и выбери ответ.", "count": 5, "gens": ["m4q1l21t"]}]},
  {"id": "m4q1l22", "icon": "", "title": "Урок 22. Задачи на движение: время и расстояние", "goal": "Находить время и расстояние по формулам t = S : v и S = v · t и переводить единицы скорости", "steps": [{"id": "m4q1l22s1", "scene": "infoTap", "gate": true, "title": "Знакомимся с темой", "text": "Привет! Это Барсик. Сегодня учимся находить время и расстояние. Нажимай на карточки.", "need": 5, "items": [{"k": "расстояние", "v": "", "t": "S = v · t. Чтобы найти расстояние, скорость умножаем на время. Автомобиль едет 50 км/ч 4 часа: 50 · 4 = 200 км."}, {"k": "время", "v": "", "t": "t = S : v. Чтобы найти время, расстояние делим на скорость. До посёлка 360 км, скорость 90 км/ч: 360 : 90 = 4 ч."}, {"k": "треугольник", "v": "", "t": "Прикрой пальцем нужную величину в треугольнике S, v, t. Если S сверху, то S = v · t. Если закрыли v или t, то делим S на другую величину."}, {"k": "км/ч в м/мин", "v": "", "t": "В 1 километре 1 000 метров, в 1 часе 60 минут. Поэтому 36 км/ч = 36 · 1 000 : 60 = 600 м/мин."}, {"k": "единицы", "v": "", "t": "Если скорость в м/мин, то время берём в минутах, а расстояние получим в метрах. 80 м/мин · 25 мин = 2 000 м."}, {"k": "проверка", "v": "", "t": "Время 3 ч при скорости 90 км/ч: 90 · 3 = 270 км. Совпало с расстоянием, значит, всё верно."}]}, {"id": "m4q1l22s2", "scene": "sortGroups", "gate": true, "title": "Разложи по группам", "text": "Разложи карточки по группам. Выбери, к какой группе относится каждая карточка.", "q": "В какую группу относится?", "take": 8, "groups": [{"e": "", "k": "Найти время"}, {"e": "", "k": "Найти расстояние"}, {"e": "", "k": "Перевести скорость"}], "items": [{"g": 0, "e": "", "t": "Расстояние делим на скорость", "h": "деление"}, {"g": 0, "e": "", "t": "Автобус едет 90 км/ч. За сколько часов он проедет 270 км?", "h": "вопрос"}, {"g": 0, "e": "", "t": "t = S : v", "h": "формула"}, {"g": 1, "e": "", "t": "Скорость умножаем на время", "h": "умножение"}, {"g": 1, "e": "", "t": "Бегун бежит 200 м/мин 5 минут. Сколько метров он пробежал?", "h": "вопрос"}, {"g": 1, "e": "", "t": "S = v · t", "h": "формула"}, {"g": 2, "e": "", "t": "6 км/ч выразить в м/мин", "h": "другие единицы"}, {"g": 2, "e": "", "t": "В 1 км — 1 000 м, в 1 ч — 60 мин", "h": "правило"}, {"g": 2, "e": "", "t": "120 м/мин выразить в м/с", "h": "другие единицы"}]}, {"id": "m4q1l22s3", "scene": "quiz", "gate": true, "title": "Проверяем себя", "text": "Выбери верный ответ.", "count": 6, "gens": ["m4q1l22q"]}, {"id": "m4q1l22s4", "scene": "quiz", "gate": true, "title": "Верно или неверно", "text": "Верно или неверно? Подумай и выбери ответ.", "count": 5, "gens": ["m4q1l22t"]}]},
  {"id": "m4q1l23", "icon": "", "title": "Урок 23. Задачи на движение: разные ситуации", "goal": "Решать задачи на движение навстречу, в противоположные стороны и вдогонку", "steps": [{"id": "m4q1l23s1", "scene": "infoTap", "gate": true, "title": "Знакомимся с темой", "text": "Привет! Это Барсик. Сегодня решаем задачи, где двое движутся одновременно. Нажимай на карточки.", "need": 5, "items": [{"k": "навстречу", "v": "", "t": "Если двое едут друг к другу, расстояние между ними сокращается на сумму скоростей. Скорости 4 км/ч и 6 км/ч: 4 + 6 = 10 км/ч — это скорость сближения."}, {"k": "в противоположные стороны", "v": "", "t": "Если двое отъезжают от одного места в разные стороны, расстояние растёт на сумму скоростей. Скорости 15 и 12 км/ч: 15 + 12 = 27 км/ч — скорость удаления."}, {"k": "вдогонку", "v": "", "t": "Если двое едут в одну сторону, а сзади — тот, кто быстрее, расстояние сокращается на разность скоростей. 80 − 60 = 20 м/мин."}, {"k": "время встречи", "v": "", "t": "Время находим по формуле t = S : v, где v — скорость сближения. Расстояние 180 км, скорости 40 и 50 км/ч: 180 : (40 + 50) = 2 ч."}, {"k": "расстояние за время", "v": "", "t": "Расстояние между двумя телами за время t: S = (v1 + v2) · t, где v1 и v2 — скорости. При 15 и 12 км/ч за 4 ч: 27 · 4 = 108 км."}, {"k": "чертёж", "v": "", "t": "Сделай схему: нарисуй отрезок, стрелки скоростей и поставь знак вопроса. Чертёж помогает понять, складывать скорости или вычитать."}]}, {"id": "m4q1l23s2", "scene": "sortGroups", "gate": true, "title": "Разложи по группам", "text": "Разложи карточки по группам. Выбери, к какой группе относится каждая карточка.", "q": "В какую группу относится?", "take": 8, "groups": [{"e": "", "k": "Навстречу"}, {"e": "", "k": "В противоположные стороны"}, {"e": "", "k": "Вдогонку"}], "items": [{"g": 0, "e": "", "t": "Скорость сближения — сумма скоростей", "h": "сложение"}, {"g": 0, "e": "", "t": "Расстояние между ними сокращается, они выехали из разных мест друг к другу", "h": "сближение"}, {"g": 0, "e": "", "t": "Время встречи: расстояние : сумма скоростей", "h": "встреча"}, {"g": 1, "e": "", "t": "Скорость удаления — сумма скоростей", "h": "сложение"}, {"g": 1, "e": "", "t": "Стартовали из одного места и разъезжаются", "h": "расходятся"}, {"g": 1, "e": "", "t": "Расстояние между ними растёт", "h": "растёт"}, {"g": 2, "e": "", "t": "Скорость сближения — разность скоростей", "h": "вычитание"}, {"g": 2, "e": "", "t": "Едут в одну сторону, один впереди", "h": "один за другим"}, {"g": 2, "e": "", "t": "Время: расстояние : разность скоростей", "h": "догнать"}]}, {"id": "m4q1l23s3", "scene": "quiz", "gate": true, "title": "Проверяем себя", "text": "Выбери верный ответ.", "count": 6, "gens": ["m4q1l23q"]}, {"id": "m4q1l23s4", "scene": "quiz", "gate": true, "title": "Верно или неверно", "text": "Верно или неверно? Подумай и выбери ответ.", "count": 5, "gens": ["m4q1l23t"]}]},
  {"id": "m4q1l24", "icon": "", "title": "Урок 24. Свойства объединения и пересечения множеств", "goal": "Применять переместительное и сочетательное свойства объединения и пересечения множеств", "steps": [{"id": "m4q1l24s1", "scene": "infoTap", "gate": true, "title": "Знакомимся с темой", "text": "Привет! Это Барсик. Сегодня узнаём, как можно переставлять множества и скобки при пересечении и объединении. Нажимай на карточки.", "need": 5, "items": [{"k": "пересечение", "v": "", "t": "Пересечение множеств A и B (A ∩ B) — общие элементы. A = { 1; 2; 3; 4 }, B = { 3; 4; 5 }: A ∩ B = { 3; 4 }."}, {"k": "объединение", "v": "", "t": "Объединение множеств A и B (A ∪ B) — все элементы обоих множеств. Повторы пишем один раз: A ∪ B = { 1; 2; 3; 4; 5 }."}, {"k": "переместительное свойство", "v": "", "t": "Порядок множеств не влияет на результат: A ∩ B = B ∩ A и A ∪ B = B ∪ A. Например, B ∩ A = { 3; 4 }, как и A ∩ B."}, {"k": "сочетательное свойство", "v": "", "t": "Скобки можно расставить по-разному: (A ∩ B) ∩ C = A ∩ (B ∩ C) и (A ∪ B) ∪ C = A ∪ (B ∪ C). Для A, B и C из примера (A ∩ B) ∩ C = { 4 }."}, {"k": "круги Эйлера", "v": "", "t": "Множества рисуют кругами. Общая часть кругов — пересечение, весь рисунок из кругов вместе — объединение."}, {"k": "не путай знаки", "v": "", "t": "Знак ∩ похож на арку, это пересечение. Знак ∪ похож на чашу, это объединение. Для { 2; 4 } и { 4; 6 }: ∩ даёт { 4 }, ∪ даёт { 2; 4; 6 }."}]}, {"id": "m4q1l24s2", "scene": "sortGroups", "gate": true, "title": "Разложи по группам", "text": "Разложи карточки по группам. Выбери, к какой группе относится каждая карточка.", "q": "В какую группу относится?", "take": 8, "groups": [{"e": "", "k": "Пересечение"}, {"e": "", "k": "Объединение"}, {"e": "", "k": "Свойства"}], "items": [{"g": 0, "e": "", "t": "Общие элементы двух множеств", "h": "общее"}, {"g": 0, "e": "", "t": "Общая часть двух кругов Эйлера", "h": "круги"}, {"g": 0, "e": "", "t": "Знак ∩", "h": "знак"}, {"g": 1, "e": "", "t": "Все элементы обоих множеств, повторы пишем один раз", "h": "всё вместе"}, {"g": 1, "e": "", "t": "Весь рисунок из двух кругов Эйлера", "h": "круги"}, {"g": 1, "e": "", "t": "Знак ∪", "h": "знак"}, {"g": 2, "e": "", "t": "Порядок множеств не влияет на результат", "h": "порядок"}, {"g": 2, "e": "", "t": "Скобки можно расставить по-разному", "h": "скобки"}, {"g": 2, "e": "", "t": "Есть и у пересечения, и у объединения", "h": "правила"}]}, {"id": "m4q1l24s3", "scene": "quiz", "gate": true, "title": "Проверяем себя", "text": "Выбери верный ответ.", "count": 6, "gens": ["m4q1l24q"]}, {"id": "m4q1l24s4", "scene": "quiz", "gate": true, "title": "Верно или неверно", "text": "Верно или неверно? Подумай и выбери ответ.", "count": 5, "gens": ["m4q1l24t"]}]},
  {"id": "m4q1l25", "icon": "", "title": "Урок 25. Множества при решении задач", "goal": "Решать задачи с помощью кругов Эйлера и подсчитывать число элементов объединения и пересечения", "steps": [{"id": "m4q1l25s1", "scene": "infoTap", "gate": true, "title": "Знакомимся с темой", "text": "Привет! Это Барсик. Сегодня решаем задачи с помощью кругов Эйлера. Нажимай на карточки.", "need": 5, "items": [{"k": "круги Эйлера", "v": "", "t": "Каждое множество рисуют кругом. Если у множеств есть общие элементы, круги пересекаются, а общая часть — это пересечение."}, {"k": "подмножество", "v": "", "t": "Если все элементы одного множества входят в другое, рисуют один круг внутри другого. Например, все тюльпаны — цветы."}, {"k": "нет общих элементов", "v": "", "t": "Если общих элементов нет, круги рисуют отдельно. Овощи и фрукты — такие множества."}, {"k": "сколько в объединении", "v": "", "t": "Чтобы найти число элементов объединения, складываем числа элементов и вычитаем общие. 17 + 15 − 6 = 26."}, {"k": "только одно множество", "v": "", "t": "Чтобы узнать, сколько элементов только в одном множестве, вычитаем общих. Из 17 футболистов 6 ещё и шахматисты: 17 − 6 = 11."}, {"k": "ни то ни другое", "v": "", "t": "Сначала находим, сколько элементов в объединении, потом вычитаем из общего числа. 28 − 26 = 2 ученика не ходят ни в одну секцию."}]}, {"id": "m4q1l25s2", "scene": "sortGroups", "gate": true, "title": "Разложи по группам", "text": "Разложи карточки по группам. Выбери, к какой группе относится каждая карточка.", "q": "В какую группу относится?", "take": 8, "groups": [{"e": "", "k": "Круги пересекаются"}, {"e": "", "k": "Один круг внутри другого"}, {"e": "", "k": "Круги не пересекаются"}], "items": [{"g": 0, "e": "", "t": "Любители футбола и любители шахмат, среди которых есть любящие оба", "h": "есть общие"}, {"g": 0, "e": "", "t": "Числа, кратные 2, и числа, кратные 5 (общее — 10, 20)", "h": "есть общие"}, {"g": 0, "e": "", "t": "Бегуны и прыгуны, часть ребят занимается обоими видами", "h": "часть общая"}, {"g": 1, "e": "", "t": "Животные и верблюды", "h": "часть и целое"}, {"g": 1, "e": "", "t": "Транспорт и автобусы", "h": "часть и целое"}, {"g": 1, "e": "", "t": "Числа и чётные числа", "h": "часть и целое"}, {"g": 2, "e": "", "t": "Мальчики и девочки в классе", "h": "нет общих"}, {"g": 2, "e": "", "t": "Квадраты и треугольники", "h": "нет общих"}, {"g": 2, "e": "", "t": "Дни недели и месяцы года", "h": "нет общих"}]}, {"id": "m4q1l25s3", "scene": "quiz", "gate": true, "title": "Проверяем себя", "text": "Выбери верный ответ.", "count": 6, "gens": ["m4q1l25q"]}, {"id": "m4q1l25s4", "scene": "quiz", "gate": true, "title": "Верно или неверно", "text": "Верно или неверно? Подумай и выбери ответ.", "count": 5, "gens": ["m4q1l25t"]}]},
  {"id": "m4q1l26", "icon": "", "title": "Урок 26. Куб и прямоугольный параллелепипед. Объём", "goal": "Находить объём куба и прямоугольного параллелепипеда по формуле V = a · b · c", "steps": [{"id": "m4q1l26s1", "scene": "infoTap", "gate": true, "title": "Знакомимся с темой", "text": "Привет! Это Барсик. Сегодня учимся находить объём коробок, аквариумов и бассейнов. Нажимай на карточки.", "need": 5, "items": [{"k": "куб", "v": "", "t": "Куб — фигура, у которой все 6 граней — равные квадраты, а все 12 рёбер равны. Пример: ящик с ребром 4 дм — это куб."}, {"k": "параллелепипед", "v": "", "t": "У прямоугольного параллелепипеда 6 граней — прямоугольники. Противоположные грани равны. Пример: кирпич 25 см × 12 см × 6 см."}, {"k": "измерения", "v": "", "t": "Длины трёх рёбер с общим концом называют измерениями: длина a, ширина b, высота c. Пример: a = 5 см, b = 4 см, c = 3 см."}, {"k": "объём", "v": "", "t": "Объём фигуры — это мера пространства, которое она занимает. Единицы объёма: см³, дм³, м³. Пример: 1 см³ — объём кубика с ребром 1 см."}, {"k": "формула V", "v": "", "t": "V = a · b · c. Пример: a = 5, b = 4, c = 3. V = 5 · 4 · 3 = 60 см³. У куба V = a · a · a = a³: ребро 3 см даёт 3 · 3 · 3 = 27 см³."}, {"k": "единицы объёма", "v": "", "t": "1 дм³ = 1 000 см³. 1 м³ = 1 000 дм³. 1 л = 1 дм³. Пример: 3 м³ = 3 000 дм³. Не путай: объём — в кубических единицах, площадь — в квадратных."}]}, {"id": "m4q1l26s2", "scene": "sortGroups", "gate": true, "title": "Разложи по группам", "text": "Разложи карточки по группам. Выбери, к какой группе относится каждая карточка.", "q": "В какую группу относится?", "take": 8, "groups": [{"e": "", "k": "Куб"}, {"e": "", "k": "Прямоугольный параллелепипед"}, {"e": "", "k": "Единица объёма"}], "items": [{"g": 0, "e": "", "t": "коробка 7 см × 7 см × 7 см", "h": "измерения равны"}, {"g": 0, "e": "", "t": "ящик с ребром 4 дм", "h": "одно ребро"}, {"g": 0, "e": "", "t": "сундучок 2 м × 2 м × 2 м", "h": "все по 2 м"}, {"g": 1, "e": "", "t": "кирпич 25 см × 12 см × 6 см", "h": "разные измерения"}, {"g": 1, "e": "", "t": "аквариум 50 см × 30 см × 40 см", "h": "разные измерения"}, {"g": 1, "e": "", "t": "бассейн 25 м × 10 м × 2 м", "h": "разные измерения"}, {"g": 2, "e": "", "t": "см³", "h": "малая"}, {"g": 2, "e": "", "t": "дм³", "h": "средняя"}, {"g": 2, "e": "", "t": "м³", "h": "большая"}]}, {"id": "m4q1l26s3", "scene": "quiz", "gate": true, "title": "Проверяем себя", "text": "Выбери верный ответ.", "count": 6, "gens": ["m4q1l26q"]}, {"id": "m4q1l26s4", "scene": "quiz", "gate": true, "title": "Верно или неверно", "text": "Верно или неверно? Подумай и выбери ответ.", "count": 5, "gens": ["m4q1l26t"]}]},
  {"id": "m4q1l27", "icon": "", "title": "Урок 27. Зависимость между величинами", "goal": "Находить неизвестную величину по зависимости между величинами и объяснять, как меняется результат", "steps": [{"id": "m4q1l27s1", "scene": "infoTap", "gate": true, "title": "Знакомимся с темой", "text": "Привет! Это Барсик. Сегодня разберёмся, как связаны цена, количество и стоимость, а также длина, ширина, высота и объём. Нажимай на карточки.", "need": 5, "items": [{"k": "стоимость", "v": "", "t": "Стоимость = цена · количество. 1 кг риса стоит 450 тг. За 3 кг: 450 · 3 = 1 350. Заплатим 1 350 тг."}, {"k": "цена", "v": "", "t": "Цена = стоимость : количество. За 3 кг заплатили 1 350 тг. 1 350 : 3 = 450. Один килограмм стоит 450 тг."}, {"k": "количество", "v": "", "t": "Количество = стоимость : цена. Килограмм стоит 450 тг, заплатили 1 350 тг. 1 350 : 450 = 3. Купили 3 кг."}, {"k": "объём и измерения", "v": "", "t": "V = a · b · c. Если известны V, a и b, то высота c = V : (a · b). Пример: V = 120 см³, a = 8 см, b = 5 см. c = 120 : (8 · 5) = 3 см."}, {"k": "как меняется результат", "v": "", "t": "Если один множитель стал больше в несколько раз, произведение стало больше во столько же раз. Пример: 4 · 5 = 20, а 4 · 10 = 40. Множитель вырос в 2 раза — и результат тоже в 2 раза."}, {"k": "квадрат и куб числа", "v": "", "t": "a² = a · a, a³ = a · a · a. Пример: 4² = 4 · 4 = 16, 4³ = 4 · 4 · 4 = 64. Не путай с умножением на 2 или на 3."}]}, {"id": "m4q1l27s2", "scene": "sortGroups", "gate": true, "title": "Разложи по группам", "text": "Разложи карточки по группам. Выбери, к какой группе относится каждая карточка.", "q": "В какую группу относится?", "take": 8, "groups": [{"e": "", "k": "Объём V"}, {"e": "", "k": "Высота c"}, {"e": "", "k": "Площадь дна"}], "items": [{"g": 0, "e": "", "t": "a · b · c", "h": "три множителя"}, {"g": 0, "e": "", "t": "5 см × 4 см × 3 см. Чему равен объём?", "h": "умножаем все три"}, {"g": 0, "e": "", "t": "длину, ширину и высоту умножить", "h": "три измерения"}, {"g": 1, "e": "", "t": "V : (a · b)", "h": "делим"}, {"g": 1, "e": "", "t": "V = 60 см³, a = 5 см, b = 4 см. Чему равно c?", "h": "60 : 20"}, {"g": 1, "e": "", "t": "объём разделить на площадь дна", "h": "делим"}, {"g": 2, "e": "", "t": "a · b", "h": "два множителя"}, {"g": 2, "e": "", "t": "a = 5 см, b = 4 см. Найди a · b", "h": "5 · 4"}, {"g": 2, "e": "", "t": "длину умножить на ширину", "h": "два измерения"}]}, {"id": "m4q1l27s3", "scene": "quiz", "gate": true, "title": "Проверяем себя", "text": "Выбери верный ответ.", "count": 6, "gens": ["m4q1l27q"]}, {"id": "m4q1l27s4", "scene": "quiz", "gate": true, "title": "Верно или неверно", "text": "Верно или неверно? Подумай и выбери ответ.", "count": 5, "gens": ["m4q1l27t"]}]},
  {"id": "m4q1l28", "icon": "", "title": "Урок 28. Площадь комбинированных фигур", "goal": "Находить площадь комбинированной фигуры разными способами: складывая площади частей или вычитая вырез", "steps": [{"id": "m4q1l28s1", "scene": "infoTap", "gate": true, "title": "Знакомимся с темой", "text": "Привет! Это Барсик. Сегодня считаем площадь фигур сложной формы: полов, участков и площадок. Нажимай на карточки.", "need": 5, "items": [{"k": "комбинированная фигура", "v": "", "t": "Комбинированная фигура состоит из нескольких простых фигур, например из прямоугольников. Площадь комбинированной фигуры равна сумме площадей её частей."}, {"k": "складываем части", "v": "", "t": "Фигура из двух прямоугольников: 6 м × 4 м и 3 м × 2 м. S₁ = 6 · 4 = 24 м², S₂ = 3 · 2 = 6 м². S = 24 + 6 = 30 м²."}, {"k": "вычитаем вырез", "v": "", "t": "Из прямоугольника 10 м × 8 м вырезали прямоугольник 4 м × 3 м. S = 10 · 8 − 4 · 3 = 80 − 12 = 68 м²."}, {"k": "разные способы", "v": "", "t": "Площадь фигуры можно найти двумя способами. Прямоугольник 10 м × 7 м с вырезом 3 м × 2 м в углу. Способ 1: 10 · 7 − 3 · 2 = 70 − 6 = 64. Способ 2: 7 · 7 + 3 · 5 = 49 + 15 = 64. Ответ: 64 м²."}, {"k": "периметр", "v": "", "t": "Периметр — сумма длин всех сторон. Если из угла прямоугольника вырезать часть, периметр не изменится. Прямоугольник 10 м × 7 м: P = (10 + 7) · 2 = 34 м."}, {"k": "единицы площади", "v": "", "t": "1 м² = 100 дм², 1 дм² = 100 см², 1 см² = 100 мм². Пример: 2 100 дм² = 21 м², потому что 2 100 : 100 = 21."}]}, {"id": "m4q1l28s2", "scene": "sortGroups", "gate": true, "title": "Разложи по группам", "text": "Разложи карточки по группам. Выбери, к какой группе относится каждая карточка.", "q": "В какую группу относится?", "take": 8, "groups": [{"e": "", "k": "Сложить площади частей"}, {"e": "", "k": "Вычесть площадь выреза"}, {"e": "", "k": "Найти периметр"}], "items": [{"g": 0, "e": "", "t": "двор из двух прямоугольников 6 м × 4 м и 3 м × 2 м", "h": "две части"}, {"g": 0, "e": "", "t": "пол из двух комнат 5 м × 3 м и 4 м × 2 м", "h": "две части"}, {"g": 0, "e": "", "t": "фигура из квадратов со сторонами 5 см и 3 см", "h": "два квадрата"}, {"g": 1, "e": "", "t": "стена 6 м × 3 м с окном 2 м × 1 м, которое не красят", "h": "окно"}, {"g": 1, "e": "", "t": "участок 20 м × 15 м, на нём дом 8 м × 5 м", "h": "дом"}, {"g": 1, "e": "", "t": "из квадрата 9 см × 9 см вырезали угол 3 см × 3 см", "h": "угол"}, {"g": 2, "e": "", "t": "забор вокруг двора 10 м × 8 м", "h": "вокруг"}, {"g": 2, "e": "", "t": "плинтус по всем стенам комнаты 5 м × 4 м", "h": "вдоль стен"}, {"g": 2, "e": "", "t": "рамка вокруг картины 30 см × 20 см", "h": "вокруг"}]}, {"id": "m4q1l28s3", "scene": "quiz", "gate": true, "title": "Проверяем себя", "text": "Выбери верный ответ.", "count": 6, "gens": ["m4q1l28q"]}, {"id": "m4q1l28s4", "scene": "quiz", "gate": true, "title": "Верно или неверно", "text": "Верно или неверно? Подумай и выбери ответ.", "count": 5, "gens": ["m4q1l28t"]}]},
  {"id": "m4q1l29", "icon": "", "title": "Урок 29. Обобщение: числа, действия, величины", "goal": "Повторить числа, действия, величины и признаки делимости, изученные в первой четверти", "steps": [{"id": "m4q1l29s1", "scene": "infoTap", "gate": true, "title": "Знакомимся с темой", "text": "Привет! Это Барсик. Повторяем всё, что мы узнали про числа, действия и величины. Нажимай на карточки.", "need": 5, "items": [{"k": "разряды и классы", "v": "", "t": "Число 345 678: класс тысяч — 345, класс единиц — 678. В нём 345 единиц тысяч. Сумма разрядных слагаемых: 300 000 + 40 000 + 5 000 + 600 + 70 + 8. Ещё один класс — класс миллионов: 1 000 000 — это тысяча тысяч."}, {"k": "порядок действий", "v": "", "t": "Сначала действия в скобках, потом умножение и деление, потом сложение и вычитание. Пример: 8 + 3 · 5 = 8 + 15 = 23, а (8 + 3) · 5 = 55."}, {"k": "округление", "v": "", "t": "Смотрим на цифру справа от нужного разряда: 5 и больше — округляем вверх, меньше 5 — вниз. Пример: 47 382 ≈ 47 000 (до тысяч), 47 682 ≈ 48 000."}, {"k": "письменные вычисления", "v": "", "t": "Пишем разряд под разрядом. Сложение проверяем вычитанием, вычитание — сложением. Пример: 500 000 − 123 456 = 376 544, проверка: 376 544 + 123 456 = 500 000."}, {"k": "единицы величин", "v": "", "t": "1 т = 1 000 кг, 1 г = 1 000 мг, 1 га = 100 а = 10 000 м², 1 м³ = 1 000 дм³, 1 € = 100 центов, 1/4 ч = 15 мин. Пример: 3 т 450 кг = 3 450 кг."}, {"k": "делимость и множества", "v": "", "t": "На 2 делятся числа, оканчивающиеся чётной цифрой, на 5 — цифрой 0 или 5, на 10 — только 0. Пересечение A ∩ B — общие элементы, объединение A ∪ B — все элементы. Пример: 25 070 : 100 = 250 (ост. 70)."}]}, {"id": "m4q1l29s2", "scene": "sortGroups", "gate": true, "title": "Разложи по группам", "text": "Разложи карточки по группам. Выбери, к какой группе относится каждая карточка.", "q": "В какую группу относится?", "take": 8, "groups": [{"e": "", "k": "Числа и действия"}, {"e": "", "k": "Единицы величин"}, {"e": "", "k": "Множества"}], "items": [{"g": 0, "e": "", "t": "345 678 = 300 000 + 40 000 + 5 000 + 600 + 70 + 8", "h": "разрядные слагаемые"}, {"g": 0, "e": "", "t": "округлить 48 362 до тысяч", "h": "приближение"}, {"g": 0, "e": "", "t": "столбиком: 506 124 + 78 956", "h": "вычисление"}, {"g": 1, "e": "", "t": "1 га = 100 а", "h": "площадь"}, {"g": 1, "e": "", "t": "1 т = 1 000 кг", "h": "масса"}, {"g": 1, "e": "", "t": "1 м³ = 1 000 дм³", "h": "объём"}, {"g": 2, "e": "", "t": "A = { 1; 2; 3 }, B = { 3; 4 }", "h": "элементы"}, {"g": 2, "e": "", "t": "общие элементы двух множеств", "h": "пересечение"}, {"g": 2, "e": "", "t": "круги Эйлера", "h": "диаграмма"}]}, {"id": "m4q1l29s3", "scene": "quiz", "gate": true, "title": "Проверяем себя", "text": "Выбери верный ответ.", "count": 6, "gens": ["m4q1l29q"]}, {"id": "m4q1l29s4", "scene": "quiz", "gate": true, "title": "Верно или неверно", "text": "Верно или неверно? Подумай и выбери ответ.", "count": 5, "gens": ["m4q1l29t"]}]},
  {"id": "m4q1l30", "icon": "", "title": "Урок 30. Обобщение: движение, множества, геометрия", "goal": "Повторить задачи на движение, действия с множествами, объём и площадь фигур", "steps": [{"id": "m4q1l30s1", "scene": "infoTap", "gate": true, "title": "Знакомимся с темой", "text": "Привет! Это Барсик. Повторяем задачи на движение, множества и геометрические фигуры. Нажимай на карточки.", "need": 5, "items": [{"k": "скорость", "v": "", "t": "Скорость — расстояние, пройденное за единицу времени. Её измеряют в км/ч, м/мин, м/с. Пример: 60 км/ч — за каждый час автобус проезжает 60 км."}, {"k": "формулы S, v, t", "v": "", "t": "S = v · t, v = S : t, t = S : v. Пример: v = 60 км/ч, t = 3 ч, тогда S = 60 · 3 = 180 км; 180 : 3 = 60; 180 : 60 = 3."}, {"k": "навстречу, врозь, вдогонку", "v": "", "t": "Навстречу и в противоположные стороны скорости складываем, вдогонку — вычитаем. Пример: 5 км/ч и 4 км/ч: 5 + 4 = 9 км за час. Вдогонку 15 км/ч и 12 км/ч: 15 − 12 = 3 км за час."}, {"k": "множества", "v": "", "t": "Пересечение A ∩ B — общие элементы («И»). Объединение A ∪ B — все элементы («ИЛИ»). Пример: A = { 1; 2; 3 }, B = { 3; 4 }. A ∩ B = { 3 }, A ∪ B = { 1; 2; 3; 4 }. Множество без элементов — пустое, ∅."}, {"k": "свойства множеств", "v": "", "t": "A ∩ B = B ∩ A и A ∪ B = B ∪ A — переместительное свойство. (A ∩ B) ∩ C = A ∩ (B ∩ C) и (A ∪ B) ∪ C = A ∪ (B ∪ C) — сочетательное свойство."}, {"k": "объём и площадь", "v": "", "t": "V = a · b · c. Пример: 6 · 5 · 4 = 120 см³. Площадь комбинированной фигуры — сумма площадей её частей: 6 · 4 + 3 · 2 = 24 + 6 = 30 м²."}]}, {"id": "m4q1l30s2", "scene": "sortGroups", "gate": true, "title": "Разложи по группам", "text": "Разложи карточки по группам. Выбери, к какой группе относится каждая карточка.", "q": "В какую группу относится?", "take": 8, "groups": [{"e": "", "k": "Движение"}, {"e": "", "k": "Множества"}, {"e": "", "k": "Геометрия"}], "items": [{"g": 0, "e": "", "t": "S = v · t", "h": "путь"}, {"g": 0, "e": "", "t": "два пешехода идут навстречу друг другу", "h": "скорости"}, {"g": 0, "e": "", "t": "60 км/ч = 1 000 м/мин", "h": "скорость"}, {"g": 1, "e": "", "t": "A ∩ B = B ∩ A", "h": "свойство"}, {"g": 1, "e": "", "t": "множество без элементов", "h": "пустое"}, {"g": 1, "e": "", "t": "круги Эйлера", "h": "диаграмма"}, {"g": 2, "e": "", "t": "V = a · b · c", "h": "измерения"}, {"g": 2, "e": "", "t": "площадь фигуры равна сумме площадей её частей", "h": "части"}, {"g": 2, "e": "", "t": "вырез в углу прямоугольника", "h": "площадь"}]}, {"id": "m4q1l30s3", "scene": "quiz", "gate": true, "title": "Проверяем себя", "text": "Выбери верный ответ.", "count": 6, "gens": ["m4q1l30q"]}, {"id": "m4q1l30s4", "scene": "quiz", "gate": true, "title": "Верно или неверно", "text": "Верно или неверно? Подумай и выбери ответ.", "count": 5, "gens": ["m4q1l30t"]}]},
  {"id": "m4q2l01", "icon": "", "title": "Урок 1. Умножение и деление числа на произведение", "goal": "Умножать число на произведение и делить число на произведение, выбирая удобный порядок действий", "steps": [{"id": "m4q2l01s1", "scene": "infoTap", "gate": true, "title": "Знакомимся с темой", "text": "Привет! Это Барсик. Сегодня учимся умножать и делить число на произведение. Нажимай на карточки.", "need": 5, "items": [{"k": "умножение на произведение", "v": "", "t": "a · (b · c) = (a · b) · c = (a · c) · b. 5 · (2 · 9) = 90."}, {"k": "деление на произведение", "v": "", "t": "a : (b · c) = (a : b) : c = (a : c) : b. 72 : (2 · 6) = 6: 72 : 2 : 6 = 6."}, {"k": "удобный порядок", "v": "", "t": "Ищем пару, которая даёт круглое число. 4 · 28 · 25: сначала 4 · 25 = 100, потом 28 · 100 = 2 800."}, {"k": "круглые пары", "v": "", "t": "2 · 5 = 10, 4 · 25 = 100, 8 · 125 = 1 000. Если видишь такую пару, умножай её первой."}, {"k": "ошибка", "v": "", "t": "Скобки нельзя терять! 24 : (2 · 3) = 24 : 6 = 4, а 24 : 2 · 3 = 36."}, {"k": "проверка", "v": "", "t": "Считаем двумя способами. 90 : (3 · 5): 90 : 3 : 5 = 6 и 90 : 5 : 3 = 6."}]}, {"id": "m4q2l01s2", "scene": "sortGroups", "gate": true, "title": "Разложи по группам", "text": "Разложи карточки по группам. Выбери, к какой группе относится каждая карточка.", "q": "В какую группу относится?", "take": 8, "groups": [{"e": "", "k": "Умножение на произведение"}, {"e": "", "k": "Деление на произведение"}, {"e": "", "k": "Удобный порядок"}], "items": [{"g": 0, "e": "", "t": "a · (b · c) = (a · b) · c", "h": "умножение"}, {"g": 0, "e": "", "t": "умножаю на один множитель, потом результат на другой", "h": "умножение"}, {"g": 0, "e": "", "t": "9 · (2 · 50) = (9 · 2) · 50", "h": "умножение"}, {"g": 1, "e": "", "t": "a : (b · c) = (a : b) : c", "h": "деление"}, {"g": 1, "e": "", "t": "делю на один множитель, потом частное на другой", "h": "деление"}, {"g": 1, "e": "", "t": "72 : (2 · 6) = 72 : 2 : 6", "h": "деление"}, {"g": 2, "e": "", "t": "ищу пару, которая даёт круглое число", "h": "удобство"}, {"g": 2, "e": "", "t": "5 · 37 · 2: сначала 5 · 2 = 10", "h": "удобство"}, {"g": 2, "e": "", "t": "4 · 25 = 100 помогает считать быстрее", "h": "удобство"}]}, {"id": "m4q2l01s3", "scene": "quiz", "gate": true, "title": "Проверяем себя", "text": "Выбери верный ответ.", "count": 6, "gens": ["m4q2l01q"]}, {"id": "m4q2l01s4", "scene": "quiz", "gate": true, "title": "Верно или неверно", "text": "Верно или неверно? Подумай и выбери ответ.", "count": 5, "gens": ["m4q2l01t"]}]},
  {"id": "m4q2l02", "icon": "", "title": "Урок 2. Устные приёмы: числа, оканчивающиеся нулями", "goal": "Устно умножать и делить числа, оканчивающиеся нулями, не обращая внимания на нули", "steps": [{"id": "m4q2l02s1", "scene": "infoTap", "gate": true, "title": "Знакомимся с темой", "text": "Привет! Это Барсик. Сегодня считаем круглые числа в уме. Нажимай на карточки.", "need": 5, "items": [{"k": "умножение", "v": "", "t": "Умножаем числа без нулей и приписываем столько нулей, сколько их в обоих множителях. 16 000 · 2 000 = 32 000 000."}, {"k": "деление", "v": "", "t": "Отбрасываем поровну нули в делимом и делителе и делим. 240 000 : 600 = 2 400 : 6 = 400."}, {"k": "разряды", "v": "", "t": "Считаем десятками, сотнями, тысячами. 240 : 60 = 24 дес. : 6 дес. = 4. А 2 400 : 600 = 24 сот. : 6 сот. = 4."}, {"k": "образец", "v": "", "t": "3 000 · 40: 3 · 4 = 12, нулей 3 + 1 = 4. Ответ 120 000."}, {"k": "ошибка", "v": "", "t": "Нули нельзя отбрасывать только у одного числа! 12 000 : 300 — отбрасываем по два нуля, получаем 120 : 3 = 40."}, {"k": "проверка", "v": "", "t": "Проверяем умножением. 12 000 : 300 = 40, потому что 40 · 300 = 12 000."}]}, {"id": "m4q2l02s2", "scene": "sortGroups", "gate": true, "title": "Разложи по группам", "text": "Разложи карточки по группам. Выбери, к какой группе относится каждая карточка.", "q": "В какую группу относится?", "take": 8, "groups": [{"e": "", "k": "Умножение"}, {"e": "", "k": "Деление"}, {"e": "", "k": "Проверка"}], "items": [{"g": 0, "e": "", "t": "умножаю числа без нулей и приписываю нули", "h": "умножение"}, {"g": 0, "e": "", "t": "нули считаю в обоих множителях", "h": "умножение"}, {"g": 0, "e": "", "t": "6 · 5 = 30, а потом приписываю 4 нуля", "h": "умножение"}, {"g": 1, "e": "", "t": "отбрасываю поровну нули в делимом и делителе", "h": "деление"}, {"g": 1, "e": "", "t": "4 800 : 60 = 480 : 6", "h": "деление"}, {"g": 1, "e": "", "t": "24 сотни : 6 сотен = 4", "h": "деление"}, {"g": 2, "e": "", "t": "40 · 300 = 12 000 — значит,   {"id": "m4q2l07", "icon": "", "title": "Урок 7. Деление на двузначное число с остатком", "goal": "Выполнять деление на двузначное число с остатком и проверять его по формуле a = b · c + r", "steps": [{"id": "m4q2l07s1", "scene": "infoTap", "gate": true, "title": "Знакомимся с темой", "text": "Привет! Это Барсик. Сегодня делим на двузначное число с остатком. Нажимай на карточки.", "need": 5, "items": [{"k": "запись", "v": "", "t": "Деление с остатком записывают так: a : b = c (ост. r). Например, 483 : 25 = 19 (ост. 8)."}, {"k": "названия", "v": "", "t": "a — делимое, b — делитель, c — частное, r — остаток. В примере 483 : 25 = 19 (ост. 8): 483 — делимое, 25 — делитель, 19 — частное, 8 — остаток."}, {"k": "главное правило", "v": "", "t": "Остаток всегда меньше делителя: r < b. При делении на 25 остаток может быть от 0 до 24."}, {"k": "формула проверки", "v": "", "t": "Чтобы проверить деление с остатком, пользуемся формулой a = b · c + r. 25 · 19 + 8 = 483. Верно!"}, {"k": "остаток в задаче", "v": "", "t": "500 человек, а в автобус помещается 45. 500 : 45 = 11 (ост. 5). Пять человек ещё остались, нужен ещё один автобус: 12."}, {"k": "ошибка", "v": "", "t": "Если остаток получился не меньше делителя, цифру частного взяли слишком маленькой. Например, 40 при делителе 36: надо взять частное на 1 больше."}]}, {"id": "m4q2l07s2", "scene": "sortGroups", "gate": true, "title": "Разложи по группам", "text": "Разложи карточки по группам. Выбери, к какой группе относится каждая карточка.", "q": "В какую группу относится?", "take": 8, "groups": [{"e": "", "k": "Выполняем деление"}, {"e": "", "k": "Проверяем остаток"}, {"e": "", "k": "Проверяем всё деление"}], "items": [{"g": 0, "e": "", "t": "нахожу первое неполное делимое", "h": "делю"}, {"g": 0, "e": "", "t": "подбираю цифру частного", "h": "делю"}, {"g": 0, "e": "", "t": "вычитаю и сношу следующую цифру", "h": "делю"}, {"g": 1, "e": "", "t": "сравниваю остаток с делителем", "h": "остаток"}, {"g": 1, "e": "", "t": "остаток мен   {"id": "m4q2l08", "icon": "", "title": "Урок 8. Деление на двузначное число: нуль в частном", "goal": "Выполнять деление на двузначное число, когда в частном есть нуль, и проверять результат", "steps": [{"id": "m4q2l08s1", "scene": "infoTap", "gate": true, "title": "Знакомимся с темой", "text": "Привет! Это Барсик. Сегодня учимся делить, когда в частном получается нуль. Нажимай на карточки.", "need": 5, "items": [{"k": "нуль в частном", "v": "", "t": "Если после сноса цифры неполное делимое меньше делителя, пишем в частном 0 и сносим следующую цифру. 2 142 : 21: 21 : 21 = 1, потом число 4 меньше 21, пишем 0, потом 42 : 21 = 2. Частное 102."}, {"k": "каждая цифра считается", "v": "", "t": "Каждая снесённая цифра даёт одну цифру частного. В 2 142 : 21 после 21 мы сносим 4 и 2, поэтому в частном три цифры."}, {"k": "нули на конце", "v": "", "t": "Бывает, что нули снесли в конце делимого. 3 500 : 35: 35 : 35 = 1, потом сносим 0 и 0, получаем два нуля: частное 100."}, {"k": "с остатком", "v": "", "t": "Нуль в частном бывает и при делении с остатком. 4 212 : 42 = 100 (ост. 12). Проверка: 42 · 100 + 12 = 4 212."}, {"k": "проверка", "v": "", "t": "Частное умножаем на делитель. 102 · 21 = 2 142. Получили делимое — всё верно."}, {"k": "ошибка", "v": "", "t": "Нельзя пропускать нуль! Если записать 2 142 : 21 = 12, то 12 · 21 = 252, а не 2 142."}]}, {"id": "m4q2l08s2", "scene": "sortGroups", "gate": true, "title": "Разложи по группам", "text": "Разложи карточки по группам. Выбери, к какой группе относится каждая карточка.", "q": "В какую группу относится?", "take": 8, "groups": [{"e": "", "k": "Определяем цифры частного"}, {"e": "", "k": "Записываем нуль"}, {"e": "", "k": "Проверяем"}], "items": [{"g": 0, "e": "", "t": "считаю, сколько цифр сношу после первого неполного делимого", "h": "цифры"}, {"g": 0, "e": "", "t": "каждая снесённая цифра даёт цифру частного", "h": "цифры"}, {"g": 0, "e": "", "t": "нахожу первое неполное делимое", "h": "цифры"}, {"g": 1, "e": "", "t": "чис   {"id": "m4q2l10", "icon": "", "title": "Урок 10. Алгоритм умножения на трёхзначное число", "goal": "Умножать многозначное число на трёхзначное столбиком, в том числе когда в множителе есть нуль, и проверять результат", "steps": [{"id": "m4q2l10s1", "scene": "infoTap", "gate": true, "title": "Знакомимся с темой", "text": "Привет! Это Барсик. Сегодня учимся умножать столбиком на трёхзначное число. Нажимай на карточки.", "need": 5, "items": [{"k": "неполные произведения", "v": "", "t": "Умножаем число по очереди на единицы, десятки и сотни множителя — получаем неполные произведения. Потом их складываем. 2 453 · 132: 4 906 + 73 590 + 245 300 = 323 796."}, {"k": "где записывать", "v": "", "t": "Первое неполное произведение пишем под единицами, второе — под десятками, третье — под сотнями. Каждое следующее сдвигаем на один разряд влево."}, {"k": "нуль в множителе", "v": "", "t": "Цифра 0 даёт нулевое неполное произведение. Его не пишем, но следующее неполное произведение сдвигаем на тот же разряд. 3 128 · 205 = 15 640 + 625 600 = 641 240."}, {"k": "нули на конце", "v": "", "t": "Если множитель оканчивается нулями, умножаем на число без нулей и приписываем нули. 1 875 · 400: 1 875 · 4 = 7 500, значит, 750 000."}, {"k": "оценка", "v": "", "t": "Сначала округляем и прикидываем ответ. 3 128 · 205 примерно равно 3 000 · 200 = 600 000. Точный ответ 641 240 близок к этому."}, {"k": "проверка", "v": "", "t": "Произведение делим на один из множителей. 641 240 : 205 = 3 128. Получили второй множитель — всё верно."}]}, {"id": "m4q2l10s2", "scene": "sortGroups", "gate": true, "title": "Разложи по группам", "text": "Разложи карточки по группам. Выбери, к какой группе относится каждая карточка.", "q": "В какую группу относится?", "take": 8, "groups": [{"e": "", "k": "Записываем"}, {"e": "", "k": "Умножаем"}, {"e": "", "k": "Проверяем"}], "items": [{"g": 0, "e": "", "t": "пишу множитель под единицами множимого", "h": "запись"}, {"g": 0, "e": "", "t": "второе неполное произведение начи   {"id": "m4q2l11", "icon": "", "title": "Урок 11. Алгоритм деления на трёхзначное число", "goal": "Выполнять деление на трёхзначное число столбиком: находить неполное делимое, подбирать цифры частного и проверять результат", "steps": [{"id": "m4q2l11s1", "scene": "infoTap", "gate": true, "title": "Знакомимся с темой", "text": "Привет! Это Барсик. Сегодня учимся делить на трёхзначное число столбиком. Нажимай на карточки.", "need": 5, "items": [{"k": "неполное делимое", "v": "", "t": "Берём первые цифры делимого, пока число не станет не меньше делителя. 66 882 : 213 — берём 668."}, {"k": "подбор цифры", "v": "", "t": "Делим сотни на сотни и проверяем умножением. 4 сотни : 2 сотни = 2, 213 · 2 = 426 — подходит для 451."}, {"k": "остаток", "v": "", "t": "После вычитания остаток должен быть меньше делителя. 451 − 426 = 25, и 25 < 213."}, {"k": "снос цифры", "v": "", "t": "К остатку сносим следующую цифру делимого и снова подбираем цифру частного. К 25 сносим 5: получилось 255."}, {"k": "проверка", "v": "", "t": "Умножаем частное на делитель — получаем делимое. 314 · 213 = 66 882."}, {"k": "число цифр", "v": "", "t": "Одна цифра частного — от неполного делимого, и ещё по одной — на каждую снесённую цифру. В 66 882 : 213 после 668 сносим 8 и 2 — в частном 3 цифры."}]}, {"id": "m4q2l11s2", "scene": "sortGroups", "gate": true, "title": "Разложи по группам", "text": "Разложи карточки по группам. Выбери, к какой группе относится каждая карточка.", "q": "В какую группу относится?", "take": 8, "groups": [{"e": "", "k": "Находим неполное делимое"}, {"e": "", "k": "Подбираем цифру частного"}, {"e": "", "k": "Проверяем"}], "items": [{"g": 0, "e": "", "t": "беру первые три цифры делимого", "h": "начало деления"}, {"g": 0, "e": "", "t": "три цифры меньше делителя — беру четыре", "h": "начало деления"}, {"g": 0, "e": "", "t": "неполное делимое не меньше делителя", "h": "начало деления"}, {"g": 1, "e": "", "t": "делю сотни на сотни", "h": "подбор"}, {"g": 1, "e": "", "t": "умножаю про   {"id": "m4q2l12", "icon": "", "title": "Урок 12. Деление на трёхзначное число: нуль в частном, остаток", "goal": "Выполнять деление на трёхзначное число, когда в частном есть нуль или в конце остаётся остаток", "steps": [{"id": "m4q2l12s1", "scene": "infoTap", "gate": true, "title": "Знакомимся с темой", "text": "Привет! Это Барсик. Сегодня делим на трёхзначное число, когда в частном есть нуль или остаётся остаток. Нажимай на карточки.", "need": 5, "items": [{"k": "нуль в частном", "v": "", "t": "Если неполное делимое меньше делителя, в частном пишем 0 и сносим следующую цифру. 640 278 : 213 = 3 006."}, {"k": "когда нуль", "v": "", "t": "Сравниваем неполное делимое и делитель. Если 27 меньше 213, цифра частного 0. Нуль — тоже цифра частного."}, {"k": "остаток", "v": "", "t": "Остаток всегда меньше делителя. При делении на 245 остаток может быть от 0 до 244."}, {"k": "запись ответа", "v": "", "t": "Пишем так: 1 540 : 125 = 12 (остаток 40). Частное 12, остаток 40."}, {"k": "проверка", "v": "", "t": "Частное умножаем на делитель и прибавляем остаток. 125 · 12 + 40 = 1 540."}, {"k": "ошибка", "v": "", "t": "Нельзя забывать нуль в частном: 503 и 53 — разные числа. Не бывает остатка, равного делителю."}]}, {"id": "m4q2l12s2", "scene": "sortGroups", "gate": true, "title": "Разложи по группам", "text": "Разложи карточки по группам. Выбери, к какой группе относится каждая карточка.", "q": "В какую группу относится?", "take": 8, "groups": [{"e": "", "k": "Нуль в частном"}, {"e": "", "k": "Остаток"}, {"e": "", "k": "Проверка"}], "items": [{"g": 0, "e": "", "t": "неполное делимое меньше делителя", "h": "когда пишем 0"}, {"g": 0, "e": "", "t": "в частном записываю 0", "h": "цифра частного"}, {"g": 0, "e": "", "t": "после нуля сношу следующую цифру", "h": "что делаем дальше"}, {"g": 1, "e": "", "t": "остаток меньше делителя", "h": "правило остатка"}, {"g": 1, "e": "", "t": "при делении на 125 остаток не больше 124", "h": "правило остатка"}, {"g": 1, "e": "", "t": "1 540 : 125 = 12 (остаток 40)", "h": "запись остатка"}, {"g": 2, "e": "", "t": "частное · делитель + остаток", "h": "как проверяем"}, {"g": 2, "e": "", "t": "125 · 12 + 40 = 1 540", "h": "пример проверки"}, {"g": 2, "e": "", "t": "сумма должна равняться делимому", "h": "как проверяем"}]}, {"id": "m4q2l12s3", "scene": "quiz", "gate": true, "title": "Проверяем себя", "text": "Выбери верный ответ.", "count": 6, "gens": ["m4q2l12q"]}, {"id": "m4q2l12s4", "scene": "quiz", "gate": true, "title": "Верно или неверно", "text": "Верно или неверно? Подумай и выбери ответ.", "count": 5, "gens": ["m4q2l12t"]}]},
  {"id": "m4q2l13", "icon": "", "title": "Урок 13. Умножение и деление на трёхзначное число: задачи, проверка, прикидка", "goal": "Решать задачи на умножение и деление с трёхзначными числами, проверять результат и оценивать его прикидкой", "steps": [{"id": "m4q2l13s1", "scene": "infoTap", "gate": true, "title": "Знакомимся с темой", "text": "Привет! Это Барсик. Сегодня решаем задачи на умножение и деление с трёхзначными числами. Учимся проверять ответ и делать прикидку. Нажимай на карточки.", "need": 5, "items": [{"k": "прикидка", "v": "", "t": "Округляем числа и считаем устно. 198 · 304 ≈ 200 · 300 = 60 000. Ответ должен быть близок к этому числу."}, {"k": "как округлять", "v": "", "t": "Округляем так, чтобы считать было легко. 59 800 : 298 ≈ 60 000 : 300 = 200."}, {"k": "проверка умножения", "v": "", "t": "Делим произведение на один из множителей. 71 370 : 305 = 234, значит, 234 · 305 = 71 370 верно."}, {"k": "проверка деления", "v": "", "t": "Умножаем частное на делитель (и прибавляем остаток). 3 006 · 213 = 640 278."}, {"k": "число цифр", "v": "", "t": "Прикидка помогает понять, сколько цифр в ответе. 123 · 456 примерно 100 · 500 = 50 000 — ответ пятизначный."}, {"k": "нуль в множителе", "v": "", "t": "При умножении на 305 умножаем на 5 единиц и на 3 сотни. Строку для нуля не пишем, а сотни сдвигаем на два разряда: 234 · 305 = 1 170 + 70 200 = 71 370."}]}, {"id": "m4q2l13s2", "scene": "sortGroups", "gate": true, "title": "Разложи по группам", "text": "Разложи карточки по группам. Выбери, к какой группе относится каждая карточка.", "q": "В какую группу относится?", "take": 8, "groups": [{"e": "", "k": "Прикидка"}, {"e": "", "k": "Проверка"}, {"e": "", "k": "Запись столбиком"}], "items": [{"g": 0, "e": "", "t": "округляю числа до сотен", "h": "приблизительный счёт"}, {"g": 0, "e": "", "t": "200 · 300 = 60 000", "h": "приблизительный счёт"}, {"g": 0, "e": "", "t": "сравниваю ответ с приближённым", "h": "приблизительный счёт"}, {"g": 1, "e": "", "t": "делю произведе ок"}, {"g": 1, "e": "", "t": "считаю 3 · 4, потом приписываю нули", "h": "нули"}, {"g": 1, "e": "", "t": "12 000 : 300 — убираю по два нуля", "h": "нули"}, {"g": 1, "e": "", "t": "3 000 · 40 = 120 000", "h": "нули"}, {"g": 2, "e": "", "t": "умножение начинаю с единиц", "h": "столбиком"}, {"g": 2, "e": "", "t": "деление начинаю с высшего разряда", "h": "столбиком"}, {"g": 2, "e": "", "t": "остаток меньше делителя", "h": "столбиком"}]}, {"id": "m4q2l14s3", "scene": "quiz", "gate": true, "title": "Проверяем себя", "text": "Выбери верный ответ.", "count": 6, "gens": ["m4q2l14q"]}, {"id": "m4q2l14s4", "scene": "quiz", "gate": true, "title": "Верно или неверно", "text": "Верно или неверно? Подумай и выбери ответ.", "count": 5, "gens": ["m4q2l14t"]}]},
  {"id": "m4q2l15", "icon": "", "title": "Урок 15. Производительность", "goal": "Находить работу, время и производительность с помощью формул A = v · t, v = A : t и t = A : v", "steps": [{"id": "m4q2l15s1", "scene": "infoTap", "gate": true, "title": "Знакомимся с темой", "text": "Привет! Это Барсик. Сегодня узнаем, что такое производительность и как связаны работа, время и производительность. Нажимай на карточки.", "need": 5, "items": [{"k": "работа A", "v": "", "t": "Количество продукции, изготовленной за определённое время, называют работой. Мастер сделал 120 деталей — это работа A."}, {"k": "время t", "v": "", "t": "Время t — это сколько часов, минут или дней шла работа. Мастер работал 8 ч — это время t."}, {"k": "производительность v", "v": "", "t": "Производительность — это работа, выполненная за единицу времени. Мастер делает 15 дет./ч — это производительность v."}, {"k": "найти работу", "v": "", "t": "Производительность умножаем на время: A = v · t. 15 · 8 = 120 деталей."}, {"k": "найти время", "v": "", "t": "Работу делим на производительность: t = A : v. 360 строк : 20 строк/мин = 18 минут."}, {"k": "найти производительность", "v": "", "t": "Работу делим на время: v = A : t. 48 блузок : 3 дня = 16 блузок в день."}]}, {"id": "m4q2l15s2", "scene": "sortGroups", "gate": true, "title": "Разложи по группам", "text": "Разложи карточки по группам. Выбери, к какой группе относится каждая карточка.", "q": "В какую группу относится?", "take": 8, "groups": [{"e": "", "k": "Работа A"}, {"e": "", "k": "Время t"}, {"e": "", "k": "Производительность v"}], "items": [{"g": 0, "e": "", "t": "сколько всего деталей изготовили", "h": "сколько всего сделано"}, {"g": 0, "e": "", "t": "сколько строк напечатали всего", "h": "сколько всего сделано"}, {"g": 0, "e": "", "t": "сколько гектаров убрали всего", "h": "сколько всего сделано"}, {"g": 1, "e": "", "t": "сколько часов работал мастер", "h": "как долго работали"}, {"g": 1, "e": "", "t": "за сколько минут выполнили заказ", "h": "ка   {"id": "m4q2l16", "icon": "", "title": "Урок 16. Производительность: задачи", "goal": "Находить работу, производительность и время по формулам A = v · t, v = A : t, t = A : v", "steps": [{"id": "m4q2l16s1", "scene": "infoTap", "gate": true, "title": "Знакомимся с темой", "text": "Привет! Это Барсик. Сегодня решаем задачи на производительность: ищем работу, время и саму производительность. Нажимай на карточки.", "need": 5, "items": [{"k": "работа", "v": "", "t": "Работу находим умножением: A = v · t. Мастер делает 14 дет./ч и работает 6 ч: 14 · 6 = 84 дет."}, {"k": "производительность", "v": "", "t": "Производительность v — сколько работы делают за единицу времени: v = A : t. За 6 ч сделали 84 дет.: 84 : 6 = 14 дет./ч."}, {"k": "время", "v": "", "t": "Время находим делением: t = A : v. Нужно 84 дет., делают по 14 дет./ч: 84 : 14 = 6 ч."}, {"k": "формулы", "v": "", "t": "Формулы — это верные равенства, которые связывают величины. Их три: A = v · t, v = A : t, t = A : v."}, {"k": "единицы", "v": "", "t": "Следи за единицами. Если v в стр./мин, а время в часах, сначала переведи: 2 ч = 120 мин. 30 · 120 = 3 600 стр."}, {"k": "ошибка", "v": "", "t": "Не путай действия. Время ищем делением работы на производительность: 90 : 15 = 6 ч, а не 90 · 15."}]}, {"id": "m4q2l16s2", "scene": "sortGroups", "gate": true, "title": "Разложи по группам", "text": "Разложи карточки по группам. Выбери, к какой группе относится каждая карточка.", "q": "В какую группу относится?", "take": 8, "groups": [{"e": "", "k": "Ищем работу"}, {"e": "", "k": "Ищем производительность"}, {"e": "", "k": "Ищем время"}], "items": [{"g": 0, "e": "", "t": "станок делает 12 дет. в час; сколько за 5 ч?", "h": "вся работа"}, {"g": 0, "e": "", "t": "умножаю v на t", "h": "формула"}, {"g": 0, "e": "", "t": "по 30 стр. в минуту; сколько за 7 мин?", "h": "вся работа"}, {"g": 1, "e": "", "t": "за 6 ч сшили 48 курток; сколько курток в час?", "h": "за единицу времени"}, {"g": 1, "e": "", "t": "делю работу на время", "h   {"id": "m4q2l17", "icon": "", "title": "Урок 17. Совместная работа", "goal": "Находить совместную производительность, время и объём работы двух участников", "steps": [{"id": "m4q2l17s1", "scene": "infoTap", "gate": true, "title": "Знакомимся с темой", "text": "Привет! Это Барсик. Сегодня учимся решать задачи, где двое работают вместе. Нажимай на карточки.", "need": 5, "items": [{"k": "совместная производительность", "v": "", "t": "Производительности складываем: v совм. = v₁ + v₂. Мастер делает 20 дет./ч, ученик — 10 дет./ч: вместе 30 дет./ч."}, {"k": "время вместе", "v": "", "t": "Объём работы делим на совместную производительность: t = A : v совм. Заказ 90 дет.: 90 : 30 = 3 ч."}, {"k": "объём вместе", "v": "", "t": "Совместную производительность умножаем на время: A = v совм. · t. 30 дет./ч · 3 ч = 90 дет."}, {"k": "производительность по времени", "v": "", "t": "Если знаем, за сколько один справится: v = A : t. Заказ 480 пирожков за 8 ч: 480 : 8 = 60 пирожков в час."}, {"k": "проверка", "v": "", "t": "Вместе работа делается быстрее. Заказ 480 пирожков: один печёт за 8 ч, второй за 24 ч, вместе за 6 ч — меньше 8."}, {"k": "ошибка", "v": "", "t": "Нельзя складывать время! 8 ч + 24 ч = 32 ч — это неверно. Складывают производительности: 60 + 20 = 80 в час."}]}, {"id": "m4q2l17s2", "scene": "sortGroups", "gate": true, "title": "Разложи по группам", "text": "Разложи карточки по группам. Выбери, к какой группе относится каждая карточка.", "q": "В какую группу относится?", "take": 8, "groups": [{"e": "", "k": "Совместная производительность"}, {"e": "", "k": "Время совместной работы"}, {"e": "", "k": "Объём совместной работы"}], "items": [{"g": 0, "e": "", "t": "v₁ + v₂", "h": "сумма"}, {"g": 0, "e": "", "t": "складываю 6 дет./ч и 4 дет./ч", "h": "вдвоём за час"}, {"g": 0, "e": "", "t": "сколько вместе за 1 час", "h": "за единицу времени"}, {"g": 1, "e": "", "t": "A : v совм.", "h": "деление"}, {"g": 1, "e": "", "t": "40 дет. делю на 10 дет./ч", "h": "ответ в часах"}, {"g   {"id": "m4q2l18", "icon": "", "title": "Урок 18. Пропорциональное деление: приведение к единице", "goal": "Решать задачи на пропорциональное деление способом приведения к единице", "steps": [{"id": "m4q2l18s1", "scene": "infoTap", "gate": true, "title": "Знакомимся с темой", "text": "Привет! Это Барсик. Сегодня учимся решать задачи способом приведения к единице. Нажимай на карточки.", "need": 5, "items": [{"k": "приведение к единице", "v": "", "t": "В такой задаче два действия. Сначала находим, что приходится на единицу, потом — ответ. За 5 ч — 40 л; за 9 ч — ?"}, {"k": "первое действие", "v": "", "t": "Первое действие — деление. 40 : 5 = 8 (л) — расход за 1 час. Это единица."}, {"k": "второе действие", "v": "", "t": "Второе действие отвечает на вопрос задачи. 8 · 9 = 72 (л) — расход за 9 часов."}, {"k": "что взять за единицу", "v": "", "t": "За единицу берём то, что в вопросе «на один»: 1 час, 1 день, 1 кг, 1 штуку. 6 м ткани — 3 600 тг, значит, 1 м — 600 тг."}, {"k": "деление во втором действии", "v": "", "t": "Иногда нужно узнать количество единиц. 8 ч — 96 дет., 156 дет.? 96 : 8 = 12, 156 : 12 = 13 ч."}, {"k": "проверка", "v": "", "t": "Больше часов — больше литров: 72 больше 40. И 72 : 9 = 8, как и в первом действии."}]}, {"id": "m4q2l18s2", "scene": "sortGroups", "gate": true, "title": "Разложи по группам", "text": "Разложи карточки по группам. Выбери, к какой группе относится каждая карточка.", "q": "В какую группу относится?", "take": 8, "groups": [{"e": "", "k": "Первое действие"}, {"e": "", "k": "Второе действие"}, {"e": "", "k": "Проверка ответа"}], "items": [{"g": 0, "e": "", "t": "40 : 5 = 8 — расход за 1 час", "h": "находим единицу"}, {"g": 0, "e": "", "t": "сколько литров приходится на один час", "h": "находим единицу"}, {"g": 0, "e": "", "t": "делю всё количество на число часов", "h": "деление"}, {"g": 1, "e": "", "t": "8 · 9 = 72", "h": "ответ"}, {"g": 1, "e": "", "t": "умножаю на 9 часов", "h": "ответ"}, {"g": 1, "e": "", "t": "отвечаю на вопрос   {"id": "m4q2l19", "icon": "", "title": "Урок 19. Пропорциональное деление: неизвестное по двум суммам", "goal": "Решать задачи на нахождение неизвестного по двум суммам и проверять ответ сложением", "steps": [{"id": "m4q2l19s1", "scene": "infoTap", "gate": true, "title": "Знакомимся с темой", "text": "Привет! Это Барсик. Сегодня решаем задачи, где известна сумма двух значений одной величины. Нажимай на карточки.", "need": 5, "items": [{"k": "три величины", "v": "", "t": "В такой задаче три связанные величины: цена, количество и стоимость. Купили 3 кг яблок и 5 кг груш по одной цене."}, {"k": "что дано", "v": "", "t": "Дана сумма двух значений одной величины: за всю покупку заплатили 2 400 тг. Нужно узнать цену и стоимость каждой части."}, {"k": "общее количество", "v": "", "t": "Сначала узнаём сумму двух других известных величин. 3 + 5 = 8 (кг) — всего купили."}, {"k": "цена одного", "v": "", "t": "Делим общую стоимость на общее количество: 2 400 : 8 = 300 (тг) — цена 1 кг."}, {"k": "каждая часть", "v": "", "t": "Находим стоимость каждой части умножением. 300 · 3 = 900 (тг) — яблоки, 300 · 5 = 1 500 (тг) — груши."}, {"k": "проверка и чертёж", "v": "", "t": "Проверяем сложением: 900 + 1 500 = 2 400. На чертеже вся сумма разделена на 8 равных частей: 3 части и 5 частей."}]}, {"id": "m4q2l19s2", "scene": "sortGroups", "gate": true, "title": "Разложи по группам", "text": "Разложи карточки по группам. Выбери, к какой группе относится каждая карточка.", "q": "В какую группу относится?", "take": 8, "groups": [{"e": "", "k": "Находим общее количество"}, {"e": "", "k": "Находим значение на единицу"}, {"e": "", "k": "Находим каждую часть и проверяем"}], "items": [{"g": 0, "e": "", "t": "3 + 5 = 8 (кг)", "h": "складываем количества"}, {"g": 0, "e": "", "t": "сколько всего килограммов купили", "h": "всего"}, {"g": 0, "e": "", "t": "складываю 3 кг и 5 кг", "h": "сумма"}, {"g": 1, "e": "", "t": "2 400 : 8 = 300 (тг)", "h": "цена"}, {"g": 1, "e": "", "t": "сколько стоит один кил   {"id": "m4q2l20", "icon": "", "title": "Урок 20. Неизвестное по двум разностям", "goal": "Решать задачи на нахождение неизвестного по двум разностям и проверять ответ вычитанием", "steps": [{"id": "m4q2l20s1", "scene": "infoTap", "gate": true, "title": "Знакомимся с темой", "text": "Привет! Это Барсик. Сегодня решаем задачи, где известна разность двух значений одной величины. Нажимай на карточки.", "need": 5, "items": [{"k": "три величины", "v": "", "t": "В задаче три связанные величины: цена, количество, стоимость. Цена одинаковая: 7 м шёлка и 4 м шерсти."}, {"k": "что дано", "v": "", "t": "Дана разность двух значений одной величины: за шёлк заплатили на 1 800 тг больше. Это разность стоимости."}, {"k": "разность количеств", "v": "", "t": "Сначала находим разность других известных величин. 7 − 4 = 3 (м) — на столько метров шёлка больше."}, {"k": "значение на единицу", "v": "", "t": "Разность стоимости делим на разность количеств: 1 800 : 3 = 600 (тг) — цена 1 м."}, {"k": "значение каждого", "v": "", "t": "Умножаем цену на количество. 600 · 7 = 4 200 (тг) — шёлк, 600 · 4 = 2 400 (тг) — шерсть."}, {"k": "проверка", "v": "", "t": "Проверяем вычитанием: 4 200 − 2 400 = 1 800 — как в условии. Не складывай: здесь дана разность, а не сумма."}]}, {"id": "m4q2l20s2", "scene": "sortGroups", "gate": true, "title": "Разложи по группам", "text": "Разложи карточки по группам. Выбери, к какой группе относится каждая карточка.", "q": "В какую группу относится?", "take": 8, "groups": [{"e": "", "k": "Находим разность количеств"}, {"e": "", "k": "Находим значение на единицу"}, {"e": "", "k": "Находим каждое значение и проверяем"}], "items": [{"g": 0, "e": "", "t": "7 − 4 = 3 (м)", "h": "вычитаем количества"}, {"g": 0, "e": "", "t": "на сколько метров шёлка больше", "h": "на сколько больше"}, {"g": 0, "e": "", "t": "вычитаю меньшее количество из большего", "h": "вычитание"}, {"g": 1, "e": "", "t": "1 800 : 3 = 600 (тг)", "h": "цена"}, {"g": 1, "e": "", "t": "сколько стоит один метр   {"id": "m4q2l23", "icon": "", "title": "Урок 23. Встречное движение: задачи", "goal": "Решать задачи на встречное движение с помощью уравнения и проверять ответ", "steps": [{"id": "m4q2l23s1", "scene": "infoTap", "gate": true, "title": "Знакомимся с темой", "text": "Привет! Это Барсик. Сегодня решаем задачи на встречное движение с помощью уравнений. Нажимай на карточки.", "need": 5, "items": [{"k": "обозначаем x", "v": "", "t": "Неизвестное обозначаем буквой x. Скорость второго поезда — x км/ч."}, {"k": "составляем уравнение", "v": "", "t": "v сбл. = v₁ + x, а расстояние S = v сбл. · t. (98 + x) · 2 = 396."}, {"k": "решаем", "v": "", "t": "Делим 396 на 2: 98 + x = 198. Тогда x = 198 − 98 = 100 (км/ч)."}, {"k": "проверка", "v": "", "t": "Подставляем корень в уравнение. (98 + 100) · 2 = 396, равенство верное."}, {"k": "ищем время", "v": "", "t": "(72 + 68) · x = 420. x = 420 : 140 = 3 (ч)."}, {"k": "лишние данные", "v": "", "t": "Не все числа в задаче нужны. Выбираем только те, что связаны с вопросом."}]}, {"id": "m4q2l23s2", "scene": "sortGroups", "gate": true, "title": "Разложи по группам", "text": "Разложи карточки по группам. Выбери, к какой группе относится каждая карточка.", "q": "В какую группу относится?", "take": 8, "groups": [{"e": "", "k": "Составляем уравнение"}, {"e": "", "k": "Решаем"}, {"e": "", "k": "Проверяем"}], "items": [{"g": 0, "e": "", "t": "(98 + x) · 2 = 396", "h": "уравнение"}, {"g": 0, "e": "", "t": "(72 + 68) · x = 420", "h": "уравнение"}, {"g": 0, "e": "", "t": "(60 + 40) · 3 = x", "h": "уравнение"}, {"g": 1, "e": "", "t": "98 + x = 396 : 2", "h": "делим"}, {"g": 1, "e": "", "t": "x = 396 : 2 − 98 = 100", "h": "находим x"}, {"g": 1, "e": "", "t": "x = 420 : 140 = 3", "h": "находим x"}, {"g": 2, "e": "", "t": "(98 + 100) · 2 = 396, верно", "h": "подставляем"}, {"g": 2, "e": "", "t": "(72 + 68) · 3 = 420, верно", "h": "подставляем"}, {"g": 2, "e": "", "t": "100 · 3 = 300, расстояние то же", "h": "сравниваем"}]}, {"id": "m4q2l23s3", "scene":   {"id": "m4q2l27", "icon": "", "title": "Урок 27. Задачи на движение", "goal": "Выбирать вид задачи на движение, делать схему, составлять выражение и уравнение", "steps": [{"id": "m4q2l27s1", "scene": "infoTap", "gate": true, "title": "Знакомимся с темой", "text": "Привет! Это Барсик. Сегодня учимся выбирать нужный вид задачи на движение. Нажимай на карточки.", "need": 5, "items": [{"k": "вид задачи", "v": "", "t": "Сначала смотрим на направление. Навстречу — сближаются, в разные стороны — удаляются. Нужная скорость: v₁ + v₂."}, {"k": "схема", "v": "", "t": "Рисуем отрезок, стрелки для скоростей и подписываем t и S. Стрелки навстречу — встреча, стрелки в разные стороны — отдаление."}, {"k": "встреча", "v": "", "t": "Время встречи: t = S : (v₁ + v₂). Два поезда, 840 км, 55 и 65 км/ч: 840 : 120 = 7 (ч)."}, {"k": "отдаление", "v": "", "t": "Расстояние: S = S₀ + (v₁ + v₂) · t. От турбаз в 20 км, 8 и 6 км/ч, 3 ч: 20 + 14 · 3 = 62 (км)."}, {"k": "уравнение", "v": "", "t": "Пусть x — неизвестная скорость. Для встречи за 2 ч при S = 100 км: (x + 15) · 2 = 100, x = 35."}, {"k": "проверка", "v": "", "t": "Проверяем: ответ подставляем в условие. Для 35 км/ч: (35 + 15) · 2 = 100. Верно."}]}, {"id": "m4q2l27s2", "scene": "sortGroups", "gate": true, "title": "Разложи по группам", "text": "Разложи карточки по группам. Выбери, к какой группе относится каждая карточка.", "q": "В какую группу относится?", "take": 8, "groups": [{"e": "", "k": "Задача на встречу"}, {"e": "", "k": "Задача на отдаление"}, {"e": "", "k": "Проверка ответа"}], "items": [{"g": 0, "e": "", "t": "расстояние между городами уменьшается", "h": "они сближаются"}, {"g": 0, "e": "", "t": "путь делим на скорость сближения", "h": "ищем время встречи"}, {"g": 0, "e": "", "t": "стрелки на схеме направлены друг к другу", "h": "схема встречи"}, {"g": 1, "e": "", "t": "к пути отдаления прибавляем начальное расстояние", "h": "они удаляются"}, {"g": 1, "e": "", "t": "стрелки на схеме направлены в разные стороны", "h": "схем const S = { li: 0, si: 0, mist: 0, token: 0, passed: {} };
let P = loadP();
function view(name){ ['map', 'lesson', 'end'].forEach(v => { $('#ac-v-' + v).style.display = v === name ? '' : 'none'; }); window.scrollTo(0, 0); }
const starsTxt = n => '★'.repeat(n) + '☆'.repeat(3 - n);

function renderMap(){
  let done = 0, h = '';
  LESSONS.forEach(function(L, i){
    const st = P[L.id] || 0; if (st) done++;
    h += '<div class="ac-lcard' + (st ? ' ac-done' : '') + '"><div class="ac-lnum">Урок ' + (i + 1) + '</div><div class="ac-licon">' + L.icon + '</div><div class="ac-ltitle">' + L.title + '</div><div class="ac-lgoal">' + L.goal + '</div><div class="ac-lstars" style="color:#F5B400">' + (st ? starsTxt(st) : '') + '</div><button class="ac-btn' + (st ? ' ac-alt' : ' ac-go') + '" data-i="' + i + '">' + (st ? 'Пройти снова' : 'Начать') + '</button></div>';
  });
  $('#ac-map').innerHTML = h;
  $('#ac-pfill').style.width = (done * 100 / LESSONS.length) + '%';
  $('#ac-ptxt').textContent = done + ' из ' + LESSONS.length;
  $$('#ac-map .ac-btn').forEach(b => b.onclick = () => openLesson(+b.dataset.i));
}
function openLesson(i){ S.li = i; S.si = 0; S.mist = 0; S.passed = {}; view('lesson'); renderStep(); }
function renderDots(){
  const L = LESSONS[S.li]; let h = '';
  L.steps.forEach((s, k) => { h += '<span class="ac-sdot' + (S.passed[k] ? ' ac-sd-done' : '') + (k === S.si ? ' ac-sd-cur' : '') + '"></span>'; });
  $('#ac-dots').innerHTML = h;
}
function renderStep(){
  stopSpeak();
  const L = LESSONS[S.li], st = L.steps[S.si], tok = ++S.token, stage = $('#ac-stage');
  const gated = !!st.gate && !S.passed[S.si];
  $('#ac-stepno').textContent = 'Шаг ' + (S.si + 1) + ' из ' + L.steps.length;
  $('#ac-lessonname').textContent = 'Урок ' + (S.li + 1) + ': ' + L.title;
  $('#ac-title').textContent = st.title;
  $('#ac-bubble').innerHTML = st.text;
  stage.innerHTML = ''; $('#ac-fb').textContent = ''; $('#ac-fb').className = 'ac-fb';
  const next = $('#ac-next'), prev = $('#ac-prev');
  next.disabled = gated; next.classList.remove('ac-pulse');
  if (BS){ BS.base(gated ? 'think' : 'idle'); if (S.si === 0) BS.react('wave', 2400); }
  next.textContent = S.si === L.steps.length - 1 ? 'Завершить урок ✓' : 'Дальше →';
  prev.disabled = S.si === 0;
  const ctx = {
    alive: () => tok === S.token,
    done: () => { if (tok !== S.token) return; S.passed[S.si] = true; next.disabled = false; if (BS) BS.base('idle'); if (!S.passed['_p' + S.si]){ S.passed['_p' + S.si] = 1; next.classList.add('ac-pulse'); } renderDots(); },
    miss: () => { S.mist++; },
    fb: (t, kind) => { if (kind === 'ok') bsReact('happy', 1500); else if (kind === 'bad') bsReact('oops', 1600); const f = $('#ac-fb'); f.textContent = t; f.className = 'ac-fb ' + (kind === 'ok' ? 'ac-ok' : kind === 'bad' ? 'ac-bad' : 'ac-info'); }
  };
  renderDots();
  SCENES[st.scene](stage, st, ctx);
  if ($('#ac-auto').checked) speak(st.id, st.say || st.text);
}
/* ===== награды: звёзды сайта, наклейка за курс, журнал занятий ===== */
function courseReward(L, oldStars, newStars){
  try {
    const slug = KEY.replace(/^bilim_/, '').replace(/_v\d+$/, '');
    const gain = Math.max(0, newStars - oldStars) * 3;
    if (gain > 0 && window.recordGameResult) recordGameResult('course_' + slug + '_' + L.id, gain, 9); /* внутри уже пишется журнал занятий */
    else if (window.logActivity) logActivity();
    if (LESSONS.every(x => (P[x.id] || 0) > 0)){
      let al = {}; try { al = JSON.parse(localStorage.getItem('bilim_stickers_v1')) || {}; } catch(e){}
      if (!al[slug]){
        al[slug] = Date.now(); try { localStorage.setItem('bilim_stickers_v1', JSON.stringify(al)); } catch(e){}
        const name = document.title.replace(/^Курс:\s*/, '').replace(/\s*—.*$/, '');
        if (window.showCelebrationQueue) showCelebrationQueue([{ type: 'achievement', icon: '🏅', titleKey: 'Курс «' + name + '» пройден! Наклейка добавлена в альбом.' }]);
      }
    }
  } catch(e){}
}
function finishLesson(){
  const L = LESSONS[S.li];
  const stars = S.mist <= 1 ? 3 : S.mist <= 4 ? 2 : 1;
  const oldStars = P[L.id] || 0; P[L.id] = Math.max(oldStars, stars); saveP(P); courseReward(L, oldStars, stars);
  stopSpeak();
  $('#ac-endtitle').textContent = 'Урок «' + L.title + '» пройден!';
  let h = ''; for (let k = 0; k < 3; k++) h += '<span style="animation-delay:' + (k * 250) + 'ms;color:' + (k < stars ? '#F5B400' : '#D5DCE4') + '">★</span>';
  $('#ac-endstars').innerHTML = h;
  $('#ac-endtext').textContent = S.mist === 0 ? 'Без единой ошибки — великолепно!' : S.mist <= 4 ? 'Ошибок: ' + S.mist + '. Хороший результат!' : 'Ошибок: ' + S.mist + '. Можно пройти урок ещё раз и улучшить результат.';
  $('#ac-endnext').style.display = S.li < LESSONS.length - 1 ? '' : 'none';
  if (BS) BS.talk(false);
  if (!BSE && window.Barsik) BSE = Barsik.mount($('#ac-endbs'));
  if (BSE) BSE.set(stars >= 2 ? 'cheer' : 'happy');
  view('end');
}
$('#ac-next').onclick = function(){
  const L = LESSONS[S.li];
  if (S.si < L.steps.length - 1){ S.si++; renderStep(); window.scrollTo(0, 0); } else finishLesson();
};
$('#ac-prev').onclick = function(){ if (S.si > 0){ S.si--; renderStep(); } };
$('#ac-tomap').onclick = function(){ stopSpeak(); if (BS) BS.base('idle'); S.token++; renderMap(); view('map'); };
$('#ac-endmap').onclick = function(){ renderMap(); view('map'); };
$('#ac-endnext').onclick = function(){ openLesson(S.li + 1); };
$('#ac-speak').onclick = function(){
  if (this.classList.contains('ac-on')){ stopSpeak(); return; }
  const st = LESSONS[S.li].steps[S.si]; speak(st.id, st.say || st.text);
};
$('#ac-auto').checked = loadAuto();
$('#ac-auto').onchange = function(){ saveAuto(this.checked); if (this.checked){ const st = LESSONS[S.li].steps[S.si]; speak(st.id, st.say || st.text); } else stopSpeak(); };
if (window.speechSynthesis){ speechSynthesis.onvoiceschanged = function(){}; speechSynthesis.getVoices(); }

window.__ac = { open: function(l, s){ S.li = l; S.si = s || 0; S.mist = 0; S.passed = {}; view('lesson'); renderStep(); }, LESSONS: LESSONS, GENS: GENS }; // для проверки
renderMap();
})();
</script>
