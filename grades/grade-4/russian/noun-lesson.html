<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Три склонения имён существительных — Білім Аралы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#24324a;--muted:#5d6b85;--bg:#f4f7ff;--card:#fff;--line:#dde5f5;--blue:#3b6cf6;--blue-d:#2a52c9;--green:#1f9d63;--green-l:#e3f6ec;--red:#d8493d;--red-l:#fdeceb;--amber:#f2a516;--amber-l:#fff4d9;--violet:#7a54d6;--rad:16px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;font-size:17px;line-height:1.5}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:#fff;border-bottom:1px solid var(--line)}
.logo{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:22px;color:var(--blue-d);text-decoration:none}
.wrap{max-width:860px;margin:0 auto;padding:16px 14px 80px}
.back{display:inline-block;margin:6px 0 10px;color:var(--blue-d);font-weight:700;text-decoration:none}
h1{font-family:'Baloo 2',sans-serif;font-size:30px;margin:4px 0 2px}
.sub{color:var(--muted);margin:0 0 14px}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 16px}
.stp{flex:1;min-width:92px;text-align:center;padding:8px 6px;border-radius:12px;background:#e8eefc;color:var(--muted);font-weight:800;font-size:14px;cursor:pointer;border:2px solid transparent}
.stp.on{background:var(--blue);color:#fff}
.stp.done{background:var(--green-l);color:var(--green);border-color:#bfe8d1}
.stp.on.done{background:var(--blue);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:18px 18px 20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(40,70,140,.06)}
.card h2{font-family:'Baloo 2',sans-serif;font-size:23px;margin:0 0 8px}
.card h3{font-size:18px;margin:14px 0 6px}
.goal{background:var(--amber-l);border-radius:12px;padding:10px 14px;margin:0 0 14px}
.rule{background:#eef3ff;border-left:5px solid var(--blue);border-radius:10px;padding:10px 14px;margin:12px 0}
button{font-family:inherit;font-size:16px;font-weight:800;cursor:pointer}
.btn{background:var(--blue);color:#fff;border:0;border-radius:12px;padding:11px 20px}
.btn:hover{background:var(--blue-d)}
.btn.sec{background:#e8eefc;color:var(--blue-d)}
.btn[disabled]{opacity:.45;cursor:default}
.opts{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.opt{background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px 16px;min-width:90px;color:var(--ink)}
.opt:hover{border-color:var(--blue)}
.opt.good{background:var(--green-l);border-color:var(--green);color:var(--green)}
.opt.bad{background:var(--red-l);border-color:var(--red);color:var(--red)}
.fb{margin:10px 0 4px;padding:10px 14px;border-radius:12px;font-weight:600;display:none}
.fb.show{display:block}
.fb.ok{background:var(--green-l);color:#146b43}
.fb.no{background:var(--red-l);color:#9c2c22}
.hint{margin-top:8px;padding:9px 13px;border-radius:12px;background:var(--amber-l);display:none}
.hint.show{display:block}
.hbtn{background:none;border:0;color:var(--violet);padding:4px 0;font-size:15px}
table.t{border-collapse:collapse;width:100%;margin:10px 0;font-size:16px}
table.t th,table.t td{border:1px solid var(--line);padding:7px 8px;text-align:center}
table.t th{background:#eef3ff}
table.t td.l{text-align:left;font-weight:700}
.sorts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.col{border:2px dashed #b9c8ee;border-radius:14px;min-height:150px;padding:8px;background:#fafcff;cursor:pointer}
.col h4{margin:0 0 6px;text-align:center;font-size:15px;color:var(--blue-d)}
.chip{display:inline-block;background:#fff;border:2px solid var(--line);border-radius:10px;padding:5px 11px;margin:3px;font-weight:700}
.chip.sel{border-color:var(--violet);background:#f1ebff}
.chip.good{border-color:var(--green);background:var(--green-l)}
.pool{min-height:54px;padding:6px;border-radius:12px;background:#f1f4fb}
input.ans{font:inherit;font-size:18px;padding:9px 12px;border:2px solid var(--line);border-radius:12px;width:220px;max-width:100%}
input.ans:focus{outline:none;border-color:var(--blue)}
.err-row{display:flex;gap:10px;align-items:center;padding:9px 12px;border:2px solid var(--line);border-radius:12px;margin:7px 0;background:#fff;cursor:pointer}
.err-row:hover{border-color:var(--blue)}
.err-row.bad{background:var(--red-l);border-color:var(--red)}
.err-row.good{background:var(--green-l);border-color:var(--green)}
.q{font-weight:800;margin:6px 0}
.small{color:var(--muted);font-size:14px}
.bar{height:12px;background:#e8eefc;border-radius:8px;overflow:hidden;margin:6px 0}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#3b6cf6,#1f9d63);width:0;transition:width .4s}
.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:12px 0}
.sk{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff}
.lvl{display:inline-block;padding:3px 12px;border-radius:99px;font-weight:800;font-size:14px}
.lvl.a{background:var(--green-l);color:var(--green)}
.lvl.b{background:var(--amber-l);color:#9a6a00}
.lvl.c{background:var(--red-l);color:var(--red)}
.sample{background:#f6f9ff;border:1px dashed #b9c8ee;border-radius:12px;padding:10px 14px;margin:8px 0}
textarea{width:100%;font:inherit;padding:10px 12px;border:2px solid var(--line);border-radius:12px;min-height:84px}
label.ck{display:block;margin:6px 0;cursor:pointer}
.hide{display:none}
@media(max-width:560px){.sorts{grid-template-columns:1fr}.stp{min-width:70px;font-size:12px}h1{font-size:25px}}
</style>
<style>.vid{margin:6px 0 16px}.vid h3{margin:0 0 8px}</style>
</head>
<body>
<header><a href="../../../index.html" class="logo">🐆 Білім Аралы</a></header>
<div class="wrap">
  <a class="back" href="index.html">← К русскому языку, 4 класс</a>
  <h1>Три склонения имён существительных</h1>
  <p class="sub">Русский язык · 4 класс · пробный урок нового формата: разбор → практика → проверка</p>
  <div class="steps" id="steps"></div>
  <div id="stage"></div>
</div>

<script src="../../../assets/minifilm.js"></script>
<script src="../../../assets/films/rus4-noun.js"></script>
<script>
(function(){
"use strict";
var KEY='bilim_noun_lesson_v1';
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var S=load();
S.stat=S.stat||{rod:[0,0],end:[0,0],skl:[0,0],init:[0,0]};   // [с первой попытки верно, всего]
S.done=S.done||{};
S.final=S.final||null;
function note(skill,ok){S.stat[skill][1]++;if(ok)S.stat[skill][0]++;save()}
function norm(s){return String(s).toLowerCase().replace(/ё/g,'е').replace(/[^а-я]/g,'')}
function $(id){return document.getElementById(id)}
function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!==undefined)e.innerHTML=html;return e}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}

var STEPS=[['1','Разбор'],['2','Три шага'],['3','Сортировка'],['4','Начальная форма'],['5','Найди ошибку'],['6','Пиши сам'],['7','Проверка'],['8','Итог']];
var cur=S.cur||0;
function goto(n){cur=n;S.cur=n;save();render();window.scrollTo({top:0,behavior:'smooth'})}
function drawSteps(){var box=$('steps');box.innerHTML='';STEPS.forEach(function(s,i){var d=el('div','stp'+(i===cur?' on':'')+(S.done[i]?' done':''),s[0]+'. '+s[1]);d.onclick=function(){goto(i)};box.appendChild(d)})}

/* ---------- общий блок «подсказка» ---------- */
function hintBlock(h1,h2){
  var w=el('div'),lvl=0;
  var b=el('button','hbtn','💡 Нужна подсказка');var box=el('div','hint');
  b.onclick=function(){lvl++;if(lvl===1){box.innerHTML=h1;box.classList.add('show');b.textContent=h2?'💡 Ещё подсказка':'💡 Подсказка открыта'}else if(lvl===2&&h2){box.innerHTML=h1+'<br><br>'+h2;b.textContent='💡 Все подсказки открыты'}};
  w.appendChild(b);w.appendChild(box);return w;
}
function fb(){var f=el('div','fb');return f}
function show(f,ok,t){f.className='fb show '+(ok?'ok':'no');f.innerHTML=t}

/* ---------- 1. РАЗБОР ---------- */
function stepIntro(){
  var c=el('div','card');
  c.innerHTML='<h2>Зачем нужно склонение?</h2>'+
  '<div class="goal"><b>Цель урока:</b> научиться по трём шагам определять склонение любого имени существительного.</div>'+
  '<p>Существительные меняются по падежам: <i>любовь, любви, любовью, о любви</i>. Окончания у слов в одних и тех же падежах могут совпадать. По этому признаку все существительные делятся на <b>три группы — три склонения</b>.</p>'+
  '<div class="vid"><h3>🎬 Видео-объяснение (1,5 минуты)</h3><div class="mf" data-film="rus4-noun" id="vidbox"></div></div>'+
  '<h3>Смотри, как это выглядит</h3>'+
  '<table class="t"><tr><th>Падеж</th><th>Вопрос</th><th>жен. род<br>любовь</th><th>муж. род<br>дом</th><th>сред. род<br>окно</th></tr>'+
  '<tr><td class="l">И.п.</td><td>что?</td><td>любовь</td><td>дом</td><td>окно</td></tr>'+
  '<tr><td class="l">Р.п.</td><td>чего?</td><td>любви</td><td>дома</td><td>окна</td></tr>'+
  '<tr><td class="l">Д.п.</td><td>чему?</td><td>любви</td><td>дому</td><td>окну</td></tr>'+
  '<tr><td class="l">В.п.</td><td>что?</td><td>любовь</td><td>дом</td><td>окно</td></tr>'+
  '<tr><td class="l">Т.п.</td><td>чем?</td><td>любовью</td><td>домом</td><td>окном</td></tr>'+
  '<tr><td class="l">П.п.</td><td>о чём?</td><td>о любви</td><td>о доме</td><td>об окне</td></tr></table>'+
  '<p class="small">Заметь: у «дома» и «окна» окончания почти одинаковые (<i>дому, окну; домом, окном</i>), а у «любви» — другие. Значит, «дом» и «окно» — одна группа, «любовь» — другая.</p>'+
  '<h3>Три склонения</h3>'+
  '<table class="t"><tr><th>Склонение</th><th>Какие слова</th><th>Примеры</th></tr>'+
  '<tr><td class="l">1-е</td><td>женский и мужской род с окончанием <b>-а, -я</b></td><td>мама, земля, дядя, папа</td></tr>'+
  '<tr><td class="l">2-е</td><td>мужской род с <b>нулевым</b> окончанием и средний род с окончанием <b>-о, -е</b></td><td>дом, конь, окно, море</td></tr>'+
  '<tr><td class="l">3-е</td><td>женский род с <b>нулевым</b> окончанием (на конце мягкий знак)</td><td>любовь, мысль, степь</td></tr></table>'+
  '<div class="rule"><b>Запомни:</b> слова с одним значением могут быть разного склонения. Например, <i>папа</i> — 1-е склонение, <i>отец</i> — 2-е.</div>'+
  '<button class="btn" id="n1">Понятно, дальше →</button>';
  $('stage').appendChild(c);
  try{MF.mount($('vidbox'))}catch(e){}
  $('n1').onclick=function(){S.done[0]=1;goto(1)};
}

/* ---------- 2. ТРИ ШАГА ---------- */
var WORDS3=[
 {w:'ценность',rod:'ж',end:'0',skl:3},
 {w:'дядя',rod:'м',end:'ая',skl:1},
 {w:'море',rod:'с',end:'ое',skl:2},
 {w:'зверь',rod:'м',end:'0',skl:2}
];
function stepWizard(){
  var c=el('div','card');
  c.innerHTML='<h2>Три шага: как определить склонение</h2>'+
  '<div class="rule"><b>Шаг 1.</b> Поставь слово в начальную форму (И.п., ед. число) и определи <b>род</b>.<br><b>Шаг 2.</b> Найди <b>окончание</b> в начальной форме.<br><b>Шаг 3.</b> По роду и окончанию определи <b>склонение</b>.</div>'+
  '<p>Пример из учебника: <b>ценность</b> → женский род → нулевое окончание → <b>3-е склонение</b>. Теперь попробуй сам.</p>';
  var holder=el('div');c.appendChild(holder);$('stage').appendChild(c);
  var i=0,part=0,tried=false;
  function nextWord(){if(i>=WORDS3.length){S.done[1]=1;save();holder.innerHTML='<div class="fb show ok">Отлично! Ты справился со всеми словами.</div><p><button class="btn" id="n2">Дальше →</button></p>';$('n2').onclick=function(){goto(2)};return}part=0;tried=false;draw()}
  function draw(){
    var W=WORDS3[i];holder.innerHTML='';
    holder.appendChild(el('div','q','Слово №'+(i+1)+' из '+WORDS3.length+': «'+W.w+'»'));
    var titles=['Шаг 1. Какой род?','Шаг 2. Какое окончание?','Шаг 3. Какое склонение?'];
    var opts=[[['м','мужской'],['ж','женский'],['с','средний']],[['ая','-а, -я'],['0','нулевое (согласная или ь на конце)'],['ое','-о, -е']],[['1','1-е'],['2','2-е'],['3','3-е']]];
    var keys=['rod','end','skl'];
    var done=el('div');
    holder.appendChild(done);
    for(var p=0;p<part;p++){done.appendChild(el('div','small','✔ '+titles[p]+' '+(opts[p].filter(function(o){return o[0]==String(W[keys[p]])})[0][1])))}
    holder.appendChild(el('h3','',titles[part]));
    var ob=el('div','opts');var f=fb();
    opts[part].forEach(function(o){var b=el('button','opt',o[1]);b.onclick=function(){
      var ok=o[0]==String(W[keys[part]]);
      if(!tried){note(keys[part],ok);}
      if(ok){b.className='opt good';tried=false;setTimeout(function(){part++;if(part>=3){i++;nextWord()}else{draw()}},650)}
      else{b.className='opt bad';tried=true;
        var m={rod:'Род определяем по смыслу и по окончанию: ',end:'Смотри на последнюю букву слова в начальной форме. ',skl:'Склонение зависит от рода и окончания: 1-е — на -а, -я; 2-е — нулевое у м.р. и -о, -е у ср.р.; 3-е — нулевое у ж.р. '}[keys[part]];
        show(f,false,m+'Попробуй ещё раз.')}
    };ob.appendChild(b)});
    holder.appendChild(ob);holder.appendChild(f);
    holder.appendChild(hintBlock(
      part===0?'Попробуй подставить слова «он», «она», «оно»: <i>зверь — он</i>.':part===1?'Прочитай слово и посмотри на его последнюю букву. Мягкий знак — это не гласная.':'Вспомни таблицу: 1-е — -а, -я; 2-е — м.р. нулевое и ср.р. -о, -е; 3-е — ж.р. нулевое.',
      part===0?'«Ценность» — она, значит женский род.':part===1?'Если слово оканчивается на согласную или на ь, окончание нулевое.':'Сравни род и окончание, которые ты уже нашёл, со строками таблицы склонений.'));
  }
  nextWord();
}

/* ---------- 3. СОРТИРОВКА ---------- */
var SORT=[['мама',1],['отец',2],['река',1],['лето',2],['дочь',3],['земля',1],['сирень',3],['брат',2],['дядя',1],['мать',3],['закат',2],['болезнь',3]];
function stepSort(){
  var c=el('div','card');
  c.innerHTML='<h2>Разложи слова по склонениям</h2><p>Нажми на слово, потом на колонку, куда оно относится.</p>';
  var pool=el('div','pool');var cols=el('div','sorts');var f=fb();
  var sel=null,left=SORT.length,mistakes=0,chips={};
  shuffle(SORT).forEach(function(s){var ch=el('span','chip',s[0]);ch.onclick=function(){if(sel)sel.classList.remove('sel');sel=ch;ch.classList.add('sel');ch._d=s};chips[s[0]]=ch;pool.appendChild(ch)});
  [1,2,3].forEach(function(n){var col=el('div','col','<h4>'+n+'-е склонение</h4>');col.onclick=function(){
    if(!sel)return;var s=sel._d;var ok=s[1]===n;
    if(!sel._t){sel._t=1;note('skl',ok)}
    if(ok){sel.classList.remove('sel');sel.classList.add('good');sel.onclick=null;col.appendChild(sel);sel=null;left--;
      show(f,true,'Верно!');if(!left){S.done[2]=1;save();show(f,true,'Все слова на местах'+(mistakes?'. Ошибок: '+mistakes:' без ошибок')+'! 🎉');nb.disabled=false}}
    else{mistakes++;var why={1:'1-е склонение: слова на -а, -я.',2:'2-е склонение: м.р. с нулевым окончанием и ср.р. на -о, -е.',3:'3-е склонение: ж.р. с нулевым окончанием (мягкий знак).'};
      var w=s[0];var t={1:'женский или мужской род с окончанием -а, -я',2:'мужской род без окончания или средний род на -о, -е',3:'женский род с мягким знаком на конце'}[s[1]];
      show(f,false,'«'+w+'» — не в эту колонку. Подумай: '+t+'.')}
  };cols.appendChild(col)});
  c.appendChild(pool);c.appendChild(cols);c.appendChild(f);
  c.appendChild(hintBlock('Сначала определи род слова, потом посмотри на конец слова.','Мягкий знак на конце у слов женского рода — 3-е склонение. У слов мужского рода с мягким знаком — 2-е.'));
  var nb=el('button','btn','Дальше →');nb.disabled=!!S.done[2];nb.style.marginTop='12px';nb.onclick=function(){goto(3)};c.appendChild(nb);
  $('stage').appendChild(c);
}

/* ---------- 4. НАЧАЛЬНАЯ ФОРМА ---------- */
var INIT=[['о любви','любовь','ж.р., 3-е склонение'],['к маме','мама','1-е склонение'],['в степи','степь','ж.р., 3-е склонение'],['с братом','брат','2-е склонение'],['у моря','море','ср.р., 2-е склонение']];
function stepInit(){
  var c=el('div','card');
  c.innerHTML='<h2>Начальная форма слова</h2><div class="rule">Чтобы определить склонение, поставь слово в <b>именительный падеж единственного числа</b>: кто? что?</div><p>Напиши начальную форму выделенного слова.</p>';
  var done=0;
  INIT.forEach(function(it,k){
    var row=el('div');row.style.margin='14px 0';
    row.innerHTML='<div class="q">'+(k+1)+'. «'+it[0]+'» →</div>';
    var inp=el('input','ans');inp.placeholder='начальная форма';var b=el('button','btn sec','Проверить');b.style.marginLeft='8px';var f=fb();var tried=false,solved=false;
    b.onclick=function(){if(solved)return;var ok=norm(inp.value)===norm(it[1]);if(!tried){note('init',ok);tried=true}
      if(ok){solved=true;show(f,true,'Верно: '+it[1]+' ('+it[2]+').');inp.disabled=true;done++;if(done===INIT.length){S.done[3]=1;save();nb.disabled=false}}
      else{show(f,false,'Пока нет. Задай вопрос: кто? что? Слово должно ответить «'+([1,3].indexOf(k)>=0?'кто?':'что?')+'» в единственном числе.')}};
    inp.onkeydown=function(e){if(e.key==='Enter')b.onclick()};
    row.appendChild(inp);row.appendChild(b);row.appendChild(f);
    row.appendChild(hintBlock('Это слово стоит не в именительном падеже. Подумай, как оно звучит, когда на него отвечают «кто? что?»'));
    c.appendChild(row);
  });
  var nb=el('button','btn','Дальше →');nb.disabled=!!S.done[3];nb.onclick=function(){goto(4)};c.appendChild(nb);
  $('stage').appendChild(c);
}

/* ---------- 5. НАЙДИ ОШИБКУ ---------- */
var ERR=[
 [['земля — 1-е склонение',1],['брат — 2-е склонение',1],['радость — 3-е склонение',1],['окно — 3-е склонение',0,'«окно» — средний род на -о, поэтому 2-е склонение.']],
 [['папа — 1-е склонение',1],['конь — 2-е склонение',1],['мысль — 3-е склонение',1],['дедушка — 2-е склонение',0,'«дедушка» оканчивается на -а, поэтому 1-е склонение, хотя слово мужского рода.']],
 [['степь — 3-е склонение',1],['поле — 2-е склонение',1],['дядя — 1-е склонение',1],['мать — 2-е склонение',0,'«мать» — женский род с мягким знаком в других формах (матери), поэтому 3-е склонение.']]];
function stepErr(){
  var c=el('div','card');
  c.innerHTML='<h2>Найди ошибку</h2><p>В каждом списке одно слово указано с неверным склонением. Нажми на него.</p>';
  var left=ERR.length;
  ERR.forEach(function(set,k){
    var box=el('div');box.style.margin='14px 0';box.appendChild(el('div','q','Список '+(k+1)));var f=fb();var tried=false,fin=false;
    set.forEach(function(r){var row=el('div','err-row',r[0]);row.onclick=function(){if(fin)return;
      var ok=r[1]===0;if(!tried){note('skl',ok);tried=true}
      if(ok){fin=true;row.classList.add('bad');show(f,true,'Верно, это ошибка. '+r[2]);left--;if(!left){S.done[4]=1;save();nb.disabled=false}}
      else{row.classList.add('good');show(f,false,'В этой строке всё правильно. Проверь остальные: род и окончание.')}}
      box.appendChild(row)});
    box.appendChild(f);box.appendChild(hintBlock('Для каждого слова определи род и окончание по трём шагам.'));c.appendChild(box)});
  var nb=el('button','btn','Дальше →');nb.disabled=!!S.done[4];nb.onclick=function(){goto(5)};c.appendChild(nb);
  $('stage').appendChild(c);
}

/* ---------- 6. ПИШИ САМ ---------- */
function stepWrite(){
  var c=el('div','card');
  c.innerHTML='<h2>Пиши сам</h2><div class="goal"><b>Задание.</b> Запиши по одному слову каждого склонения и составь с ними предложение (можно одно предложение на все три слова).</div>'+
  '<textarea id="wr" placeholder="Например: мама — 1-е склонение, ... "></textarea>'+
  '<p><button class="btn sec" id="chk">Показать образец и проверить себя</button></p><div id="smp" class="hide"></div>';
  $('stage').appendChild(c);
  $('wr').value=S.wr||'';$('wr').oninput=function(){S.wr=this.value;save()};
  $('chk').onclick=function(){
    var s=$('smp');s.classList.remove('hide');
    s.innerHTML='<div class="sample"><b>Образец.</b> мама — 1-е склонение, брат — 2-е склонение, радость — 3-е склонение.<br><i>Мама рассказала брату о своей радости.</i></div>'+
    '<p><b>Проверь себя:</b></p>'+
    '<label class="ck"><input type="checkbox" class="cc"> Есть слово 1-го склонения (м. или ж. род на -а, -я)</label>'+
    '<label class="ck"><input type="checkbox" class="cc"> Есть слово 2-го склонения (м.р. с нулевым окончанием или ср.р. на -о, -е)</label>'+
    '<label class="ck"><input type="checkbox" class="cc"> Есть слово 3-го склонения (ж.р. с мягким знаком на конце)</label>'+
    '<label class="ck"><input type="checkbox" class="cc"> Я проверил каждое слово по трём шагам</label>'+
    '<p><button class="btn" id="n6" disabled>Дальше →</button></p>';
    var cc=s.querySelectorAll('.cc');function upd(){var all=true;for(var i=0;i<cc.length;i++)if(!cc[i].checked)all=false;$('n6').disabled=!all}
    for(var i=0;i<cc.length;i++)cc[i].onchange=upd;
    $('n6').onclick=function(){S.done[5]=1;goto(6)};
  };
  if(S.done[5])$('chk').click();
}

/* ---------- 7. ПРОВЕРКА ---------- */
var FIN=[['тётя',1,'ж.р., окончание -я'],['картофель',2,'м.р.: «он картофель», нулевое окончание (не путай с ж.р. на ь!)'],['тишина',1,'ж.р., окончание -а'],['тень',3,'ж.р. с мягким знаком'],['сынишка',1,'м.р., но окончание -а']];
function stepFinal(){
  var c=el('div','card');
  c.innerHTML='<h2>Проверка</h2><p>Пять слов. Подсказок нет. Чтобы тема считалась освоенной, нужно не меньше 4 верных ответов.</p>';
  var order=shuffle(FIN),k=0,right=0,box=el('div');c.appendChild(box);$('stage').appendChild(c);
  function q(){
    if(k>=order.length){S.final=right;S.done[6]=1;save();box.innerHTML='<div class="fb show '+(right>=4?'ok':'no')+'">Результат: '+right+' из '+order.length+'.</div><p><button class="btn" id="n7">Смотреть итог →</button></p>';$('n7').onclick=function(){goto(7)};return}
    var it=order[k];box.innerHTML='<div class="q">'+(k+1)+' из '+order.length+'. Какого склонения слово «'+it[0]+'»?</div>';
    var ob=el('div','opts');[1,2,3].forEach(function(n){var b=el('button','opt',n+'-е');b.onclick=function(){var ok=n===it[1];note('skl',ok);if(ok)right++;
      b.className='opt '+(ok?'good':'bad');var f=fb();show(f,ok,(ok?'Верно. ':'Неверно, это '+it[1]+'-е склонение. ')+it[0]+': '+it[2]+'.');box.appendChild(f);
      var all=ob.querySelectorAll('button');for(var i=0;i<all.length;i++)all[i].disabled=true;
      var nx=el('button','btn','Дальше →');nx.style.marginTop='8px';nx.onclick=function(){k++;q()};box.appendChild(nx)};ob.appendChild(b)});
    box.appendChild(ob);
  }
  q();
}

/* ---------- 8. ИТОГ ---------- */
function stepReport(){
  var c=el('div','card');
  var fin=S.final;var lv=fin===null?['c','Проверка не пройдена']:fin>=4?['a','Тема освоена']:fin===3?['b','Почти освоено']:['c','Нужно повторить'];
  c.innerHTML='<h2>Итог урока</h2><p><span class="lvl '+lv[0]+'">'+lv[1]+'</span>'+(fin!==null?' &nbsp; Итоговая проверка: '+fin+' из 5':'')+'</p>';
  var names={rod:'Определение рода',end:'Нахождение окончания',skl:'Определение склонения',init:'Начальная форма слова'};
  var grid=el('div','skills');
  Object.keys(names).forEach(function(k){var a=S.stat[k][0],t=S.stat[k][1];var p=t?Math.round(100*a/t):0;
    var lab=!t?['c','не пройдено']:p>=80?['a','уверенно']:p>=50?['b','есть пробелы']:['c','повторить'];
    var s=el('div','sk','<b>'+names[k]+'</b><div class="bar"><i style="width:'+p+'%"></i></div><span class="lvl '+lab[0]+'">'+lab[1]+'</span> <span class="small">'+(t?a+' из '+t+' с первой попытки':'')+'</span>');grid.appendChild(s)});
  c.appendChild(grid);
  var weak=[];if(S.stat.rod[1]&&S.stat.rod[0]/S.stat.rod[1]<.8)weak.push('шаг 1 «Три шага»');if(S.stat.end[1]&&S.stat.end[0]/S.stat.end[1]<.8)weak.push('шаг 2 «Три шага»');if(S.stat.skl[1]&&S.stat.skl[0]/S.stat.skl[1]<.8)weak.push('«Сортировка» и «Найди ошибку»');if(S.stat.init[1]&&S.stat.init[0]/S.stat.init[1]<.8)weak.push('«Начальная форма»');
  c.appendChild(el('p','',weak.length?'<b>Что повторить:</b> '+weak.join(', ')+'.':'Пробелов не видно. Молодец!'));
  c.appendChild(el('p','small','Этот отчёт может посмотреть родитель или учитель: по нему видно, что ребёнок освоил, а что нужно повторить.'));
  var r=el('button','btn sec','Пройти урок заново');r.onclick=function(){if(confirm('Стереть результаты и начать заново?')){S={stat:{rod:[0,0],end:[0,0],skl:[0,0],init:[0,0]},done:{},final:null,cur:0};save();cur=0;render()}};c.appendChild(r);
  $('stage').appendChild(c);
}

function render(){$('stage').innerHTML='';drawSteps();[stepIntro,stepWizard,stepSort,stepInit,stepErr,stepWrite,stepFinal,stepReport][cur]()}
render();
})();
</script>
</body>
