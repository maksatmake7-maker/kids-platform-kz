<!DOCTYPE html>
<html lang="kk">
<head>
<script src="../../../assets/media-base.js"></script>
<meta name="robots" content="noindex, nofollow">
<script src="../../../assets/stats.js" defer></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Қатты және ақырын дыбыстар — Білім Аралы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../assets/styles.css">
<link rel="stylesheet" href="../../../assets/world.css">
<link rel="stylesheet" href="../../../assets/subject.css">
<link rel="preload" as="script" href="../../../assets/barsik.js">
<link rel="preload" as="script" href="../../../games/mathx-voice.js">
<link rel="preload" as="script" href="../../../games/mathx.js">
<link rel="preload" as="script" href="../../../games/mathx-g2.js">
<link rel="preload" as="script" href="../../../games/mathx-hero.js">
<link rel="preload" as="script" href="../../../games/est2-kit.js">
<link rel="preload" as="script" href="../../../games/est2-soundloud-game.js">
<style id="mx-prehide">#explain-panel:not(.mxh){visibility:hidden}</style>
<script>setTimeout(function(){var e=document.getElementById("mx-prehide");if(e)e.remove();},15000);</script>
</head>
<body class="w-page" data-subject="estestvo">

<header>
  <a href="../../../index.html" class="logo"><span class="logo-dot">🐆</span> Білім Аралы</a>
  <div class="lang-toggle">
    <button data-lang="ru" onclick="applyLang('ru')">RU</button>
    <button class="active" data-lang="kz" onclick="applyLang('kz')">ҚАЗ</button>
    <button data-lang="en" onclick="applyLang('en')">EN</button>
    <button data-lang="zh" onclick="applyLang('zh')">中文</button>
    <button data-lang="uz" onclick="applyLang('uz')">O'ZB</button>
    <button data-lang="tg" onclick="applyLang('tg')">ТҶК</button>
    <button data-lang="ug" onclick="applyLang('ug')">Уйғурчә</button>
  </div>
</header>

<section class="game-shell">
  <a href="index.html" class="back-link" data-i18n="back_estestvo"></a>

  <div class="game-card explain-card" id="explain-panel">
    <h2 class="explain-heading" data-i18n="explain_heading"></h2>
    <p class="explain-text" data-i18n="est2soundloud_explain"></p>
    <div class="explain-actions">
      <button class="speak-btn" id="speak-btn">
        <span data-i18n="speak_button"></span>
      </button>
      <button class="cta" id="start-game-btn">
        <span data-i18n="badge_play"></span>
      </button>
    </div>
  </div>

  <div class="game-card" id="game-panel" style="display:none;">
    <h1 data-i18n="est2soundloud_game_title"></h1>
    <p class="game-sub" data-i18n="est2soundloud_game_sub"></p>
    <div class="game-meta">
      <div class="score-badge">
        <span data-i18n="score_label"></span>
        <span id="count-score-value">0</span>
      </div>
      <div class="score-badge">
        <span id="count-progress-value">0 / 10</span>
      </div>
    </div>
    <div id="game-root"></div>
  </div>
</section>

<footer data-i18n="footer"></footer>

<script>try{localStorage.setItem('bilim_lang_v1','kz')}catch(e){}</script>
<script>window.BILIM_NO_VOICE=1</script>
<style>#ac-speak,.mxs-snd,.mxs-replay{display:none !important}</style>
<script src="../../../assets/i18n.js"></script>
<script src="../../../assets/progress.js"></script>
<script src="../../../assets/world.js"></script>
<script src="../../../assets/subject-themes.js"></script>
<script src="../../../assets/subject.js"></script>
<script src="../../../assets/explain.js"></script>
<script src="../../../games/est2-kit.js"></script>
<script src="../../../games/est2-soundloud-game.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function(){
    initSpeakButton('speak-btn', 'est2soundloud_explain');
    initStartGameButton('start-game-btn', 'explain-panel', 'game-panel', function(){
      initEst2SoundloudGame('game-root');
    });
  });
</script>
</body>
</html>
