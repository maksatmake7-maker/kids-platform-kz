<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Национальные элементы — Білім Аралы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../assets/styles.css">
<link rel="preload" as="script" href="../../../assets/barsik.js">
<link rel="preload" as="script" href="../../../games/mathx-voice.js">
<link rel="preload" as="script" href="../../../games/mathx.js">
<link rel="preload" as="script" href="../../../games/mathx-g2.js">
<link rel="preload" as="script" href="../../../games/pz2-kit.js">
<link rel="preload" as="script" href="../../../games/pz2-trud3national-game.js">
</head>
<body>
<div class="cloud cloud1"></div>
<div class="cloud cloud2"></div>
<div class="cloud cloud3"></div>
<header>
  <a href="../../../index.html" class="logo"><span class="logo-dot">🐆</span> Білім Аралы</a>
  <div class="lang-toggle">
    <button class="active" data-lang="ru" onclick="applyLang('ru')">RU</button>
    <button data-lang="kz" onclick="applyLang('kz')">ҚАЗ</button>
    <button data-lang="en" onclick="applyLang('en')">EN</button>
    <button data-lang="zh" onclick="applyLang('zh')">中文</button>
    <button data-lang="uz" onclick="applyLang('uz')">O'ZB</button>
    <button data-lang="tg" onclick="applyLang('tg')">ТҶК</button>
    <button data-lang="ug" onclick="applyLang('ug')">ئۇيغۇر</button>
  </div>
</header>
<section class="game-shell">
  <a href="index.html" class="back-link">← К играм по труду</a>
  <div class="game-card" id="game-panel">
    <h1>Национальные элементы</h1>
    <p class="game-sub">Узоры, предметы и материалы наших предков</p>
    <div class="game-meta">
      <div class="score-badge">
        <span data-i18n="score_label"></span>
        <span id="count-score-value">0</span>
      </div>
      <div class="score-badge">
        <span id="count-progress-value">0 / 10</span>
      </div>
    </div>
    <div id="game-root"></div>
  </div>
</section>
<footer data-i18n="footer"></footer>
<script src="../../../assets/i18n.js"></script>
<script src="../../../assets/progress.js"></script>
<script src="../../../games/pz2-kit.js"></script>
<script src="../../../games/pz2-trud3national-game.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function(){ initPz2Game('game-root'); });
</script>
</body>
</html>
