<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Аппликация из бумаги — Білім Аралы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../assets/styles.css">
</head>
<body>
<div class="cloud cloud1"></div>
<div class="cloud cloud2"></div>
<div class="cloud cloud3"></div>

<header>
  <a href="../../../index.html" class="logo"><span class="logo-dot">🐆</span> Білім Аралы</a>
  <div class="lang-toggle">
    <button class="active" data-lang="ru" onclick="applyLang('ru')">RU</button>
    <button data-lang="kz" onclick="applyLang('kz')">ҚАЗ</button>
    <button data-lang="en" onclick="applyLang('en')">EN</button>
    <button data-lang="zh" onclick="applyLang('zh')">中文</button>
    <button data-lang="uz" onclick="applyLang('uz')">O'ZB</button>
    <button data-lang="tg" onclick="applyLang('tg')">ТҶК</button>
    <button data-lang="ug" onclick="applyLang('ug')">ئۇيغۇر</button>
  </div>
</header>

<section class="game-shell">
  <a href="index.html" class="back-link" data-i18n="back_trud"></a>

  <div class="game-card explain-card" id="explain-panel">
    <h2 class="explain-heading" data-i18n="explain_heading"></h2>
    <p class="explain-text" data-i18n="applique_explain"></p>
    <div class="explain-actions">
      <button class="speak-btn" id="speak-btn">
        <span data-i18n="speak_button"></span>
      </button>
      <button class="cta" id="start-video-btn">
        <span data-i18n="btn_watch"></span>
      </button>
    </div>
  </div>

  <div class="game-card" id="video-panel" style="display:none;">
    <h1 data-i18n="applique_video_title"></h1>
    <div class="video-embed">
      <iframe src="https://www.youtube-nocookie.com/embed/p1MT8VmCt24?rel=0" title="Аппликация из бумаги" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>
    <button class="cta video-done-btn" id="done-btn">
      <span data-i18n="btn_done"></span>
    </button>
  </div>
</section>

<footer data-i18n="footer"></footer>

<script src="../../../assets/i18n.js"></script>
<script src="../../../assets/progress.js"></script>
<script src="../../../assets/explain.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function(){
    initSpeakButton('speak-btn', 'applique_explain', '../../../assets/audio/');
    initStartGameButton('start-video-btn', 'explain-panel', 'video-panel');
    document.getElementById('done-btn').addEventListener('click', function(){
      recordGameResult('applique', 1, 1);
      window.location.href = 'index.html';
    });
  });
</script>
</body>
</html>
