<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Грамота 1 класс — Білім Аралы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../assets/styles.css">
</head>
<body>
<div class="cloud cloud1"></div>
<div class="cloud cloud2"></div>
<div class="cloud cloud3"></div>

<header>
  <a href="../../../index.html" class="logo"><span class="logo-dot">🐆</span> Білім Аралы</a>
  <div class="lang-toggle">
    <button class="active" data-lang="ru" onclick="applyLang('ru')">RU</button>
    <button data-lang="kz" onclick="applyLang('kz')">ҚАЗ</button>
    <button data-lang="en" onclick="applyLang('en')">EN</button>
    <button data-lang="zh" onclick="applyLang('zh')">中文</button>
    <button data-lang="uz" onclick="applyLang('uz')">O'ZB</button>
    <button data-lang="tg" onclick="applyLang('tg')">ТҶК</button>
    <button data-lang="ug" onclick="applyLang('ug')">ئۇيغۇر</button>
  </div>
</header>

<section class="subjects" id="subjects" style="padding-top:20px;">
  <a href="../index.html" class="back-link" data-i18n="back_home" style="display:block; text-align:center; color:var(--ink); opacity:0.7;"></a>
  <span class="grade-tag" data-i18n="read_title"></span>
  <h2 data-i18n="hub_title"></h2>
  <p class="lead" data-i18n="hub_lead"></p>

  <h3 class="quarter-heading" data-i18n="q3_heading"></h3>
  <div class="island-grid">
    <a href="letters.html" class="island read ready" style="text-decoration:none;">
      <span class="emoji">🔤</span>
      <h3 data-i18n="hub_letter_title"></h3>
      <p data-i18n="hub_letter_desc"></p>
      <span class="badge" data-i18n="badge_play"></span>
    </a>
    <a href="words.html" class="island read ready" style="text-decoration:none;">
      <span class="emoji">📝</span>
      <h3 data-i18n="hub_word_title"></h3>
      <p data-i18n="hub_word_desc"></p>
      <span class="badge" data-i18n="badge_play"></span>
    </a>
    <a href="vowels.html" class="island read ready" style="text-decoration:none;">
      <span class="emoji">🔠</span>
      <h3 data-i18n="hub_vowel_title"></h3>
      <p data-i18n="hub_vowel_desc"></p>
      <span class="badge" data-i18n="badge_play"></span>
    </a>
    <a href="syllables.html" class="island read ready" style="text-decoration:none;">
      <span class="emoji">🧩</span>
      <h3 data-i18n="hub_syllable_title"></h3>
      <p data-i18n="hub_syllable_desc"></p>
      <span class="badge" data-i18n="badge_play"></span>
    </a>
    <a href="riddle.html" class="island read ready" style="text-decoration:none;">
      <span class="emoji">🧐</span>
      <h3 data-i18n="hub_riddle_title"></h3>
      <p data-i18n="hub_riddle_desc"></p>
      <span class="badge" data-i18n="badge_play"></span>
    </a>
    <a href="lecture.html" class="island read ready" style="text-decoration:none;">
      <span class="emoji">📺</span>
      <h3 data-i18n="hub_lecture_reading_title"></h3>
      <p data-i18n="hub_lecture_reading_desc"></p>
      <span class="badge" data-i18n="btn_watch"></span>
    </a>
  </div>

  <h3 class="quarter-heading" data-i18n="q4_heading"></h3>
  <div class="island-grid" data-requires="letter,word,vowel,syllable,riddle,lecture_reading">
    <a href="spelling.html" class="island read ready" style="text-decoration:none;">
      <span class="emoji">✍️</span>
      <h3 data-i18n="hub_spelling_title"></h3>
      <p data-i18n="hub_spelling_desc"></p>
      <span class="badge" data-i18n="badge_play"></span>
    </a>
    <a href="alphabetorder.html" class="island read ready" style="text-decoration:none;">
      <span class="emoji">🔤</span>
      <h3 data-i18n="hub_alphabetorder_title"></h3>
      <p data-i18n="hub_alphabetorder_desc"></p>
      <span class="badge" data-i18n="badge_play"></span>
    </a>
  </div>
  <p class="locked-message" data-i18n="locked_message"></p>
  <p class="quarter-empty" data-i18n="reading_q4_note3"></p>
</section>

<footer data-i18n="footer"></footer>

<script src="../../../assets/i18n.js"></script>
<script src="../../../assets/progress.js"></script>
</body>
</html>
