<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Курс: Математика 2 класс — Білім Аралы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../assets/styles.css">
<link rel="stylesheet" href="../../../assets/world.css">
<link rel="stylesheet" href="../../../assets/subject.css">
<style>
  /* Стили только для этого курса (префикс ac-) — остальной сайт не затрагивают */
  .ac-shell{position:relative;z-index:2;max-width:880px;margin:0 auto;padding:10px 16px 80px;}
  .ac-back{display:inline-block;color:#fff;font-weight:800;text-decoration:none;opacity:1;background:rgba(29,53,87,.6);border:none;font-size:.95rem;cursor:pointer;font-family:'Nunito',sans-serif;padding:7px 16px;border-radius:999px;}
  .ac-back:hover{opacity:1;}
  .ac-card{background:#fff;border-radius:28px;padding:26px 22px 22px;box-shadow:0 12px 0 rgba(29,53,87,.08),0 18px 34px rgba(29,53,87,.12);}
  .ac-card h1,.ac-card h2{font-family:'Baloo 2',sans-serif;color:#1D3557;text-align:center;}
  .ac-sub{text-align:center;color:#5C7690;font-weight:700;margin:4px 0 8px;}
  .ac-note{text-align:center;font-size:.8rem;color:#8B95A3;margin-bottom:16px;}

  /* ----- карта курса ----- */
  .ac-progress{display:flex;align-items:center;gap:12px;max-width:520px;margin:12px auto 22px;}
  .ac-progress-bar{flex:1;height:14px;background:#E5EAF0;border-radius:999px;overflow:hidden;}
  .ac-progress-fill{height:100%;background:linear-gradient(90deg,#FFC93C,#FF9F1C);border-radius:999px;transition:width .5s ease;}
  .ac-progress-txt{font-family:'Baloo 2',sans-serif;font-weight:800;color:#1D3557;white-space:nowrap;}
  .ac-map{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;}
  .ac-lcard{border:2px solid #E1E8EF;border-radius:20px;padding:16px;text-align:left;background:#FAFCFE;display:flex;flex-direction:column;gap:6px;}
  .ac-lcard.ac-done{border-color:#3FAE5A;background:#F3FBF4;}
  .ac-lnum{font-size:.78rem;font-weight:800;color:#8B95A3;text-transform:uppercase;letter-spacing:.04em;}
  .ac-licon{font-size:2.2rem;line-height:1;}
  .ac-ltitle{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:1.2rem;color:#1D3557;line-height:1.15;}
  .ac-lgoal{font-size:.9rem;color:#5C6B7A;flex:1;}
  .ac-lstars{font-size:1.1rem;letter-spacing:2px;min-height:1.4em;}
  .ac-btn{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:1rem;background:#1D3557;color:#fff;border:none;border-radius:999px;padding:11px 24px;cursor:pointer;transition:transform .15s ease,background .2s ease;}
  .ac-btn:hover:not(:disabled){transform:translateY(-1px);background:#27487a;}
  .ac-btn:disabled{opacity:.4;cursor:default;}
  .ac-btn.ac-alt{background:#fff;color:#1D3557;border:2px solid #1D3557;}
  .ac-btn.ac-go{background:#3FB088;}
  .ac-btn.ac-go:hover:not(:disabled){background:#35a07a;}
  .ac-btn.ac-pulse{animation:acPulse 1.2s ease-in-out infinite;}
  @keyframes acPulse{0%,100%{box-shadow:0 0 0 0 rgba(63,176,136,.5);}50%{box-shadow:0 0 0 10px rgba(63,176,136,0);}}

  /* ----- урок ----- */
  .ac-topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
  .ac-dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;background:rgba(29,53,87,.6);padding:7px 12px;border-radius:999px;}
  .ac-sdot{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.4);border:2px solid transparent;}
  .ac-sdot.ac-sd-done{background:#FFC93C;}
  .ac-sdot.ac-sd-cur{background:#fff;border-color:#FFC93C;transform:scale(1.25);}
  .ac-stephead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;}
  .ac-stepno{font-size:.8rem;font-weight:800;color:#8B95A3;white-space:nowrap;}
  .ac-guide{display:flex;gap:12px;align-items:flex-start;margin:10px 0 8px;}
  .ac-mascot{width:104px;flex:none;}
  @keyframes acBob{0%,100%{transform:translateY(0);}50%{transform:translateY(-4px);}}
  .ac-bubble{position:relative;background:#EEF6FF;border-radius:18px;padding:12px 16px;font-size:1.02rem;line-height:1.5;color:#1D3557;text-align:left;flex:1;}
  .ac-bubble::before{content:'';position:absolute;left:-8px;top:18px;border:8px solid transparent;border-right-color:#EEF6FF;border-left:0;}
  .ac-bubble b{color:#E8453C;}
  .ac-speakrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0 10px;padding-left:4px;}
  .ac-speak{display:inline-flex;align-items:center;gap:6px;background:#fff;border:2px solid #1D3557;color:#1D3557;font-family:'Baloo 2',sans-serif;font-weight:700;padding:6px 14px;border-radius:999px;cursor:pointer;font-size:.9rem;}
  .ac-speak:hover{background:#1D3557;color:#fff;}
  .ac-speak.ac-on{background:#F4847A;border-color:#F4847A;color:#fff;}
  .ac-auto{font-size:.85rem;color:#5C7690;display:inline-flex;align-items:center;gap:6px;cursor:pointer;}
  .ac-stage{margin:8px 0 6px;min-height:80px;}
  .ac-fb{text-align:center;font-family:'Baloo 2',sans-serif;font-weight:800;min-height:1.7em;margin:8px 0;font-size:1.05rem;}
  .ac-fb.ac-ok{color:#1D6B2E;} .ac-fb.ac-bad{color:#8C2A20;} .ac-fb.ac-info{color:#1D3557;}
  .ac-nav{display:flex;justify-content:space-between;gap:10px;margin-top:10px;}

  .ac-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0;}
  .ac-eq{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:2.4rem;color:#1D3557;text-align:center;margin:6px 0;min-height:1.3em;}
  .ac-eq .n1,.ac-red{color:#E8453C;} .ac-eq .n2,.ac-grn{color:#5B9A1E;} .ac-eq b{color:#1D3557;}
  .ac-bigeq{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:2.8rem;text-align:center;color:#1D3557;margin:10px 0 18px;}

  /* сцены */
  .ac-join{width:100%;height:auto;max-height:340px;display:block;}
  .ac-mv{transition:transform .9s cubic-bezier(.45,0,.2,1);}
  .ac-frame{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:340px;margin:8px auto;}
  .ac-cell{aspect-ratio:1;border-radius:14px;background:#EEF3F8;border:2px dashed #C9D5E2;transition:all .25s ease;}
  .ac-cell.a{background:radial-gradient(circle at 35% 30%,#FF9A8F,#E8453C);border:none;transform:scale(.92);}
  .ac-cell.b{background:radial-gradient(circle at 35% 30%,#FFE082,#F5B400);border:none;transform:scale(.92);}
  .ac-steprow{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin:10px 0;}
  .ac-stp{display:flex;align-items:center;gap:8px;font-family:'Baloo 2',sans-serif;font-weight:800;color:#1D3557;}
  .ac-stp button{width:40px;height:40px;border-radius:50%;border:2px solid #1D3557;background:#fff;color:#1D3557;font-size:1.4rem;font-weight:800;cursor:pointer;line-height:1;}
  .ac-stp button:hover:not(:disabled){background:#1D3557;color:#fff;} .ac-stp button:disabled{opacity:.35;cursor:default;}
  .ac-stp .v{min-width:30px;text-align:center;font-size:1.5rem;}
  .ac-goal{text-align:center;font-weight:800;font-size:1.1rem;margin:4px 0;}
  .ac-chips{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;margin:14px 0 6px;font-family:'Baloo 2',sans-serif;font-size:2.3rem;font-weight:800;}
  .ac-chip{border:3px solid #CBD6E2;border-radius:16px;background:#F5F8FA;min-width:62px;padding:2px 12px;cursor:pointer;color:#1D3557;font:inherit;transition:all .2s;}
  .ac-chip:hover{border-color:#1D3557;}
  .ac-chip.on.k0{background:#FFE3DF;border-color:#E8453C;} .ac-chip.on.k1{background:#FFF1C9;border-color:#F5B400;} .ac-chip.on.k2{background:#DFF5E1;border-color:#3FAE5A;}
  .ac-chipname{text-align:center;min-height:2.6em;font-weight:800;font-size:1.05rem;}
  .ac-op{color:#F2A03D;}
  .ac-nl{width:100%;height:auto;display:block;}
  .ac-nl text{font-family:'Baloo 2',sans-serif;font-weight:800;}
  .ac-nlnum circle{fill:#fff;stroke:#1D3557;stroke-width:2;transition:all .2s;}
  .ac-nlnum text{fill:#1D3557;font-size:16px;}
  .ac-nlnum.on circle{fill:#FFC93C;stroke:#E8A200;}
  .ac-nlnum.click{cursor:pointer;} .ac-nlnum.click:hover circle{fill:#EAF3FF;}
  .ac-nlnum.bad circle{fill:#FBE4E1;stroke:#E0574A;}
  .ac-nlnum.good circle{fill:#DFF5E1;stroke:#3FAE5A;}
  .ac-count{display:flex;justify-content:center;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:2.2rem;}
  .ac-pop{background:#FFF1C9;border:3px solid #F5B400;border-radius:14px;min-width:54px;text-align:center;padding:2px 10px;animation:acPopIn .45s ease;}
  .ac-big{background:#FFE3DF;border:3px solid #E8453C;border-radius:14px;min-width:54px;text-align:center;padding:2px 10px;}
  @keyframes acPopIn{0%{transform:scale(.2);opacity:0;}70%{transform:scale(1.2);}100%{transform:scale(1);opacity:1;}}
  .ac-house{max-width:420px;margin:6px auto 0;}
  .ac-roof{height:84px;background:linear-gradient(180deg,#FF8A7A,#E8453C);clip-path:polygon(50% 0,100% 100%,0 100%);display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;color:#fff;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:2.2rem;}
  .ac-hbody{display:grid;grid-template-columns:1fr 1fr;gap:12px;background:#FFE9B8;padding:14px;border-radius:0 0 18px 18px;}
  .ac-win{min-height:130px;background:#CDEBFF;border:5px solid #8B5E34;border-radius:10px;display:flex;flex-wrap:wrap;gap:6px;align-content:center;justify-content:center;padding:8px;}
  .ac-dot{width:26px;height:26px;border-radius:50%;animation:acPopIn .3s ease;}
  .ac-dot.l{background:radial-gradient(circle at 35% 30%,#FF9A8F,#E8453C);} .ac-dot.r{background:radial-gradient(circle at 35% 30%,#FFE082,#F5B400);}
  .ac-pairs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin:12px 0;}
  .ac-pair{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#F5F8FA;border-radius:12px;padding:6px 12px;font-family:'Baloo 2',sans-serif;font-weight:800;color:#1D3557;opacity:0;animation:acSlide .45s ease forwards;}
  .ac-pair .dots{display:flex;gap:3px;}
  .ac-pair .dots i{width:11px;height:11px;border-radius:50%;display:block;} .ac-pair .dots i.l{background:#E8453C;} .ac-pair .dots i.r{background:#F5B400;}
  @keyframes acSlide{0%{opacity:0;transform:translateX(-14px);}100%{opacity:1;transform:none;}}
  .ac-swap{position:relative;height:110px;margin:10px 0;}
  .ac-grp{position:absolute;top:0;width:41%;display:flex;flex-wrap:wrap;gap:4px;justify-content:center;align-content:center;height:100%;transition:left .9s cubic-bezier(.45,0,.2,1);}
  .ac-swap .ac-plus{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:'Baloo 2',sans-serif;font-weight:800;font-size:2.6rem;color:#F2A03D;}
  .ac-tabs{display:flex;gap:8px;justify-content:center;margin-bottom:12px;}
  .ac-tab{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:1.1rem;border:2px solid #1D3557;color:#1D3557;background:#fff;border-radius:999px;padding:6px 20px;cursor:pointer;}
  .ac-tab.on{background:#1D3557;color:#fff;}
  .ac-row{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin:10px 0;}
  .ac-tray{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;align-items:center;min-width:88px;min-height:56px;max-width:230px;padding:8px;border-radius:16px;background:#F5F8FA;}
  .ac-tray.empty{border:3px dashed #B8C4D2;background:#fff;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:1.8rem;color:#8B95A3;}
  .ac-sign{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:2.2rem;color:#F2A03D;}
  .ac-tbl{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;max-width:600px;margin:8px auto;}
  .ac-tc{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:8px;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:clamp(.7rem,2.7vw,1.1rem);border:none;padding:0;}
  .ac-th{background:#FFE9B8;color:#8A5A00;} .ac-th.rowh{background:#FFE3DF;color:#B8402F;} .ac-corner{background:transparent;color:#F2A03D;}
  .ac-void{background:#F1F4F7;}
  .ac-cellbtn{background:#F5F8FA;color:#1D3557;cursor:pointer;transition:all .15s;}
  .ac-cellbtn:hover{background:#DDEBFA;}
  .ac-cellbtn.rowhl{background:#FFE3DF;} .ac-cellbtn.colhl{background:#FFF1C9;} .ac-cellbtn.cur{background:#1D3557;color:#fff;transform:scale(1.1);} .ac-cellbtn.mirror{background:#3FB088;color:#fff;}
  .ac-cellbtn.found{background:#DFF5E1;color:#1D6B2E;box-shadow:inset 0 0 0 2px #3FAE5A;} .ac-cellbtn.flash{background:#FBE4E1;color:#8C2A20;}
  .ac-qcount{text-align:center;font-size:.85rem;font-weight:800;color:#8B95A3;margin-bottom:4px;}
  .ac-opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:420px;margin:0 auto;}
  .ac-opt{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:1.5rem;padding:14px 8px;border-radius:16px;border:2px solid #DCE3EA;background:#F5F8FA;color:#1D3557;cursor:pointer;transition:all .2s;}
  .ac-opt:hover:not(:disabled){border-color:#1D3557;} .ac-opt:disabled{cursor:default;}
  .ac-opt.ok{background:#DFF5E1;border-color:#3FAE5A;color:#1D6B2E;} .ac-opt.bad{background:#FBE4E1;border-color:#E0574A;color:#8C2A20;opacity:.8;}
  .ac-hint{background:#FFF8E1;border-left:5px solid #F5B400;border-radius:10px;padding:10px 14px;margin:14px auto 0;max-width:520px;text-align:left;font-size:.98rem;color:#5A4300;}
  .ac-qpics{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin:6px 0 14px;}
  .es-pick{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:6px 0 10px;}
  .es-pb{border:3px solid transparent;border-radius:16px;background:#F3F7FB;font-size:2.1rem;line-height:1;padding:8px 12px;cursor:pointer;transition:all .15s;font-family:inherit;color:#1D3557;}
  .es-pb:hover{background:#EAF3FF;transform:translateY(-2px);} .es-pb.cur{border-color:#F5B400;background:#FFF1C9;} .es-pb.seen{border-color:#3FAE5A;}
  .es-pb small{display:block;font:800 .78rem 'Baloo 2',sans-serif;margin-top:3px;}
  .es-card{display:flex;flex-direction:column;align-items:center;gap:6px;max-width:420px;margin:8px auto;padding:12px 18px;border-radius:22px;background:#F5F8FA;border:3px solid #DCE6F0;text-align:center;font:800 1.1rem/1.3 'Baloo 2',sans-serif;color:#1D3557;}
  .es-card .em{font-size:3.6rem;line-height:1.1;} .es-card .nm{font-size:1.35rem;} .es-card .tx{font-weight:700;font-size:1rem;color:#41566E;}
  .es-nb{border:3px solid #1D3557;border-radius:999px;background:#fff;color:#1D3557;font:800 1.05rem 'Baloo 2',sans-serif;padding:9px 18px;cursor:pointer;} .es-nb.seen{background:#DFF5E1;border-color:#3FAE5A;}
  .gm-task{max-width:460px;margin:0 auto 8px;} .gm-ti{font:800 .92rem/1.3 'Baloo 2',sans-serif;color:#1D3557;padding:6px 10px;border-radius:12px;background:#FFF1C9;border:2px solid #F5B400;} .gm-ti small{display:block;font-weight:700;font-size:.8rem;color:#41566E;margin-top:2px;} .gm-ti.ok{background:#E9F7EC;border-color:#3FAE5A;color:#2F8A47;}
  .gm-tb{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0;} .gm-col{width:34px;height:34px;border-radius:50%;border:3px solid #1D3557;cursor:pointer;} .gm-col.cur{outline:4px solid #F5B400;}
  .gm-canvas{display:block;width:100%;max-width:420px;margin:6px auto;background:#FFFDF4;border:3px solid #DCE6F0;border-radius:18px;touch-action:none;}
  .ac-qtxt{text-align:center;font-weight:800;font-size:1.15rem;margin:6px 0 12px;}
  .ac-finish{text-align:center;padding:10px 0;}
  .ac-stars{font-size:3.4rem;letter-spacing:6px;margin:8px 0;}
  .ac-stars span{display:inline-block;animation:acPopIn .6s ease both;}
  .ac-link{text-decoration:none;display:inline-block;}
  @media (max-width:520px){
    .ac-card{padding:20px 14px 18px;} .ac-eq{font-size:2rem;} .ac-bigeq{font-size:2.3rem;}
    .ac-mascot{width:78px;} .ac-bubble{font-size:.96rem;padding:10px 12px;}
    .ac-opt{font-size:1.3rem;} .ac-chips{font-size:1.9rem;}
  }
  @media (prefers-reduced-motion:reduce){.ac-btn.ac-pulse{animation:none;}.ac-mv,.ac-grp{transition:none;}}
  /* ----- курс «Числа и счёт» ----- */
  .nc-items{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:480px;margin:8px auto;}
  .nc-it{position:relative;background:#F5F8FA;border:2px solid #DCE3EA;border-radius:16px;padding:6px;cursor:pointer;transition:all .2s;line-height:0;}
  .nc-it:hover:not(:disabled){border-color:#1D3557;}
  .nc-it.counted{background:#FFF1C9;border-color:#F5B400;cursor:default;}
  .nc-badge{position:absolute;right:-6px;top:-8px;min-width:24px;height:24px;border-radius:12px;background:#E8453C;color:#fff;font:800 .95rem 'Baloo 2',sans-serif;line-height:24px;text-align:center;padding:0 5px;animation:acPopIn .35s ease;}
  .nc-chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:430px;margin:10px auto;}
  .nc-chip{min-width:52px;height:52px;border-radius:14px;border:3px solid #CBD6E2;background:#F5F8FA;color:#1D3557;font:800 1.6rem 'Baloo 2',sans-serif;cursor:pointer;transition:all .15s;}
  .nc-chip:hover{border-color:#1D3557;}
  .nc-chip.seen{background:#EEF6FF;border-color:#9DB9D8;}
  .nc-chip.cur{background:#FFC93C;border-color:#E8A200;transform:scale(1.1);}
  .nc-chip.prev{background:#FFE3DF;border-color:#E8453C;}
  .nc-chip.next{background:#DFF5E1;border-color:#3FAE5A;}
  .nc-show{text-align:center;min-height:130px;margin:6px 0;}
  .nc-show .big{font:800 3.6rem 'Baloo 2',sans-serif;color:#1D3557;line-height:1.1;}
  .nc-show .wd{font:800 1.4rem 'Baloo 2',sans-serif;color:#E8453C;}
  .nc-dots{display:grid;grid-template-columns:repeat(5,22px);gap:6px;justify-content:center;margin:8px auto;}
  .nc-dots i{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FF9A8F,#E8453C);display:block;animation:acPopIn .3s ease both;}
  .nc-dots i.y{background:radial-gradient(circle at 35% 30%,#FFE082,#F5B400);}
  .nc-seq{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;margin:10px 0 16px;}
  .nc-cell{display:inline-flex;align-items:center;justify-content:center;min-width:52px;height:52px;padding:0 6px;border-radius:14px;background:#F5F8FA;border:3px solid #CBD6E2;font:800 1.7rem 'Baloo 2',sans-serif;color:#1D3557;}
  .nc-cell.q{background:#FFF1C9;border-color:#F5B400;color:#E8A200;}
  .nc-cell.done{background:#DFF5E1;border-color:#3FAE5A;color:#1D6B2E;}
  .nc-cell.empty{background:#fff;border-style:dashed;color:#B8C4D2;}
  .nc-tiles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:12px 0;}
  .nc-tile{min-width:62px;height:62px;border-radius:16px;border:3px solid #1D3557;background:#fff;color:#1D3557;font:800 1.9rem 'Baloo 2',sans-serif;cursor:pointer;transition:all .15s;}
  .nc-tile:hover:not(:disabled){background:#EEF6FF;}
  .nc-tile:disabled{opacity:.25;cursor:default;}
  .nc-tile.bad{background:#FBE4E1;border-color:#E0574A;animation:ncShake .35s;}
  @keyframes ncShake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}

<script>
(function(){
'use strict';

/* ================= помощники ================= */
const $ = (s, r) => (r || document).querySelector(s);
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
const sleep = ms => new Promise(r => setTimeout(r, ms));
const PRAISE = ['Верно! 🎉', 'Отлично! ⭐', 'Молодец! 👏', 'Так держать! 🚀', 'Точно! ✅'];
function nums(correct, lo, hi){ // 4 варианта ответа
  const set = new Set([correct]);
  const near = shuffle([correct - 2, correct - 1, correct + 1, correct + 2, correct + 3, correct - 3]).filter(x => x >= lo && x <= hi);
  for (const x of near){ if (set.size >= 4) break; set.add(x); }
  let k = lo; while (set.size < 4 && k <= hi){ set.add(k++); }
  return shuffle(Array.from(set));
}

/* ================= озвучка =================
   1) пробуем готовый mp3: assets/audio/math2/<id>.mp3 (потом сюда лягут файлы ElevenLabs);
   2) если файла нет — читает голос браузера. */
let audioEl = null, speakToken = 0;
const BS = window.Barsik ? Barsik.mount($('#ac-barsik')) : null;
const BSM = window.Barsik ? Barsik.mount($('#ac-mapbs'), { state: 'wave' }) : null;
let BSE = null;
const bsTalk = on => { if (BS) BS.talk(on); };
const bsReact = (s, ms) => { if (BS) BS.react(s, ms); };
function ttsClean(t){
  return t.replace(/<[^>]+>/g, ' ').replace(/\+/g, ' плюс ').replace(/=/g, ' равно ').replace(/[−–]/g, ' минус ').replace(/≠/g, ' не равно ').replace(/☐/g, ' окошко ').replace(/\?/g, '?').replace(/\s+/g, ' ').trim();
}
const MALE_RE = /pavel|dmitri|dmitry|dmitriy|yuri|yury|maxim|ivan|aleksandr|alexander|mikhail|boris|павел|дмитр|юри|максим|иван|александр|михаил|борис|male|мужск/i;
const FEMALE_RE = /milena|alena|katya|svetlana|dariya|daria|irina|tatyana|elena|anna|female|женск|милена|алён|алена|катя|светлан|дарь|ирин|татьян|елен|анна/i;
function bestVoice(){
  const vs = (window.speechSynthesis && speechSynthesis.getVoices()) || [];
  const ru = vs.filter(v => /^ru/i.test(v.lang));
  if (!ru.length) return null;
  /* Барсик — мальчик: сначала ищем мужской голос, женские опускаем вниз */
  const score = v => (MALE_RE.test(v.name) ? 20 : 0) - (FEMALE_RE.test(v.name) ? 8 : 0) + (/natural|online|neural/i.test(v.name) ? 4 : 0) + (v.localService ? 0 : 1);
  return ru.sort((a, b) => score(b) - score(a))[0];
}
function stopSpeak(){
  speakToken++; bsTalk(false);
  try { if (audioEl){ audioEl.pause(); audioEl = null; } } catch(e){}
  try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch(e){}
  const b = $('#ac-speak'); if (b){ b.classList.remove('ac-on'); b.textContent = '🔊 Послушать'; }
}
function speak(id, text){
  stopSpeak();
  const tok = speakToken, btn = $('#ac-speak');
  const end = () => { if (tok === speakToken){ btn.classList.remove('ac-on'); btn.textContent = '🔊 Послушать'; bsTalk(false); } };
  const tts = () => {
    if (tok !== speakToken || !window.speechSynthesis) return end();
    const u = new SpeechSynthesisUtterance(ttsClean(text));
    u.lang = 'ru-RU'; u.rate = .92; u.pitch = 1;
    const v = bestVoice(); if (v) u.voice = v; if (!v || !MALE_RE.test(v.name)) u.pitch = .6; /* нет явно мужского голоса: делаем ниже, чтобы звучало не по-девичьи */
    u.onend = end; u.onerror = end;

function opts4(c, cands){

  let k = 1; while (set.length < 4 && typeof c === 'number'){ const x = c + (k % 2 ? k : -k); if (set.indexOf(x) < 0 && x >= 0) set.push(x); k++; }
  return shuffle(set);
}

  h += '<tr><td></td>' + A.map((d, i) => '<td' + ((state.cut || [])[i + 3 - cols] ? ' class="cut"' : '') + '>' + d + '</td>').join('') + '</tr>';

/* шаги письменного сложения и вычитания */
function colSteps(a, b, op){
  const A = dg(a), B = dg(b), st = [], res = ['', '', ''], note = ['', '', ''], cut = [false, false, false];
  const snap = txt => st.push({ txt: txt, res: res.slice(), note: note.slice(), cut: cut.slice() });
  snap('Записываем числа в столбик: единицы под единицами, десятки под десятками. Начинаем с единиц.');
  if (op === '+'){
    const so = A[2] + B[2], co = so >= 10 ? 1 : 0; res[2] = String(so % 10);
    if (co){ note[1] = '+1'; snap('Единицы: ' + A[2] + ' + ' + B[2] + ' = ' + so + '. Пишем ' + so % 10 + ', а 1 десяток запоминаем и прибавим к десяткам.'); }
    else snap('Единицы: ' + A[2] + ' + ' + B[2] + ' = ' + so + '. Пишем ' + so + '.');
    const stn = A[1] + B[1] + co; res[1] = String(stn);
    snap('Десятки: ' + A[1] + ' + ' + B[1] + (co ? ' + 1 (запомнили)' : '') + ' = ' + stn + '. Пишем ' + stn + '.');
  } else if (a === 100){
    note[0] = '0'; note[1] = '9'; note[2] = '10'; cut[0] = true;
    snap('У числа 100 нет ни десятков, ни единиц. Разменяем сотню: 100 = 9 десятков и 10 единиц.');
    res[2] = String(10 - B[2]); snap('Единицы: 10 − ' + B[2] + ' = ' + (10 - B[2]) + '. Пишем ' + (10 - B[2]) + '.');
    res[1] = String(9 - B[1]); snap('Десятки: 9 − ' + B[1] + ' = ' + (9 - B[1]) + '. Пишем ' + (9 - B[1]) + '.');
  } else {
    let t = A[1], bor = A[2] < B[2];
    if (bor){ t = A[1] - 1; note[1] = String(t); cut[1] = true; res[2] = String(A[2] + 10 - B[2]);
      snap('Из ' + A[2] + ' единиц нельзя вычесть ' + B[2] + '. Занимаем 1 десяток — это 10 единиц: ' + (A[2] + 10) + ' − ' + B[2] + ' = ' + (A[2] + 10 - B[2]) + '. Пишем ' + (A[2] + 10 - B[2]) + '. Десятков осталось ' + t + '.'); }
    else { res[2] = String(A[2] - B[2]); snap('Единицы: ' + A[2] + ' − ' + B[2] + ' = ' + (A[2] - B[2]) + '. Пишем ' + (A[2] - B[2]) + '.'); }
    res[1] = String(t - B[1]); snap('Десятки: ' + t + ' − ' + B[1] + ' = ' + (t - B[1]) + '. Пишем ' + (t - B[1]) + '.');
  }
  st.push({ txt: 'Ответ: ' + a + ' ' + (op === '+' ? '+' : '−') + ' ' + b + ' = ' + (op === '+' ? a + b : a - b) + '.', res: (() => { const r = String(op === '+' ? a + b : a - b).split(''); while (r.length < 3) r.unshift(''); return r; })(), note: ['', '', ''], cut: [false, false, false], last: true });
  return st;
}

  const t = rnd(0, 3), mi = D.vals.indexOf(Math.max.apply(null, D.vals)), i = rnd(0, 3); let j; do { j = rnd(0, 3); } while (j === i);
  if (t === 0) return { html: '<div class="ac-qtxt">Сколько детей выбрали «' + D.cats[i] + '»?</div>' + fig, opts: opts4(D.vals[i], [D.vals[i] + 1, D.vals[i] - 1, D.vals[j], D.vals[i] + 2].filter(x => x > 0)), ans: D.vals[i], hint: 'Найди «' + D.cats[i] + '» и прочитай число: ' + D.vals[i] + '.' };
  if (t === 1) return { html: '<div class="ac-qtxt">Что выбрали чаще всего?</div>' + fig, opts: shuffle(D.cats), ans: D.cats[mi], hint: 'Самое большое число — ' + D.vals[mi] + ' — у «' + D.cats[mi] + '».' };
  if (t === 2){ const d = Math.abs(D.vals[i] - D.vals[j]); return { html: '<div class="ac-qtxt">На сколько «' + D.cats[i] + '» и «' + D.cats[j] + '» отличаются по числу детей?</div>' + fig, opts: opts4(d, [d + 1, d + 2, D.vals[i] + D.vals[j], d - 1].filter(x => x > 0)), ans: d, hint: 'Вычти меньшее число из большего: ' + Math.max(D.vals[i], D.vals[j]) + ' − ' + Math.min(D.vals[i], D.vals[j]) + ' = ' + d + '.' }; }
  const tot = D.vals.reduce((a, b) => a + b, 0); return { html: '<div class="ac-qtxt">Сколько всего детей ответили?</div>' + fig, opts: opts4(tot, [tot + 1, tot - 1, tot + 2, tot - 2]), ans: tot, hint: 'Сложи все числа: ' + D.vals.join(' + ') + ' = ' + tot + '.' };
}
GENS.chartRead = function(){ const D = dataSet(); return dataQ(D, barSVG(D.cats, D.vals, 10)); };
GENS.tableRead = function(){ const D = dataSet(); return dataQ(D, dataTbl(D.cats, D.vals)); };


/* угол: двигаем ползунок */
SCENES.angleSlider = function(stage, st, ctx){
  const seen = {};
  stage.innerHTML = '<div id="a-v"></div><input type="range" id="a-r" min="15" max="165" step="5" value="45" style="width:80%;max-width:360px;display:block;margin:8px auto"><div class="ac-qtxt m2-big" id="a-t"></div><div class="ac-qtxt m2-ex" id="a-x"></div>';
  const r = $('#a-r', stage);
  function draw(){
    const d = +r.value, k = d === 90 ? 'прямой' : d < 90 ? 'острый' : 'тупой'; seen[k] = 1;
    $('#a-v', stage).innerHTML = angleSVG(d, 0);
    $('#a-t', stage).textContent = 'Это ' + k + ' угол';
    $('#a-x', stage).textContent = k === 'прямой' ? 'Прямой угол — как угол листа бумаги, угольника или квадрата.' : k === 'острый' ? 'Острый угол меньше прямого. Он острый, как кончик карандаша.' : 'Тупой угол больше прямого. Стороны «раскрылись» шире.';
    const n = Object.keys(seen).length;
    if (n >= 3){ ctx.fb('Все три вида углов найдены!', 'ok'); ctx.done(); } else ctx.fb('Найди ещё виды углов: ' + n + ' из 3. Двигай ползунок.', 'info');
  }
  r.oninput = draw; draw();
};

/* точечная бумага: инструкции */
SCENES.dotDraw = function(stage, st, ctx){
  const COLS = 8, ROWS = 6, S = 44, X = i => 28 + i * S, Y = j => 28 + j * S; let ti = 0, clicks = [], T = null, locked = false;
  stage.innerHTML = '<div class="ac-qcount" id="d-c"></div><div class="ac-qtxt" id="d-q" style="min-height:3.4em"></div><svg viewBox="0 0 ' + (X(COLS - 1) + 28) + ' ' + (Y(ROWS - 1) + 28) + '" class="m2-fig" id="d-s"></svg><div class="m2-btns"><button class="ac-btn ac-alt" id="d-r">Начать заново</button></div>';
  const svg = $('#d-s', stage);
  const DIR = { 'вправо': [1, 0], 'влево': [-1, 0], 'вверх': [0, -1], 'вниз': [0, 1] };
  function mk(kind){
    if (kind === 'follow'){
      const mv = [], n = rnd(2, 3); let x = rnd(1, COLS - 2), y = rnd(1, ROWS - 2); const sx = x, sy = y, ks = Object.keys(DIR);
      for (let i = 0; i < n; i++){ let tries = 0; while (tries++ < 50){ const k = pick(ks), L = rnd(1, 3), nx = x + DIR[k][0] * L, ny = y + DIR[k][1] * L; if (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS && (i === 0 || mv[i - 1][0] !== k)){ mv.push([k, L]); x = nx; y = ny; break; } } }
      return { kind: kind, sx: sx, sy: sy, ex: x, ey: y, mv: mv, q: 'Начни с красной точки. Двигайся по линиям: ' + mv.map(m => m[1] + ' ' + (m[1] === 1 ? 'клетку' : m[1] < 5 ? 'клетки' : 'клеток') + ' ' + m[0]).join(', потом ') + '. Нажми на точку, где остановишься.' };
    }
    if (kind === 'segment'){ const L = rnd(3, 6); return { kind: kind, L: L, q: 'Начерти отрезок длиной ' + L + ' клеток: нажми на две точки на одной линии.' }; }
    return { kind: 'right', q: 'Начерти прямой угол. Нажми три точки: конец одной стороны, вершину угла, конец другой стороны.' };
  }
  function draw(){
    let h = ''; for (let j = 0; j < ROWS; j++) for (let i = 0; i < COLS; i++) h += '<circle cx="' + X(i) + '" cy="' + Y(j) + '" r="5" fill="#8B95A3"/>';
    if (T.kind === 'follow') h += '<circle cx="' + X(T.sx) + '" cy="' + Y(T.sy) + '" r="9" fill="#E0574A"/>';
    if (clicks.length) h += '<polyline points="' + clicks.map(c => X(c[0]) + ',' + Y(c[1])).join(' ') + '" fill="none" stroke="#2F6FD0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>';
    clicks.forEach(c => { h += '<circle cx="' + X(c[0]) + '" cy="' + Y(c[1]) + '" r="8" fill="#2F6FD0"/>'; });
    for (let j = 0; j < ROWS; j++) for (let i = 0; i < COLS; i++) h += '<circle class="hit" data-i="' + i + '" data-j="' + j + '" cx="' + X(i) + '" cy="' + Y(j) + '" r="20" fill="transparent" style="cursor:pointer"/>';
    svg.innerHTML = h;
    $$('.hit', svg).forEach(c => c.onclick = () => click(+c.dataset.i, +c.dataset.j));
  }
  function next(){ if (ti >= st.tasks.length){ $('#d-q', stage).textContent = 'Все чертежи готовы! 🌟'; $('#d-c', stage).textContent = ''; ctx.done(); return; } T = mk(st.tasks[ti]); clicks = []; locked = false; $('#d-c', stage).textContent = 'Задание ' + (ti + 1) + ' из ' + st.tasks.length; $('#d-q', stage).textContent = T.q; ctx.fb('', 'info'); draw(); }
  function fail(msg){ ctx.miss(); ctx.fb(msg, 'bad'); clicks = []; draw(); }
  function win(){ locked = true; ctx.fb(pick(PRAISE), 'ok'); ti++; setTimeout(() => { if (ctx.alive()) next(); }, 1000); }
  function click(i, j){
    if (locked) return;
    if (T.kind === 'follow'){
      clicks = [[T.sx, T.sy]]; let x = T.sx, y = T.sy; T.mv.forEach(m => { x += DIR[m[0]][0] * m[1]; y += DIR[m[0]][1] * m[1]; clicks.push([x, y]); });
      if (i === T.ex && j === T.ey){ draw(); win(); } else { clicks = []; fail('Не та точка. Пройди путь по шагам от красной точки, считая клетки.'); }
      return;
    }
    clicks.push([i, j]); draw();
    if (T.kind === 'segment' && clicks.length === 2){ const a = clicks[0], b = clicks[1], dx = Math.abs(a[0] - b[0]), dy = Math.abs(a[1] - b[1]);
      if ((dx === T.L && dy === 0) || (dy === T.L && dx === 0)) win(); else fail('Длина получилась ' + (dy === 0 ? dx : dx === 0 ? dy : 'другая') + (dy === 0 || dx === 0 ? ' клетки' : ', отрезок не по линии') + '. Нужно ровно ' + T.L + ' клеток по одной линии.'); }
    if (T.kind === 'right' && clicks.length === 3){ const a = clicks[0], o = clicks[1], b = clicks[2], v1 = [a[0] - o[0], a[1] - o[1]], v2 = [b[0] - o[0], b[1] - o[1]];
      if ((v1[0] || v1[1]) && (v2[0] || v2[1]) && v1[0] * v2[0] + v1[1] * v2[1] === 0) win(); else fail('Это не прямой угол. Стороны должны идти по клеточным линиям: одна вдоль, другая поперёк.'); }
  }
  $('#d-r', stage).onclick = () => { clicks = []; locked = false; draw(); };
  next();
};

/* периметр: строим прямоугольник */
SCENES.perimBuild = function(stage, st, ctx){
  let a = 3, b = 2, ti = 0; const tasks = st.tasks;
  stage.innerHTML = '<div class="ac-qcount" id="q-c"></div><div class="ac-qtxt m2-big" id="q-q"></div><div id="q-v"></div><div class="m2-ctl"><span>длина</span><button class="ac-btn ac-alt" data-a="a-">−</button><b id="q-a"></b><button class="ac-btn ac-alt" data-a="a+">+</button></div><div class="m2-ctl"><span>ширина</span><button class="ac-btn ac-alt" data-a="b-">−</button><b id="q-b"></b><button class="ac-btn ac-alt" data-a="b+">+</button></div><div class="ac-qtxt m2-ex" id="q-p"></div><div class="m2-btns"><button class="ac-btn ac-go" id="q-ok">Проверить</button></div>';
  function draw(){ $('#q-v', stage).innerHTML = gridRectSVG(a, b); $('#q-a', stage).textContent = a; $('#q-b', stage).textContent = b; $('#q-p', stage).innerHTML = 'P = (' + a + ' + ' + b + ') · 2 = <b>' + (a + b) * 2 + '</b> клеток'; }
  function task(){ const T = tasks[ti]; $('#q-c', stage).textContent = 'Задание ' + (ti + 1) + ' из ' + tasks.length; $('#q-q', stage).textContent = T.sq ? 'Построй квадрат с периметром ' + T.P + ' клеток' : 'Построй прямоугольник с периметром ' + T.P + ' клеток'; draw(); }
  $$('[data-a]', stage).forEach(x => x.onclick = function(){ const k = x.dataset.a; if (k === 'a+' && a < 9) a++; else if (k === 'a-' && a > 1) a--; else if (k === 'b+' && b < 7) b++; else if (k === 'b-' && b > 1) b--; draw(); });
  $('#q-ok', stage).onclick = function(){
    const T = tasks[ti], P = (a + b) * 2;
    if (P === T.P && (!T.sq || a === b)){ ti++; ctx.fb(pick(PRAISE), 'ok'); if (ti >= tasks.length){ $('#q-q', stage).textContent = 'Все фигуры построены! 🌟'; $$('.m2-ctl,.m2-btns', stage).forEach(e => e.style.display = 'none'); ctx.done(); } else setTimeout(() => { if (ctx.alive()) task(); }, 900); }
    else { ctx.miss(); ctx.fb(P !== T.P ? 'Периметр получился ' + P + '. Нужно ' + T.P + ': сумма длины и ширины должна быть ' + T.P / 2 + '.' : 'У квадрата длина и ширина одинаковые.', 'bad'); }
  };
  task();
};

/* повороты стрелки */
SCENES.turnVis = function(stage, st, ctx){
  let ang = 0; const used = {}; const num = a => [12, 3, 6, 9][(((a / 90) % 4) + 4) % 4];

  stage.innerHTML = '<div class="m2-fig sm" id="t-v">' + svgW(220, 220, s, 'm2-fig sm') + '</div><div class="ac-qtxt m2-big" id="t-t">Стрелка показывает на 12</div><div class="m2-btns"><button class="ac-btn ac-alt" data-d="90">↻ четверть по часовой</button><button class="ac-btn ac-alt" data-d="-90">↺ четверть против часовой</button><button class="ac-btn ac-alt" data-d="180">½ поворота</button><button class="ac-btn ac-alt" data-d="360">полный поворот</button></div>';

  });

/* разрезаем прямоугольник */
SCENES.cutShape = function(stage, st, ctx){
  const C = 40, TASKS = [{ w: 4, h: 2, q: 'Раздели прямоугольник на два квадрата', ok: (v, p) => v && p === 2 }, { w: 6, h: 2, q: 'Раздели прямоугольник на два одинаковых прямоугольника', ok: (v, p) => (v && p === 3) || (!v && p === 1) }, { w: 5, h: 2, q: 'Раздели прямоугольник на квадрат и прямоугольник', ok: (v, p) => v && (p === 2 || p === 3) }]; let ti = 0, cut = null;
  stage.innerHTML = '<div class="ac-qcount" id="c-c"></div><div class="ac-qtxt m2-big" id="c-q"></div><svg class="m2-fig" id="c-s"></svg><div class="ac-qtxt m2-ex" id="c-x"></div>';
  const svg = $('#c-s', stage);
  const nm = (a, b) => a === b ? 'квадрат ' + a + ' на ' + a : 'прямоугольник ' + a + ' на ' + b;
  function draw(){
    const T = TASKS[ti], W = T.w * C, H = T.h * C, x0 = (440 - W) / 2, y0 = 14; svg.setAttribute('viewBox', '0 0 440 ' + (H + 28)); let h = '';
    for (let i = 0; i < T.w; i++) for (let j = 0; j < T.h; j++){ let col = '#DCEBFF'; if (cut){ const second = cut.v ? i >= cut.p : j >= cut.p; col = second ? '#FFE3A8' : '#CDEBC8'; } h += '<rect x="' + (x0 + i * C) + '" y="' + (y0 + j * C) + '" width="' + C + '" height="' + C + '" fill="' + col + '" stroke="#9DB7D8"/>'; }
    h += '<rect x="' + x0 + '" y="' + y0 + '" width="' + W + '" height="' + H + '" fill="none" stroke="#1D3557" stroke-width="4"/>';
    if (cut){ h += cut.v ? '<line x1="' + (x0 + cut.p * C) + '" y1="' + y0 + '" x2="' + (x0 + cut.p * C) + '" y2="' + (y0 + H) + '" stroke="#E0574A" stroke-width="5" stroke-dasharray="8 5"/>' : '<line x1="' + x0 + '" y1="' + (y0 + cut.p * C) + '" x2="' + (x0 + W) + '" y2="' + (y0 + cut.p * C) + '" stroke="#E0574A" stroke-width="5" stroke-dasharray="8 5"/>'; }
    for (let p = 1; p < T.w; p++) h += '<rect class="m2cut" data-v="1" data-p="' + p + '" x="' + (x0 + p * C - 12) + '" y="' + y0 + '" width="24" height="' + H + '" fill="transparent" style="cursor:pointer"/>';
    for (let p = 1; p < T.h; p++) h += '<rect class="m2cut" data-v="0" data-p="' + p + '" x="' + x0 + '" y="' + (y0 + p * C - 12) + '" width="' + W + '" height="24" fill="transparent" style="cursor:pointer"/>';
    svg.innerHTML = h;
    $$('.m2cut', svg).forEach(r => r.onclick = function(){ cutAt(r.dataset.v === '1', +r.dataset.p); });
  }
  function task(){ cut = null; $('#c-c', stage).textContent = 'Задание ' + (ti + 1) + ' из ' + TASKS.length; $('#c-q', stage).textContent = TASKS[ti].q + ' (нажми на линию разреза)'; $('#c-x', stage).textContent = ''; draw(); }
  function cutAt(v, p){
    const T = TASKS[ti]; cut = { v: v, p: p }; draw();
    const a = v ? [p, T.h] : [T.w, p], b = v ? [T.w - p, T.h] : [T.w, T.h - p];
    $('#c-x', stage).textContent = 'Получились: ' + nm(a[0], a[1]) + ' и ' + nm(b[0], b[1]) + '.';
    if (T.ok(v, p)){ ctx.fb(pick(PRAISE), 'ok'); ti++; if (ti >= TASKS.length){ setTimeout(() => { if (ctx.alive()){ $('#c-q', stage).textContent = 'Все фигуры разрезаны! 🌟'; ctx.done(); } }, 1200); } else setTimeout(() => { if (ctx.alive()) task(); }, 1500); }
    else { ctx.miss(); ctx.fb('Не то, что нужно. Попробуй другую линию.', 'bad'); }
  }
  task();
};

/* ставим время на часах */
SCENES.clockSet = function(stage, st, ctx){
  let r = 0, h = 12, m = 0, T; const rounds = st.rounds || 3;
  stage.innerHTML = '<div class="ac-qcount" id="k-c"></div><div class="ac-qtxt m2-big" id="k-q"></div><div id="k-v"></div><div class="m2-btns"><button class="ac-btn ac-alt" data-a="h-">− час</button><button class="ac-btn ac-alt" data-a="h+">+ час</button><button class="ac-btn ac-alt" data-a="m-5">− 5 мин</button><button class="ac-btn ac-alt" data-a="m+5">+ 5 мин</button><button class="ac-btn ac-alt" data-a="m-1">− 1 мин</button><button class="ac-btn ac-alt" data-a="m+1">+ 1 мин</button></div><div class="m2-btns"><button class="ac-btn ac-go" id="k-ok">Проверить</button></div>';
  const draw = () => { $('#k-v', stage).innerHTML = clockSVG(h, m); };
  function newT(){ const k = r; T = { h: rnd(1, 12), m: k === 0 ? pick([0, 30]) : k === 1 ? rnd(1, 11) * 5 : rnd(1, 59) }; h = 12; m = 0; $('#k-c', stage).textContent = 'Время ' + (r + 1) + ' из ' + rounds; $('#k-q', stage).textContent = 'Поставь время ' + tm(T.h, T.m); draw(); }
  $$('[data-a]', stage).forEach(b => b.onclick = function(){
    const a = b.dataset.a; if (a === 'h+') h = h % 12 + 1; else if (a === 'h-') h = h === 1 ? 12 : h - 1; else if (a[0] === 'm'){ m = ((m + (+a.slice(1)) ) % 60 + 60) % 60; }
    draw();
  });
  $('#k-ok', stage).onclick = function(){
    if (h === T.h && m === T.m){ r++; ctx.fb(pick(PRAISE), 'ok'); if (r >= rounds){ $('#k-q', stage).textContent = 'Все часы поставлены! 🌟'; $('#k-c', stage).textContent = ''; $$('.m2-btns', stage).forEach(e => e.style.display = 'none'); ctx.done(); } else setTimeout(() => { if (ctx.alive()) newT(); }, 900); }
    else { ctx.miss(); ctx.fb('Сейчас на часах ' + tm(h, m) + '. Нужно ' + tm(T.h, T.m) + '. Короткая стрелка — часы, длинная — минуты.', 'bad'); }
  };
  newT();
};

/* ---------- сцены части 4 ---------- */
/* составляем комбинации: выбрать предмет из каждого ряда */
SCENES.comboBuild = function(stage, st, ctx){
  let ti = 0, selA = -1, found = {}, T;
  stage.innerHTML = '<div class="ac-qcount" id="cb-c"></div><div class="ac-qtxt m2-big" id="cb-q"></div><div class="m2-cbrow" id="cb-a"></div><div class="m2-cbrow" id="cb-b"></div><div class="m2-cbfound" id="cb-f"></div><div class="ac-qcount" id="cb-n"></div>';
  function paint(){
    const A = $('#cb-a', stage), B = $('#cb-b', stage);
    A.innerHTML = T.A.map((x, i) => '<button class="ac-btn m2-cbtn' + (i === selA ? ' on' : '') + '" data-i="' + i + '">' + x + '</button>').join('');
    B.innerHTML = T.B.map((x, j) => '<button class="ac-btn ac-alt m2-cbtn" data-j="' + j + '">' + x + '</button>').join('');
    $$('[data-i]', A).forEach(b => b.onclick = function(){ selA = +b.dataset.i; ctx.fb('Теперь выбери ' + T.bLabel + '.', 'info'); paint(); });
    $$('[data-j]', B).forEach(b => b.onclick = function(){
      if (selA < 0){ ctx.fb('Сначала выбери ' + T.aLabel + ' в верхнем ряду.', 'info'); return; }
      const key = selA + '-' + b.dataset.j;
      if (found[key]){ ctx.miss(); ctx.fb('Такой комплект уже есть. Ищи новый.', 'bad'); selA = -1; paint(); return; }
      found[key] = 1; const n = Object.keys(found).length; selA = -1; paint(); list();
      if (n >= T.A.length * T.B.length){
        ti++; ctx.fb(pick(PRAISE) + ' Всего ' + n + ' комплектов: ' + T.A.length + ' · ' + T.B.length + ' = ' + n + '.', 'ok');
        if (ti >= st.tasks.length){ $('#cb-q', stage).textContent = 'Все комбинации найдены! 🌟'; $('#cb-a', stage).style.display = 'none'; $('#cb-b', stage).style.display = 'none'; ctx.done(); }
        else setTimeout(() => { if (ctx.alive()) next(); }, 1600);
      } else ctx.fb('Есть! Найдено ' + n + ' из ' + T.A.length * T.B.length + '.', 'info');
    });
  }
  function list(){ $('#cb-f', stage).innerHTML = Object.keys(found).map(k => { const p = k.split('-'); return '<span class="m2-cbchip">' + T.A[+p[0]] + ' + ' + T.B[+p[1]] + '</span>'; }).join(''); $('#cb-n', stage).textContent = 'Найдено: ' + Object.keys(found).length + ' из ' + T.A.length * T.B.length; }
  function next(){ T = st.tasks[ti]; found = {}; selA = -1; $('#cb-c', stage).textContent = 'Задание ' + (ti + 1) + ' из ' + st.tasks.length; $('#cb-q', stage).textContent = T.q; $('#cb-a', stage).style.display = ''; $('#cb-b', stage).style.display = ''; ctx.fb('', 'info'); paint(); list(); }
  next();
};

SCENES.dataCollect = function(stage, st, ctx){
  const cats = st.cats, seq = st.seq, vals = cats.map(() => 0); let i = 0;
  stage.innerHTML = '<div class="ac-qcount" id="dc-c"></div><div class="ac-qtxt m2-big" id="dc-q"></div><div id="dc-cur" class="m2-dccur"></div><div class="m2-cbrow" id="dc-b"></div><div id="dc-v"></div>';
  const chart = () => { $('#dc-v', stage).innerHTML = barSVG(cats, vals, st.mx || 8); };
  function show(){
    if (i >= seq.length){
      $('#dc-q', stage).textContent = 'Опрос закончен! Вот таблица и диаграмма.'; $('#dc-c', stage).textContent = ''; $('#dc-cur', stage).innerHTML = dataTbl(cats, vals); $('#dc-b', stage).style.display = 'none';
      const mx = cats.reduce((a, c, k) => vals[k] > vals[a] ? k : a, 0); ctx.fb('Чаще всего выбрали «' + cats[mx] + '»: ' + vals[mx] + '.', 'ok'); ctx.done(); return;
    }
    $('#dc-c', stage).textContent = 'Ответ ' + (i + 1) + ' из ' + seq.length;
    $('#dc-q', stage).textContent = 'Один ребёнок ответил: «' + cats[seq[i]] + '». Нажми на нужную кнопку, и столбик вырастет.';
    $('#dc-cur', stage).setAttribute('data-cur', seq[i]); $('#dc-cur', stage).textContent = cats[seq[i]];
  }
  $('#dc-b', stage).innerHTML = cats.map((c, k) => '<button class="ac-btn ac-alt m2-cbtn" data-k="' + k + '">' + c + '</button>').join('');
  $$('[data-k]', stage).forEach(b => b.onclick = function(){
    if (i >= seq.length) return;
    if (+b.dataset.k === seq[i]){ vals[seq[i]]++; i++; chart(); ctx.fb(pick(PRAISE), 'ok'); show(); }
    else { ctx.miss(); ctx.fb('Ребёнок ответил «' + cats[seq[i]] + '». Нажми на эту кнопку.', 'bad'); }
  });
  chart(); show();
};

SCENES.quiz = function(stage, st, ctx){

    const q = GENS[pick(st.gens)](); locked = false;
    $('#q-cnt', stage).textContent = 'Вопрос ' + (i + 1) + ' из ' + st.count;
    $('#q-body', stage).innerHTML = q.html; $('#q-hint', stage).style.display = 'none'; ctx.fb('', 'info');
    const o = $('#q-opts', stage); o.style.gridTemplateColumns = (q.wide || q.opts.some(v => typeof v === 'string' && v.length > 8)) ? '1fr' : ''; o.innerHTML = '';
    q.opts.forEach(function(v){
      const b = document.createElement('button'); b.className = 'ac-opt'; b.textContent = v;
      b.onclick = function(){
        if (locked) return;
        if (v === q.ans){
          locked = true; b.classList.add('ok'); $$('.ac-opt', o).forEach(x => x.disabled = true);
          ctx.fb(pick(PRAISE), 'ok'); i++; setTimeout(() => { if (ctx.alive()) next(); }, 1000);

        }
      };
      o.appendChild(b);
    });
  }
  next();
};

      Q('m40s3', 'quiz', 'Читаем диаграмму', 'Найди нужный столбик, посмотри на шкалу слева и прочитай число.', { count: 6, gens: ['chartRead'] }),
      Q('m40s4', 'quiz', 'Читаем таблицу', 'В таблице ищи нужную строку. Чтобы сравнить, вычитай; чтобы узнать всё вместе, складывай.', { count: 6, gens: ['tableRead'] }),
      Q('m40s5', 'quiz', 'Повторяем часть 4', 'Вперемешку: задачи, множества, логика и данные.', { count: 10, gens: ['wordSimple', 'twoStep', 'timesQ', 'priceQty', 'vennCount', 'truth', 'chartRead', 'digitsClass', 'comboQ'] })
    ] }
);

LESSONS[LESSONS.length - 1].steps.push({ id: 'mfin', scene: 'finale', gate: false, title: 'Ты молодец!', text: 'Ты прошёл все уроки курса. Теперь заходи в тренажёры и тренируйся, пока всё не станет получаться легко и быстро.' });

/* ================= движок ================= */
const S = { li: 0, si: 0, mist: 0, token: 0, passed: {} };
let P = loadP();
function view(name){ ['map', 'lesson', 'end'].forEach(v => { $('#ac-v-' + v).style.display = v === name ? '' : 'none'; }); window.scrollTo(0, 0); }
const starsTxt = n => '★'.repeat(n) + '☆'.repeat(3 - n);

function renderMap(){
  let done = 0, h = '';
  LESSONS.forEach(function(L, i){
    const st = P[L.id] || 0; if (st) done++;
    h += '<div class="ac-lcard' + (st ? ' ac-done' : '') + '"><div class="ac-lnum">Урок ' + (i + 1) + '</div><div class="ac-licon">' + L.icon + '</div><div class="ac-ltitle">' + L.title + '</div><div class="ac-lgoal">' + L.goal + '</div><div class="ac-lstars" style="color:#F5B400">' + (st ? starsTxt(st) : '') + '</div><button class="ac-btn' + (st ? ' ac-alt' : ' ac-go') + '" data-i="' + i + '">' + (st ? 'Пройти снова' : 'Начать') + '</button></div>';
  });
  $('#ac-map').innerHTML = h;
  $('#ac-pfill').style.width = (done * 100 / LESSONS.length) + '%';
  $('#ac-ptxt').textContent = done + ' из ' + LESSONS.length;
  $$('#ac-map .ac-btn').forEach(b => b.onclick = () => openLesson(+b.dataset.i));
}
function openLesson(i){ S.li = i; S.si = 0; S.mist = 0; S.passed = {}; view('lesson'); renderStep(); }
function renderDots(){
  const L = LESSONS[S.li]; let h = '';
  L.steps.forEach((s, k) => { h += '<span class="ac-sdot' + (S.passed[k] ? ' ac-sd-done' : '') + (k === S.si ? ' ac-sd-cur' : '') + '"></span>'; });
  $('#ac-dots').innerHTML = h;
}
function renderStep(){
  stopSpeak();
  const L = LESSONS[S.li], st = L.steps[S.si], tok = ++S.token, stage = $('#ac-stage');
  const gated = !!st.gate && !S.passed[S.si];
  $('#ac-stepno').textContent = 'Шаг ' + (S.si + 1) + ' из ' + L.steps.length;
  $('#ac-lessonname').textContent = 'Урок ' + (S.li + 1) + ': ' + L.title;
  $('#ac-title').textContent = st.title;
  $('#ac-bubble').innerHTML = st.text;
  stage.innerHTML = ''; $('#ac-fb').textContent = ''; $('#ac-fb').className = 'ac-fb';
  const next = $('#ac-next'), prev = $('#ac-prev');
  next.disabled = gated; next.classList.remove('ac-pulse');
  if (BS){ BS.base(gated ? 'think' : 'idle'); if (S.si === 0) BS.react('wave', 2400); }
  next.textContent = S.si === L.steps.length - 1 ? 'Завершить урок ✓' : 'Дальше →';
  prev.disabled = S.si === 0;
  const ctx = {
    alive: () => tok === S.token,
    done: () => { if (tok !== S.token) return; S.passed[S.si] = true; next.disabled = false; if (BS) BS.base('idle'); if (!S.passed['_p' + S.si]){ S.passed['_p' + S.si] = 1; next.classList.add('ac-pulse'); } renderDots(); },
    miss: () => { S.mist++; },
    fb: (t, kind) => { if (kind === 'ok') bsReact('happy', 1500); else if (kind === 'bad') bsReact('oops', 1600); const f = $('#ac-fb'); f.textContent = t; f.className = 'ac-fb ' + (kind === 'ok' ? 'ac-ok' : kind === 'bad' ? 'ac-bad' : 'ac-info'); }
  };
  renderDots();
  SCENES[st.scene](stage, st, ctx);
  if ($('#ac-auto').checked) speak(st.id, st.say || st.text);
}
/* ===== награды: звёзды сайта, наклейка за курс, журнал занятий ===== */
function courseReward(L, oldStars, newStars){
  try {
    const slug = KEY.replace(/^bilim_/, '').replace(/_v\d+$/, '');
    const gain = Math.max(0, newStars - oldStars) * 3;
    if (gain > 0 && window.recordGameResult) recordGameResult('course_' + slug + '_' + L.id, gain, 9); /* внутри уже пишется журнал занятий */
    else if (window.logActivity) logActivity();
    if (LESSONS.every(x => (P[x.id] || 0) > 0)){
      let al = {}; try { al = JSON.parse(localStorage.getItem('bilim_stickers_v1')) || {}; } catch(e){}
      if (!al[slug]){
        al[slug] = Date.now(); try { localStorage.setItem('bilim_stickers_v1', JSON.stringify(al)); } catch(e){}
        const name = document.title.replace(/^Курс:\s*/, '').replace(/\s*—.*$/, '');
        if (window.showCelebrationQueue) showCelebrationQueue([{ type: 'achievement', icon: '🏅', titleKey: 'Курс «' + name + '» пройден! Наклейка добавлена в альбом.' }]);
      }
    }
  } catch(e){}
}
function finishLesson(){
  const L = LESSONS[S.li];
  const stars = S.mist <= 1 ? 3 : S.mist <= 4 ? 2 : 1;
  const oldStars = P[L.id] || 0; P[L.id] = Math.max(oldStars, stars); saveP(P); courseReward(L, oldStars, stars);
  stopSpeak();
  $('#ac-endtitle').textContent = 'Урок «' + L.title + '» пройден!';
  let h = ''; for (let k = 0; k < 3; k++) h += '<span style="animation-delay:' + (k * 250) + 'ms;color:' + (k < stars ? '#F5B400' : '#D5DCE4') + '">★</span>';
  $('#ac-endstars').innerHTML = h;
  $('#ac-endtext').textContent = S.mist === 0 ? 'Без единой ошибки — великолепно!' : S.mist <= 4 ? 'Ошибок: ' + S.mist + '. Хороший результат!' : 'Ошибок: ' + S.mist + '. Можно пройти урок ещё раз и улучшить результат.';
  $('#ac-endnext').style.display = S.li < LESSONS.length - 1 ? '' : 'none';
  if (BS) BS.talk(false);
  if (!BSE && window.Barsik) BSE = Barsik.mount($('#ac-endbs'));
  if (BSE) BSE.set(stars >= 2 ? 'cheer' : 'happy');
  view('end');
}
$('#ac-next').onclick = function(){
  const L = LESSONS[S.li];
  if (S.si < L.steps.length - 1){ S.si++; renderStep(); window.scrollTo(0, 0); } else finishLesson();
};
$('#ac-prev').onclick = function(){ if (S.si > 0){ S.si--; renderStep(); } };
$('#ac-tomap').onclick = function(){ stopSpeak(); if (BS) BS.base('idle'); S.token++; renderMap(); view('map'); };
$('#ac-endmap').onclick = function(){ renderMap(); view('map'); };
$('#ac-endnext').onclick = function(){ openLesson(S.li + 1); };
$('#ac-speak').onclick = function(){
  if (this.classList.contains('ac-on')){ stopSpeak(); return; }
  const st = LESSONS[S.li].steps[S.si]; speak(st.id, st.say || st.text);
};
$('#ac-auto').checked = loadAuto();
$('#ac-auto').onchange = function(){ saveAuto(this.checked); if (this.checked){ const st = LESSONS[S.li].steps[S.si]; speak(st.id, st.say || st.text); } else stopSpeak(); };
if (window.speechSynthesis){ speechSynthesis.onvoiceschanged = function(){}; speechSynthesis.getVoices(); }

window.__ac = { open: function(l, s){ S.li = l; S.si = s || 0; S.mist = 0; S.passed = {}; view('lesson'); renderStep(); }, LESSONS: LESSONS, GENS: GENS }; // для проверки
renderMap();
})();
</script>
</body>
</html>
