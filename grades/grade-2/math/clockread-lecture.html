<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Урок: Который час? — Білім Аралы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../assets/styles.css">
</head>
<body>
<div class="cloud cloud1"></div>
<div class="cloud cloud2"></div>
<div class="cloud cloud3"></div>

<header>
  <a href="../../../index.html" class="logo"><span class="logo-dot">🐆</span> Білім Аралы</a>
  <div class="lang-toggle">
    <button class="active" data-lang="ru" onclick="applyLang('ru')">RU</button>
    <button data-lang="kz" onclick="applyLang('kz')">ҚАЗ</button>
    <button data-lang="en" onclick="applyLang('en')">EN</button>
    <button data-lang="zh" onclick="applyLang('zh')">中文</button>
    <button data-lang="uz" onclick="applyLang('uz')">O'ZB</button>
    <button data-lang="tg" onclick="applyLang('tg')">ТҶК</button>
    <button data-lang="ug" onclick="applyLang('ug')">ئۇيغۇر</button>
  </div>
</header>

<section class="game-shell">
  <a href="index.html" class="back-link" data-i18n="back_math"></a>

  <div class="game-card">
    <h1 data-i18n="lecture_clockread_title" style="text-align:center; margin-bottom:6px;"></h1>
    <p class="game-sub" data-i18n="lecture_clockread_sub" style="text-align:center;"></p>

    <div class="slide-deck" id="slide-deck">
      <div class="slide active" data-slide="0">
        <span class="slide-icon">🐆</span>
        <h2 class="slide-title" data-i18n="clockread_s1_title"></h2>
        <p class="slide-text" data-i18n="clockread_s1_text"></p>
      </div>
      <div class="slide" data-slide="1">
        <span class="slide-icon">🕐</span>
        <h2 class="slide-title" data-i18n="clockread_s2_title"></h2>
        <p class="slide-text" data-i18n="clockread_s2_text"></p>
      </div>
      <div class="slide" data-slide="2">
        <span class="slide-icon">🕒</span>
        <h2 class="slide-title" data-i18n="clockread_s3_title"></h2>
        <p class="slide-text" data-i18n="clockread_s3_text"></p>
      </div>
      <div class="slide" data-slide="3">
        <span class="slide-icon">🕕</span>
        <h2 class="slide-title" data-i18n="clockread_s4_title"></h2>
        <p class="slide-text" data-i18n="clockread_s4_text"></p>
      </div>
      <div class="slide" data-slide="4">
        <span class="slide-icon">🔢</span>
        <h2 class="slide-title" data-i18n="clockread_s5_title"></h2>
        <p class="slide-text" data-i18n="clockread_s5_text"></p>
      </div>
      <div class="slide" data-slide="5">
        <span class="slide-icon">⭐</span>
        <h2 class="slide-title" data-i18n="clockread_s6_title"></h2>
        <p class="slide-text" data-i18n="clockread_s6_text"></p>
      </div>
    </div>

    <div class="slide-nav">
      <button class="slide-nav-btn" id="prev-btn" onclick="prevSlide()" aria-label="Previous">←</button>
      <span class="slide-counter" id="slide-counter">1 / 6</span>
      <button class="slide-nav-btn" id="next-btn" onclick="nextSlide()" aria-label="Next">→</button>
    </div>

    <div class="explain-actions" style="margin-top:22px;">
      <a href="clockread.html" class="speak-btn video-done-btn" style="text-decoration:none; display:inline-block;" data-i18n="badge_play"></a>
    </div>
  </div>
</section>

<footer data-i18n="footer"></footer>

<script src="../../../assets/i18n.js"></script>
<script src="../../../assets/progress.js"></script>
<script>
(function(){
  var current = 0;
  var total = document.querySelectorAll('#slide-deck .slide').length;

  function render(){
    document.querySelectorAll('#slide-deck .slide').forEach(function(s, i){
      s.classList.toggle('active', i === current);
    });
    document.getElementById('slide-counter').textContent = (current + 1) + ' / ' + total;
    document.getElementById('prev-btn').disabled = (current === 0);
    document.getElementById('next-btn').disabled = (current === total - 1);
  }

  window.nextSlide = function(){
    if (current < total - 1){ current++; render(); }
  };
  window.prevSlide = function(){
    if (current > 0){ current--; render(); }
  };

  render();
})();
</script>
</body>
</html>
