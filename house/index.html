<script>
(function(){
  var bubble = document.getElementById('bubble'), bt = null;
  function say(id){
    bubble.textContent = House.say(id); bubble.classList.add('on');
    clearTimeout(bt); bt = setTimeout(function(){ bubble.classList.remove('on'); }, 3600);
  }
  Barsik.mount(document.getElementById('bsRoom'), { grade: 1, track: true });
  [].forEach.call(document.querySelectorAll('[data-say]'), function(el){
    el.addEventListener('click', function(){ say(el.getAttribute('data-say')); });
  });
  House.badge();
  setTimeout(function(){ say(Math.random() < 0.5 ? 'hello1' : 'hello2'); }, 500);
  document.getElementById('back').addEventListener('click', function(e){ e.preventDefault(); if (document.referrer && history.length > 1) history.back(); else location.href = '../index.html'; });
})();
</script>
